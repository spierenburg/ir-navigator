  - id: "device-code-response/defender/s9-refused-and-successful-token-use-after-the-revoc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Defender XDR / Sentinel"
    title: "Refused and successful token use after the revocation time"
    why: "The account is disabled at step 2, so a \"successes after revocation\" query is empty by construction and proves nothing. The proof of containment is the attacker's refresh attempts failing: 50057 (user disabled) and 50173 (token revoked) from the attacker ASN, carrying a refreshToken or primaryRefreshToken. A ResultType \"0\" after the revocation time is a live channel, usually a device object or a consented app."
    how: null
    fp: "The user's own clients also fail with 50057 and 50173 after step 2, from the user's usual ASN; those rows are expected. Access tokens issued before revocation stay valid until they expire (about one hour), so a success inside that hour from a non-CAE client is not a miss; one after it is."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > datetime(<revocation time, UTC>)
      | where AutonomousSystemNumber in (<attacker asn>) or IPAddress in ("<attacker ip>")
            or UserPrincipalName in~ ("<upn1>", "<upn2>")
      | where IncomingTokenType in ("refreshToken", "primaryRefreshToken") or ResultType == "0"
      | extend Verdict = case(ResultType == "0", "LIVE: success after revocation",
                              ResultType in ("50057", "50173", "70008", "50133", "53003"), "contained: refused",
                              "other failure")
      | summarize Attempts = count(), Last = max(TimeGenerated), Codes = make_set(ResultType),
                  TokenTypes = make_set(IncomingTokenType), Apps = make_set(AppDisplayName, 10)
          by Verdict, UserPrincipalName, IPAddress, AutonomousSystemNumber
      | order by Verdict asc, Last desc
      // 50057 user disabled; 50173 refresh token revoked; 70008 refresh token expired; 50133 session invalid
      // after password change; 53003 blocked by Conditional Access.
    tested: null
    attack:
      - "T1550.001"
  - id: "device-code-response/defender/s9-access-token-use-that-never-reaches-the-sign-in"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Defender XDR / Sentinel"
    title: "Access-token use that never reaches the sign-in logs"
    why: "Graph calls and mailbox reads made with an access token minted before revocation show up only in MicrosoftGraphActivityLogs and OfficeActivity. Anything here more than 90 minutes after the revocation time is a channel the revocation did not cover."
    how: null
    fp: "The user's own Outlook and OneDrive clients keep calling with their cached access token for up to an hour after revocation, then fail; a 401 or 403 in Status is the revocation working, a 200 after the hour is not."
    query: |-
      union
        (MicrosoftGraphActivityLogs
          | where TimeGenerated > datetime(<revocation time, UTC>)
          | where IPAddress in ("<attacker ip>") or UserId in ("<user object id>")
          | project TimeGenerated, Source = "Graph", Who = UserId,
                    What = strcat(RequestMethod, " ", tostring(parse_url(RequestUri).Path)),
                    Status = tostring(ResponseStatusCode), IPAddress),
        (OfficeActivity
          | where TimeGenerated > datetime(<revocation time, UTC>)
          | where UserId in~ ("<upn1>", "<upn2>") or ClientIP has_any ("<attacker ip>")
          | project TimeGenerated, Source = OfficeWorkload, Who = UserId, What = Operation,
                    Status = ResultStatus, IPAddress = ClientIP)
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1550.001"
  - id: "device-code-response/crowdstrike/s1-device-code-attempts-that-did-not-complete-reach"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "CrowdStrike Falcon"
    title: "Device-code attempts that did not complete (reach of the lure)"
    why: "No mail telemetry in the Entra repo, and the lure URL is Microsoft's own, so the lure's reach is measured from the sign-in side: codes that expired or were blocked show which users the campaign got to, beyond the successes in stage 2."
    how: null
    fp: "After the step 7 block, legitimate Azure CLI and kubelogin users produce 53003 rows; drop the exception group's apps and read the remainder as reach."
    query: |-
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.authenticationProtocol=deviceCode
      | Vendor.properties.status.errorCode!=0
      | groupBy([Vendor.properties.userPrincipalName, Vendor.properties.appDisplayName, Vendor.properties.status.errorCode], function=[count(), min(@timestamp), max(@timestamp)])
      // 53003 = blocked by Conditional Access, 50058 = code entered without a completed sign-in.
    tested: null
    attack:
      - "T1528"
