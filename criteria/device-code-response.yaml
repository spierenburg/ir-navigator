    title: "Device code requested as the Authentication Broker, and PRT sign-ins from the new device"
    why: "A deviceCode sign-in to the broker is never a normal user action; the PRT sign-ins that follow carry the attacker's device id and show whether the device disable in step 4 took effect (the PRT renews about every four hours)."
    how: null
    fp: "Every PRT sign-in from the user's real Entra-joined laptop lands here; keep the device ids registered inside the window."
