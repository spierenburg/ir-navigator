  - id: "device-code-response/splunk/s5-consent-permission-grants-and-service-principal"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Consent"
    stage_ord: 5
    platform: "Splunk"
    title: "Consent, permission grants and service-principal changes by the victim account"
    why: "A consented app keeps its own access to mail and files after the user's sessions are revoked. A refresh token alone cannot create a grant through Graph for a non-admin user; consent usually needs a second lure. The same search answers step 11."
    how: null
    fp: "Admin consent by your identity team and first-party permission grants fire constantly; keep rows where the actor is the victim or the IP is in the attacker ASN."
    query: |-
      index=<entra> sourcetype=azure:monitor:aad properties.result=success
        operationName IN ("Consent to application", "Add delegated permission grant", "Add service principal",
                          "Add service principal credentials", "Add member to role")
        ("properties.initiatedBy.user.userPrincipalName"="<upn>" OR "properties.targetResources{}.userPrincipalName"="<upn>")
      | rename properties.* as *
      | eval permissions = mvindex('targetResources{}.modifiedProperties{}.newValue',
          mvfind('targetResources{}.modifiedProperties{}.displayName', "ConsentAction.Permissions"))
      | table _time operationName initiatedBy.user.userPrincipalName initiatedBy.user.ipAddress targetResources{}.displayName permissions
    tested: null
    attack:
      - "T1528"
      - "T1098.001"
  - id: "device-code-response/splunk/s6-mail-and-file-access-by-the-victim-account-by-cl"
