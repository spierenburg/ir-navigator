  - id: "device-code-response/splunk/s9-refused-and-successful-token-use-after-the-revoc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Splunk"
    title: "Refused and successful token use after the revocation time"
    why: "The account is disabled at step 2, so a successes-only search is empty by construction. Proof of containment is the attacker's refreshes failing with 50057 (disabled) or 50173 (revoked) from their ASN, carrying a refreshToken or primaryRefreshToken; any errorCode 0 after the revocation time is a live channel."
    how: null
    fp: "The user's own clients also fail with 50057 and 50173 from the usual ASN; a success inside the first hour from a non-CAE client is a pre-revocation access token, not a miss."
    query: |-
      index=<entra> sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs)
        earliest="<MM/DD/YYYY:HH:MM:SS revocation time>"
        ("properties.autonomousSystemNumber"=<attacker asn> OR user="<upn>")
        ("properties.incomingTokenType" IN (refreshToken, primaryRefreshToken) OR "properties.status.errorCode"=0)
      | eval verdict=case('properties.status.errorCode'=0, "LIVE", 'properties.status.errorCode' IN (50057, 50173, 70008, 50133, 53003), "refused", true(), "other")
      | stats count max(_time) as last values(properties.status.errorCode) as codes values(properties.appDisplayName) as apps
          by verdict user src properties.autonomousSystemNumber
      | convert ctime(last)
      // Access-token use that never hits sign-ins: index=<o365> user="<upn>" earliest=<revocation time> | stats count by Operation src
    tested: null
    attack:
      - "T1550.001"
