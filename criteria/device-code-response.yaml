# Source of truth for this playbook's IR criteria.
# Hand-edit freely. Re-run 'bun run build:index' after any change.
playbook: "device-code-response"
title: "Device Code Abuse Response"
platforms:
  - "Defender XDR / Sentinel"
  - "CrowdStrike Falcon"
  - "SentinelOne"
  - "Velociraptor"
  - "Splunk"
  - "Elastic / Wazuh"
scenarios:
  - id: "1"
    status: "draft"
    source: "research@2026-10-25 https://www.volexity.com/blog/2025/02/13/multiple-russian-threat-actors-targeting-microsoft-device-code-authentication/"
    validated_at: null
    supersedes: null
    name: "Device-Code Token Theft (Storm-2372, UTA0304/UTA0307; no device registered)"
    indicators: "first sign-in with authenticationProtocol 'deviceCode'; later refreshes often have it empty but carry originalTransferMethod 'deviceCodeFlow' (interactive and non-interactive logs). Client varies: Microsoft Office, or Microsoft Teams 1fec8e78-bce4-4aaf-ab1b-5451cc387264 (UTA0307). Microsoft's hunt: a UrlClickEvents hit on microsoft.com/devicelogin from mail or Teams, then sign-ins with ErrorCode 0 and 50199 in the same session. Lures depend on live coordination because the code expires in 15 minutes: fake Teams invites, Signal or Element chats moved to a timed 'secure chat' invite. Afterwards: Graph mail searches for 'password', 'admin', 'teamviewer', 'credentials'; FileDownloaded; device-code phishing sent internally from the victim."
    discriminator: "device-code sign-in with NO device registration near it in time — that is what separates it from scenario 2. Containment per Microsoft: revoke refresh tokens (revokeSignInSessions) and force re-authentication through Conditional Access. Hunt the victim's Sent Items for internal device-code lures: scope is wider than one user."
    attack:
      - "T1566.002"
      - "T1528"
      - "T1550.001"
      - "T1114.002"
    window: null
  - id: "2"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2025/02/13/storm-2372-conducts-device-code-phishing-campaign/ https://www.elastic.co/security-labs/entra-id-oauth-phishing-detection"
    validated_at: null
    supersedes: null
    name: "Device Code to Device Registration and PRT (Microsoft Authentication Broker)"
    indicators: "device-code sign-in to the Microsoft Authentication Broker (29d9ed98-a469-4536-ade2-f981bc1d605e per Elastic; Microsoft names the client but not the id); its refresh token redeemed for the Device Registration Service (resource 01cb2876-7ebd-4aa4-9cc9-d28bd4d359a9, scope adrs_access); a new Entra device for the user (CloudAppEvents AccountDisplayName 'Device Registration Service') within about 10 minutes; then PRT sign-ins from that device with trust type 'Azure AD joined', through a proxy geolocated near the victim. Elastic names ROADtx as the tooling."
    discriminator: "a device registration for the user minutes after the device-code sign-in, and DeviceId populated on subsequent sign-ins. Revoking sessions is the sourced step. Disabling and deleting the rogue device so its PRT dies is the obvious next step but no fetched source states it — confirm in a test tenant before relying on it."
    attack:
      - "T1566.002"
      - "T1528"
      - "T1098.005"
      - "T1550.001"
    window: null
  - id: "3"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign/ https://www.proofpoint.com/us/blog/threat-insight/access-granted-phishing-device-code-authorization-account-takeover"
    validated_at: null
    supersedes: null
    name: "Phishing-Kit Device Code (EvilTokens, TA2723; volume, BEC-oriented)"
    indicators: "the code is generated on click, so the gap between click and device-code sign-in is short; polling and sign-in from short-lived Railway, Cloudflare or DigitalOcean nodes; lures on compromised legitimate sites, generic and business-themed (RFP, invoice, DocuSign, salary amendment); the landing page asks for the email to 'generate an OTP'. Afterwards: device registration and PRT within 10 minutes in some cases, or hours later inbox rules via the Microsoft Office client, Graph reconnaissance and mail exfiltration from finance or executive mailboxes."
    discriminator: "the sign-in comes from hosting or PaaS infrastructure rather than a proxy near the victim, the lure is generic rather than a built rapport, and other tenants are hit the same day. Scope per victim: some reach scenario 2 (device registered), so check for a device. Inbox rules mean BEC follow-up: run the bec-response checks and payment-fraud recall."
    attack:
      - "T1566.002"
      - "T1528"
      - "T1564.008"
      - "T1098.005"
    window: null
  - id: "4"
    status: "draft"
    source: "research@2026-10-25 https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-authentication-flows"
    validated_at: null
    supersedes: null
    name: "Legitimate Device-Code Use (shared devices, meeting rooms)"
    indicators: "device-code sign-ins from an expected client and platform (Microsoft's worked example: Android meeting-room devices) from a named location, with a stable history for the account. Volexity found most tenants had no legitimate device-code use at all."
    discriminator: "a baseline: the same client, platform and location seen before. A user's first-ever device-code sign-in from an unfamiliar IP is not this reading. The Outlook desktop-to-mobile QR flow is 'authentication transfer', a separate Conditional Access flow, not device code."
    attack: []
    window: null
criteria:
  - id: "device-code-response/defender/s1-lure-delivery-and-clicks-mail"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Lure delivery and clicks (mail)"
    why: "The lure links to Microsoft's own sign-in page, so URL reputation never fires; the signal is a devicelogin or deviceauth URL arriving by mail at all. Every recipient is a candidate for stage 2, clicked or not, because the code can be typed from the message body."
    how: null
    fp: "IT and developer teams mail each other devicelogin links for Azure CLI and VS Code set-up. Keep hits from external senders, newly registered domains and mail that also carries a nine-character code in the body; drop internal sender-to-self mail."
    query: |-
      let lure = dynamic(["microsoft.com/devicelogin", "oauth2/deviceauth", "/oauth2/v2.0/devicecode"]);
      EmailUrlInfo
      | where Timestamp > ago(30d) and Url has_any (lure)
      | join kind=inner (EmailEvents
          | project NetworkMessageId, RecipientEmailAddress, SenderFromAddress, SenderMailFromDomain, Subject, DeliveryAction)
          on NetworkMessageId
      | join kind=leftouter (UrlClickEvents
          | where Timestamp > ago(30d)
          | project NetworkMessageId, ClickTime = Timestamp, ClickedBy = AccountUpn, ActionType)
          on NetworkMessageId
      | project Timestamp, RecipientEmailAddress, SenderFromAddress, SenderMailFromDomain, Subject, Url, DeliveryAction, ClickTime, ClickedBy, ActionType
      | order by Timestamp asc
    tested: null
    attack:
      - "T1566.002"
  - id: "device-code-response/defender/s1-lure-delivery-in-teams-external-chats"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Lure delivery in Teams external chats"
    why: "Storm-2372 and its copycats send the lure as a Teams invitation from a look-alike tenant; the mail hunt never sees it. MessageEvents and MessageUrlInfo need Defender for Office 365 Teams protection enabled."
    how: null
    fp: "Federated partners and MSPs legitimately share Azure CLI instructions in external chats; compare the sender tenant with your allowed federation list before you treat it as a lure."
    query: |-
      MessageEvents
      | where Timestamp > ago(30d) and IsExternalThread == true
      | join kind=inner (MessageUrlInfo
          | where Url has_any ("devicelogin", "deviceauth", "devicecode"))
          on TeamsMessageId
      | project Timestamp, SenderEmailAddress, SenderDisplayName, RecipientDetails, ThreadType, Url
      | order by Timestamp asc
    tested: null
    attack:
      - "T1566.003"
  - id: "device-code-response/defender/s1-device-code-attempts-that-did-not-complete-reach"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Device-code attempts that did not complete (reach of the lure)"
    why: "A code that expired before it was entered, or a user the Conditional Access block caught, still shows the lure reached them. These rows are the campaign's target list beyond the successes in stage 2; each user on it gets a check for a second attempt."
    how: null
    fp: "After step 7 is live, every legitimate Azure CLI and kubelogin user produces 53003 rows; filter the exception group's apps out and read the rest as reach."
    query: |-
      SigninLogs
      | where TimeGenerated > ago(30d)
      | where AuthenticationProtocol =~ "deviceCode" and ResultType != "0"
      | summarize Attempts = count(), First = min(TimeGenerated), Last = max(TimeGenerated),
                  Codes = make_set(ResultType), Reasons = make_set(ResultDescription, 5)
          by UserPrincipalName, AppDisplayName, AppId
      | order by First asc
      // 53003 = blocked by Conditional Access (the step 7 policy working); 50058 = code entered without a
      // completed sign-in; 70016/70020 = the client polled past the code's lifetime.
    tested: null
    attack:
      - "T1528"
  - id: "device-code-response/defender/s2-successful-device-code-sign-ins"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Code entered"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Successful device-code sign-ins"
    why: "Every user on this list may have handed over tokens: this is the containment scope. The IP on these events is the victim's browser, not the attacker's; the polling client's user agent (often python-requests or a bare Go client) is the first attacker artefact."
    how: null
    fp: "Azure CLI on a headless host, kubelogin, Arc onboarding, Teams Rooms and printers sign in with device code every day. Build the exception list from 30 days of these rows by AppId and user, then treat anything outside it, or any new AppId for a known user, as a hit."
    query: |-
      SigninLogs
      | where TimeGenerated > ago(30d)
      | where AuthenticationProtocol =~ "deviceCode" and ResultType == "0"
      | project TimeGenerated, UserPrincipalName, AppDisplayName, AppId, ResourceDisplayName,
                IPAddress, AutonomousSystemNumber, UserAgent, SessionId, UniqueTokenIdentifier, CorrelationId
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1528"
  - id: "device-code-response/defender/s3-token-use-from-another-ip-after-the-device-code"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Token use"
    stage_ord: 3
    platform: "Defender XDR / Sentinel"
    title: "Token use from another IP after the device-code sign-in, including FOCI app switches"
    why: "The IP that redeems and refreshes the tokens is the attacker's: it is the indicator for every later hunt and for the tenant-wide spread search. The refresh token is family-scoped (FOCI), so the attacker swaps it to Office, Azure CLI, Azure PowerShell, the Authentication Broker, VS Code or Teams and the non-interactive rows carry a different AppId. Join on the user, not the app. CAE-capable tokens can run 24 hours before the first refresh, so the window is 48 hours, not six."
    how: null
    fp: "The user's own phone moving from Wi-Fi to cellular, a VPN reconnect and Microsoft service IPs all show as a second IP within minutes, usually on the same SessionId and a mobile ASN. Rank by ASN (hosting, VPS and residential-proxy ranges first) and by apps the user never used before, not by count."
    query: |-
      let foci = dynamic(["d3590ed6-52b3-4102-aeff-aad2292ab01c",   // Microsoft Office
                          "04b07795-8ddb-461a-bbee-02f9e1bf7b46",   // Azure CLI
                          "1950a258-227b-4e31-a9cf-717495945fc2",   // Azure PowerShell
                          "29d9ed98-a469-4536-ade2-f981bc1d605e",   // Microsoft Authentication Broker
                          "aebc6443-996d-45c2-90f0-388ff96faa56",   // Visual Studio Code
                          "1fec8e78-bce4-4aaf-ab1b-5451cc387264"]); // Microsoft Teams
      let dc = SigninLogs
        | where TimeGenerated > ago(30d)
        | where AuthenticationProtocol =~ "deviceCode" and ResultType == "0"
        | project UserPrincipalName, DC_Time = TimeGenerated, DC_IP = IPAddress, DC_App = AppId, DC_Session = SessionId;
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and ResultType == "0"
      | join kind=inner dc on UserPrincipalName
      | where TimeGenerated between (DC_Time .. DC_Time + 48h) and IPAddress != DC_IP
      | extend Family = iff(AppId in (foci), "FOCI", "other"), SameSession = SessionId == DC_Session
      | summarize FirstUse = min(TimeGenerated), Uses = count(), Resources = make_set(ResourceDisplayName, 10),
                  TokenTypes = make_set(IncomingTokenType), SameSession = max(SameSession)
          by UserPrincipalName, DC_IP, AttackerIP = IPAddress, AttackerASN = AutonomousSystemNumber, AppId, AppDisplayName, Family
      | order by UserPrincipalName asc, FirstUse asc
    tested: null
    attack:
      - "T1550.001"
  - id: "device-code-response/defender/s4-device-objects-registered-by-the-victim-account"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Device registration"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Device objects registered by the victim account in the window"
    why: "A device the attacker registers lets them request a Primary Refresh Token for silent sign-in; it has to be disabled in Entra, separately from revoking the user's sessions. Registration writes three audit activities, not one; key on all of them."
    how: null
    fp: "Intune autopilot and the user's own new laptop produce the same three activities; the attacker's device has no MDM enrolment, an ActorIP from the attacker ASN and a registration minutes after the device-code event."
    query: |-
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where OperationName in ("Register device", "Add device", "Add registered owner to device", "Add registered users to device")
      | extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName)),
               ActorIP = tostring(InitiatedBy.user.ipAddress),
               Device = tostring(TargetResources[0].displayName), DeviceObjectId = tostring(TargetResources[0].id),
               Changes = tostring(TargetResources[0].modifiedProperties)
      | where Actor =~ "<upn>" or Changes has "<upn>"
      | project TimeGenerated, OperationName, Result, Actor, ActorIP, Device, DeviceObjectId, Changes
      | order by TimeGenerated asc
      // Changes carries the OS build and trust type; a Windows 10.0.19045 build with no MDM and a hostname that
      // does not match your naming standard is the phishing-kit default.
    tested: null
    attack:
      - "T1098.005"
  - id: "device-code-response/defender/s4-device-code-requested-directly-as-the-authentica"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Device registration"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Device code requested directly as the Authentication Broker (PRT path)"
    why: "Since early 2025 the kits request the code with the Microsoft Authentication Broker client (29d9ed98) for the Device Registration Service, so the stolen token registers a device and mints a PRT without any further lure (Microsoft Threat Intelligence, Storm-2372, February 2025). A deviceCode sign-in to the broker is never a normal user action."
    how: null
    fp: "Windows Hello for Business enrolment and a genuine Entra join also call the Device Registration Service from the broker, from the corporate network with a Windows user agent. The deviceCode protocol on the broker AppId has no legitimate source."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where AppId == "29d9ed98-a469-4536-ade2-f981bc1d605e"
      | where AuthenticationProtocol =~ "deviceCode" or ResourceDisplayName == "Device Registration Service"
      | project TimeGenerated, Type, UserPrincipalName, AuthenticationProtocol, ResourceDisplayName, ResultType,
                IPAddress, AutonomousSystemNumber, IncomingTokenType, UserAgent, SessionId
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1098.005"
      - "T1528"
  - id: "device-code-response/defender/s4-prt-use-from-a-device-registered-in-the-window"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Device registration"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "PRT use from a device registered in the window"
    why: "Once the attacker's device holds a PRT it is \"compliant enough\" for device-based Conditional Access and shows up as primaryRefreshToken sign-ins from a device id you have never seen. The PRT renews roughly every four hours, so disabling the device object is not instant: this hunt is also the check that the disable bit."
    how: null
    fp: "Every PRT sign-in from the user's real Entra-joined laptop lands here; compare DeviceId with the device objects from the audit hunt and with Intune's inventory, and keep the ones registered inside the window."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>"
      | where IncomingTokenType == "primaryRefreshToken"
      | extend DeviceId = tostring(DeviceDetail.deviceId), DeviceName = tostring(DeviceDetail.displayName),
               OS = tostring(DeviceDetail.operatingSystem), TrustType = tostring(DeviceDetail.trustType),
               IsCompliant = tostring(DeviceDetail.isCompliant), IsManaged = tostring(DeviceDetail.isManaged)
      | summarize First = min(TimeGenerated), Last = max(TimeGenerated), SignIns = count(), Apps = make_set(AppDisplayName, 10)
          by DeviceId, DeviceName, OS, TrustType, IsCompliant, IsManaged, IPAddress, AutonomousSystemNumber
      | order by First asc
    tested: null
    attack:
      - "T1098.005"
      - "T1550.001"
  - id: "device-code-response/defender/s5-consent-permission-grants-and-service-principal"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Consent"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Consent, permission grants and service-principal changes by the victim account"
    why: "A consented app keeps its own access to mail and files after the user's sessions are revoked. A refresh token alone does not get the attacker there: a user without an admin role cannot create a permission grant through Graph, so consent usually needs a second, consent-phishing lure, or the tenant allows user consent and the attacker drives the prompt with the stolen session. The same query answers step 11: roles added, credentials added to an existing service principal, new service principals."
    how: null
    fp: "Admin consent by your own identity team and \"Add delegated permission grant\" for Microsoft first-party apps fire constantly; keep rows where the actor is the victim, the ActorIP is in the attacker ASN, or the target app has no verified publisher."
    query: |-
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where OperationName in ("Consent to application", "Add delegated permission grant", "Add app role assignment grant to user",
                                "Add service principal", "Add service principal credentials", "Add member to role",
                                "Add eligible member to role")
          or OperationName has "Certificates and secrets management"
      | extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName)),
               ActorIP = tostring(InitiatedBy.user.ipAddress),
               Target = tostring(TargetResources[0].displayName), TargetId = tostring(TargetResources[0].id),
               Changes = tostring(TargetResources[0].modifiedProperties)
      | where Actor =~ "<upn>" or Changes has "<upn>"
      | project TimeGenerated, OperationName, Result, Actor, ActorIP, Target, TargetId, Changes
      | order by TimeGenerated asc
      // ConsentAction.Permissions inside Changes lists the scopes; offline_access plus Mail.Read or Files.Read.All
      // from an unverified publisher is the pattern.
    tested: null
    attack:
      - "T1528"
      - "T1098.001"
  - id: "device-code-response/defender/s6-mail-file-search-and-teams-reads-by-the-victim-a"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Data access"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Mail, file, search and Teams reads by the victim account, by client and source IP"
    why: "Access from the attacker's IP is the evidence legal and privacy need to decide whether this is a notifiable breach. MailItemsAccessed is in Audit Standard since late 2023, so every tenant has it; SearchQueryInitiated and the Teams read operations still need Audit Premium. The client columns separate the attacker's Graph or EWS tooling from Outlook."
    how: null
    fp: "The owner's own clients dominate MailItemsAccessed; split by ClientIP and ClientApp first. Outlook in cached mode and mobile mail legitimately show Sync. Exchange stops writing MailItemsAccessed for 24 hours after 1,000 records from one mailbox (IsThrottled = True), so a throttled row means \"more than you can see\", and the user's own full-mailbox search trips the same throttle."
    query: |-
      OfficeActivity
      | where TimeGenerated > ago(30d) and UserId =~ "<upn>"
      | where Operation in ("MailItemsAccessed", "FileDownloaded", "FileAccessed", "FileSyncDownloadedFull",
                            "SearchQueryInitiatedExchange", "SearchQueryInitiatedSharePoint",
                            "MessagesListed", "ChatRetrieved", "MessageRead")
      | extend Props = tostring(OperationProperties),
               ClientApp = coalesce(ClientAppId, AppId, ClientInfoString)
      | extend AccessType = extract(@'"Name":"MailAccessType","Value":"(\w+)"', 1, Props),
               Throttled = Props contains '"Name":"IsThrottled","Value":"True"'
      | summarize Events = count(), First = min(TimeGenerated), Last = max(TimeGenerated),
                  Folders = make_set(Folders, 10)
          by OfficeWorkload, Operation, ClientIP, ClientApp, AccessType, Throttled
      | order by First asc
      // ClientIP on Exchange rows can be "[ip]:port"; Client_IPAddress is the bare form.
    tested: null
    attack:
      - "T1114.002"
      - "T1213.002"
  - id: "device-code-response/defender/s6-graph-api-calls-made-with-the-stolen-tokens"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Data access"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Graph API calls made with the stolen tokens"
    why: "Attacker tooling reads mail and files through Microsoft Graph; those calls never appear in sign-in logs once the access token is issued. SignInActivityId equals the UniqueTokenIdentifier of the sign-in that minted the token, so you can list exactly what each stolen token was used for. UserId here is the object id, not the UPN."
    how: null
    fp: "Nothing legitimate shares a token id with an attacker sign-in; the only noise is Microsoft's own first-party calls on the IP filter when the \"attacker\" IP turns out to be a shared egress. Confirm the ASN before you pivot on IP alone."
    query: |-
      let tokens = union SigninLogs, AADNonInteractiveUserSignInLogs
        | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>"
        | where IPAddress in ("<attacker ip>") or AutonomousSystemNumber in (<attacker asn>)
        | distinct UniqueTokenIdentifier;
      MicrosoftGraphActivityLogs
      | where TimeGenerated > ago(30d)
      | where SignInActivityId in (tokens) or IPAddress in ("<attacker ip>")
      | extend Path = tostring(parse_url(RequestUri).Path)
      | summarize Calls = count(), First = min(TimeGenerated), Last = max(TimeGenerated),
                  Status = make_set(ResponseStatusCode), Scopes = make_set(Scopes, 5)
          by RequestMethod, Path, AppId, IPAddress, UserAgent
      | order by First asc
    tested: null
    attack:
      - "T1114.002"
      - "T1213.002"
      - "T1550.001"
  - id: "device-code-response/defender/s7-mail-sent-from-the-account-defender-for-office-3"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Outbound"
    stage_ord: 7
    platform: "Defender XDR / Sentinel"
    title: "Mail sent from the account (Defender for Office 365)"
    why: "Lateral phishing from the compromised mailbox is the most common follow-on. Recipient count per hour and the subject set show whether the account became a lure sender; every internal recipient who clicked gets the same containment."
    how: null
    fp: "Assistants, shared mailboxes and newsletter senders mail many recipients every day; compare the recipient set and subjects with the 30 days before the window, not with zero."
    query: |-
      EmailEvents
      | where Timestamp > ago(30d)
      | where SenderFromAddress =~ "<upn>" or SenderMailFromAddress =~ "<upn>"
      | where EmailDirection in ("Outbound", "Intra-org")
      | summarize Messages = count(), Recipients = dcount(RecipientEmailAddress),
                  Sample = make_set(RecipientEmailAddress, 20), Subjects = make_set(Subject, 10)
          by bin(Timestamp, 1h), EmailDirection
      | order by Timestamp asc
    tested: null
    attack:
      - "T1534"
  - id: "device-code-response/defender/s7-send-sendas-and-teams-messages-by-client-and-sou"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Outbound"
    stage_ord: 7
    platform: "Defender XDR / Sentinel"
    title: "Send, SendAs and Teams messages by client and source IP (Unified Audit Log)"
    why: "The audit log ties each send to the client and IP that made it, which the message trace cannot; a Send from the attacker's ASN through a Graph client is the proof, and a Teams MessageSent burst to external threads is the lure moving on. Send moved into Audit Standard with MailItemsAccessed."
    how: null
    fp: "Delegates with SendAs on shared mailboxes produce SendAs rows from the office egress all day; the row that matters has the attacker's ClientIP or a client string you have never seen on this mailbox."
    query: |-
      OfficeActivity
      | where TimeGenerated > ago(30d) and UserId =~ "<upn>"
      | where Operation in ("Send", "SendAs", "SendOnBehalf", "MessageSent")
      | summarize Events = count(), First = min(TimeGenerated), Last = max(TimeGenerated), Threads = dcount(ChatThreadId)
          by OfficeWorkload, Operation, ClientIP, ClientInfoString, CommunicationType
      | order by First asc
    tested: null
    attack:
      - "T1534"
  - id: "device-code-response/defender/s8-other-users-successful-device-code-sign-ins-acro"
    status: "active"
