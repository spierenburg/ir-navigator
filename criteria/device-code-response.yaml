  - id: "device-code-response/crowdstrike/s3-token-use-from-another-ip-after-the-device-code"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Token use"
    stage_ord: 3
    platform: "CrowdStrike Falcon"
    title: "Token use from another IP after the device-code sign-in, including FOCI app switches"
    why: "The IP that redeems and refreshes the tokens is the attacker's. The refresh token is family-scoped, so the attacker's later rows carry another family AppId (Office d3590ed6, Azure CLI 04b07795, Azure PowerShell 1950a258, Broker 29d9ed98, VS Code aebc6443, Teams 1fec8e78): group on the user and read every app, not only the one from stage 2. Give it 48 hours; CAE-capable tokens refresh late."
    how: null
    fp: "The user's own phone switching networks and VPN reconnects show as a second IP within minutes on a mobile or corporate ASN; rank hosting, VPS and proxy ASNs first."
    query: |-
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.userPrincipalName="<upn>"
      | Vendor.properties.status.errorCode=0
      | groupBy([Vendor.properties.ipAddress, Vendor.properties.autonomousSystemNumber, Vendor.properties.appId, Vendor.properties.appDisplayName, Vendor.properties.incomingTokenType], function=[count(), min(@timestamp), max(@timestamp)])
      | sort(min(@timestamp))
      // The device-code event carries the victim's IP; the next IP, on a different ASN, is the attacker's.
    tested: null
    attack:
      - "T1550.001"
  - id: "device-code-response/crowdstrike/s4-device-registered-by-the-victim-account-and-the"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Device registration"
    stage_ord: 4
    platform: "CrowdStrike Falcon"
    title: "Device registered by the victim account, and the broker-client device-code variant"
    why: "A device the attacker registers lets them request a Primary Refresh Token for silent sign-in; it has to be disabled in Entra, separately from revoking the user's sessions. Since early 2025 the kits request the code as the Microsoft Authentication Broker, which goes straight to a device and a PRT."
    how: null
    fp: "Genuine Entra joins and Windows Hello enrolment also hit the Device Registration Service from the broker, from the corporate network; the deviceCode protocol on the broker AppId has no legitimate source."
    query: |-
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.userPrincipalName="<upn>" OR Vendor.properties.targetResources[0].userPrincipalName="<upn>"
      | Vendor.operationName=/^(Register device|Add device|Add registered owner to device)$/
      // The broker-client variant, all users:
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.authenticationProtocol=deviceCode
      | Vendor.properties.appId="29d9ed98-a469-4536-ade2-f981bc1d605e"
      // Then PRT sign-ins from the new device id: Vendor.properties.incomingTokenType=primaryRefreshToken
      // grouped by Vendor.properties.deviceDetail.deviceId. CrowdStrike ships correlation rule templates for
      // this chain in Next-Gen SIEM.
    tested: null
    attack:
      - "T1098.005"
  - id: "device-code-response/crowdstrike/s5-consent-permission-grants-and-service-principal"
    status: "active"
