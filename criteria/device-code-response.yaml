    title: "Consent, permission grants and service-principal changes by the victim account"
    why: "A consented app keeps its own access to mail and files after the user's sessions are revoked. A refresh token alone cannot create a grant through Graph for a non-admin user; consent usually needs a second lure, so an empty result here is normal. The same search answers step 11."
    how: null
    fp: "Admin consent by your identity team and first-party permission grants fire constantly; keep rows where the actor is the victim or the source IP is in the attacker ASN."
    query: |-
      #repo="3pi_microsoft_entra_id"
      | Vendor.operationName=/^(Consent to application|Add delegated permission grant|Add service principal|Add service principal credentials|Add member to role)$/
      | "<upn>"
      // Free text on the UPN catches both the actor and the target; read the app and the permissions from the
      // parsed targetResources.
    tested: null
    attack:
      - "T1528"
      - "T1098.001"
