  - id: "device-code-response/splunk/s3-token-use-from-another-ip-after-the-device-code"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Token use"
    stage_ord: 3
    platform: "Splunk"
    title: "Token use from another IP after the device-code sign-in, including FOCI app switches"
    why: "The IP that redeems and refreshes the tokens is the attacker's. The refresh token is family-scoped, so the attacker's later rows carry another family appId (Office d3590ed6, Azure CLI 04b07795, Azure PowerShell 1950a258, Broker 29d9ed98, VS Code aebc6443, Teams 1fec8e78): stats by user and src, not by app. Give it 48 hours; CAE-capable tokens refresh late."
    how: null
    fp: "The user's own phone and VPN reconnects show as a second src within minutes on a mobile or corporate ASN; rank hosting, VPS and proxy ASNs first."
    query: |-
      index=<entra> sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs)
        user="<upn>" "properties.status.errorCode"=0
      | eval devicecode=if('properties.authenticationProtocol'="deviceCode", 1, 0)
      | stats min(_time) as first max(_time) as last max(devicecode) as devicecode_event
          values(properties.appId) as app_ids values(properties.appDisplayName) as apps
          values(properties.incomingTokenType) as token_types
          by src properties.autonomousSystemNumber category
      | sort first | convert ctime(first) ctime(last)
    tested: null
    attack:
      - "T1550.001"
  - id: "device-code-response/splunk/s4-device-registered-by-the-victim-account-and-the"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Device registration"
    stage_ord: 4
    platform: "Splunk"
    title: "Device registered by the victim account, and the broker-client device-code variant"
    why: "A device the attacker registers lets them request a Primary Refresh Token for silent sign-in; it has to be disabled in Entra, separately from revoking the user's sessions. Since early 2025 the kits request the code as the Microsoft Authentication Broker (29d9ed98), which goes straight to a device and a PRT."
    how: null
    fp: "Intune autopilot and the user's own new laptop write the same events; the attacker's device has no MDM enrolment, a src in the attacker ASN and a registration minutes after the device-code event."
    query: |-
      index=<entra> sourcetype=azure:monitor:aad
        operationName IN ("Register device", "Add device", "Add registered owner to device") properties.result=success
        user="<upn>"
      | table _time operationName user src properties.targetResources{}.displayName properties.targetResources{}.id
    tested: null
    attack:
      - "T1098.005"
