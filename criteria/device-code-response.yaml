    title: "Refused and successful token use after the revocation time"
    why: "The account is disabled at step 2, so a successes-only search is empty by construction. Proof of containment is the attacker's refreshes failing with 50057 or 50173 from their ASN; any errorCode 0 after the revocation time is a live channel."
    how: null
    fp: "The user's own clients also fail with 50057 and 50173 from the usual ASN; a success inside the first hour from a non-CAE client is a pre-revocation access token, not a miss."
