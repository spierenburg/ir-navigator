    why: "A device the attacker registers lets them request a Primary Refresh Token for silent sign-in; it has to be disabled in Entra, separately from revoking the user's sessions. Registration writes three audit activities; key on all of them."
    how: null
    fp: "Intune autopilot and the user's own new laptop write the same events; the attacker's device has no MDM enrolment, a source IP in the attacker ASN and a registration minutes after the device-code event."
    query: |-
      data_stream.dataset:"azure.auditlogs"
        and azure.auditlogs.operation_name:("Register device" or "Add device" or "Add registered owner to device")
        and azure.auditlogs.properties.initiated_by.user.userPrincipalName:"<upn>"
      // Columns: azure.auditlogs.properties.target_resources.0.display_name, azure.auditlogs.properties.target_resources.0.id, event.outcome.
      // Prebuilt rules (8.19): "Suspicious Microsoft OAuth Flow via Auth Broker to DRS" (same user and session
      // from several IPs, broker to Device Registration Service), "Unusual Device Registration in Entra ID",
      // "Entra ID RT to PRT Transition from Same User and Device".
    tested: null
    attack:
      - "T1098.005"
  - id: "device-code-response/elastic/s4-device-code-requested-as-the-authentication-brok"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Device registration"
    stage_ord: 4
    platform: "Elastic / Wazuh"
    title: "Device code requested as the Authentication Broker, and PRT sign-ins from the new device"
    why: "Since early 2025 the kits request the code as the Microsoft Authentication Broker (29d9ed98), which goes straight to a device and a PRT. The PRT sign-ins that follow carry the attacker's device id and show whether the device disable took effect (the PRT renews about every four hours)."
    how: null
    fp: "Every PRT sign-in from the user's real Entra-joined laptop lands here; keep the device ids registered inside the window. The deviceCode protocol on the broker app_id has no legitimate source."
    query: |-
      FROM logs-azure.signinlogs-*
      | WHERE @timestamp > NOW() - 30 days
        AND ((azure.signinlogs.properties.app_id == "29d9ed98-a469-4536-ade2-f981bc1d605e"
              AND azure.signinlogs.properties.authentication_protocol == "deviceCode")
             OR (azure.signinlogs.properties.user_principal_name == "<upn>"
                 AND azure.signinlogs.properties.incoming_token_type == "primaryRefreshToken"))
      | STATS first = MIN(@timestamp), last = MAX(@timestamp), signins = COUNT(*)
        BY azure.signinlogs.properties.user_principal_name, source.ip,
           azure.signinlogs.properties.device_detail.device_id, azure.signinlogs.properties.device_detail.trust_type,
           azure.signinlogs.properties.device_detail.is_compliant, azure.signinlogs.properties.device_detail.is_managed
      | SORT first
    tested: null
    attack:
      - "T1098.005"
      - "T1550.001"
  - id: "device-code-response/elastic/s5-consent-permission-grants-and-service-principal"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Consent"
    stage_ord: 5
    platform: "Elastic / Wazuh"
    title: "Consent, permission grants and service-principal changes by the victim account"
    why: "A consented app keeps its own access to mail and files after the user's sessions are revoked. A refresh token alone cannot create a grant through Graph for a non-admin user; consent usually needs a second lure, so an empty result is normal. The same query answers step 11."
    how: null
    fp: "Admin consent by your identity team and first-party permission grants fire constantly; keep rows where the actor is the victim or the source IP is in the attacker ASN."
    query: |-
      data_stream.dataset:"azure.auditlogs"
        and azure.auditlogs.operation_name:("Consent to application" or "Add delegated permission grant"
             or "Add service principal" or "Add service principal credentials" or "Add member to role")
        and event.outcome:"success"
        and azure.auditlogs.properties.initiated_by.user.userPrincipalName:"<upn>"
      // Columns: azure.auditlogs.properties.target_resources.0.display_name, azure.auditlogs.properties.target_resources.0.modified_properties, source.ip.
    tested: null
    attack:
      - "T1528"
      - "T1098.001"
  - id: "device-code-response/elastic/s6-mail-and-file-access-by-the-victim-account-by-cl"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Data access"
    stage_ord: 6
    platform: "Elastic / Wazuh"
    title: "Mail and file access by the victim account, by client and source IP"
    why: "Access from the attacker's IP is the evidence legal and privacy need to decide whether this is a notifiable breach. MailItemsAccessed is in Audit Standard since late 2023, so every tenant has it."
    how: null
    fp: "The owner's own Outlook dominates MailItemsAccessed; split by source.ip and client first. Exchange throttles MailItemsAccessed for 24 hours after 1,000 records (IsThrottled in o365.audit.OperationProperties), so a throttled row means more than you can see."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days AND user.id == "<upn>"
        AND event.action IN ("MailItemsAccessed", "FileDownloaded", "FileAccessed", "SearchQueryInitiatedExchange", "SearchQueryInitiatedSharePoint")
      | STATS events = COUNT(*), first = MIN(@timestamp), last = MAX(@timestamp)
        BY event.action, source.ip, o365.audit.ClientAppId, o365.audit.ClientInfoString
      | SORT first
      // Wazuh: rule.groups:office365 and data.office365.UserId:"<upn>" and data.office365.Operation:MailItemsAccessed
    tested: null
    attack:
      - "T1114.002"
      - "T1213.002"
  - id: "device-code-response/elastic/s7-mail-and-teams-messages-sent-from-the-account-by"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Outbound"
    stage_ord: 7
    platform: "Elastic / Wazuh"
    title: "Mail and Teams messages sent from the account, by client and source IP"
    why: "Lateral phishing from the compromised mailbox is the most common follow-on; the Send audit row carries the client and IP that made it. Send moved into Audit Standard with MailItemsAccessed."
    how: null
    fp: "Delegates with SendAs on shared mailboxes send all day from the office egress; the row that matters has the attacker's source.ip or an unfamiliar client string."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days AND user.id == "<upn>"
        AND event.action IN ("Send", "SendAs", "SendOnBehalf", "MessageSent")
      | STATS events = COUNT(*), first = MIN(@timestamp), last = MAX(@timestamp)
        BY event.action, source.ip, o365.audit.ClientInfoString
      | SORT first
    tested: null
    attack:
      - "T1534"
  - id: "device-code-response/elastic/s8-other-users-device-code-sign-ins-across-the-tena"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Spread"
    stage_ord: 8
    platform: "Elastic / Wazuh"
    title: "Other users: device-code sign-ins across the tenant, and anyone from the attacker ASN"
    why: "Campaigns target many users at once; every account found here needs the same containment. Pivot on the ASN, not the IP: kits rotate addresses inside one range within days."
    how: null
    fp: "Exclude the step 7 exception group. A carrier or large cloud ASN puts legitimate users behind the same number; pivot on ASN only for hosting, VPS and proxy ranges."
    query: |-
      FROM logs-azure.signinlogs-*
      | WHERE @timestamp > NOW() - 30 days
        AND azure.signinlogs.properties.authentication_protocol == "deviceCode"
        AND event.outcome == "success"
      | STATS first = MIN(@timestamp), apps = VALUES(azure.signinlogs.properties.app_display_name)
        BY azure.signinlogs.properties.user_principal_name
      | SORT first
      // Anyone else from the attacker's ASN (KQL, both sign-in categories):
      // data_stream.dataset:"azure.signinlogs" and azure.signinlogs.properties.autonomous_system_number:<attacker asn>
    tested: null
    attack:
      - "T1528"
      - "T1550.001"
  - id: "device-code-response/elastic/s9-refused-and-successful-token-use-after-the-revoc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Elastic / Wazuh"
    title: "Refused and successful token use after the revocation time"
    why: "The account is disabled at step 2, so a successes-only query is empty by construction. Proof of containment is the attacker's refreshes failing with 50057 (disabled) or 50173 (revoked) from their ASN, carrying a refreshToken or primaryRefreshToken; any success after the revocation time is a live channel."
    how: null
    fp: "The user's own clients also fail with 50057 and 50173 from the usual ASN; a success inside the first hour from a non-CAE client is a pre-revocation access token, not a miss."
    query: |-
      FROM logs-azure.signinlogs-*
      | WHERE @timestamp > TO_DATETIME("<revocation time, ISO 8601>")
        AND (azure.signinlogs.properties.autonomous_system_number == <attacker asn>
             OR azure.signinlogs.properties.user_principal_name == "<upn>")
        AND (azure.signinlogs.properties.incoming_token_type IN ("refreshToken", "primaryRefreshToken")
             OR event.outcome == "success")
      | EVAL verdict = CASE(event.outcome == "success", "LIVE",
                            azure.signinlogs.properties.status.error_code IN (50057, 50173, 70008, 50133, 53003), "refused",
                            "other")
      | STATS attempts = COUNT(*), last = MAX(@timestamp), codes = VALUES(azure.signinlogs.properties.status.error_code),
              apps = VALUES(azure.signinlogs.properties.app_display_name)
        BY verdict, azure.signinlogs.properties.user_principal_name, source.ip, azure.signinlogs.properties.autonomous_system_number
      | SORT verdict
      // Access-token use that never hits sign-ins: FROM logs-o365.audit-* | WHERE user.id == "<upn>" AND @timestamp > <revocation time>
    tested: null
    attack:
      - "T1550.001"
  - id: "device-code-response/defender/s8-going-broad-without-conditional-access-block-dev"
    status: "active"
    source: "https://github.com/MicrosoftDocs/entra-docs/commit/bb7280b7cd3538710cff4da36c4fd818bb436af1 (security-defaults.md, Manage individual Security Defaults protections (preview), 2026-10-14); discovered via T-Minus365 YouTube"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 8 · Spread"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Going broad without Conditional Access: block device code flow via the Security Defaults rule on Entra ID Free tenants"
    why: "Step 7 blocks device code flow through a Conditional Access policy, and that requires Entra ID P1. Business Basic/Standard tenants on Entra ID Free can't create that policy. Their containment control is the Security Defaults \"Block device code flow\" rule. In the individual-protections preview it can be switched on by itself, leaving the other three rules (admin MFA, all-user MFA, legacy-auth block) as they are. Without the preview, the only option is turning on the whole Security Defaults baseline, which brings in MFA for all users mid-incident. Drawback: the SD rule has no documented exclusion list, so every legitimate device-code user (Azure CLI on headless hosts, Teams Rooms, printers) breaks with no exception group. Pull the device-code sign-in list first anyway, so you know what will break and can tell those owners."
    how: null
    fp: "Not the path when the tenant has P1/P2: use the Conditional Access policy with an exception group. Not needed when Security Defaults is already on with the device-code block in effect; then a successful deviceCode sign-in means the block was turned off (Stage 2 criterion). Free tenants keep sign-in logs 7 days, so the exception-scoping list covers a week at most. Free tenants cannot read sign-in logs through Microsoft Graph or stream them to a workspace (both need P1/P2), so the exception list comes from the admin-center download, not from a query."
    query: |-
      # Is device code already blocked? Current Security Defaults state (classic toggle; readable on Free)
      Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy | Select-Object IsEnabled
      # In preview tenants the device-code rule can be on while IsEnabled is False: check the rule's state on the Security Defaults page.
      # Who will break: Entra admin center > Monitoring & health > Sign-in logs, last 7 days,
      #   filter Authentication protocol = Device code and Status = Success, then Download (CSV).
      #   Group the CSV by application and user; export it before you flip the rule.
      # State change, not a query (preview tenants): Entra admin center > Security Defaults > Block device code flow > On
    tested: null
    attack:
      - "T1528"
  - id: "device-code-response/defender/s2-successful-device-code-sign-in-in-a-security-def"
    status: "active"
    source: "https://github.com/MicrosoftDocs/entra-docs/commit/bb7280b7cd3538710cff4da36c4fd818bb436af1; https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults (device code block for new tenants from 2026-07-01); discovered via T-Minus365 YouTube"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 2 · Code entered"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Successful device-code sign-in in a Security Defaults tenant: find when the block was turned off"
    why: "Security Defaults blocks device code flow. Microsoft Learn says this applies to all new tenants from 2026-07-01, and the individual-protections preview makes it a separate rule. A successful deviceCode sign-in (ResultType 0) in a tenant that relies on Security Defaults therefore means either the block was never in effect for that tenant or someone turned the rule or the whole baseline off. If it was turned off, that change sets the earliest start of the exposure window and is an attacker action in its own right. Look at the actor, the IP and whether the change sits close to the attacker's first device-code success (Stage 2 hunt), not the tenant's earliest one, which may be a legitimate Azure CLI user."
    how: null
    fp: "No Security Defaults change in the lookback, and the tenant predates the July 2026 enforcement: the block was never on. The entry path was open, but no one tampered with it. Unverified: older tenants may not have the block yet (the doc mentions \"planned device code flow enablement\" with no dates), and the exact audit entry written by a single-rule toggle is undocumented. A Microsoft or service actor changing the rule during the phased rollout is Microsoft, not the attacker. An empty result rules nothing out when the logs don't reach back far enough: Entra keeps audit logs 7 days on Free and 30 on P1/P2. If AuditLogs aren't streamed to the workspace, read them with Get-MgAuditLogDirectoryAudit or the admin-center audit log (Category = Policy), and treat a change older than the retention as unknown, not absent."
    query: |-
      // attackerFirstDC: the attacker's first successful device-code sign-in, from the Stage 2 hunt
      let attackerFirstDC = datetime(<attacker's first device-code success>);
      AuditLogs
      | where TimeGenerated between ((attackerFirstDC - 30d) .. (attackerFirstDC + 1d))
      | where OperationName has "security defaults"
           or tostring(TargetResources) has_any ("Security Defaults", "identitySecurityDefaultsEnforcementPolicy")
      | project TimeGenerated, OperationName, Result, Actor=tostring(InitiatedBy.user.userPrincipalName),
                App=tostring(InitiatedBy.app.displayName), ActorIP=tostring(InitiatedBy.user.ipAddress),
                Target=tostring(TargetResources[0].displayName), Modified=TargetResources[0].modifiedProperties, AttackerFirstDeviceCode=attackerFirstDC
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1556.009"
      - "T1528"
steps:
  - ord: 1
    time: null
    title: "0. Export the logs for the window before anything is revoked"
    why: "Containment writes new rows and the sources age out on their own: Entra keeps sign-in and audit logs 30 days on P1/P2 and 7 days on the free tier; the Unified Audit Log 180 days on Audit Standard, one year on Premium; mailbox audit 90 days by default. MicrosoftGraphActivityLogs exists only in a Sentinel workspace with the diagnostic setting on. Pull sign-ins (interactive and non-interactive), audit logs, the UAL and the Graph activity for the window, hash the files, and record the hashes in the case. Why: the stage 9 verdict and any notification decision are made on these rows weeks later, when the live tenant no longer has them. Cmdlets are in the Defender tab's \"Preserve\" step."
    critical: true
  - ord: 2
    time: null
    title: "1. Disable the account, then revoke sessions and refresh tokens"
    why: "Disable first: the attacker's next refresh fails with 50057. Then revoke: anything that survived the disable fails with 50173, and session cookies die with it. Those two failure codes from the attacker's ASN are what step 8 looks for. Mark the user compromised as well, so risk-based Conditional Access and Identity Protection react. Re-authentication is forced at the next access-token expiry, about one hour for the attacker's non-CAE tooling. Why: revoking first leaves a window in which a refresh from the still-enabled account can succeed before the disable lands."
    critical: true
  - ord: 3
    time: null
    title: "2. Keep the account disabled; reset the password only after investigation"
    why: "Buys investigation time without giving the attacker a reset notification window. Re-enable only after step 8 shows refused refreshes and no success since the revocation time, and after MFA re-registration from a Temporary Access Pass. The Defender portal actions (Disable user, Revoke session, Mark user as compromised) run in Entra and need an Entra role; the Entra SOC Identity Responder built-in role (introduced July 2026) carries exactly these without User Administrator."
    critical: true
  - ord: 4
    time: null
    title: "3. Export the MFA methods, remove what the user did not enrol, issue a TAP"
    why: "The attacker may have enrolled a second Authenticator or phone with the stolen session. Export the full method list first, remove anything the user did not enrol (the \"User registered security info\" audit event dates each one), then issue a one-time Temporary Access Pass for re-registration rather than trusting a method the attacker could also hold."
    critical: true
  - ord: 5
    time: null
    title: "4. Export, then disable, the devices registered in the access window"
    why: "A registered device produces a Primary Refresh Token enabling silent SSO across the tenant. Since early 2025 the kits request the device code as the Microsoft Authentication Broker, so the device and the PRT arrive without a second lure (Microsoft Threat Intelligence, Storm-2372, February 2025). Export the device object first — registrationDateTime, trustType, operatingSystem and the OS build are the attribution evidence — then disable it. The PRT renews about every four hours, so the disable is not instant; the stage 4 PRT hunt confirms when it bit. Disable only the devices from the window; disabling all of them locks out the user's own machines."
    critical: true
  - ord: 6
    time: null
    title: "5. Disable any consented app and revoke its grants from the access window"
    why: "A consented app keeps its own access to mail and files after the user's sessions are revoked. A stolen refresh token alone does not get the attacker there: a user without an admin role cannot create a permission grant through Graph, so consent usually needs a second, consent-phishing lure, or a tenant that allows user consent. Export the grants, then disable the app's service principal (one action that stops its token path) and remove the grants in the same pass as steps 1–4. Get-MgUserOauth2PermissionGrant lists only this user's own consents; an admin-consented grant on the same app does not appear there, so query the grant by client id too, and check the app's own application permissions."
    critical: true
  - ord: 7
    time: null
    title: "6. Litigation hold, export, then purge inbox rules and SMTP forwarding"
    why: "The #1 BEC persistence mechanism. Attacker creates rules redirecting finance / IT / security replies into hidden folders so the legitimate user never sees them. Also check ForwardingSmtpAddress and ForwardingAddress. Put the mailbox on litigation hold first (needs Exchange Online Plan 2 or the Archiving add-on), export the rules, then remove them — a purged rule is destroyed evidence, and its shape drives the tenant-wide hunt."
    critical: true
  - ord: 8
    time: null
    title: "7. Go broad: block Device Code flow tenant-wide, contain every account seen from the attacker"
    why: "If the tenant doesn't already block Device Code flow, block it now in Conditional Access for everyone except the exception group — that single policy cuts the campaign's entry path for every user it may have reached. Build the exception group first, from 30 days of successful deviceCode sign-ins by app and user (the Defender tab's \"Scope the exception group\" query); without it, expect Azure CLI on headless hosts and CI runners, kubelogin, Azure Arc onboarding, Teams Rooms and Surface Hub, Android phones in Teams and Outlook, and printers that mail to M365 to break the moment the policy is enabled. Then check for other accounts with successful device-code sign-ins or any sign-in from the attacker's ASN (not only the IP) since the campaign started, and give each one steps 1–6. Broad containment costs some friction for the few legitimate device-code users; narrow containment against a multi-user campaign costs the eviction."
    critical: true
  - ord: 9
    time: null
    title: "8. Verify the containment held"
    why: "The account is disabled, so \"no successes since revocation\" is empty by construction and proves nothing. Run the Stage 9 · Still active hunts and look for two things: refused refreshes from the attacker's ASN (50057 user disabled, 50173 token revoked, carrying a refreshToken or primaryRefreshToken), which show the attacker tried and failed; and any success, Graph call or mailbox read more than an hour after the revocation time, for any account in scope, which means a channel was missed — usually a device object or an app grant. Widen the containment before moving on. The attacker is out when the refusals are there and the successes are not."
    critical: true
actions:
  - platform: "Defender XDR / Sentinel"
    label: "T+0 · Preserve"
    name: "Export the logs for the window before anything is revoked"
    tier: "read"
    tier_inferred: false
    why: "Revocation and disablement write new rows and, in Entra's own store, the window closes on its own: sign-in and audit logs live 30 days on P1/P2 and 7 days on the free tier, the Unified Audit Log 180 days on Audit Standard and one year on Premium, mailbox audit 90 days by default. MicrosoftGraphActivityLogs exists only in the Sentinel workspace. Pull the window now; the hunts above run on the export if the live data ages out."
    how: null
    body: |-
      # Entra sign-ins (interactive) and audit, Graph v1.0; non-interactive sign-ins need the beta cmdlet
      Get-MgAuditLogSignIn -Filter "userPrincipalName eq '<upn>' and createdDateTime ge <start ISO 8601>Z" -All |
        Export-Csv signins-<upn>.csv -NoTypeInformation
      Get-MgBetaAuditLogSignIn -Filter "userPrincipalName eq '<upn>' and signInEventTypes/any(t: t eq 'nonInteractiveUser') and createdDateTime ge <start>Z" -All |
        Export-Csv noninteractive-<upn>.csv -NoTypeInformation
      Get-MgAuditLogDirectoryAudit -Filter "activityDateTime ge <start>Z" -All | Export-Csv auditlogs.csv -NoTypeInformation
      # Unified Audit Log (Exchange Online PowerShell); 5,000 rows per page, ReturnLargeSet pages to 50,000
      Search-UnifiedAuditLog -StartDate <start> -EndDate <end> -UserIds <upn1>,<upn2> -SessionCommand ReturnLargeSet -ResultSize 5000 |
        Export-Csv ual-window.csv -NoTypeInformation
      # Sentinel tables for the window, including MicrosoftGraphActivityLogs (workspace only)
      az monitor log-analytics query -w <workspace id> -o json --analytics-query "
        union SigninLogs, AADNonInteractiveUserSignInLogs, AuditLogs, OfficeActivity, MicrosoftGraphActivityLogs
        | where TimeGenerated between (datetime(<start>) .. datetime(<end>))" > sentinel-window.json
      Get-FileHash signins-<upn>.csv, noninteractive-<upn>.csv, auditlogs.csv, ual-window.csv, sentinel-window.json -Algorithm SHA256
    attack: []
  - platform: "Defender XDR / Sentinel"
    label: "Step 7 · Scope the exception group"
    name: "Who legitimately uses device code, before you flip the block"
    tier: "destructive"
    tier_inferred: false
    why: "The block fails every device-code sign-in in the tenant, including the ones the business depends on. Thirty days of successes by app and user is the exception group; anything not on it breaks on purpose."
    how: null
    body: |-
      SigninLogs
      | where TimeGenerated > ago(30d)
      | where AuthenticationProtocol =~ "deviceCode" and ResultType == "0"
      | summarize SignIns = count(), Users = make_set(UserPrincipalName), Last = max(TimeGenerated),
                  ASNs = make_set(AutonomousSystemNumber)
          by AppDisplayName, AppId
      | order by SignIns desc
      // Expected breakage without an exception: Azure CLI on headless hosts and CI runners, kubelogin, Azure Arc
      // onboarding, Teams Rooms and Surface Hub, Android phones signing in to Teams and Outlook, printers and
      // scanners that mail to M365.
    attack:
      - "T1528"
  - platform: "Defender XDR / Sentinel"
    label: "Step 7 · Go broad"
    name: "Block Device Code flow for the whole tenant"
    tier: "destructive"
    tier_inferred: false
    why: "One policy cuts the campaign's entry path for every user it reached, not only the one you found. A blocked attempt lands in stage 1 as ResultType 53003, which is how you measure the campaign's reach afterwards."
    how: "Console: Entra admin center › Conditional Access › New policy › Conditions › Authentication flows › Device code flow; Grant › Block access. Exclude the exception group from the previous step and your break-glass accounts. During an incident the state is enabled, not report-only."
    body: |-
      New-MgIdentityConditionalAccessPolicy -BodyParameter @{
        displayName   = "IR - block device code flow"
        state         = "enabled"
        conditions    = @{
          users               = @{ includeUsers = @("All"); excludeGroups = @("<exception group id>")
                                  excludeUsers = @("<break-glass account id>") }
          applications        = @{ includeApplications = @("All") }
          clientAppTypes      = @("all")
          authenticationFlows = @{ transferMethods = "deviceCodeFlow" }
        }
        grantControls = @{ operator = "OR"; builtInControls = @("block") }
      }
    attack:
      - "T1528"
  - platform: "Defender XDR / Sentinel"
    label: "Steps 1–2 · Contain"
    name: "Disable, then revoke, then mark compromised, for every account seen from the attacker"
    tier: "destructive"
    tier_inferred: false
    why: "Disable first so the next refresh fails with 50057, then revoke so any token that survives the disable fails with 50173; revoking one victim while the campaign's others stay live tells the attacker they have been found. A password reset alone is not containment: for a cloud-managed user an admin reset does revoke password-based refresh tokens, but tokens issued through SSO, passwordless or a federated IdP survive it, and the device-code token is one of those. Access tokens already issued stay valid until they expire, about one hour; CAE shortens that to minutes only for CAE-capable clients (Office, Teams, Outlook, Edge), and roadtx, TokenTactics and the kits' own pollers are not."
    how: "Console: Defender portal › Identities › <user> › Disable user / Revoke session / Mark user as compromised. These actions run in Entra and need an Entra role; the Entra SOC Identity Responder built-in role (introduced July 2026) carries exactly these three, without User Administrator."
    body: |-
      "<upn1>","<upn2>" | ForEach-Object {
        $u = Get-MgUser -UserId $_ -Property Id
        Update-MgUser -UserId $u.Id -AccountEnabled:$false            # next refresh fails: 50057
        Revoke-MgUserSignInSession -UserId $u.Id                       # refresh tokens and session cookies: 50173
        Confirm-MgRiskyUserCompromised -UserIds @($u.Id)               # risk = high; risk-based CA and Identity Protection react
      }
    attack: []
  - platform: "Defender XDR / Sentinel"
    label: "Step 3 · Contain"
    name: "Export the MFA methods, remove what the user did not enrol, issue a TAP"
    tier: "destructive"
    tier_inferred: false
    why: "The attacker may have enrolled a second Authenticator or phone with the stolen session. Record the original list before you delete anything; the user re-registers from a Temporary Access Pass, not from a method the attacker could also hold."
    how: null
    body: |-
      Get-MgUserAuthenticationMethod -UserId <upn> |
        Select-Object Id, @{n='Type';e={$_.AdditionalProperties['@odata.type']}}, @{n='Detail';e={$_.AdditionalProperties | ConvertTo-Json -Compress}} |
        Export-Csv mfa-<upn>.csv -NoTypeInformation
      Remove-MgUserAuthenticationMicrosoftAuthenticatorMethod -UserId <upn> -MicrosoftAuthenticatorAuthenticationMethodId <id>
      Remove-MgUserAuthenticationPhoneMethod -UserId <upn> -PhoneAuthenticationMethodId <id>
      Remove-MgUserAuthenticationSoftwareOathMethod -UserId <upn> -SoftwareOathAuthenticationMethodId <id>
      Remove-MgUserAuthenticationFido2Method -UserId <upn> -Fido2AuthenticationMethodId <id>
      Remove-MgUserAuthenticationEmailMethod -UserId <upn> -EmailAuthenticationMethodId <id>
      New-MgUserAuthenticationTemporaryAccessPassMethod -UserId <upn> -BodyParameter @{ lifetimeInMinutes = 60; isUsableOnce = $true }
    attack:
      - "T1556.006"
  - platform: "Defender XDR / Sentinel"
    label: "Steps 4–5 · Contain"
    name: "Export and disable the attacker's device, disable the app, remove the grants, in the same pass"
    tier: "destructive"
    tier_inferred: false
    why: "A registered device or a consented app keeps access after the sessions are revoked. Export the device object first; the registration time, trust type and OS build are the attribution evidence and go with the device when it is deleted later. Disabling the service principal stops the app's own token path at once; removing grants one by one does not."
    how: "Disable only the devices registered in the access window; disabling all of them locks out the user's own machines. Get-MgUserOauth2PermissionGrant lists only this user's own consents; an admin-consented (AllPrincipals) grant on the same app does not show there, so query the grant by client id as well. The PRT on the attacker's device renews about every four hours, so the disable takes effect at the next renewal; the stage 4 PRT hunt confirms it."
    body: |-
      Get-MgDevice -DeviceId <device object id> -Property Id,DeviceId,DisplayName,RegistrationDateTime,TrustType,OperatingSystem,OperatingSystemVersion,IsCompliant,IsManaged,EnrollmentType,ApproximateLastSignInDateTime |
        Export-Csv device-<device object id>.csv -NoTypeInformation
      Update-MgDevice -DeviceId <device object id> -AccountEnabled:$false            # -DeviceId takes the object id
      Get-MgUserOauth2PermissionGrant -UserId <user id> -All                          # this user's own consents
      Get-MgOauth2PermissionGrant -Filter "clientId eq '<app service principal id>'" -All   # every grant on the app, both consent types
      Get-MgServicePrincipalAppRoleAssignment -ServicePrincipalId <app service principal id> -All   # application permissions the app holds
      Get-MgServicePrincipalAppRoleAssignedTo -ServicePrincipalId <app service principal id> -All   # users and groups assigned to it
      Update-MgServicePrincipal -ServicePrincipalId <app service principal id> -AccountEnabled:$false
      Remove-MgOauth2PermissionGrant -OAuth2PermissionGrantId <grant id>
    attack:
      - "T1098.005"
      - "T1098.001"
  - platform: "Defender XDR / Sentinel"
    label: "Step 6 · Preserve"
    name: "Litigation hold before the rules and forwarding are purged"
    tier: "destructive"
    tier_inferred: false
    why: "Removing an inbox rule or forwarding address destroys the evidence of what the attacker diverted. A hold keeps the mailbox, the rules and the deleted items as they are; export the rules, then remove them."
    how: "Exchange Online PowerShell. Litigation hold needs an Exchange Online Plan 2 licence or the Exchange Online Archiving add-on on the mailbox."
    body: |-
      Set-Mailbox -Identity <upn> -LitigationHoldEnabled $true -LitigationHoldDuration 365
      Get-InboxRule -Mailbox <upn> -IncludeHidden | Export-Clixml inboxrules-<upn>.xml
      Get-Mailbox -Identity <upn> | Select-Object ForwardingSmtpAddress, ForwardingAddress, DeliverToMailboxAndForward | Export-Csv forwarding-<upn>.csv
      Get-InboxRule -Mailbox <upn> -IncludeHidden | Where-Object { $_.Name -notin @("<rules the user confirms>") } | Remove-InboxRule -Confirm:$false
      Set-Mailbox -Identity <upn> -ForwardingSmtpAddress $null -ForwardingAddress $null -DeliverToMailboxAndForward $false
    attack:
      - "T1114.003"
      - "T1564.008"
