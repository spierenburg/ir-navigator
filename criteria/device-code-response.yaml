      index=<entra> sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs)
        (("properties.appId"="29d9ed98-a469-4536-ade2-f981bc1d605e" "properties.authenticationProtocol"=deviceCode)
         OR (user="<upn>" "properties.incomingTokenType"=primaryRefreshToken))
      | stats min(_time) as first max(_time) as last count by user src properties.deviceDetail.deviceId
          properties.deviceDetail.trustType properties.deviceDetail.isCompliant properties.deviceDetail.isManaged
      | sort first | convert ctime(first) ctime(last)
