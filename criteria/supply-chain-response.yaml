    query: |-
      src.process.publisher contains '<vendor signer name>' OR tgt.process.publisher contains '<vendor signer name>'
      | group Hosts = estimate_distinct(endpoint.name), Hashes = estimate_distinct(tgt.process.image.sha256)
          by tgt.process.publisher, tgt.process.name, tgt.process.signedStatus
      // Serial number and countersignature time are not in the event: check them on the sample with
      //   Get-AuthenticodeSignature <file> | Select SignerCertificate, TimeStamperCertificate
      // A countersignature dated before the revocation keeps the signature valid; the serial is the evidence.
