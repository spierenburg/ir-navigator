# Source of truth for this playbook's IR criteria.
# Hand-edit freely. Re-run 'bun run build:index' after any change.
playbook: "supply-chain-response"
title: "Supply Chain Incident Response"
platforms:
  - "Defender XDR / Sentinel"
  - "CrowdStrike Falcon"
  - "SentinelOne"
  - "Velociraptor"
  - "Splunk"
  - "Elastic / Wazuh"
scenarios:
  - id: "1"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Vendor or MSP Breach"
    indicators: "a breach notice from a vendor, SaaS provider or MSP; press or leak-site reports naming them; anomalous activity from their accounts or IP ranges."
    discriminator: "The attacker is in the vendor's environment, not yours — yet. Verify the notice first, then cut data flows and revoke every credential the vendor holds; the question is whether their access into you was used, and the answer is in your logs from the vendor's earliest access date, not from the notice. An MSP is a different incident: its RMM agent is command-and-control as SYSTEM on every host it manages, and in the Kaseya VSA incident (July 2021) the attacker pushed ransomware to downstream organisations (fewer than 1,500 by Kaseya's own count) as a “hot-fix” procedure through the agent. Disable the agent service fleet-wide, revoke the RMM's API keys, end the GDAP or DAP relationship and the Lighthouse delegations, then review every script, policy and procedure the RMM pushed in the window — those are the attacker's actions, not a patch run. The multi-tenant vendor app's secret lives in the vendor's tenant: you cannot rotate it, so get written confirmation that they did. A vendor app authorised in Salesforce, Google Workspace or Slack is cut in that platform; the Salesloft Drift tokens used against Salesforce tenants (August 2025) were untouched by any Entra action. Template: supply-chain-response."
    attack: []
    window: null
  - id: "2"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Compromised Package or GitHub Action"
    indicators: "an advisory for an npm or PyPI package, GitHub Action, OS package or base image you depend on; node on a runner spawning trufflehog, gh or an AI CLI, or talking to api.github.com during an install; new repositories, workflows or runners in your org; unexpected publishes of your own packages. Examples: Shai-Hulud npm worm (September and November 2025), Nx s1ngularity (August 2025), tj-actions/changed-files (March 2025), xz-utils (2024)."
    discriminator: "Install is execution: a bad version that only reached a CI runner or a laptop still had that machine's secrets. Scope by “where was it installed?”, not “did it reach production?”. The 2025 worms ran inside node with no curl to catch: they harvested ~/.npmrc, cloud and GitHub credentials, published them to public repositories and workflow logs, and used the npm token to trojanise every package the victim maintained — so stage 6 (propagation) is minutes behind stage 3, and your own packages' publish history is a first-hour check, not a day-two one. xz-utils was a distro package carried into base images, not a lockfile entry: pin base images by digest and inventory OS packages in images with Syft, not only application dependencies. Do not pin Actions to tags (every tj-actions tag was moved), do not rebuild on the same caches or runners, and install with --ignore-scripts and a cooling-off period until the registry proxy allowlist is in place. Template: supply-chain-package-compromise."
    attack: []
    window: null
  - id: "3"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Trojanised Vendor Update"
    indicators: "a vendor advisory that a signed release was malicious; EDR detections on a trusted application; the application reaching unknown domains. Example: the 3CX desktop app (2023)."
    discriminator: "Treat it as an endpoint compromise, not a patching task: the update ran with the application's privileges on every host that installed it. The signature is the dimension that changes the hunt: the installer is signed with the vendor's real certificate, so a hash block covers one file while the attacker holds the key. Hunt by signer and serial ( DeviceFileCertificateInfo, Sysmon 7, code_signature.subject_name ) for everything signed with that certificate, block the certificate itself, and read the trust flag with care — it stays valid until the CA revokes and the device fetches the CRL, and a countersignature dated before the revocation keeps the file valid afterwards. In the 3CX case the signed desktop app sideloaded a trojanised ffmpeg.dll: the main executable's hash never identified the payload, the module load did. Block the vendor's update host until it confirms a clean release, because the update channel is the delivery path; if the compromise was on the vendor's build or update server rather than a developer's key, its service accounts are what need rotating, on their side. Isolate the hosts, collect memory and a persistence snapshot, then uninstall or roll back — the pre-encryption situation. Template: supply-chain-package-compromise."
    attack: []
    window: null
  - id: "4"
    status: "active"
    source: "research@2026-10-30 https://cursor.com/blog/claude-code-extension-security-notice https://opensourcemalware.com/blog/trojanized-claude-code-extension-plants-persistent-ssh-backdoor https://www.reuters.com/technology/cybersecurity/data-loss-prevention-company-cyberhaven-hit-by-breach-statement-says-2024-12-27/"
    validated_at: "2026-10-31"
    supersedes: null
    name: "Malicious IDE or Browser Extension"
    indicators: "a marketplace or vendor notice that an extension version was malicious; an editor or browser process (code, cursor, node under an extension host, chrome) writing to authorized_keys, LaunchAgents, cron or Startup, or opening SSH or raw TCP outbound; new extensions or versions in the endpoint extension inventory. Examples: trojanised anthropic.claude-code 2.1.313 in the Cursor Marketplace (October 2026, live about 11 hours); the Cyberhaven Chrome extension, published from a phished developer's Chrome Web Store access (December 2024)."
    discriminator: "An extension is code that runs as the user on every launch of the editor or browser, with no install script to catch: the Claude Code loader ran when extension.js loaded. Auto-update means exposure is every host whose editor or browser was running during the window, not only who chose to install it, so scope from the extension inventory by version and by the time the bad version was live. Scope by marketplace too: one extension id is served by several marketplaces (Microsoft, Open VSX, Cursor's, a browser store), and they can differ — in the Claude Code case only Cursor's copy was malicious, so VS Code hosts with the same id and version were clean. Removing or updating the extension does not undo what it did: the planted SSH key, LaunchAgent, cron entry or scheduled task survive, so collect persistence before the cleanup. A developer endpoint holds cloud, GitHub, npm and SSH credentials; treat every one it held as exposed, as in a compromised package."
    attack: []
    window: null
  - id: "5"
    status: "active"
    source: "research@2026-10-30 https://status.polymarket.com/cmvtuswgi00221bkzps7w21pt https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/ https://sansec.io/research/polyfill-supply-chain-attack"
    validated_at: "2026-10-31"
    supersedes: null
    name: "Compromised Third-Party Web Script"
    indicators: "a notice from an analytics, monitoring, chat, tag-manager or CDN provider whose script your pages load; users reporting account actions or transactions they did not make; CSP violation reports or outbound requests to a new domain from your pages; a change in the hash of a script you load without a matching vendor release. Examples: Polymarket, where wallet-draining code was served in place of DebugBear's monitoring script (October 2026); polyfill.io, where the domain's new owner served malware to 100,000+ sites (June 2024)."
    discriminator: "None of your servers was touched, so server logs and EDR show nothing: the code ran in your users' browsers, as your site, with everything the page can reach — session tokens and API keys in localStorage, the DOM, and the logged-in session itself. At Polymarket the script read the stored API key map and signed transactions through the live trading client. The served content can be conditional: the drainer skipped geoblocked visitors, and the polyfill payload fired only on certain mobile devices at certain hours and avoided admin users, so fetching the script yourself afterwards proves nothing. Get the content that was served from the provider, a CDN archive or captured traffic. Scope by which pages loaded it and which users had a session while it was live; their tokens and keys are exposed whether or not misuse shows. Removing the tag stops new loads, not use of what was taken: revoke those sessions and keys, then self-host the script or pin it with Subresource Integrity before it returns. The provider's breach is scenario 1 on their side; the incident on yours is what ran in your users' sessions."
    attack: []
    window: null
criteria:
  - id: "supply-chain-response/defender/s2-every-external-tenant-with-a-path-into-ours-gues"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Every external tenant with a path into ours: guests, direct connect, GDAP and DAP"
    why: "The vendor register is usually incomplete. Sign-ins carry the home tenant and the path used: serviceProvider is an MSP acting through a Partner Center GDAP or DAP relationship, b2bCollaboration a guest, b2bDirectConnect a Teams shared channel. Each path has a different cut, so the path matters as much as the account."
    how: null
    fp: "Your own MSP, Microsoft support ( microsoftSupport ) and every Teams shared-channel partner appear here legitimately. The first query is the inventory; the vendor under investigation is the filter, and any serviceProvider tenant you cannot name is its own finding."
    query: |-
      // Which external tenants act in ours, and by which path (serviceProvider = GDAP/DAP)
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(90d)
      | where CrossTenantAccessType != "none" and HomeTenantId != AADTenantId
      | summarize SignIns=count(), LastSeen=max(TimeGenerated), Users=dcount(UserPrincipalName),
                  Apps=make_set(AppDisplayName, 20) by HomeTenantId, HomeTenantName, CrossTenantAccessType
      // The named vendor: every account, what it reached, from where
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(90d) and HomeTenantId == "<vendor tenant id>"
      | summarize LastSeen=max(TimeGenerated), Apps=make_set(AppDisplayName), IPs=make_set(IPAddress, 20)
          by UserPrincipalName, UserType, CrossTenantAccessType
    tested: null
    attack:
      - "T1199"
      - "T1078.004"
  - id: "supply-chain-response/defender/s2-vendor-owned-apps-their-permissions-and-azure-li"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Vendor-owned apps, their permissions, and Azure Lighthouse delegations"
    why: "A multi-tenant vendor app has its app object, and its secret, in the vendor's tenant; AppOwnerTenantId tells you which apps those are and therefore which credentials you cannot rotate yourself. Lighthouse delegations give the MSP ARM access to subscriptions without any sign-in to your tenant, so the sign-in logs never show them."
    how: "Non-Microsoft SaaS-to-SaaS grants (a vendor app authorised in Salesforce, Google Workspace, Slack or GitHub) do not appear in Entra at all. List them in each platform's connected-apps page: the Salesloft Drift tokens used against Salesforce in August 2025 were invisible to an Entra-only inventory."
    fp: null
    query: |-
      // Service principals the vendor owns (app object, and its secret, live in their tenant)
      AADServicePrincipalSignInLogs
      | where TimeGenerated > ago(90d)
      | where AppOwnerTenantId == "<vendor tenant id>" or AppId == "<vendor app id>"
      | summarize LastSeen=max(TimeGenerated), Resources=make_set(ResourceDisplayName), IPs=make_set(IPAddress, 20)
          by ServicePrincipalName, AppId, AppOwnerTenantId
      // App governance: what those apps are allowed to do, and whether an admin consented
      OAuthAppInfo
      | where AppOwnerTenantId == "<vendor tenant id>" or AppId == "<vendor app id>"
      | project AppName, AppId, PrivilegeLevel, Permissions, IsAdminConsented, AssignedRoles, LastUsedTime
      // Azure Lighthouse: delegations written in the window. The current list is
      // `az managedservices assignment list` per subscription, or Azure portal > Service providers.
      AzureActivity
      | where TimeGenerated > ago(90d)
      | where OperationNameValue =~ "Microsoft.ManagedServices/registrationAssignments/write"
      | project TimeGenerated, Caller, CallerIpAddress, ResourceId, ActivityStatusValue
    tested: null
    attack:
      - "T1199"
      - "T1078.004"
  - id: "supply-chain-response/defender/s3-which-vendor-app-credential-is-in-use-was-one-ad"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Credentials"
    stage_ord: 3
    platform: "Defender XDR / Sentinel"
    title: "Which vendor-app credential is in use, was one added, and whose tenant holds it"
    why: "Rotating the wrong secret leaves the attacker in. A credential, consent or role assignment added during the exposure window is the attacker's own foothold and is removed, not rotated. The key id the app signs in with identifies the exact secret to rotate; if the app's owner tenant is the vendor's, that secret is on their app object and only they can rotate it."
    how: null
    fp: "A vendor's scheduled credential rollover fires 'Add service principal credentials' legitimately. The tell is a second credential added without the old one removed, a consent granted by a user rather than an admin, or a new key first used from an address the vendor does not own (stage 5)."
    query: |-
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where OperationName in ("Add service principal credentials", "Consent to application",
                                "Add app role assignment to service principal", "Add delegated permission grant")
           or OperationName has "Certificates and secrets management"
      | where tostring(TargetResources) has "<vendor app name>"
      | project TimeGenerated, OperationName, Result, InitiatedBy, TargetResources
      // Anything the vendor's own identities changed in our directory (GDAP technicians, guests, the app)
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where tostring(InitiatedBy) has "<vendor upn domain>" or tostring(InitiatedBy) has "<vendor app id>"
      | summarize Count=count(), Examples=make_set(tostring(TargetResources), 10) by OperationName, Category
      // Which key the app actually signs in with: KeyId on OUR service principal only if
      // AppOwnerTenantId is our tenant; otherwise it is the vendor's app-object key (send them the id)
      AADServicePrincipalSignInLogs
      | where TimeGenerated > ago(30d) and AppId == "<vendor app id>"
      | summarize FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated), IPs=make_set(IPAddress)
          by AppOwnerTenantId, ServicePrincipalCredentialKeyId, ServicePrincipalCredentialThumbprint
    tested: null
    attack:
      - "T1098.001"
      - "T1528"
  - id: "supply-chain-response/defender/s4-where-the-package-the-vendor-binary-or-the-sidel"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Where the package, the vendor binary or the sideloaded payload exists, ran or was loaded"
    why: "Every host with the bad version is in scope, including CI runners and developer laptops no asset register lists. A trojanised installer often carries the payload as a sideloaded library (3CX, 2023: ffmpeg.dll loaded by the signed desktop app), so the installer hash alone misses the hosts that matter."
    how: null
    fp: "DeviceFileEvents samples writes: an empty result is not absence. Containers on Linux runners are only seen when Defender runs on the host and the workspace is on the host filesystem; otherwise the CI job logs and the registry proxy are the source for stage 4."
    query: |-
      // The trojanised binary by hash: written, executed, or loaded as a module
      union DeviceFileEvents, DeviceProcessEvents, DeviceImageLoadEvents
      | where Timestamp > ago(30d)
      | where SHA256 in ("<sha256 of installer>", "<sha256 of payload dll>")
      | summarize FirstSeen=min(Timestamp), LastSeen=max(Timestamp), Types=make_set(ActionType) by DeviceName, FolderPath, FileName
      // The sideloaded payload by name and parent, hash-agnostic (catches variants the advisory missed)
      DeviceImageLoadEvents
      | where Timestamp > ago(30d)
      | where FileName =~ "<sideloaded dll>" and InitiatingProcessFileName =~ "<vendor exe>"
      | summarize Hosts=dcount(DeviceName), Hashes=make_set(SHA256) by FolderPath
      // The npm package on disk: laptops and runner workspaces (PyPI: FolderPath has "site-packages")
      DeviceFileEvents
      | where Timestamp > ago(30d)
      | where FolderPath has "node_modules" and FolderPath has "<package>" and FileName =~ "package.json"
      | summarize FirstSeen=min(Timestamp) by DeviceName, FolderPath, InitiatingProcessFileName
      // Vendor desktop and server software by version. DeviceTvmSoftwareInventory indexes installed
      // programs only: it does not see npm, pip, container or base-image contents.
      DeviceTvmSoftwareInventory
      | where SoftwareVendor has "<vendor>" | project DeviceName, SoftwareName, SoftwareVersion
    tested: null
    attack:
      - "T1195.002"
      - "T1195.001"
      - "T1574.001"
  - id: "supply-chain-response/defender/s4-everything-signed-with-the-vendor-s-stolen-certi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Everything signed with the vendor's stolen certificate"
    why: "A stolen signing key makes a hash block insufficient: the attacker can sign a new payload. Hunt by signer and serial number across executions and module loads, then block the certificate, not just the files."
    how: null
    fp: "Every legitimate binary from the vendor matches the signer name. The discriminators are the serial of the leaked certificate (the vendor names it), a CertificateCountersignatureTime inside the compromise window, and files the vendor's release manifest does not list."
    query: |-
      // Signer, serial and countersignature (timestamp) time come from DeviceFileCertificateInfo, joined on SHA1
      DeviceFileCertificateInfo
      | where Timestamp > ago(30d)
      | where Signer has "<vendor signer name>" or CertificateSerialNumber =~ "<serial from the advisory>"
      | join kind=inner (
          union DeviceProcessEvents, DeviceImageLoadEvents
          | where Timestamp > ago(30d)
          | project DeviceName, SHA1, FileName, FolderPath, Timestamp) on SHA1
      | summarize Hosts=dcount(DeviceName), FirstSeen=min(Timestamp1), Files=make_set(FileName, 20)
          by Signer, CertificateSerialNumber, CertificateCountersignatureTime, IsTrusted
      // IsTrusted stays true until the CA revokes and the device fetches the CRL. A countersignature
      // dated before the revocation keeps the signature valid even then: trust the serial and the
      // countersignature time inside the compromise window, not the trust flag.
    tested: null
    attack:
      - "T1553.002"
      - "T1588.003"
  - id: "supply-chain-response/defender/s5-vendor-accounts-apps-and-msp-technicians-signing"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Vendor accounts, apps and MSP technicians signing in from outside the vendor's ranges"
    why: "A vendor identity used from an address the vendor does not own is the attacker using the stolen access, and moves the incident from theirs to ours. GDAP sessions come from the MSP's technicians' own egress, so ask the MSP for that list before reading the result."
    how: null
    fp: "Vendors run from cloud egress that changes without notice, and technicians work from home. Treat a new ASN with a known credential key id as a question for the vendor; a new key id, a new user agent and a new ASN together as the attacker."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where HomeTenantId == "<vendor tenant id>"
      | where not(ipv4_is_in_any_range(IPAddress, "<vendor cidr>"))
      | summarize SignIns=count(), Apps=make_set(AppDisplayName), FirstSeen=min(TimeGenerated)
          by UserPrincipalName, CrossTenantAccessType, IPAddress, ResultType
      AADServicePrincipalSignInLogs
      | where TimeGenerated > ago(30d) and AppId == "<vendor app id>"
      | where not(ipv4_is_in_any_range(IPAddress, "<vendor cidr>"))
      | summarize SignIns=count(), FirstSeen=min(TimeGenerated)
          by ServicePrincipalName, IPAddress, ResourceDisplayName, ServicePrincipalCredentialKeyId
    tested: null
    attack:
      - "T1078.004"
      - "T1199"
  - id: "supply-chain-response/defender/s5-connections-and-logons-into-our-hosts-from-the-v"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Connections and logons into our hosts from the vendor's ranges"
    why: "These are the hosts the vendor (or whoever holds its access) actually reaches; they are where to look for spread and what to cut off first."
    how: null
    fp: null
    query: |-
      DeviceNetworkEvents
      | where Timestamp > ago(30d)
      | where ipv4_is_in_any_range(RemoteIP, "<vendor cidr>")
      | summarize Connections=count(), LastSeen=max(Timestamp) by DeviceName, LocalPort, ActionType, InitiatingProcessFileName
      DeviceLogonEvents
      | where Timestamp > ago(30d) and ipv4_is_in_any_range(RemoteIP, "<vendor cidr>")
      | summarize Logons=count() by DeviceName, AccountName, LogonType, ActionType
    tested: null
    attack:
      - "T1133"
      - "T1021.001"
  - id: "supply-chain-response/defender/s5-stolen-ci-credentials-used-in-the-cloud-oidc-rol"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Stolen CI credentials used in the cloud: OIDC role assumption from an unexpected subject"
    why: "A package that ran on a runner had the runner's OIDC token and any long-lived keys in its environment. In CloudTrail, UserIdentityUserName on AssumeRoleWithWebIdentity is the token's sub claim (GitHub: repo:org/repo:ref:refs/heads/main ); a subject or source address you cannot map to a workflow is the stolen token in use. CloudTrail event history keeps 90 d; a trail to S3 keeps what you configured."
    how: null
    fp: "A subject you do not recognise is usually a renamed repository or a new workflow. A pull_request subject assuming a deploy role, or GitHub-hosted runner traffic from outside GitHub's published actions ranges ( api.github.com/meta ), is not."
    query: |-
      AWSCloudTrail
      | where TimeGenerated > ago(30d)
      | where EventName == "AssumeRoleWithWebIdentity"
      | extend RoleArn = tostring(parse_json(RequestParameters).roleArn)
      | where UserIdentityUserName !startswith "repo:<org>/"
           or UserIdentityUserName has "pull_request"
           or not(ipv4_is_in_any_range(SourceIpAddress, dynamic(["<runner egress cidr>"])))
      | summarize Count=count(), FirstSeen=min(TimeGenerated), IPs=make_set(SourceIpAddress, 20) by UserIdentityUserName, RoleArn
      // Long-lived keys that lived on runners or laptops: everything they did from a new address
      AWSCloudTrail
      | where TimeGenerated > ago(30d) and UserIdentityAccessKeyId in ("<leaked access key ids>")
      | summarize Calls=count(), Events=make_set(EventName, 30) by UserIdentityAccessKeyId, SourceIpAddress, UserAgent
    tested: null
    attack:
      - "T1550.001"
      - "T1078.004"
  - id: "supply-chain-response/defender/s6-shells-and-commands-launched-by-the-msp-s-remote"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Shells and commands launched by the MSP's remote-management agent"
    why: "An MSP's RMM agent is command-and-control as SYSTEM on every managed host; in the Kaseya VSA incident (2021) the attacker pushed a 'hot-fix' procedure through the agent to deploy ransomware. Commands the agent launched during the window show whether the attacker used it inside our network."
    how: null
    fp: "Every legitimate RMM task (patching, inventory, scripted fixes) spawns cmd and powershell as SYSTEM. Baseline the week before the window and diff. Encoded commands, certutil decoding, Defender tampering and shells on hosts with no open ticket are the signal."
    query: |-
      DeviceProcessEvents
      | where Timestamp > ago(30d)
      // Kaseya AgentMon.exe, ScreenConnect.ClientService.exe, AteraAgent.exe, NinjaRMMAgent.exe, CagService.exe (Datto), BASupSrvc.exe (N-able)
      | where InitiatingProcessFileName in~ ("<rmm agent exe>")
      | where FileName in~ ("cmd.exe", "powershell.exe", "pwsh.exe", "rundll32.exe", "certutil.exe", "msiexec.exe", "sh", "bash")
      | extend Suspicious = ProcessCommandLine has_any ("-EncodedCommand", "-enc ", "certutil", "-decode", "DisableRealtimeMonitoring", "Set-MpPreference", "vssadmin", "bcdedit")
      | summarize Hosts=dcount(DeviceName), Examples=make_set(ProcessCommandLine, 25), FirstSeen=min(Timestamp)
          by InitiatingProcessFileName, FileName, AccountName, Suspicious
    tested: null
    attack:
      - "T1219"
      - "T1059.003"
      - "T1059.001"
  - id: "supply-chain-response/defender/s6-install-time-execution-lifecycle-scripts-in-proc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Install-time execution: lifecycle scripts, in-process credential theft and the 2025 worm pattern"
    why: "npm, pnpm and yarn run lifecycle scripts through a shell: cmd.exe /d /s /c \"<script>\" on Windows, sh -c on Linux and macOS, with node as the parent. In-process payloads never spawn curl: Shai-Hulud (September and November 2025) ran inside node, fetched trufflehog, read ~/.npmrc and cloud credential files, talked to api.github.com, created repositories and workflows and published with the stolen npm token. Nx s1ngularity (August 2025) used installed claude, gemini and q CLIs as the secret finder. Hunt node's children, its files and its connections, not a download tool."
    how: null
    fp: "Query 1 fires on node-gyp builds, husky, esbuild and every other legitimate install script; it is a scoping query, read the command lines. Query 2: developers run gh and AI CLIs from editors that are node processes (VS Code extensions); the parent command line distinguishes an editor from an npm install. Query 3: node talking to api.github.com is normal on a laptop with gh or Dependabot tooling, abnormal on a CI runner during an install step."
    query: |-
      // 1. Lifecycle scripts in the window: every package with an install script matches, so filter to the package
      DeviceProcessEvents
      | where Timestamp > ago(30d)
      | where InitiatingProcessFileName in~ ("node.exe", "node")
      | where (FileName =~ "cmd.exe" and ProcessCommandLine has "/d /s /c")
           or (FileName in~ ("sh", "bash", "dash") and ProcessCommandLine has "-c")
      | where ProcessCommandLine has_any ("<package>", "preinstall", "postinstall")
      | summarize Examples=make_set(ProcessCommandLine, 25), FirstSeen=min(Timestamp) by DeviceName, AccountName
      // 2. Node or bun spawning the tools the 2025 worms used
      DeviceProcessEvents
      | where Timestamp > ago(30d)
      | where InitiatingProcessFileName in~ ("node.exe", "node", "bun", "bun.exe")
      | where FileName in~ ("trufflehog", "trufflehog.exe", "gh", "gh.exe", "claude", "gemini", "q", "q.exe")
           or ProcessCommandLine has_any ("--dangerously-skip-permissions", "--yolo", "--trust-all-tools", "npm publish", "gh repo create", "gh auth", "/tmp/inventory.txt")
      | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessCommandLine
      // 3. Node, bun or trufflehog talking to GitHub, a webhook sink, the registry or the metadata service
      DeviceNetworkEvents
      | where Timestamp > ago(30d)
      | where InitiatingProcessFileName in~ ("node.exe", "node", "bun", "bun.exe", "trufflehog", "trufflehog.exe")
      | where RemoteUrl has_any ("api.github.com", "webhook.site", "registry.npmjs.org") or RemoteIP in ("169.254.169.254")
      | summarize Count=count(), FirstSeen=min(Timestamp) by DeviceName, InitiatingProcessFileName, RemoteUrl, RemoteIP
      // 4. Files the worms wrote (Shai-Hulud: bundle.js, setup_bun.js, bun_environment.js, the *.json dumps, migrate-repos.sh)
      DeviceFileEvents
      | where Timestamp > ago(30d)
      | where FileName in~ ("setup_bun.js", "bun_environment.js", "cloud.json", "contents.json", "environment.json", "truffleSecrets.json", "actionsSecrets.json", "migrate-repos.sh", "shai-hulud-workflow.yml")
           or (FileName =~ "bundle.js" and FolderPath has "node_modules" and FileSize > 2000000)
      | summarize Hosts=dcount(DeviceName), Paths=make_set(FolderPath, 20) by FileName
    tested: null
    attack:
      - "T1195.001"
      - "T1059.007"
      - "T1552.001"
      - "T1567.001"
  - id: "supply-chain-response/crowdstrike/s2-every-external-tenant-with-a-path-into-ours-gues"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "CrowdStrike Falcon"
    title: "Every external tenant with a path into ours: guests, direct connect, GDAP and DAP"
    why: "The vendor register is usually incomplete. Sign-ins carry the home tenant and the path: serviceProvider is an MSP acting through Partner Center (GDAP or DAP), b2bCollaboration a guest. Each path has a different cut."
    how: null
    fp: "Your own MSP, Microsoft support and every Teams shared-channel partner appear here legitimately; the first query is the inventory, and any serviceProvider tenant you cannot name is its own finding."
    query: |-
      #Vendor=microsoft @sourcetype="microsoft-entra-id"
      | Vendor.properties.crossTenantAccessType!="none"
      | groupBy([Vendor.properties.homeTenantId, Vendor.properties.crossTenantAccessType],
                function=[max(@timestamp, as=LastSeen), count(as=SignIns), count(Vendor.properties.userPrincipalName, distinct=true, as=Users)])
      // The named vendor: accounts, apps and the path used
      #Vendor=microsoft @sourcetype="microsoft-entra-id"
      | Vendor.properties.homeTenantId="<vendor tenant id>" or Vendor.properties.appId="<vendor app id>"
      | groupBy([Vendor.category, Vendor.properties.userPrincipalName, Vendor.properties.crossTenantAccessType, Vendor.properties.appDisplayName],
                function=[max(@timestamp, as=LastSeen), count(as=SignIns)])
      // Vendor.properties.* mirrors Entra's JSON keys. Confirm homeTenantId, crossTenantAccessType and
      // appOwnerTenantId exist in one parsed event before trusting an empty result.
    tested: null
    attack:
      - "T1199"
      - "T1078.004"
  - id: "supply-chain-response/crowdstrike/s3-which-vendor-app-credential-is-in-use-was-one-ad"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Credentials"
    stage_ord: 3
    platform: "CrowdStrike Falcon"
    title: "Which vendor-app credential is in use, was one added, and whose tenant holds it"
    why: "Rotating the wrong secret leaves the attacker in; a credential, consent or role added during the window is the attacker's own foothold and is removed, not rotated. If the app's owner tenant is the vendor's, the secret is on their app object: only they can rotate it, and the key id from the sign-in is what you send them."
    how: null
    fp: "A vendor's scheduled credential rollover fires 'Add service principal credentials' legitimately; the tell is a second credential added without the old one removed, or a user (not admin) consent."
    query: |-
      #Vendor=microsoft @sourcetype="microsoft-entra-id" Vendor.category=AuditLogs
      | Vendor.operationName=/Add service principal credentials|Certificates and secrets management|Consent to application|Add app role assignment to service principal|Add delegated permission grant/i
      | table([@timestamp, Vendor.operationName, Vendor.properties.initiatedBy.user.userPrincipalName, Vendor.properties.targetResources[0].displayName])
      // Filter the table on <vendor app name>. Then the key in use:
      #Vendor=microsoft @sourcetype="microsoft-entra-id" Vendor.category=ServicePrincipalSignInLogs
      | Vendor.properties.appId="<vendor app id>"
      | groupBy([Vendor.properties.appOwnerTenantId, Vendor.properties.servicePrincipalCredentialKeyId, Vendor.properties.servicePrincipalCredentialThumbprint],
                function=[min(@timestamp, as=FirstSeen), max(@timestamp, as=LastSeen), count(as=SignIns)])
    tested: null
    attack:
      - "T1098.001"
      - "T1528"
  - id: "supply-chain-response/crowdstrike/s4-where-the-package-the-vendor-binary-or-the-sidel"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "CrowdStrike Falcon"
    title: "Where the package, the vendor binary or the sideloaded payload exists, ran or was loaded"
    why: "Every host with the bad version is in scope, including CI runners and developer laptops no asset register lists. A trojanised installer often carries the payload as a sideloaded library (3CX, 2023: ffmpeg.dll loaded by the signed desktop app), so the installer hash alone misses the hosts that matter."
    how: null
    fp: "Falcon records module loads it classifies, not every DLL; an empty ClassifiedModuleLoad result is not absence. The RTR disk check is the authority for 'installed'."
    query: |-
      #event_simpleName=ProcessRollup2
      | SHA256HashData=~in(values=["<sha256 of installer>", "<sha256 of payload dll>"]) or CommandLine=/<package>/i
      | groupBy([ComputerName, ImageFileName, SHA256HashData], function=[min(@timestamp, as=FirstSeen), count(as=Runs)])
      // The sideloaded payload as a module load (confirm ClassifiedModuleLoad is populated in your tenant)
      #event_simpleName=ClassifiedModuleLoad
      | ImageFileName=/\\<sideloaded dll>$/i or SHA256HashData="<sha256 of payload dll>"
      | groupBy([ComputerName, ImageFileName, SHA256HashData, TargetProcessId], function=count())
      // Execution and loads only. A package that is installed but never ran needs a disk check, RTR on the runner or laptop:
      //   runscript -Raw=```Get-ChildItem C:\Users, C:\actions-runner, C:\agent -Recurse -Filter package.json -ErrorAction SilentlyContinue | ? FullName -like '*\node_modules\<package>\package.json' | % { $_.FullName; (Get-Content $_.FullName | ConvertFrom-Json).version }```
      //   runscript -Raw=```find /home /root /opt /srv /builds -path '*/node_modules/<package>/package.json' -exec grep -H '"version"' {} +```
    tested: null
    attack:
      - "T1195.002"
      - "T1195.001"
      - "T1574.001"
  - id: "supply-chain-response/crowdstrike/s4-everything-signed-with-the-vendor-s-stolen-certi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "CrowdStrike Falcon"
    title: "Everything signed with the vendor's stolen certificate"
    why: "A stolen signing key makes a hash block insufficient: the attacker can sign a new payload. Falcon events do not expose the signer name for ad-hoc hunting; enumerate by certificate thumbprint on disk with RTR on the hosts the stage 4 hunt returned, then block every hash it finds."
    how: null
    fp: "Every legitimate binary from the vendor matches the signer name; the discriminators are the serial of the leaked certificate, a timestamp inside the compromise window, and files the vendor's release manifest does not list."
    query: |-
      runscript -Raw=```Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)', 'C:\ProgramData', 'C:\Users' -Recurse -Include *.exe,*.dll,*.msi -ErrorAction SilentlyContinue |
        Get-AuthenticodeSignature | Where-Object { $_.SignerCertificate.Thumbprint -eq '<thumbprint>' -or $_.SignerCertificate.SerialNumber -eq '<serial>' } |
        Select-Object Path, Status, @{n='Countersigned';e={$_.TimeStamperCertificate.NotBefore}}, @{n='SHA256';e={(Get-FileHash $_.Path).Hash}}```
      // Status stays Valid until the CA revokes and the host fetches the CRL; a countersignature dated before the
      // revocation keeps it Valid even then. The serial and a signing time inside the window are the evidence.
    tested: null
    attack:
      - "T1553.002"
      - "T1588.003"
