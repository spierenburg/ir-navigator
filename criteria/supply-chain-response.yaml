  - id: "supply-chain-response/splunk/s2-every-external-tenant-with-a-path-into-ours-gues"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "Splunk"
    title: "Every external tenant with a path into ours: guests, direct connect, GDAP and DAP"
    why: "The vendor register is usually incomplete. Sign-ins carry the home tenant and the path: serviceProvider is an MSP acting through Partner Center (GDAP or DAP), b2bCollaboration a guest. Each path has a different cut."
    how: null
    fp: "Your own MSP, Microsoft support ( microsoftSupport ) and every Teams shared-channel partner appear here legitimately; the first search is the inventory, and any serviceProvider tenant you cannot name is its own finding."
    query: |-
      sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs) properties.crossTenantAccessType!=none
      | stats count as signins max(_time) as last_seen dc(properties.userPrincipalName) as users
          by properties.homeTenantId properties.crossTenantAccessType
      | convert ctime(last_seen)
      `comment("the named vendor: accounts, apps, and its service principals")`
      sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs, ServicePrincipalSignInLogs)
        (properties.homeTenantId="<vendor tenant id>" OR properties.appOwnerTenantId="<vendor tenant id>" OR properties.appId="<vendor app id>")
      | stats max(_time) as last_seen values(properties.appDisplayName) as apps values(properties.ipAddress) as ips
          by category properties.userPrincipalName properties.crossTenantAccessType properties.servicePrincipalName properties.appOwnerTenantId
      | convert ctime(last_seen)
    tested: null
    attack:
      - "T1199"
      - "T1078.004"
  - id: "supply-chain-response/splunk/s3-which-vendor-app-credential-is-in-use-was-one-ad"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Credentials"
    stage_ord: 3
    platform: "Splunk"
    title: "Which vendor-app credential is in use, was one added, and whose tenant holds it"
    why: "Rotating the wrong secret leaves the attacker in; a credential, consent or role added during the window is the attacker's own foothold and is removed, not rotated. If appOwnerTenantId is the vendor's, the secret is on their app object: only they can rotate it, and the key id from the sign-in is what you send them."
    how: null
    fp: "A vendor's scheduled credential rollover fires 'Add service principal credentials' legitimately; the tell is a second credential added without the old one removed, or a user (not admin) consent."
    query: |-
      sourcetype=azure:monitor:aad category=AuditLogs
        (operationName="Add service principal credentials" OR operationName="Update application*Certificates and secrets management*"
         OR operationName="Consent to application" OR operationName="Add app role assignment to service principal" OR operationName="Add delegated permission grant")
        "<vendor app name>"
      | table _time operationName properties.initiatedBy.user.userPrincipalName properties.targetResources{}.displayName
      `comment("the key the app signs in with")`
      sourcetype=azure:monitor:aad category=ServicePrincipalSignInLogs properties.appId="<vendor app id>"
      | stats min(_time) as first_seen max(_time) as last_seen count by properties.appOwnerTenantId properties.servicePrincipalCredentialKeyId properties.servicePrincipalCredentialThumbprint
      | convert ctime(first_seen) ctime(last_seen)
    tested: null
    attack:
      - "T1098.001"
      - "T1528"
  - id: "supply-chain-response/splunk/s4-where-the-package-the-vendor-binary-or-the-sidel"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Splunk"
    title: "Where the package, the vendor binary or the sideloaded payload exists, ran or was loaded"
    why: "Every host with the bad version is in scope, including CI runners and developer laptops no asset register lists. Sysmon 7 (image load) carries the signer, so it catches both the sideloaded payload (3CX, 2023: ffmpeg.dll loaded by the signed desktop app) and every other file signed with the vendor's certificate."
    how: null
    fp: "Sysmon 7 is high volume and usually filtered to a few processes in the config; check the config before trusting an empty result. Every legitimate vendor binary matches the signer: the serial, a signing time inside the window and files not on the vendor's release manifest are the discriminators."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
        ((EventCode=1 (Hashes="*<sha256 of installer>*" OR Hashes="*<sha256 of payload dll>*"))
         OR (EventCode=7 (Hashes="*<sha256 of payload dll>*" OR (ImageLoaded="*\\<sideloaded dll>" Image="*\\<vendor exe>")))
         OR (EventCode=11 TargetFilename="*node_modules*<package>*package.json"))
      | stats min(_time) as first_seen by host EventCode Image ImageLoaded TargetFilename Signature SignatureStatus
      | convert ctime(first_seen)
      `comment("everything signed with the vendor's certificate: Sysmon 7 Signature is the signer name; the serial is not logged, check it on the sample with Get-AuthenticodeSignature")`
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=7 Signed=true Signature="<vendor signer name>"
      | stats dc(host) as hosts values(Hashes) as hashes min(_time) as first_seen by ImageLoaded Image SignatureStatus
      | convert ctime(first_seen)
      `comment("Linux runners with Sysmon for Linux: source=\"Syslog:Linux-Sysmon/Operational\" (sourcetype=sysmon:linux)")`
    tested: null
    attack:
      - "T1195.002"
      - "T1195.001"
      - "T1574.001"
