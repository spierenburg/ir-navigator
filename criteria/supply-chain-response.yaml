      // AWS CloudTrail connector, ECS-normalised. Confirm the field names in one parsed AssumeRoleWithWebIdentity event first.
      #Vendor=aws event.action="AssumeRoleWithWebIdentity"
      | user.name!=/^repo:<org>\// or user.name=/pull_request/ or !cidr(source.ip, subnet=["<runner egress cidr>"])
      | groupBy([user.name, source.ip], function=[min(@timestamp, as=FirstSeen), count()])
    tested: null
    attack:
