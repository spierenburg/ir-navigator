    validated_at: null
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "CrowdStrike Falcon"
    title: "Stolen CI credentials used in the cloud: OIDC role assumption from an unexpected subject"
    why: "A package that ran on a runner had the runner's OIDC token and any long-lived keys in its environment. On AssumeRoleWithWebIdentity the user name is the token's sub claim (GitHub: repo:org/repo:ref:refs/heads/main ); a subject or source address you cannot map to a workflow is the stolen token in use. CloudTrail event history keeps 90 d."
    how: null
    fp: "A subject you do not recognise is usually a renamed repository or a new workflow. A pull_request subject assuming a deploy role, or GitHub-hosted runner traffic from outside GitHub's published actions ranges (api.github.com/meta), is not."
