  - id: "supply-chain-response/elastic/s5-stolen-ci-credentials-used-in-the-cloud-oidc-rol"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Elastic / Wazuh"
    title: "Stolen CI credentials used in the cloud: OIDC role assumption from an unexpected subject"
    why: "A package that ran on a runner had the runner's OIDC token and any long-lived keys in its environment. On AssumeRoleWithWebIdentity the user name is the token's sub claim (GitHub: repo:org/repo:ref:refs/heads/main ); a subject or source address you cannot map to a workflow is the stolen token in use. CloudTrail event history keeps 90 d; the integration keeps what your ILM policy does."
    how: null
    fp: "A subject you do not recognise is usually a renamed repository or a new workflow. A pull_request subject assuming a deploy role, or GitHub-hosted runner traffic from outside GitHub's published actions ranges (api.github.com/meta), is not."
    query: |-
      FROM logs-aws.cloudtrail-*
      | WHERE @timestamp > NOW() - 30 days AND event.action == "AssumeRoleWithWebIdentity"
      | WHERE NOT user.name LIKE "repo:<org>/*" OR user.name LIKE "*pull_request*" OR NOT CIDR_MATCH(source.ip, "<runner egress cidr>")
      | STATS count = COUNT(*), first_seen = MIN(@timestamp), ips = VALUES(source.ip) BY user.name, aws.cloudtrail.user_identity.type
      // Long-lived keys that lived on runners or laptops: everything they did from a new address
      FROM logs-aws.cloudtrail-*
      | WHERE @timestamp > NOW() - 30 days AND aws.cloudtrail.user_identity.access_key_id IN ("<leaked access key ids>")
      | STATS calls = COUNT(*), events = VALUES(event.action) BY aws.cloudtrail.user_identity.access_key_id, source.ip, user_agent.original
    tested: null
    attack:
      - "T1550.001"
      - "T1078.004"
