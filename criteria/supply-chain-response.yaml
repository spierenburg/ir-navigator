    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Velociraptor"
    title: "Install-time execution: what the package left behind, and what node is running now"
    why: "No process history without Sysmon or an EDR, so Velociraptor hunts what the payload left: the worm's dropped files (Shai-Hulud 2025: bundle.js, setup_bun.js, bun_environment.js, the credential dumps, migrate-repos.sh ), the shell history of the install and of trufflehog, the.bashrc sabotage from Nx s1ngularity, and the credential files it read ( ~/.npmrc, cloud SDK caches)."
    how: null
    fp: "bundle.js is a common legitimate file name, so it is not in the glob; hunt it by size and path (over 2 MB inside node_modules/<package>) if the advisory names it. Shell history only shows interactive installs; CI installs live in the job log."
    query: |-
      Hunt: Linux.Search.FileFinder
        SearchFilesGlob = /{home/*,root,opt,srv,builds,tmp}/**/{setup_bun.js,bun_environment.js,truffleSecrets.json,actionsSecrets.json,cloud.json,environment.json,contents.json,migrate-repos.sh,inventory.txt}
        Upload_File     = Y
      Hunt: Windows.Search.FileFinder
        SearchFilesGlob = C:\{Users\*,actions-runner,agent}\**\{setup_bun.js,bun_environment.js,truffleSecrets.json,actionsSecrets.json,migrate-repos.sh}
      Hunt: Linux.Sys.BashHistory
        SearchRegex = (?i)(npm|pnpm|yarn|bun|pip3?) (install|i|add|ci) .*<package>|trufflehog|gh repo create|npm publish|claude .*--dangerously|gemini .*--yolo
      Hunt: Linux.Sys.BashHistory                (Nx s1ngularity appended a shutdown to shell rc files)
        TargetGlob  = /{root,home/*}/.{bashrc,zshrc}
        SearchRegex = shutdown
      Hunt: Generic.System.Pstree               (live, while a build runs)
        CallChainFilter = (?i)(node|bun).*(sh|bash|trufflehog|gh|claude|gemini|q)
    tested: null
    attack:
      - "T1195.001"
      - "T1059.007"
      - "T1552.001"
