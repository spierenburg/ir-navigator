  - id: "supply-chain-response/splunk/s5-stolen-ci-credentials-used-in-the-cloud-oidc-rol"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Splunk"
    title: "Stolen CI credentials used in the cloud: OIDC role assumption from an unexpected subject"
    why: "A package that ran on a runner had the runner's OIDC token and any long-lived keys in its environment. On AssumeRoleWithWebIdentity, userIdentity.userName is the token's sub claim (GitHub: repo:org/repo:ref:refs/heads/main ); a subject or source address you cannot map to a workflow is the stolen token in use. CloudTrail event history keeps 90 d; the add-on keeps what your index does."
    how: null
    fp: "A subject you do not recognise is usually a renamed repository or a new workflow. A pull_request subject assuming a deploy role, or GitHub-hosted runner traffic from outside GitHub's published actions ranges (api.github.com/meta), is not."
    query: |-
      sourcetype=aws:cloudtrail eventName=AssumeRoleWithWebIdentity
      | rename userIdentity.userName as sub, requestParameters.roleArn as role
      | where NOT like(sub, "repo:<org>/%") OR like(sub, "%pull_request%") OR NOT cidrmatch("<runner egress cidr>", sourceIPAddress)
      | stats count min(_time) as first_seen values(sourceIPAddress) as ips by sub role
      | convert ctime(first_seen)
      `comment("long-lived keys that lived on runners or laptops: everything they did from a new address")`
      sourcetype=aws:cloudtrail userIdentity.accessKeyId IN ("<leaked access key ids>")
      | stats count values(eventName) as events by userIdentity.accessKeyId sourceIPAddress userAgent
    tested: null
    attack:
      - "T1550.001"
      - "T1078.004"
  - id: "supply-chain-response/splunk/s6-shells-and-commands-launched-by-the-msp-s-remote"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Splunk"
    title: "Shells and commands launched by the MSP's remote-management agent"
    why: "An MSP's RMM agent is command-and-control as SYSTEM on every managed host (Kaseya VSA, 2021: a pushed 'hot-fix' procedure deployed ransomware through AgentMon.exe). Commands it launched during the window show whether the attacker used it inside our network."
    how: null
    fp: "Every legitimate RMM task spawns cmd and powershell as SYSTEM. Baseline the week before the window and diff; encoded commands, certutil decoding, Defender tampering and shells on hosts with no open ticket are the signal."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1
        ParentImage IN ("*\\AgentMon.exe", "*\\ScreenConnect.ClientService.exe", "*\\AteraAgent.exe", "*\\NinjaRMMAgent.exe", "*\\CagService.exe", "*\\BASupSrvc.exe", "*\\<rmm agent exe>")
        (Image="*\\cmd.exe" OR Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\rundll32.exe" OR Image="*\\certutil.exe" OR Image="*\\msiexec.exe")
      | eval suspicious=if(match(CommandLine, "(?i)-enc|-EncodedCommand|certutil|-decode|DisableRealtimeMonitoring|vssadmin|bcdedit"), "yes", "no")
      | stats dc(host) as hosts values(host) as host_list min(_time) as first_seen by ParentImage Image User suspicious CommandLine
      | convert ctime(first_seen)
    tested: null
    attack:
      - "T1219"
      - "T1059.003"
      - "T1059.001"
  - id: "supply-chain-response/splunk/s6-install-time-execution-lifecycle-scripts-in-proc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Splunk"
    title: "Install-time execution: lifecycle scripts, in-process credential theft and the 2025 worm pattern"
    why: "npm runs lifecycle scripts through cmd.exe /d /s /c on Windows and sh -c elsewhere, with node as the parent. In-process payloads never spawn curl: Shai-Hulud (2025) ran inside node, fetched trufflehog, read ~/.npmrc and cloud credential files, talked to api.github.com and published with the stolen token; Nx s1ngularity used installed claude, gemini and q CLIs as the secret finder. Hunt node's children, its DNS and its file writes, not a download tool."
    how: null
    fp: "Search 1 fires on node-gyp builds, husky and every legitimate install script: read the command lines. Search 2: editors are node processes and developers run gh and AI CLIs from them; ParentCommandLine separates an editor from an npm install. Search 3 needs Sysmon 22 enabled in the config; node resolving api.github.com is normal on a laptop, abnormal on a CI runner during an install step."
    query: |-
      `comment("1. lifecycle scripts in the window, scoped to the package")`
      index=* (source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR source="Syslog:Linux-Sysmon/Operational") EventCode=1
        (ParentImage="*\\node.exe" OR ParentImage="*/node")
        ((Image="*\\cmd.exe" CommandLine="*/d /s /c*") OR (Image IN ("*/sh", "*/bash", "*/dash") CommandLine="* -c *"))
        (CommandLine="*<package>*" OR CommandLine="*preinstall*" OR CommandLine="*postinstall*")
      | stats min(_time) as first_seen values(CommandLine) as cmds by host User
      `comment("2. node or bun spawning the tools the worms used")`
      index=* (source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR source="Syslog:Linux-Sysmon/Operational") EventCode=1
        (ParentImage IN ("*\\node.exe", "*/node", "*\\bun.exe", "*/bun"))
        (Image IN ("*/trufflehog", "*\\trufflehog.exe", "*/gh", "*\\gh.exe", "*/claude", "*/gemini", "*/q", "*\\q.exe")
         OR CommandLine IN ("*--dangerously-skip-permissions*", "*--yolo*", "*--trust-all-tools*", "*npm publish*", "*gh repo create*", "*gh auth*", "*/tmp/inventory.txt*"))
      | table _time host User Image CommandLine ParentCommandLine
      `comment("3. node, bun or trufflehog resolving GitHub, a webhook sink or the registry (Sysmon 22), or hitting the metadata service (Sysmon 3)")`
      index=* (source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR source="Syslog:Linux-Sysmon/Operational")
        (Image IN ("*\\node.exe", "*/node", "*\\bun.exe", "*/bun", "*/trufflehog", "*\\trufflehog.exe"))
        ((EventCode=22 QueryName IN ("api.github.com", "webhook.site", "registry.npmjs.org")) OR (EventCode=3 DestinationIp="169.254.169.254"))
      | stats count min(_time) as first_seen by host Image QueryName DestinationIp
      `comment("4. files the worms wrote (Sysmon 11)")`
      index=* (source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR source="Syslog:Linux-Sysmon/Operational") EventCode=11
        TargetFilename IN ("*setup_bun.js", "*bun_environment.js", "*truffleSecrets.json", "*actionsSecrets.json", "*cloud.json", "*environment.json", "*migrate-repos.sh", "*shai-hulud-workflow.yml")
      | stats dc(host) as hosts values(TargetFilename) as paths by Image
    tested: null
    attack:
      - "T1195.001"
      - "T1059.007"
      - "T1552.001"
      - "T1567.001"
  - id: "supply-chain-response/elastic/s2-every-external-tenant-with-a-path-into-ours-gues"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "Elastic / Wazuh"
    title: "Every external tenant with a path into ours: guests, direct connect, GDAP and DAP"
    why: "The vendor register is usually incomplete. Sign-ins carry the home tenant and the path: serviceProvider is an MSP acting through Partner Center (GDAP or DAP), b2bCollaboration a guest. Each path has a different cut."
    how: null
    fp: "Your own MSP, Microsoft support ( microsoftSupport ) and every Teams shared-channel partner appear here legitimately; the first query is the inventory, and any serviceProvider tenant you cannot name is its own finding."
    query: |-
      FROM logs-azure.signinlogs-*
      | WHERE @timestamp > NOW() - 90 days AND azure.signinlogs.properties.cross_tenant_access_type != "none"
      | STATS signins = COUNT(*), last_seen = MAX(@timestamp), users = COUNT_DISTINCT(azure.signinlogs.properties.user_principal_name)
          BY azure.signinlogs.properties.home_tenant_id, azure.signinlogs.properties.cross_tenant_access_type
      // The named vendor: accounts, apps and the path used
      FROM logs-azure.signinlogs-*
      | WHERE @timestamp > NOW() - 90 days
      | WHERE azure.signinlogs.properties.home_tenant_id == "<vendor tenant id>"
           OR azure.signinlogs.properties.app_id == "<vendor app id>"
      | STATS last_seen = MAX(@timestamp), signins = COUNT(*)
          BY azure.signinlogs.category, azure.signinlogs.properties.user_principal_name,
             azure.signinlogs.properties.cross_tenant_access_type, azure.signinlogs.properties.service_principal_name
    tested: null
    attack:
      - "T1199"
      - "T1078.004"
  - id: "supply-chain-response/elastic/s3-which-vendor-app-credential-is-in-use-was-one-ad"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Credentials"
    stage_ord: 3
    platform: "Elastic / Wazuh"
    title: "Which vendor-app credential is in use, was one added, and whose tenant holds it"
    why: "Rotating the wrong secret leaves the attacker in; a credential, consent or role added during the window is the attacker's own foothold and is removed, not rotated. A multi-tenant vendor app's secret is on the app object in the vendor's tenant: only they can rotate it, and the key id from the sign-in is what you send them (the owner tenant is on the Graph servicePrincipal as appOwnerOrganizationId )."
    how: null
    fp: "A vendor's scheduled credential rollover fires 'Add service principal credentials' legitimately; the tell is a second credential added without the old one removed, or a user (not admin) consent."
    query: |-
      FROM logs-azure.auditlogs-*
      | WHERE @timestamp > NOW() - 30 days
      | WHERE azure.auditlogs.operation_name IN ("Add service principal credentials", "Consent to application",
                "Add app role assignment to service principal", "Add delegated permission grant")
           OR azure.auditlogs.operation_name LIKE "*Certificates and secrets management*"
      | KEEP @timestamp, azure.auditlogs.operation_name, azure.auditlogs.properties.initiated_by.user.userPrincipalName,
             azure.auditlogs.properties.target_resources.*
      // Filter on <vendor app name> in target_resources. The key the app signs in with is in the
      // service-principal sign-in properties (same integration, category ServicePrincipalSignInLogs).
    tested: null
    attack:
      - "T1098.001"
      - "T1528"
  - id: "supply-chain-response/elastic/s4-where-the-package-the-vendor-binary-or-the-sidel"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Elastic / Wazuh"
    title: "Where the package, the vendor binary or the sideloaded payload exists, ran or was loaded"
    why: "Every host with the bad version is in scope, including CI runners and developer laptops no asset register lists. A trojanised installer often carries the payload as a sideloaded library (3CX, 2023: ffmpeg.dll loaded by the signed desktop app), so the installer hash alone misses the hosts that matter."
    how: null
    fp: "Library events need Elastic Defend (or Sysmon 7, usually filtered in the config); an empty result is not absence. The package.json write is the install event, so a package installed before retention is invisible here."
    query: |-
      any where
        process.hash.sha256 in ("<sha256 of installer>", "<sha256 of payload dll>") or
        file.hash.sha256 in ("<sha256 of installer>", "<sha256 of payload dll>") or
        dll.hash.sha256 == "<sha256 of payload dll>" or
        (event.category == "file" and file.path : ("*/node_modules/<package>/package.json",
                                                   "*\\node_modules\\<package>\\package.json"))
      // The sideloaded payload by name and parent, hash-agnostic
      library where dll.name : "<sideloaded dll>" and process.name : "<vendor exe>"
    tested: null
    attack:
      - "T1195.002"
      - "T1195.001"
      - "T1574.001"
  - id: "supply-chain-response/elastic/s4-everything-signed-with-the-vendor-s-stolen-certi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Elastic / Wazuh"
    title: "Everything signed with the vendor's stolen certificate"
    why: "A stolen signing key makes a hash block insufficient: the attacker can sign a new payload. Hunt by signer across process starts and library loads, then block the signer in the Defend blocklist and every hash it returned."
    how: null
    fp: "Every legitimate binary from the vendor matches the signer; the discriminators are the serial of the leaked certificate, a code_signature.timestamp inside the compromise window, and files the vendor's release manifest does not list."
    query: |-
      any where
        process.code_signature.subject_name : "<vendor signer name>" or
        dll.code_signature.subject_name : "<vendor signer name>"
      // ECS carries subject_name, trusted, status and timestamp, not the serial: check the serial on the sample
      // with Get-AuthenticodeSignature. trusted stays true until the CA revokes and the host fetches the CRL;
      // a countersignature dated before the revocation keeps it true even then.
    tested: null
    attack:
      - "T1553.002"
      - "T1588.003"
