      // Identity half: only if Entra logs are ingested. Discover the parser's fields, then filter on the vendor tenant id:
      dataSource.name = '<entra source>' | limit 5
      // Endpoint half: hosts that accept logons from the vendor's addresses
      event.category = 'logins' AND net_ipsubnet(src.endpoint.ip.address, '<vendor cidr>')
      | group Logons = count() by endpoint.name, event.login.userName, event.login.type
    tested: null
    attack:
      - "T1199"
