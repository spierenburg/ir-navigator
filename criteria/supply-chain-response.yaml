  - id: "supply-chain-response/sentinelone/s6-install-time-execution-lifecycle-scripts-in-proc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "SentinelOne"
    title: "Install-time execution: lifecycle scripts, in-process credential theft and the 2025 worm pattern"
    why: "npm runs lifecycle scripts through cmd.exe /d /s /c on Windows and sh -c elsewhere, with node as the parent. In-process payloads never spawn curl: Shai-Hulud (2025) ran inside node, fetched trufflehog, read ~/.npmrc and cloud credential files, talked to api.github.com and published with the stolen token; Nx s1ngularity used installed claude, gemini and q CLIs as the secret finder. Hunt node's children, its files and its connections, not a download tool."
    how: null
    fp: "Query 1 fires on node-gyp builds, husky and every legitimate install script: read the command lines. Query 2: editors are node processes and developers run gh and AI CLIs from them; the parent command line separates an editor from an npm install. Query 3: node resolving api.github.com is normal on a laptop, abnormal on a CI runner during an install step."
    query: |-
      // 1. Lifecycle scripts in the window, scoped to the package
      event.type = 'Process Creation' AND src.process.name in:anycase ('node', 'node.exe')
        AND ((tgt.process.name in:anycase ('cmd.exe') AND tgt.process.cmdline contains '/d /s /c')
             OR (tgt.process.name in:anycase ('sh', 'bash', 'dash') AND tgt.process.cmdline contains ' -c '))
        AND tgt.process.cmdline contains ('<package>', 'preinstall', 'postinstall')
      | group First = min(event.time), Cmds = count() by endpoint.name, src.process.user, tgt.process.cmdline
      // 2. Node or bun spawning the tools the worms used
      event.type = 'Process Creation' AND src.process.name in:anycase ('node', 'node.exe', 'bun', 'bun.exe')
        AND (tgt.process.name in:anycase ('trufflehog', 'trufflehog.exe', 'gh', 'gh.exe', 'claude', 'gemini', 'q', 'q.exe')
             OR tgt.process.cmdline contains ('--dangerously-skip-permissions', '--yolo', '--trust-all-tools', 'npm publish', 'gh repo create', 'gh auth', '/tmp/inventory.txt'))
      | columns event.time, endpoint.name, src.process.user, tgt.process.name, tgt.process.cmdline, src.process.cmdline
      // 3. Node, bun or trufflehog connecting to GitHub, a webhook sink, the registry or the metadata service
      (event.type = 'IP Connect' OR event.type = 'DNS Resolved')
        AND src.process.name in:anycase ('node', 'node.exe', 'bun', 'bun.exe', 'trufflehog', 'trufflehog.exe')
        AND (dns.request contains ('api.github.com', 'webhook.site', 'registry.npmjs.org') OR dst.ip.address = '169.254.169.254')
      | group Count = count(), First = min(event.time) by endpoint.name, src.process.name, dns.request, dst.ip.address
      // 4. Files the worms wrote
      event.type = 'File Creation'
        AND (tgt.file.path contains ('setup_bun.js', 'bun_environment.js', 'truffleSecrets.json', 'actionsSecrets.json', 'migrate-repos.sh', 'shai-hulud-workflow.yml', 'cloud.json', 'environment.json')
             OR (tgt.file.path contains 'node_modules' AND tgt.file.path contains 'bundle.js' AND tgt.file.size > 2000000))
      | group Hosts = estimate_distinct(endpoint.name) by tgt.file.path
    tested: null
    attack:
      - "T1195.001"
      - "T1059.007"
      - "T1552.001"
      - "T1567.001"
