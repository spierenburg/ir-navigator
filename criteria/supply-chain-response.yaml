  - id: "supply-chain-response/elastic/s6-install-time-execution-lifecycle-scripts-in-proc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Elastic / Wazuh"
    title: "Install-time execution: lifecycle scripts, in-process credential theft and the 2025 worm pattern"
    why: "npm runs lifecycle scripts through cmd.exe /d /s /c on Windows and sh -c elsewhere, with node as the parent. In-process payloads never spawn curl: Shai-Hulud (2025) ran inside node, fetched trufflehog, read ~/.npmrc and cloud credential files, talked to api.github.com and published with the stolen token; Nx s1ngularity used installed claude, gemini and q CLIs as the secret finder. Hunt node's children, its DNS and its file writes, not a download tool."
    how: null
    fp: "Query 1 fires on node-gyp builds, husky and every legitimate install script: read the command lines. Query 2: editors are node processes and developers run gh and AI CLIs from them; the parent command line separates an editor from an npm install. Query 3 needs DNS events (Elastic Defend network events or Sysmon 22); node resolving api.github.com is normal on a laptop, abnormal on a CI runner during an install step."
    query: |-
      // 1. Lifecycle scripts in the window, scoped to the package
      process where event.type == "start" and process.parent.name : ("node", "node.exe") and
        ((process.name : "cmd.exe" and process.command_line : "*/d /s /c*") or
         (process.name : ("sh", "bash", "dash") and process.args : "-c")) and
        process.command_line : ("*<package>*", "*preinstall*", "*postinstall*")
      // 2. Node or bun spawning the tools the worms used
      process where event.type == "start" and process.parent.name : ("node", "node.exe", "bun", "bun.exe") and
        (process.name : ("trufflehog", "trufflehog.exe", "gh", "gh.exe", "claude", "gemini", "q", "q.exe") or
         process.command_line : ("*--dangerously-skip-permissions*", "*--yolo*", "*--trust-all-tools*", "*npm publish*", "*gh repo create*", "*gh auth*", "*/tmp/inventory.txt*"))
      // 3. Node, bun or trufflehog resolving GitHub, a webhook sink or the registry, or hitting the metadata service
      any where process.name : ("node", "node.exe", "bun", "bun.exe", "trufflehog", "trufflehog.exe") and
        (dns.question.name : ("api.github.com", "webhook.site", "registry.npmjs.org") or destination.ip == "169.254.169.254")
      // 4. Files the worms wrote
      file where event.type : ("creation", "change") and
        (file.name : ("setup_bun.js", "bun_environment.js", "truffleSecrets.json", "actionsSecrets.json", "cloud.json", "environment.json", "migrate-repos.sh", "shai-hulud-workflow.yml") or
         (file.name : "bundle.js" and file.path : "*node_modules*" and file.size > 2000000))
    tested: null
    attack:
      - "T1195.001"
      - "T1059.007"
      - "T1552.001"
      - "T1567.001"
  - id: "supply-chain-response/defender/s6-vendor-app-writing-to-other-identities-in-our-te"
    status: "active"
    source: "Huntress, 'Vendor Credential Enables Unauthorized Access' (https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access); Microsoft Security Blog 2026-10-21 Storm-0940/ARTEX (https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/); discovered via T-Minus365 recreation video (distill 2026-10-25)"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Vendor app writing to other identities in our tenant: self-assigned roles and credentials planted on other apps"
    why: "A compromised multi-tenant vendor app with RoleManagement.ReadWrite.Directory or Application.ReadWrite.All can make itself Global Administrator and plant credentials on OTHER apps in our tenant, which then outlive the vendor app being disabled and the vendor rotating its secret. ConnectWise Cloud Backup / SkyKick, Oct 2026 (Huntress): the ConnectWise Cloud Management – MS Teams app (24205314-2b89-4e07-a2a4-579e898a5640) gave itself Global Administrator, then added credentials to two other apps, one a single-tenant Huntress app. Secrets went onto apparently random apps, in one tenant some of the least privileged, so do not narrow the hunt to high-privilege targets. Operations to look for: \"Add member to role\", \"Add app role assignment to service principal\", \"Add service principal credentials\", and \"Update application\" where the modified property is KeyDescription (secrets/certificates) or FederatedIdentityCredentials. Initiator is the vendor service principal (InitiatedBy.app). Every role, credential or owner change the vendor app makes in our tenant is a finding, its own service principal included: a self-assigned role is the Global Administrator step, and a credential on its own service principal is a backdoor that survives the vendor rotating its secret. The vendor's real secret rotation happens on its application object in its own home tenant and writes no row in ours. Each target app becomes its own non-human-identity incident (identity-breach-response scenario 6): remove the planted credential, do not just rotate it."
    how: null
    fp: "Our own identity-governance or CI automation adds credentials and role assignments on a schedule; exclude its app ids from the initiator. Do not dismiss a row because the target is the vendor app itself: a multi-tenant vendor rotates its secret in its own tenant, so a credential or role change on its service principal in ours is not routine. The benign case is a change made by one of our own admins or automation to the vendor's service principal, which shows our initiator, not the vendor app. AuditLogs carries no IP for an app initiator, so take addresses from AADServicePrincipalSignInLogs for the same AppId and time."
    query: |-
      // Example ids from the ConnectWise advisory: Cloud Backup (506e08f9-...) and Cloud Management - MS Teams (24205314-...).
      // Replace with the full app id list from the advisory for the vendor you are investigating.
      let vendorAppIds = dynamic(["506e08f9-6e9a-4da4-942b-a099a03644ae","24205314-2b89-4e07-a2a4-579e898a5640"]);
      AuditLogs
      | where TimeGenerated > ago(30d)
      | extend InitiatorAppId = tostring(InitiatedBy.app.appId), InitiatorName = tostring(InitiatedBy.app.displayName)
      | where InitiatorAppId in (vendorAppIds)
      | where OperationName in ("Add member to role","Add eligible member to role","Add app role assignment to service principal","Add service principal credentials","Add owner to application","Add owner to service principal")
          or (OperationName startswith "Update application" and tostring(TargetResources) has_any ("KeyDescription","FederatedIdentityCredentials"))
      | mv-expand Target = TargetResources
      | extend TargetId = tostring(Target.id), TargetName = tostring(Target.displayName), TargetType = tostring(Target.type), Modified = Target.modifiedProperties
      | project TimeGenerated, OperationName, Result, InitiatorName, InitiatorAppId, TargetType, TargetName, TargetId, Modified, CorrelationId
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1098.001"
      - "T1098.003"
  - id: "supply-chain-response/defender/s5-planted-on-apps-still-signing-in-after-the-vendo"
    status: "active"
    source: "Huntress ConnectWise/SkyKick advisory (credentials planted on other apps); Microsoft Learn 'Conditional Access for workload identities' (single-tenant SPs only, Workload ID Premium); distill 2026-10-25 of T-Minus365 recreation video (t=34:20 CA notApplied demo)"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Planted-on apps still signing in after the vendor app is disabled"
    why: "Disabling the vendor's enterprise app and waiting for the vendor to rotate its secret ends only the first foothold. If the attacker planted a secret or certificate on one of our apps (stage 6), that app keeps getting app-only tokens with the new key, and no vendor-side action reaches it. A successful service-principal sign-in using a key id created in the exposure window, or from the vendor's IoC IPs or hosting/Azure IPv6 space, after the vendor app was disabled, means the attacker is still in. Conditional Access shows \"notApplied\" on every one of these sign-ins (CA for workload identities covers only single-tenant service principals and needs Workload ID Premium), so a missing CA block rules nothing out."
    how: null
    fp: "A credential our own team added and documented, signing in from our own automation's addresses, is benign; confirm the key id against the change record. With plantedKeyIds empty the query matches on the IoC IPs only, so populate it from the stage 6 results before reading an empty table as clean."
    query: |-
      let disabledAt = datetime(<when the vendor app was disabled>);
      let plantedKeyIds = dynamic([]); // keyIds of credentials added in the window (stage 6 Modified/KeyDescription)
      let iocIPs = dynamic(["144.172.64.128"]); // ConnectWise advisory IoC; replace with the advisory's list for your vendor
      AADServicePrincipalSignInLogs
      | where TimeGenerated > disabledAt
      | where ResultType == "0"
      | where ServicePrincipalCredentialKeyId in (plantedKeyIds) or IPAddress in (iocIPs)
      | summarize First = min(TimeGenerated), Last = max(TimeGenerated), Count = count(), Resources = make_set(ResourceDisplayName) by ServicePrincipalName, AppId, ServicePrincipalCredentialKeyId, IPAddress, ConditionalAccessStatus
    tested: null
    attack:
      - "T1078.004"
  - id: "supply-chain-response/defender/s2-containing-a-compromised-vendor-multi-tenant-app"
    status: "active"
    source: "Huntress ConnectWise/SkyKick advisory (disable not delete); SpecterOps 2026-10-17 tenant check; ctipilot.ch 2026-10-18 (seven app ids, 90-min token tail, Entra Free 7-day retention, S-K LLC owner tenant); distill 2026-10-25 of T-Minus365 video (t=33:01)"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Containing a compromised vendor multi-tenant app: disable-not-delete, the token tail, and log retention"
    why: "The vendor's secret sits on its app object in the vendor's tenant: we cannot rotate it, so the only lever on our side is setting the enterprise app's accountEnabled to false (Enabled for users to sign-in = No). Disable, do not delete. Deleting removes the consent and app-role assignments, and with them the record of what the app was allowed to do, before the investigation has used it (Huntress, SpecterOps). Disabling stops NEW token issuance only. An app-only access token already issued stays valid for its lifetime (60–90 min), so keep watching MicrosoftGraphActivityLogs for the AppId until at least 90 minutes after the disable, and only then treat later silence as containment. Export the sign-in and audit logs immediately: Entra ID Free keeps 7 days and P1/P2 keep 30, so an incident found late has already lost its first sign-ins unless they were streamed to Log Analytics. Disable every app ID in the vendor's advisory (seven for ConnectWise, dormant ones included) and list every app with appOwnerOrganizationId equal to the vendor's tenant (ConnectWise S-K LLC: 3f9cd7a0-127a-4ed4-bf06-2f830d5616b7). The advisory list can be incomplete."
    how: null
    fp: "Ruled out when none of the vendor's app ids exist as service principals here and no app has the vendor's owner tenant id. Graph calls up to 90 minutes after the disable can be the token tail, not a failed containment; a call more than 90 minutes after it is a failed containment."
    query: |-
      // Run the Graph PowerShell side first: Get-MgServicePrincipal -All -Property Id,AppId,DisplayName,AppOwnerOrganizationId,AccountEnabled | ? AppOwnerOrganizationId -eq '<vendor tenant id>'
      // advisoryAppIds: every app id in the vendor's advisory. The two below are ConnectWise examples (Cloud Backup,
      // Cloud Management - MS Teams); the ConnectWise advisory lists seven, so add the other five from it.
      let advisoryAppIds = dynamic(["506e08f9-6e9a-4da4-942b-a099a03644ae","24205314-2b89-4e07-a2a4-579e898a5640"]);
      let vendorTenantId = "<vendor tenant id>"; // ConnectWise S-K LLC: 3f9cd7a0-127a-4ed4-bf06-2f830d5616b7
      // Any app owned by the vendor's tenant that has signed in here counts too, so an id missing from the advisory is still watched.
      let ownedAppIds = AADServicePrincipalSignInLogs
        | where TimeGenerated > ago(90d) and AppOwnerTenantId == vendorTenantId
        | distinct AppId;
      let disabledAt = datetime(<when the enterprise apps were disabled>);
      MicrosoftGraphActivityLogs
      | where TimeGenerated > disabledAt
      | where AppId in (advisoryAppIds) or AppId in (ownedAppIds)
      | extend MinutesAfterDisable = datetime_diff("minute", TimeGenerated, disabledAt)
      | summarize Calls = count(), First = min(TimeGenerated), Last = max(TimeGenerated), Uris = make_set(RequestUri, 20),
                  PastTokenTail = countif(MinutesAfterDisable > 90) by AppId, IPAddress, ResponseStatusCode
      // PastTokenTail > 0 is a call more than 90 minutes after the disable: containment failed for that AppId.
      | order by PastTokenTail desc, Last desc
    tested: null
    attack:
      - "T1199"
  - id: "supply-chain-response/defender/s4-sckit-worm-stage0-from-ai-agent-memory-packages"
    status: "active"
    source: "StepSecurity 2026-09-30 (corroborated by Socket, SafeDep, Aikido/THN)"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Sckit worm: install-time stage0 via AI-agent-memory packages (MemTensor npm/PyPI)"
    why: "An npm lifecycle script or Python import chain that drops and executes a Go implant (process cmdline 'sckit stage0 --config64 <base64>') and beacons to per-victim 12-hex subdomains of skyleen[.]fr means install-time supply-chain compromise of AI-agent memory tooling; persistence lands under agent-runtime dirs ($HOME/.openclaw/.cache/runtime, $HOME/.memos/.cache/runtime, .sckit/<os>-<arch>/). Ruled out by: zero DNS answers for *.skyleen.fr in resolver history, no .cache/runtime under agent dirs, no sckit process cmdline. The domain is sinkhole-able; the durable discriminators are the per-victim-subdomain beacon pattern and the stage0 cmdline shape, not the IOC list."
    how: "Run all four on every host that installed the MemTensor npm or PyPI packages, developer laptops and CI runners included. Defender for Endpoint on macOS and Linux fills the process, file and network tables; a runner without the sensor needs its job log and the registry proxy instead. RemoteUrl is the hostname Defender saw on the connection, not resolver history: for the 'zero DNS answers' falsifier, query the resolver or DnsEvents for *.skyleen.fr as well."
    fp: "The agent tools create their own .cache/runtime directories on install: a hit on the path alone is not the implant. The discriminators are a new executable written there by node, npm or python, and the 'stage0 --config64' command line. The generic 12-hex-subdomain beacon line matches CDN and telemetry hosts too; it is only meaningful when the initiating process is node or python from the package path."
    query: |-
      // The stage0 implant by command-line shape: survives a new domain and a rebuilt binary
      DeviceProcessEvents
      | where Timestamp > ago(30d)
      | where ProcessCommandLine has "stage0" and ProcessCommandLine has "--config64"
      | project Timestamp, DeviceName, AccountName, FileName, FolderPath, SHA256, ProcessCommandLine,
          InitiatingProcessFileName, InitiatingProcessCommandLine
      // Drops under the agent-runtime directories and the implant's own tree, and who wrote them
      DeviceFileEvents
      | where Timestamp > ago(30d)
      | where FolderPath matches regex @"[\\/]\.(openclaw|memos)[\\/]\.cache[\\/]runtime|[\\/]\.sckit[\\/]"
      | summarize FirstSeen=min(Timestamp), Files=make_set(FileName, 20), Writers=make_set(InitiatingProcessFileName, 10)
          by DeviceName, FolderPath
      // Beacon to the known domain: per-victim 12-hex subdomains
      DeviceNetworkEvents
      | where Timestamp > ago(30d)
      | where RemoteUrl endswith ".skyleen.fr"
      | summarize FirstSeen=min(Timestamp), Subdomains=make_set(RemoteUrl, 20), Ports=make_set(RemotePort)
          by DeviceName, InitiatingProcessFileName, InitiatingProcessFolderPath
      // The same beacon shape on any domain, from node or python: the domain is sinkhole-able, the pattern is not
      DeviceNetworkEvents
      | where Timestamp > ago(30d)
      | where InitiatingProcessFileName in~ ("node", "node.exe", "python", "python3", "python.exe")
          or InitiatingProcessFolderPath has_any (".openclaw", ".memos", ".sckit")
      | where RemoteUrl matches regex @"^[0-9a-f]{12}\.[a-z0-9-]+\.[a-z]{2,}$"
      | summarize Hosts=dcount(DeviceName), Subdomains=make_set(RemoteUrl, 20)
          by Domain=substring(RemoteUrl, 13), InitiatingProcessFileName
    tested: null
    attack:
      - "T1195.001"
      - "T1204.005"
  - id: "supply-chain-response/proposed/python-startup-hook-persistence-pth-sitecustomize-py-written-into-site-packages"
    status: "active"
    source: "Socket / LiteLLM / Microsoft / Datadog reporting on the litellm 1.107.0 compromise (2026-10-21; OSV MAL-2026-2144)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Velociraptor"
    title: "Python startup-hook persistence: .pth / sitecustomize.py written into site-packages by a package install"
    why: "A .pth line beginning with 'import' and a sitecustomize.py or usercustomize.py all execute on EVERY Python interpreter start, independent of importing the package, so uninstalling the package does not remove the payload (litellm 1.107.0, Oct 2026: cook.pth + sitecustomize.py loader that ran hourly, read a GitHub dead drop and executed /codepy). Hunt by RECORD, not by filename: the malicious wheel's dist-info/RECORD lists the hook files, a clean wheel does not. Legit .pth files (_virtualenv.pth, coloredlogs.pth, *-nspkg.pth, distutils-precedence.pth) and vendor sitecustomize.py (venvstacks/LM Studio) are common, so a filename hit alone is not a finding: read the content for import lines that open sockets, spawn processes, or decode base64. Rules out: hook file absent from the package RECORD and content limited to sys.path manipulation. Scope = every host/container/CI runner that started Python with the bad version installed; rotate every credential reachable from those processes."
    how: null
    fp: "Editable installs (pip install -e) write __editable__*.pth files that contain an import line by design; they name a local source path and a finder module, not a socket or a subprocess. Containers and CI runners are not enrolled clients: hunt their images and caches, or the job log, instead."
    query: |-
      Hunt: Generic.Detection.Yara.Glob          (hook files whose content does more than extend sys.path)
        PathGlob = /{usr,usr/local,opt,home/*,root,srv,builds}/**/{site,dist}-packages/{*.pth,sitecustomize.py,usercustomize.py}
        YaraRule = rule py_startup_hook { strings: $i = /(^|\n)import[ \t]/ $a = "exec(" $b = "b64decode" $c = "subprocess" $d = "socket" $e = "urlopen" condition: ($i and any of ($a,$b,$c,$d,$e)) or 2 of ($a,$b,$c,$d,$e) }
      Hunt: Generic.Detection.Yara.Glob          (Windows)
        PathGlob = C:\{Users\*\AppData,Program Files,ProgramData,actions-runner,agent}\**\site-packages\{*.pth,sitecustomize.py,usercustomize.py}
        YaraRule = (as above)
      Hunt: Generic.Detection.Yara.Glob          (which installed wheel put a hook file there)
        PathGlob = /{usr,usr/local,opt,home/*,root,srv,builds}/**/{site,dist}-packages/*.dist-info/RECORD
        YaraRule = rule py_hook_in_record { strings: $p = /(^|\n)[^\/\n,]+\.pth,/ $s = "sitecustomize.py," $u = "usercustomize.py," condition: any of them }
      Hunt: Linux.Search.FileFinder               (collect every hit for reading)
        SearchFilesGlob = <paths returned above>
        Upload_File     = Y
    tested: null
    attack:
      - "T1546.018"
      - "T1195.001"
  - id: "supply-chain-response/proposed/blockchain-dead-drop-c2-non-wallet-process-resolving-public-solana-rpc-endpoints"
    status: "active"
    source: "StepSecurity reporting on the OVHcloud CLI GlassWorm loader detonation (Oct 2026)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Blockchain dead-drop C2: non-wallet process resolving public Solana RPC endpoints"
    why: "GlassWorm (OVHcloud CLI GitHub release swap + VS Code extension, Oct 2026) reads its C2 address from Solana transaction memos via public RPC (api.mainnet-beta.solana.com, solana-rpc.publicnode.com, solana.drpc.org, solana.api.onfinality.io, solana.api.pocket.network), so the C2 can rotate without any blockable domain. On a host or network with no crypto wallet or Solana tooling, any connection to these RPC hosts is high-signal; the initiating process (editor extension host, CLI binary, node) is the discriminator. Rules out: the process is a known wallet/dev tool the user runs, or the host legitimately does Solana development. Pivot: same process to a raw-IP HTTPS POST /upload (45.32.148.174), files under /tmp/envchecker-* or ~/init.json."
    how: "A resolver log (AdGuard, Pi-hole, a DNS firewall) answers which host asked but not which process; use it for hosts without the sensor, then collect the process from the host."
    fp: "Wallet apps, Solana CLI and SDK installs, and browsers with a wallet extension reach the same endpoints. publicnode.com, drpc.org, onfinality.io and pocket.network also serve other chains, which is why the list names the Solana hostnames and not the bare domains."
    query: |-
      let rpc = dynamic(["api.mainnet-beta.solana.com", "solana-rpc.publicnode.com", "solana.drpc.org", "solana.api.onfinality.io", "solana.api.pocket.network"]);
      DeviceNetworkEvents
      | where Timestamp between (datetime(<window start>) .. now())
      | where RemoteUrl has_any (rpc)
      | summarize first=min(Timestamp), last=max(Timestamp), connections=count()
          by DeviceName, InitiatingProcessFileName, InitiatingProcessFolderPath, InitiatingProcessCommandLine, InitiatingProcessAccountName, RemoteUrl
      | order by first asc
      // Pivot on the devices above: the exfil endpoint and the loader's files
      DeviceNetworkEvents
      | where Timestamp between (datetime(<window start>) .. now())
      | where RemoteIP == "45.32.148.174"
      | project Timestamp, DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, RemoteIP, RemotePort
      DeviceFileEvents
      | where Timestamp between (datetime(<window start>) .. now())
      | where FolderPath startswith "/tmp/envchecker-" or (FileName == "init.json" and FolderPath matches regex @"^/(home|Users)/[^/]+/init\.json$")
      | project Timestamp, DeviceName, ActionType, FolderPath, InitiatingProcessFileName, InitiatingProcessCommandLine
    tested: null
    attack:
      - "T1102.001"
      - "T1195.002"
  - id: "supply-chain-response/proposed/extension-exposure-is-scoped-by-editor-marketplace-and-version-during-the-window"
    status: "active"
    source: "research@2026-10-30 https://cursor.com/blog/claude-code-extension-security-notice https://opensourcemalware.com/blog/trojanized-claude-code-extension-plants-persistent-ssh-backdoor"
    validated_at: "2026-10-31"
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Velociraptor"
    title: "Extension exposure is scoped by editor, marketplace and version during the window, not by extension id"
    why: "The same extension id is served by several marketplaces (Microsoft, Open VSX, Cursor's, browser stores), and they can differ: in the October 2026 Claude Code case only the Cursor Marketplace copies of 2.1.312 and 2.1.313 were malicious. Auto-update installs a bad version on every host whose editor or browser ran while it was live, without anyone choosing to. A host is exposed when its inventory shows any of the bad versions from the affected marketplace, in that editor, inside the window; the same id from another marketplace, or a version outside the window, rules it out."
    how: null
    fp: null
    query: ""
    tested: null
    attack: []
  - id: "supply-chain-response/proposed/an-editor-or-extension-host-process-writing-ssh-keys-or-autostart-entries-or-ope"
    status: "active"
    source: "research@2026-10-30 https://cursor.com/blog/claude-code-extension-security-notice https://opensourcemalware.com/blog/trojanized-claude-code-extension-plants-persistent-ssh-backdoor"
    validated_at: "2026-10-31"
    supersedes: null
    stage: "Stage 5 · Activity"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "An editor or extension-host process writing SSH keys or autostart entries, or opening a reverse SSH tunnel"
    why: "Editors and browsers have no reason to modify authorized_keys, create LaunchAgents, cron entries, scheduled tasks or Startup items, or start ssh with -R. The trojanised Claude Code extension did all of these from the editor's own process tree, appending a key with the comment svc-telemetry and tunnelling to 134.209.82.225. Any such write or spawn with an editor, extension host or browser as ancestor is the extension acting; removing the extension leaves what it wrote, so the persistence is collected and removed separately."
    how: null
    fp: null
    query: ""
    tested: null
    attack: []
steps:
  - ord: 1
    time: "T+0–15 min"
    title: "Verify the notice, check for impact, declare when you find it"
    why: "Reach the vendor's security team on a contact you already had — never through a link or number in the notice. For a package, take the facts from the advisory: package name, malicious versions, when they were published and pulled, and the published IOCs. Bring in security, IT, the engineering lead, legal and communications. A notice alone is intelligence, not yet your incident: declare and name one incident lead as soon as you find the bad version installed, or the vendor's access used — or straight away if the supplier held privileged access (RMM, admin accounts, code running on your hosts) that you can't rule out. Why: breach notifications are also used as phishing lures, and the publication-to-removal window is your scope — any install in it counts, even if you are on a good version now."
    critical: true
  - ord: 2
    time: "T+15–60 min"
    title: "Find every place you are connected, or it was installed"
    why: "Vendor: its accounts and guests, API keys, OAuth apps, VPN access, firewall rules and the software of theirs you run. MSP: the paths that never show as a vendor account — the GDAP or DAP relationship (Microsoft 365 admin center › Settings › Partner relationships), Azure Lighthouse delegations ( az managedservices assignment list per subscription, or Azure portal › Service providers), its RMM agent on your hosts, and apps it authorised in Salesforce, Google Workspace, Slack or GitHub, which Entra never lists. Package: lockfiles across all repositories, the uses: lines of every workflow, CI build logs and caches, container images and their base-image digests, OS packages on hosts and images (xz-utils was a distro package, not a lockfile entry), developer machines, production hosts. Why: you can only cut and rotate what you have listed. Lockfiles show what should be installed; CI logs and SBOMs of built images show what actually was, and when; a pinned action's own dependencies are not pinned by your SHA."
    critical: true
  - ord: 3
    time: "T+15–60 min, in parallel"
    title: "Export first: preserve what ages out, and what the vendor can delete"
    why: "Retention runs against you from the start: Entra sign-ins 30 days on P1/P2 and 7 free, the unified audit log 180 days Standard and 1 year Premium, CloudTrail event history 90 days, GitHub Actions run logs 90 days by default, the organisation audit log 180 days (Git events 7). The vendor's earliest access date is routinely months before its notice, so widen every window to that date and export from it. For a package, preserve the tarball and its registry metadata: the registry removes malicious versions, and your cache is then the only copy. Why: a hunt you cannot re-run is a finding you cannot defend to a regulator, an insurer or a court. Send the vendor a litigation-hold letter on day one and ask for its IR firm's report; a statement that there is “no evidence of” exfiltration describes their logging, not your data."
    critical: true
  - ord: 4
    time: "T+15–90 min, in parallel"
    title: "Look for the access being used"
    why: "Sign-in, API and firewall logs for the vendor's IP ranges, service accounts, guests, GDAP technicians and integrations; cloud audit logs for role assumptions and API calls from unknown subjects and IPs; the GitHub audit log for repositories, workflows, tokens, secrets and pushes the package's stolen token could have made; your own packages' publish history, owners and dist-tags — back to the start of the window. Run this alongside the inventory, not after the cut: every new account, token, workflow, repository or host it turns up joins the list for the next step. Why: revoking stops future use; only the logs show what was already done, and a foothold you find after the cut is one the attacker kept. The 2025 npm worms used the stolen token within minutes to create repositories, add workflows and publish trojanised versions of the victim's own packages. This is where a vendor incident becomes yours — use the hunts under Hunt & Act by Platform."
    critical: true
  - ord: 5
    time: "T+60–120 min"
    title: "Cut every path and revoke every credential — one action"
    why: "Paths. Vendor: suspend integrations, file transfers and syncs; disable its accounts and guests, VPN and RMM access; restrict the network segments and firewall rules that let its services in. MSP: each path has its own switch and Update-MgServicePrincipal flips none of them — end the GDAP or DAP relationship (admin center › Partner relationships › Remove roles), delete every Lighthouse assignment, block the partner tenant inbound in cross-tenant access settings (guests and direct connect only; it does not govern GDAP), disable the RMM agent service fleet-wide and revoke the RMM's API keys. SaaS-to-SaaS: revoke the vendor's connected app in each platform it was authorised in; the Entra cut does not reach a Salesforce or Workspace grant. Package: block the bad versions in your registry proxy and pause the CI workflows that pull it; network-contain the hosts and runners where it ran — they get rebuilt from clean later, not cleaned in place (see Rebuild from clean below). Trojanised update: block the vendor's update host until it confirms a clean release, and block the stolen certificate, not only the hashes. Credentials, in the same pass. Vendor: API keys, OAuth tokens and app consents, service accounts and VPN accounts it holds; reset any password shared with it. A multi-tenant vendor app's secret lives on the app object in the vendor's tenant: you cannot rotate it, so send the vendor the key id from the stage 3 hunt and get written confirmation. Package: everything readable from where it ran, listed below. Revoke first, then reissue. Pins. Pin to the last known-good version only after checking it: its hash or signature matches the registry's record, it was published before the compromise window, and the advisory doesn't list it. For a GitHub Action, pin to a full commit SHA and verify that SHA against the upstream commit history, not against the tag: in the tj-actions/changed-files incident (March 2025) every version tag was moved to the malicious commit. A SHA pin covers that action only; the actions it calls internally are pinned however its author pinned them. Why: a path left open while another is cut is a warning, not a containment; most malicious packages are credential stealers, and self-spreading ones use stolen publish tokens to trojanise the victim's own packages next. The next build reinstalls whatever the pin points at, and tags can be moved by whoever controls the repository."
    critical: true
  - ord: 6
    time: "T+2–4 h"
    title: "Verify the cut held"
    why: "Re-run the access hunt from the moment of the cut: any sign-in, API call, token use or connection from the supplier's accounts, ranges or integrations afterwards means a path was missed. Widen the cut before moving on. Why: the containment is proven by the logs after it, not by the list of actions you took."
    critical: true
  - ord: 7
    time: null
    title: "Gate: eradication confirmed before anything reconnects"
    why: "Before rebuilt hosts rejoin the network, reissued credentials go back into CI, or paused workflows restart: every known foothold is removed or rebuilt, and a verification hunt shows no activity from the supplier's paths or the payload's indicators since the eviction time. Record who confirmed it and when. Why: recovery that starts before eradication is finished hands the attacker a clean, trusted foothold — this gate covers your own systems; the vendor decision below covers theirs."
    critical: true
actions:
  - platform: "Defender XDR / Sentinel"
    label: "T+15–60 · Export"
    name: "Export the identity evidence before it ages out"
    tier: "read"
    tier_inferred: false
    why: "the Entra portal keeps sign-ins 30 d on P1/P2 and 7 d free, the unified audit log 180 d on Standard and 1 y on Premium, Defender XDR device data 30 d; a vendor's 'earliest access date' is routinely months earlier than its notice, so the export is the only copy you will have."
    how: "Export to a case folder with a hash manifest. Ask the vendor's IR firm for its report and send the vendor a litigation-hold letter on day one so their logs are preserved too."
    body: |-
      # Entra sign-ins and directory audit (Microsoft Graph PowerShell)
      Get-MgAuditLogSignIn -Filter "createdDateTime ge <window start>T00:00:00Z" -All |
        Where-Object { $_.HomeTenantId -eq '<vendor tenant id>' -or $_.AppId -eq '<vendor app id>' } |
        Export-Csv vendor-signins.csv -NoTypeInformation
      Get-MgAuditLogDirectoryAudit -Filter "activityDateTime ge <window start>T00:00:00Z" -All | Export-Csv directory-audit.csv -NoTypeInformation
      # Unified audit log (Exchange Online PowerShell): what the vendor's accounts and app touched in M365
      Search-UnifiedAuditLog -StartDate <window start> -EndDate (Get-Date) -UserIds <vendor accounts> -ResultSize 5000 -SessionCommand ReturnLargeSet | Export-Csv ual-vendor.csv -NoTypeInformation
      # Device timeline for every host in scope (Defender XDR API, 30 d)
      GET https://api.security.microsoft.com/api/machines/<machine id>/alerts
      Get-ChildItem <case folder> -File | Get-FileHash -Algorithm SHA256 | Export-Csv manifest.csv -NoTypeInformation
    attack:
      - "T1199"
  - platform: "Defender XDR / Sentinel"
    label: "T+60–120 · Cut"
    name: "Cut the vendor's cloud access — each path with its own primitive"
    tier: "destructive"
    tier_inferred: false
    why: "Update-MgServicePrincipal cuts the app and nothing else. An MSP reaches you through a GDAP or DAP relationship, Lighthouse delegations and guests, each with its own switch; a path left open while another is cut tells the attacker they have been found."
    how: "GDAP and DAP: Microsoft 365 admin center › Settings › Partner relationships › select the partner › Remove roles. That ends the relationship from your side; the partner sees it terminated in Partner Center. Cross-tenant access settings govern guests and direct connect only — they do not apply to GDAP sign-ins, which is why the relationship itself has to go. Non-Microsoft OAuth (a vendor app authorised in Salesforce, Google Workspace, Slack, GitHub): revoke it in that platform — Salesforce Setup › Connected Apps OAuth Usage › Block — the Entra cut does not reach it. Ban the vendor's app in Defender for Cloud Apps › OAuth apps as well, so re-consent is blocked."
    body: |-
      # Vendor service principal: disable, then strip what it was granted. Issued access tokens stay valid up to ~1 h.
      Update-MgServicePrincipal -ServicePrincipalId <sp object id> -AccountEnabled:$false
      Get-MgServicePrincipalOauth2PermissionGrant -ServicePrincipalId <sp object id> |
        ForEach-Object { Remove-MgOauth2PermissionGrant -OAuth2PermissionGrantId $_.Id }
      Get-MgServicePrincipalAppRoleAssignment -ServicePrincipalId <sp object id> |
        ForEach-Object { Remove-MgServicePrincipalAppRoleAssignment -ServicePrincipalId <sp object id> -AppRoleAssignmentId $_.Id }
      # Credentials: only when AppOwnerTenantId (stage 2) is OUR tenant does the secret live on an object we control.
      # A multi-tenant vendor app's secret is on the app object in the vendor's tenant: you cannot rotate it.
      # Send the vendor the ServicePrincipalCredentialKeyId from stage 3 and get written confirmation it was rotated.
      Remove-MgServicePrincipalPassword -ServicePrincipalId <sp object id> -KeyId <key id>    # our-tenant app only
      # Guests: disable first, then revoke (revoke alone leaves access tokens valid until they expire)
      Update-MgUser -UserId <guest object id> -AccountEnabled:$false
      Revoke-MgUserSignInSession -UserId <guest object id>
      # Cross-tenant access settings: block the partner tenant inbound (B2B collaboration; not GDAP)
      New-MgPolicyCrossTenantAccessPolicyPartner -TenantId <vendor tenant id> -B2BCollaborationInbound @{
        usersAndGroups = @{ accessType = "blocked"; targets = @(@{ target = "AllUsers"; targetType = "user" }) }
        applications   = @{ accessType = "blocked"; targets = @(@{ target = "AllApplications"; targetType = "application" }) } }
      # Azure Lighthouse: per delegated subscription
      az account set -s <subscription id>
      az managedservices assignment list
      az managedservices assignment delete --assignment <assignment id>
    attack:
      - "T1199"
      - "T1078.004"
  - platform: "Defender XDR / Sentinel"
    label: "T+60–120 · Cut"
    name: "Block the payload, the stolen certificate and the update channel fleet-wide"
    tier: "destructive"
    tier_inferred: false
    why: "a tenant-wide indicator stops it on every device, including the ones your hunt hasn't found yet. Block the sideloaded payload's hash, not only the installer's; block the certificate so a re-signed variant is stopped too; and block the vendor's update host until the vendor confirms a clean release, because the update channel is the delivery path."
    how: "Settings › Endpoints › Indicators: File hashes, Certificates (upload the.CER or.PEM, or the thumbprint via the API) and URLs/Domains. IP indicators take single IPs only: block the vendor's ranges at the firewall or VPN instead. Server-side update compromises (the vendor's build or update server) also need the vendor's service accounts rotated on their side; ask for it in writing."
    body: |-
      POST https://api.security.microsoft.com/api/indicators    # one call per indicator
      {"indicatorValue": "<sha256 of sideloaded dll>", "indicatorType": "FileSha256", "action": "BlockAndRemediate",
       "title": "IR <case>: <vendor> payload", "severity": "High", "description": "Supply-chain incident <case>"}
      {"indicatorValue": "<certificate thumbprint>", "indicatorType": "CertificateThumbprint", "action": "Block",
       "title": "IR <case>: <vendor> stolen signing certificate", "description": "Supply-chain incident <case>"}
      {"indicatorValue": "<update host>", "indicatorType": "DomainName", "action": "Block",
