  - id: "supply-chain-response/crowdstrike/s6-shells-and-commands-launched-by-the-msp-s-remote"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "CrowdStrike Falcon"
    title: "Shells and commands launched by the MSP's remote-management agent"
    why: "An MSP's RMM agent is command-and-control as SYSTEM on every managed host (Kaseya VSA, 2021: a pushed 'hot-fix' procedure deployed ransomware through AgentMon.exe). Commands it launched during the window show whether the attacker used it inside our network."
    how: null
    fp: "Every legitimate RMM task spawns cmd and powershell as SYSTEM. Baseline the week before the window and diff; encoded commands, certutil decoding, Defender tampering and shells on hosts with no open ticket are the signal."
    query: |-
      #event_simpleName=ProcessRollup2
      // AgentMon.exe (Kaseya), ScreenConnect.ClientService.exe, AteraAgent.exe, NinjaRMMAgent.exe, CagService.exe (Datto), BASupSrvc.exe (N-able)
      | ParentBaseFileName=/^<rmm agent exe>$/i
      | ImageFileName=/[\\\/](cmd|powershell|pwsh|rundll32|certutil|msiexec)\.exe$|\/(ba)?sh$/i
      | Suspicious := if(CommandLine=/-enc|-EncodedCommand|certutil|-decode|DisableRealtimeMonitoring|vssadmin|bcdedit/i, then="yes", else="no")
      | groupBy([ParentBaseFileName, ImageFileName, UserName, Suspicious, CommandLine], function=count(ComputerName, distinct=true, as=Hosts))
    tested: null
    attack:
      - "T1219"
      - "T1059.003"
      - "T1059.001"
  - id: "supply-chain-response/crowdstrike/s6-install-time-execution-lifecycle-scripts-in-proc"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Our spread"
    stage_ord: 6
    platform: "CrowdStrike Falcon"
    title: "Install-time execution: lifecycle scripts, in-process credential theft and the 2025 worm pattern"
    why: "npm runs lifecycle scripts through cmd.exe /d /s /c on Windows and sh -c elsewhere, with node as the parent. In-process payloads never spawn curl: Shai-Hulud (2025) ran inside node, fetched trufflehog, read ~/.npmrc and cloud credential files, talked to api.github.com and published with the stolen token; Nx s1ngularity used installed claude, gemini and q CLIs as the secret finder. Hunt node's children and its DNS, not a download tool."
    how: null
    fp: "Query 1 fires on node-gyp builds, husky and every legitimate install script: read the command lines. Query 2: editors are node processes and developers run gh and AI CLIs from them; the parent command line separates an editor from an npm install. Query 3: node resolving api.github.com is normal on a laptop, abnormal on a CI runner during an install step."
    query: |-
      // 1. Lifecycle scripts in the window, scoped to the package
      #event_simpleName=ProcessRollup2
      | ParentBaseFileName=/^node(\.exe)?$/i
      | (ImageFileName=/\\cmd\.exe$/i and CommandLine=/\/d \/s \/c/) or (ImageFileName=/\/(ba|da)?sh$/ and CommandLine=/ -c /)
      | CommandLine=/<package>|preinstall|postinstall/i
      | groupBy([ComputerName, UserName, CommandLine], function=min(@timestamp, as=FirstSeen))
      // 2. Node or bun spawning the tools the worms used
      #event_simpleName=ProcessRollup2
      | ParentBaseFileName=/^(node|bun)(\.exe)?$/i
      | ImageFileName=/[\\\/](trufflehog|gh|claude|gemini|q)(\.exe)?$/i or CommandLine=/--dangerously-skip-permissions|--yolo|--trust-all-tools|npm publish|gh repo create|gh auth|\/tmp\/inventory\.txt/i
      | table([@timestamp, ComputerName, UserName, ImageFileName, CommandLine, ParentCommandLine])
      // 3. Node, bun or trufflehog resolving GitHub, a webhook sink or the registry (confirm DnsRequest field names in one event)
      #event_simpleName=DnsRequest
      | ContextBaseFileName=/^(node|bun|trufflehog)(\.exe)?$/i
      | DomainName=/api\.github\.com|webhook\.site|registry\.npmjs\.org/i
      | groupBy([ComputerName, ContextBaseFileName, DomainName], function=[min(@timestamp, as=FirstSeen), count()])
    tested: null
    attack:
      - "T1195.001"
      - "T1059.007"
      - "T1552.001"
      - "T1567.001"
  - id: "supply-chain-response/sentinelone/s2-which-of-our-hosts-the-vendor-reaches-and-whethe"
    status: "active"
