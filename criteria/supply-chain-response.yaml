  - id: "supply-chain-response/sentinelone/s4-where-the-package-the-vendor-binary-or-the-sidel"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "SentinelOne"
    title: "Where the package, the vendor binary or the sideloaded payload exists, ran or was loaded"
    why: "Every host with the bad version is in scope, including CI runners and developer laptops no asset register lists. A trojanised installer often carries the payload as a sideloaded library (3CX, 2023: ffmpeg.dll loaded by the signed desktop app), so the installer hash alone misses the hosts that matter."
    how: null
    fp: "File Creation is the install event, so a package installed before the agent's retention window is invisible here; RemoteOps Fetch Files on node_modules/<package>/package.json is the authority for 'installed'."
    query: |-
      // By hash across every event type (#sha256 expands to every SHA256 field; explicit: tgt.file.sha256, module.sha256)
      #sha256 in ('<sha256 of installer>', '<sha256 of payload dll>')
      | group Events = count(), Hosts = estimate_distinct(endpoint.name) by event.type, tgt.file.path, module.path
      // The sideloaded payload by name and parent, hash-agnostic
      event.type = 'Module Load' AND module.path contains '<sideloaded dll>' AND src.process.name = '<vendor exe>'
      | group Hosts = estimate_distinct(endpoint.name), Hashes = estimate_distinct(module.sha256) by module.path
      // The npm package on disk (PyPI: site-packages)
      event.type = 'File Creation' AND tgt.file.path contains 'node_modules' AND tgt.file.path contains '<package>'
      | group Files = count() by endpoint.name, src.process.name
      // Installed vendor applications by version: Application Inventory in the console (installed programs only;
      // it does not see npm, pip or container contents)
    tested: null
    attack:
      - "T1195.002"
      - "T1195.001"
      - "T1574.001"
  - id: "supply-chain-response/sentinelone/s4-everything-signed-with-the-vendor-s-stolen-certi"
    status: "active"
