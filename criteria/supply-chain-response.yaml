    stage: "Stage 2 · Our connection"
    stage_ord: 2
    platform: "SentinelOne"
    title: "Which of our hosts the vendor reaches, and whether Entra data is in the lake"
    why: "The endpoint half of the vendor's connection is the hosts that accept its logons and run its software; the identity half (guests, GDAP, apps) is only visible if the Entra logs are ingested, and then only after you have confirmed the parser's field names."
    how: null
    fp: "Service desks and jump hosts take vendor logons by design; the hosts to worry about are the ones with no change ticket for the window."
