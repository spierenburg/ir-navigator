  - id: "supply-chain-response/velociraptor/s4-where-the-package-the-vendor-binary-or-the-sidel"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Velociraptor"
    title: "Where the package, the vendor binary or the sideloaded payload exists or is loaded"
    why: "Every host with the bad version is in scope, including CI runners and developer laptops no asset register lists. A trojanised installer often carries the payload as a sideloaded library (3CX, 2023: ffmpeg.dll loaded by the signed desktop app), so the installer hash alone misses the hosts that matter."
    how: null
    fp: "HashHunter's filters are cumulative: a size or date filter that excludes the file hides a hash hit. Run it with the path filter only first."
    query: |-
      Hunt: Generic.Detection.HashHunter
        TargetGlob = C:/**/*.{exe,dll,msi}            (narrow to the vendor's install folder)
        SHA256List = <sha256 of installer>
                     <sha256 of payload dll>
      Hunt: Windows.System.DLLs                       (the sideloaded payload loaded right now, with its certificate)
        ProcessRegex    = (?i)^<vendor exe>$
        DllRegex        = (?i)<sideloaded dll>$
        Calculate_Hash  = Y
        CertificateInfo = Y
      Hunt: Windows.Search.FileFinder
        SearchFilesGlob = C:\{Users\*,actions-runner,agent}\**\node_modules\<package>\package.json
        Upload_File     = Y                              (the version is inside the file)
      Hunt: Linux.Search.FileFinder
        SearchFilesGlob = /{home/*,root,opt,srv,builds}/**/node_modules/<package>/package.json
        Upload_File     = Y
        (PyPI: .../site-packages/<package>-*.dist-info/METADATA)
    tested: null
    attack:
      - "T1195.002"
      - "T1195.001"
      - "T1574.001"
  - id: "supply-chain-response/velociraptor/s4-everything-signed-with-the-vendor-s-stolen-certi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Software"
    stage_ord: 4
    platform: "Velociraptor"
    title: "Everything signed with the vendor's stolen certificate"
    why: "A stolen signing key makes a hash block insufficient: the attacker can sign a new payload. No built-in artifact hunts by signer, so this is VQL over authenticode(); the serial and the signing time inside the window are the evidence, the trust flag is not."
    how: null
    fp: "Every legitimate binary from the vendor matches the signer; the discriminators are the serial of the leaked certificate, a countersignature inside the compromise window, and files the vendor's release manifest does not list. Hashing every PE on a fleet is slow: scope the glob."
    query: |-
      -- Notebook or custom artifact; narrow the glob to the vendor's folders on a large fleet
      SELECT OSPath, Sig.SubjectName AS Signer, Sig.SerialNumber AS Serial, Sig.Timestamp AS Countersigned, Sig.Trusted AS Trusted,
             hash(path=OSPath).SHA256 AS SHA256
      FROM foreach(row={
             SELECT OSPath FROM glob(globs=['C:/Program Files*/**/*.{exe,dll}', 'C:/ProgramData/**/*.{exe,dll}', 'C:/Users/*/AppData/**/*.{exe,dll}'])
           }, query={ SELECT OSPath, authenticode(filename=OSPath) AS Sig FROM scope() })
      WHERE Signer =~ "<vendor signer name>" OR Serial =~ "<serial from the advisory>"
      -- Trusted stays true until the CA revokes and the host fetches the CRL; a countersignature dated
      -- before the revocation keeps it true even then.
    tested: null
    attack:
      - "T1553.002"
      - "T1588.003"
  - id: "supply-chain-response/velociraptor/s5-logons-by-the-vendor-s-accounts-and-from-the-ven"
