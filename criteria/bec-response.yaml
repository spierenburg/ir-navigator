  - id: "bec-response/splunk/s1-successful-sign-ins-for-the-user-first-seen-per"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Splunk"
    title: "Successful sign-ins for the user, first seen per IP"
    why: "The earliest sign-in from an IP the user never uses starts the access window; every later question (what was read, what was sent) is bounded by it."
    how: null
    fp: "Mobile carriers and VPN concentrators give the same user a new IP every day; judge on ASN and user agent, not on the IP alone."
    query: |-
      sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs) user="<upn>" action=success
      | stats min(_time) as first_seen max(_time) as last_seen count values(properties.userAgent) as user_agent
          values(properties.sessionId) as sessions by src properties.autonomousSystemNumber
      | sort first_seen | convert ctime(first_seen) ctime(last_seen)
      // Without the Cloud Services add-on (interactive sign-ins only):
      // sourcetype=o365:management:activity Workload=AzureActiveDirectory Operation=UserLoggedIn UserId="<upn>" | stats min(_time) by ClientIP
    tested: null
    attack:
      - "T1078.004"
  - id: "bec-response/splunk/s1-aitm-one-session-replayed-from-two-networks-mfa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Splunk"
    title: "AiTM: one session replayed from two networks, MFA carried by the token"
    why: "A proxy phishing kit steals the session cookie after the real MFA, so a password reset alone does not end the access. One sessionId from two ASNs within minutes, or a sign-in whose MFA step reads “MFA requirement satisfied by claim in the token” from a new IP, is the replay."
    how: null
    fp: "Office Wi-Fi to phone hotspot changes ASN mid-session; a replay shows two networks within the same minutes, one of them usually a hosting provider. “Satisfied by claim in the token” is normal on a device that did MFA once; it matters only from a new IP or ASN."
    query: |-
      sourcetype=azure:monitor:aad category IN (SignInLogs, NonInteractiveUserSignInLogs) user="<upn>" action=success
      | stats dc(properties.autonomousSystemNumber) as asns values(src) as ips min(_time) as first max(_time) as last by properties.sessionId
      | where asns > 1 | convert ctime(first) ctime(last)
      // MFA satisfied by the token rather than performed:
      sourcetype=azure:monitor:aad category=SignInLogs user="<upn>" action=success
      | spath output=step path=properties.authenticationDetails{}.authenticationStepResultDetail
      | search step="MFA requirement satisfied by claim in the token"
      | table _time src properties.autonomousSystemNumber properties.appDisplayName properties.sessionId properties.userAgent
    tested: null
    attack:
      - "T1557"
      - "T1550.004"
      - "T1539"
  - id: "bec-response/splunk/s1-victim-device-infostealer-or-fake-installer-befo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Splunk"
    title: "Victim device: infostealer or fake installer before first access"
    why: "If the session cookie or password was stolen by malware on the laptop, a password reset is not enough: the device keeps stealing new ones until it is rebuilt."
    how: null
    fp: "Installers and updaters run from Downloads and Temp all day; the lead is a binary the user cannot explain, launched shortly before the first foreign sign-in, with a hash new to the estate."
