# Source of truth for this playbook's IR criteria.
# Hand-edit freely. Re-run 'bun run build:index' after any change.
playbook: "bec-response"
title: "BEC Response"
platforms:
  - "Defender XDR / Sentinel"
  - "CrowdStrike Falcon"
  - "SentinelOne"
  - "Velociraptor"
  - "Splunk"
  - "Elastic / Wazuh"
scenarios:
  - id: "1"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2026/01/21/multistage-aitm-phishing-bec-campaign-abusing-sharepoint/"
    validated_at: null
    supersedes: null
    name: "AiTM-Led Mailbox Takeover (session cookie stolen, mailbox then used for fraud)"
    indicators: "a lure (often SharePoint-hosted, from a trusted vendor) leads to a credential prompt; the risky sign-in shows MFA satisfied, followed by a sign-in from a different IP with the same session. Within minutes to hours: an inbox rule that deletes or marks-read incoming mail, and a new MFA method registered by the attacker (e.g. an OTP phone). Sentinel signals Microsoft names: MailItemsAccessed anomaly, Malicious_Inbox_Rule, SharePointFileOperation from a new IP or user agent."
    discriminator: "MFA was satisfied on the risky sign-in and an authentication method was added shortly after — a password-only takeover shows neither. The cookie, not the password, is the credential: a password reset alone leaves the attacker in. Revoke sessions, remove the attacker-registered MFA method, delete the rules, then reset. Microsoft saw payment fraud start as little as 5 minutes after token theft (2022), so check Sent Items and the rules before anything else."
    attack:
      - "T1566.002"
      - "T1557"
      - "T1539"
      - "T1550.004"
      - "T1564.008"
      - "T1098.005"
    window: null
  - id: "2"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2026/01/21/multistage-aitm-phishing-bec-campaign-abusing-sharepoint/"
    validated_at: null
    supersedes: null
    name: "Compromised Mailbox Phishing Onward (internal and external spread)"
    indicators: "high-volume Send from the user to contacts and distribution lists taken from recent threads (600+ messages in Microsoft's case); NDRs and out-of-office replies deleted; the attacker answers recipients who question the mail and deletes those exchanges; a second wave of AiTM sign-ins from internal recipients who clicked."
    discriminator: "the objective is more accounts, not a payment — no bank-detail change, no payment thread. Scope is every recipient who clicked, not one user: ZAP or purge the campaign and run the AiTM checks on each downstream account. If payment fraud also appears, it is scenario 1 or 4 with spread on top."
    attack:
      - "T1534"
      - "T1566.002"
      - "T1564.008"
      - "T1078.004"
    window: null
  - id: "3"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2025/10/09/investigating-targeted-payroll-pirate-attacks-affecting-us-universities/"
    validated_at: null
    supersedes: null
    name: "Payroll / Direct-Deposit Diversion (fraud in the HR SaaS, Storm-2657)"
    indicators: "SSO into the HR SaaS from the compromised identity; Workday 'Change My Account' or 'Manage Payment Elections' (visible through the Defender for Cloud Apps Workday connector); 'Add iOS/Android Device'; an inbox rule matching From @myworkday.com with DeleteMessage or MoveToFolder; SoftDelete/HardDelete/MoveToDeletedItems on the change notifications; an Entra 'Update user.' with StrongAuthenticationPhoneAppDetail within 6h of a medium or high risk sign-in."
    discriminator: "the fraud is in the HR app, not in email: the decisive evidence is the HR SaaS audit log, and the inbox rule only hides its notifications. Containment adds restoring the bank details in the HR app, removing the attacker's MFA from the HR app or its MFA provider, and telling payroll before the next run."
    attack:
      - "T1078.004"
      - "T1098.005"
      - "T1564.008"
      - "T1657"
    window: null
  - id: "4"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2023/12/12/threat-actors-misuse-oauth-applications-to-automate-financially-driven-attacks/"
    validated_at: null
    supersedes: null
    name: "Invoice Fraud From Inside Your Mailbox (conversation hijack)"
    indicators: "reconnaissance first: MailItemsAccessed / FileAccessed on attachments and threads about 'payment' or 'invoice'; a rule that hides the counterparty's replies; then a reply inside an existing, genuine thread carrying new bank details."
    discriminator: "the fraudulent message comes from your own authentic domain and passes SPF, DKIM and DMARC, and the attacker activity is in YOUR audit log. That separates it from scenario 5 (lookalike domain, your log clean) and scenario 6 (the supplier's tenant compromised, your log clean). Recall or freeze the payment in parallel with identity containment."
    attack:
      - "T1114.002"
      - "T1534"
      - "T1564.008"
      - "T1657"
    window: null
  - id: "5"
    status: "draft"
    source: "research@2026-10-25 https://intelligence.abnormal.ai/attack-library/threat-actor-hijacks-conversation-using-look-alike-domain-in-attempt-to-divert-17m-wire-transfer"
    validated_at: null
    supersedes: null
    name: "Lookalike-Domain Impersonation (no compromise of your tenant)"
    indicators: "a newly registered lookalike domain (letter swap, homoglyph); a reply to an old genuine thread (a year stale in the 17M USD case), with lookalike CCs posing as other staff of the counterparty; no link or payload; message trace shows a first-seen sender domain."
    discriminator: "your audit log is clean: no risky sign-in, no rule, no MailItemsAccessed anomaly. DMARC does not help because the attacker owns the domain. No identity reset — block the domain, recall the payment, request a takedown. Open question for scoping: how did the attacker get the thread history? If it was from the counterparty, they are in scenario 6 and should be told."
    attack:
      - "T1583.001"
      - "T1684.001"
      - "T1657"
    window: null
  - id: "6"
    status: "draft"
    source: "research@2026-10-25 https://www.microsoft.com/en-us/security/blog/2026/01/21/multistage-aitm-phishing-bec-campaign-abusing-sharepoint/"
    validated_at: null
    supersedes: null
    name: "Supplier Mailbox Compromised (vendor email compromise, their tenant)"
    indicators: "an authenticated inbound message from a real supplier address, passing authentication, carrying new bank instructions or a SharePoint/AiTM lure."
    discriminator: "no attacker activity in your logs; the compromise is in the supplier's tenant, which you cannot investigate. Notify the supplier through a known-good channel, verify any payment change out-of-band, and block the sender temporarily. If your users clicked the lure, it becomes scenario 1 in your tenant."
    attack:
      - "T1586.002"
      - "T1684.001"
      - "T1657"
    window: null
  - id: "7"
    status: "draft"
    source: "research@2026-10-25 https://learn.microsoft.com/en-us/security/operations/incident-response-playbook-app-consent"
    validated_at: null
    supersedes: null
    name: "OAuth App Mailbox Access (Graph API persistence)"
    indicators: "the compromised user creates an app registration and adds credentials, or consents to a multitenant app (names like 'oauth' or 'App') with Mail.Read, Mail.ReadWrite, Mail.Send, Contacts.*, MailboxSettings.* or People.*; MailItemsAccessed and Send carry an AppId instead of an interactive client."
    discriminator: "mail activity continues after the password reset and session revocation, and the client is an app, not a browser or Outlook. Disable the service principal first (accountEnabled false), then remove its credentials and grants — deleting first destroys the grant records. Full procedure: identity-breach-response scenario 4."
    attack:
      - "T1528"
      - "T1671"
      - "T1550.001"
      - "T1114.002"
    window: null
criteria:
  - id: "bec-response/defender/s1-successful-sign-ins-for-the-user-first-seen-per"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Successful sign-ins for the user, first seen per IP"
    why: "The earliest sign-in from an IP the user never uses starts the access window; every later question (what was read, what was sent) is bounded by it. Export this result now: the 30-day Entra retention rolls off during the case."
    how: null
    fp: "Mobile carriers and VPN concentrators give the same user a new IP every day; judge on ASN and user agent, not on the IP alone. Non-interactive sign-ins from Microsoft service ranges (Exchange acting for Outlook) are normal and should not be read as attacker sessions."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where UserPrincipalName =~ "<upn>" and ResultType == "0"
      | summarize FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated), SignIns=count(),
          Apps=make_set(AppDisplayName, 10), Sessions=make_set(SessionId, 10)
          by IPAddress, AutonomousSystemNumber, Location, UserAgent
      | order by FirstSeen asc
    tested: null
    attack:
      - "T1078.004"
  - id: "bec-response/defender/s1-aitm-one-session-replayed-from-two-networks-mfa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "AiTM: one session replayed from two networks, MFA carried by the token"
    why: "A proxy phishing kit (Tycoon 2FA, EvilProxy) steals the session cookie after the real MFA, so a password reset alone does not end the access. The tells are one SessionId used from two ASNs within minutes, sign-ins where MFA was “satisfied by claim in the token” from an IP the user has never used, and the Defender alerts “Stolen session cookie was used” and “Possible use of a stolen session cookie”."
    how: null
    fp: "A laptop moving from office Wi-Fi to a phone hotspot changes ASN mid-session; a replay shows two networks within the same minutes, one of them usually a hosting provider. “Satisfied by claim in the token” is normal for every token refresh on a device that did MFA once; it only matters from a new IP or ASN."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where UserPrincipalName =~ "<upn>" and ResultType == "0" and isnotempty(SessionId)
      | summarize ASNs=dcount(AutonomousSystemNumber), IPs=make_set(IPAddress, 10),
          First=min(TimeGenerated), Last=max(TimeGenerated) by SessionId
      | where ASNs > 1
      // MFA satisfied by a claim in the token rather than performed in this sign-in:
      SigninLogs
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>" and ResultType == "0"
      | mv-expand step = AuthenticationDetails
      | where tostring(step.authenticationStepResultDetail) == "MFA requirement satisfied by claim in the token"
      | project TimeGenerated, IPAddress, AutonomousSystemNumber, AppDisplayName, SessionId, UserAgent
      // The alerts, with the account and remote IP they carry:
      AlertInfo
      | where Timestamp > ago(30d)
      | where Title in ("Stolen session cookie was used", "Possible use of a stolen session cookie",
          "Authentication request from AiTM-related phishing page")
      | join kind=inner (AlertEvidence | where AccountUpn =~ "<upn>") on AlertId
      | project Timestamp, Title, Severity, EntityType, RemoteIP, AccountUpn
    tested: null
    attack:
      - "T1557"
      - "T1550.004"
      - "T1539"
  - id: "bec-response/defender/s1-victim-device-infostealer-or-fake-installer-befo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Victim device: infostealer or fake installer before first access"
    why: "If the session cookie or password was stolen by malware on the laptop, a password reset is not enough: the device keeps stealing new ones until it is rebuilt."
    how: null
    fp: "Installers, updaters and portable tools run from Downloads and Temp all day; the lead is a binary the user cannot explain, launched shortly before the first foreign sign-in, with a SHA256 that is new to the tenant. Exclude the browsers, Teams and OneDrive updaters as above."
    query: |-
      DeviceProcessEvents
      | where Timestamp between (datetime(<first access UTC>) - 14d .. datetime(<first access UTC>))
      | where DeviceName =~ "<victim host>"
      | where FolderPath has_any (@"\AppData\Local\Temp\", @"\Downloads\")
      | where not(FileName in~ ("msedge.exe", "chrome.exe", "Teams.exe", "OneDrive.exe"))
      | project Timestamp, FileName, FolderPath, ProcessCommandLine, SHA256, InitiatingProcessFileName
      // Something other than the browser touching the browser's credential and cookie stores:
      DeviceFileEvents
      | where Timestamp between (datetime(<first access UTC>) - 14d .. datetime(<first access UTC>))
      | where DeviceName =~ "<victim host>"
      | where FolderPath has_any (@"\User Data\Default\Network\", @"\User Data\Default\") and FileName in~ ("Cookies", "Login Data", "Web Data")
      | where not(InitiatingProcessFileName in~ ("msedge.exe", "chrome.exe", "brave.exe"))
      | project Timestamp, FileName, FolderPath, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessSHA256
    tested: null
    attack:
      - "T1555.003"
      - "T1204.002"
  - id: "bec-response/defender/s2-inbox-rules-and-mailbox-forwarding-created-or-ch"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Inbox rules and mailbox forwarding created or changed"
    why: "The rule's creation time and client IP bound the access window and give an attacker IP to pivot on. Rules made in Outlook desktop arrive as UpdateInboxRules with the IP in Client_IPAddress; rules made on the web or in PowerShell arrive as New-InboxRule / Set-InboxRule with the IP in ClientIP and the target mailbox in OfficeObjectId (the UserId is whoever ran the cmdlet). Set-Mailbox only matters with a forwarding parameter."
    how: null
    fp: "Users make rules too. Attacker rules move mail to RSS Feeds, Archive or Deleted Items, delete it, or match on invoice, payment, bank or the attacker's own domain; names are often a single character or a full stop."
    query: |-
      OfficeActivity
      | where TimeGenerated > ago(30d) and OfficeWorkload == "Exchange"
      | where Operation in ("New-InboxRule", "Set-InboxRule", "Enable-InboxRule", "UpdateInboxRules", "Set-Mailbox")
      | where Operation != "Set-Mailbox"
          or Parameters has_any ("ForwardingSmtpAddress", "ForwardingAddress", "DeliverToMailboxAndForward")
      | where UserId =~ "<upn>" or MailboxOwnerUPN =~ "<upn>" or OfficeObjectId has "<mailbox alias>"
      | extend SourceIP = coalesce(Client_IPAddress, ClientIP)
      | project TimeGenerated, Operation, UserId, OfficeObjectId, SourceIP, SessionId, Parameters, OperationProperties
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1114.003"
      - "T1564.008"
  - id: "bec-response/defender/s2-permissions-transport-rules-auto-reply-junk-sett"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Permissions, transport rules, auto-reply, junk settings and deletions from the attacker's IP"
    why: "Delegate and SendAs permissions outlive a password reset; a tenant transport rule is a forwarding rule the mailbox owner never sees; an auto-reply or junk-list entry hides the victim's own replies; HardDelete and MoveToDeletedItems from the attacker's IP are the attacker cleaning the thread they hijacked."
    how: null
    fp: "Deletions by the owner from the office IP are the user tidying up; keep the IP and SessionId filter. Helpdesk staff grant FullAccess for leavers and shared mailboxes: a grant to a user who already exists, from an admin IP, with a ticket, is not the attacker."
    query: |-
      OfficeActivity
      | where TimeGenerated > ago(30d) and OfficeWorkload == "Exchange"
      | where Operation in ("Add-MailboxPermission", "Add-RecipientPermission", "Add-MailboxFolderPermission",
          "Set-MailboxFolderPermission", "UpdateFolderPermissions", "New-TransportRule", "Set-TransportRule",
          "Set-MailboxAutoReplyConfiguration", "Set-MailboxJunkEmailConfiguration",
          "HardDelete", "SoftDelete", "MoveToDeletedItems")
          or (Operation == "Set-Mailbox" and Parameters has "GrantSendOnBehalfTo")
      | extend SourceIP = coalesce(Client_IPAddress, ClientIP)
      | where UserId =~ "<upn>" or MailboxOwnerUPN =~ "<upn>" or OfficeObjectId has "<mailbox alias>"
          or SourceIP in ("<ip1>", "<ip2>")
      | project TimeGenerated, Operation, UserId, MailboxOwnerUPN, OfficeObjectId, SourceIP, SessionId,
          Parameters, AffectedItems
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1098.002"
      - "T1070.008"
  - id: "bec-response/defender/s2-oauth-consent-granted-in-the-window-and-what-the"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "OAuth consent granted in the window, and what the app did with it"
    why: "An app the user consented to keeps reading mail through Graph after every password reset and session revocation; it is removed by deleting the grant, not the credential. The consent is in the Entra audit log; the app's activity afterwards is in CloudAppEvents under its OAuthAppId."
    how: null
    fp: "Teams add-ins, Adobe, Zoom and signature tools ask for Mail.Read and offline_access legitimately. A grant to a multi-tenant app with no publisher verification, created minutes after a foreign sign-in, is the one to remove."
    query: |-
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where OperationName in ("Consent to application", "Add OAuth2PermissionGrant", "Add delegated permission grant",
          "Add app role assignment grant to user", "Add service principal")
      | where tostring(InitiatedBy.user.userPrincipalName) =~ "<upn>" or tostring(TargetResources) has "<upn>"
      | mv-expand TargetResources
      | project TimeGenerated, OperationName, Result, App=tostring(TargetResources.displayName),
          ServicePrincipalId=tostring(TargetResources.id), InitiatedIP=tostring(InitiatedBy.user.ipAddress),
          Changes=TargetResources.modifiedProperties
      // The app id for the next query: Get-MgServicePrincipal -ServicePrincipalId <ServicePrincipalId> | select AppId
      CloudAppEvents
      | where Timestamp > ago(30d) and OAuthAppId == "<app id>"
      | summarize Actions=count(), First=min(Timestamp), Last=max(Timestamp),
          Users=make_set(AccountDisplayName, 20) by ActionType, IPAddress
    tested: null
    attack:
      - "T1528"
      - "T1550.001"
  - id: "bec-response/defender/s3-mailitemsaccessed-in-the-attacker-s-sessions-dow"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Reading"
    stage_ord: 3
    platform: "Defender XDR / Sentinel"
    title: "MailItemsAccessed in the attacker's sessions, down to the message ids"
    why: "Sync access means the whole folder counts as read; Bind access lists each message. Pivot on the SessionId from stage 1 rather than on IP alone: the proxy kit changes IP, the session does not. The message-id list decides the personal-data notification and feeds the payment-thread hunt at stage 5. Throttling: more than 1,000 MailItemsAccessed records for one mailbox in 24 hours stops the logging for 24 hours, and the record that tripped it carries IsThrottled; a gap in the window is itself a finding, not an all-clear."
    how: null
    fp: "The user's own Outlook and phone sync whole folders every few minutes (ClientInfoString Outlook, Outlook-iOS, OutlookService); without the session or IP filter every message in the mailbox looks read."
    query: |-
      let attackerSessions = OfficeActivity
      | where TimeGenerated > ago(30d) and Operation == "MailItemsAccessed" and MailboxOwnerUPN =~ "<upn>"
      | where Client_IPAddress in ("<ip1>", "<ip2>") or SessionId in ("<session id from stage 1>")
      | distinct SessionId;
      OfficeActivity
      | where TimeGenerated > ago(30d) and Operation == "MailItemsAccessed" and MailboxOwnerUPN =~ "<upn>"
      | where SessionId in (attackerSessions) or Client_IPAddress in ("<ip1>", "<ip2>")
      | mv-apply p = OperationProperties on (
          summarize AccessType = take_anyif(tostring(p.Value), tostring(p.Name) == "MailAccessType"),
                    Throttled  = take_anyif(tostring(p.Value), tostring(p.Name) == "IsThrottled"))
      | mv-expand Folder = Folders
      | mv-expand Item = Folder.FolderItems
      | project TimeGenerated, SessionId, Client_IPAddress, ClientInfoString, AccessType, Throttled,
          FolderPath = tostring(Folder.Path), InternetMessageId = tostring(Item.InternetMessageId)
      | order by TimeGenerated asc
      // Defender XDR only (30-day retention), the raw record uses ClientIPAddress, not ClientIP:
      CloudAppEvents
      | where Timestamp > ago(30d) and ActionType == "MailItemsAccessed" and AccountObjectId == "<user object id>"
      | where tostring(RawEventData.ClientIPAddress) in ("<ip1>", "<ip2>") or tostring(RawEventData.SessionId) in ("<session id>")
      | project Timestamp, RawEventData.SessionId, RawEventData.ClientIPAddress, RawEventData.OperationProperties, RawEventData.Folders
    tested: null
    attack:
      - "T1114.002"
  - id: "bec-response/defender/s4-mail-the-attacker-sent-from-the-real-mailbox-wit"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Impersonation"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Mail the attacker sent from the real mailbox, with recipients"
    why: "Send (owner), SendAs and SendOnBehalf (delegate) audit records carry the subject, client IP and session. Audit (Standard) has included Send and MailItemsAccessed since Microsoft's 2024 roll-out unless the mailbox's audit set was customised (check: Get-Mailbox <upn> | fl DefaultAuditSet, AuditOwner). Recipients are not in the audit record; EmailEvents (30 days) or a message trace give those. Drafts never send and never audit: the attacker's unsent drafts are found by opening the Drafts folder in a Content Search."
    how: null
    fp: "The user kept sending mail during the window. Separate the attacker's sends by Client_IPAddress and SessionId from stage 1, and by subject lines that reply to threads the attacker read at stage 3."
    query: |-
      OfficeActivity
      | where TimeGenerated > ago(30d) and Operation in ("Send", "SendAs", "SendOnBehalf")
      | where MailboxOwnerUPN =~ "<upn>" or UserId =~ "<upn>"
      | project TimeGenerated, Operation, UserId, Client_IPAddress, SessionId, ClientInfoString,
          Subject = tostring(Item.Subject), InternetMessageId = tostring(Item.InternetMessageId)
      | order by TimeGenerated asc
      // Recipients and delivery, from mail flow:
      EmailEvents
      | where Timestamp > ago(30d) and SenderFromAddress =~ "<upn>" and EmailDirection in ("Outbound", "Intra-org")
      | project Timestamp, RecipientEmailAddress, Subject, SenderIPv4, InternetMessageId, NetworkMessageId, DeliveryAction
      | order by Timestamp asc
    tested: null
    attack:
      - "T1534"
      - "T1684.001"
  - id: "bec-response/defender/s4-lookalike-domains-writing-to-your-people-and-env"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Impersonation"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Lookalike domains writing to your people, and envelope-versus-header mismatches"
    why: "Generate the candidate list rather than guessing one: dnstwist -r on your own domain and on the top suppliers' domains, then match the list against SenderFromDomain. A second tell is the envelope sender domain (SenderMailFromDomain, P1) differing from the header From domain (SenderFromDomain, P2) on mail that claims a trusted domain. EmailEvents has no Reply-To column: for a Reply-To mismatch, run a Content Search on the recipients for the subject and read the headers of the.eml it returns."
    how: null
    fp: "Mailing-list, ticketing and marketing platforms set P1 to their own bounce domain on purpose; exclude the platforms your suppliers use and anything whose AuthenticationDetails shows DMARC pass."
    query: |-
      let lookalikes = dynamic(["<dnstwist domain 1>", "<dnstwist domain 2>"]);
      EmailEvents
      | where Timestamp > ago(30d)
      | where SenderFromDomain in~ (lookalikes) or SenderMailFromDomain in~ (lookalikes)
      | project Timestamp, SenderFromAddress, SenderMailFromAddress, RecipientEmailAddress, Subject,
          DeliveryAction, AuthenticationDetails
      // Header From claims a trusted domain, the envelope does not:
      EmailEvents
      | where Timestamp > ago(30d) and EmailDirection == "Inbound"
      | where SenderFromDomain in~ ("<your domain>", "<supplier domain>") and SenderMailFromDomain !~ SenderFromDomain
      | summarize Messages=count(), Recipients=dcount(RecipientEmailAddress), Subjects=make_set(Subject, 5)
          by SenderFromDomain, SenderMailFromDomain, SenderIPv4
    tested: null
    attack:
      - "T1583.001"
      - "T1684.001"
  - id: "bec-response/defender/s5-payment-and-bank-detail-threads-in-the-window-ra"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Payment request"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Payment and bank-detail threads in the window, ranked by what the attacker read"
    why: "The payment request is a reply inside a thread the attacker already read. Join the message ids from the Bind records at stage 3 to EmailEvents, then widen with subject and attachment keywords for the same window; everything that comes back goes to finance by phone, with the attacker-read ones first."
    how: null
    fp: "A finance mailbox matches the keywords on most of its mail; the AttackerRead column is the ranking, the keywords only widen the net. Add your own ERP's subject prefixes and the Dutch or German terms your suppliers use."
    query: |-
      let keywords = dynamic(["invoice", "remittance", "payment", "wire", "IBAN", "bank details", "account change",
          "overdue", "factuur", "betaling", "rekeningnummer"]);
      let readIds = OfficeActivity
      | where TimeGenerated > ago(30d) and Operation == "MailItemsAccessed" and MailboxOwnerUPN =~ "<upn>"
      | where SessionId in ("<attacker session id>") or Client_IPAddress in ("<ip1>", "<ip2>")
      | mv-expand Folder = Folders | mv-expand Item = Folder.FolderItems
      | distinct InternetMessageId = tostring(Item.InternetMessageId);
      EmailEvents
      | where Timestamp between (datetime(<first access UTC>) .. datetime(<revocation time UTC>))
      | where SenderFromAddress =~ "<upn>" or RecipientEmailAddress =~ "<upn>"
      | join kind=leftouter (EmailAttachmentInfo | project NetworkMessageId, FileName, FileType) on NetworkMessageId
      | where Subject has_any (keywords) or FileName has_any (keywords) or InternetMessageId in (readIds)
      | extend AttackerRead = InternetMessageId in (readIds)
      | project Timestamp, EmailDirection, SenderFromAddress, RecipientEmailAddress, Subject, FileName, AttackerRead
      | order by AttackerRead desc, Timestamp asc
    tested: null
    attack:
      - "T1684.001"
      - "T1657"
  - id: "bec-response/defender/s8-other-accounts-on-the-attacker-s-ips-or-sessions"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Wider targets"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Other accounts on the attacker's IPs or sessions; the same rule elsewhere"
    why: "Attackers rarely take one mailbox. A second account on the same IP, or with the same rule shape, is a second incident that needs the same containment, in the same pass."
    how: null
    fp: "A shared egress IP (office NAT, the company VPN) puts every colleague on the attacker's IP; match on ASN plus user agent, or on the session, before adding an account to the eviction list."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and (IPAddress in ("<ip1>", "<ip2>") or AutonomousSystemNumber in (<asn>))
      | where ResultType == "0"
      | summarize FirstSeen=min(TimeGenerated), SignIns=count(), Apps=make_set(AppDisplayName, 5) by UserPrincipalName, IPAddress
      // Same rule pattern or the same source in other mailboxes:
      OfficeActivity
      | where TimeGenerated > ago(30d) and Operation in ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "New-TransportRule")
      | extend SourceIP = coalesce(Client_IPAddress, ClientIP)
      | where Parameters has "<rule name or keyword>" or SourceIP in ("<ip1>", "<ip2>")
      | summarize FirstSeen=min(TimeGenerated) by UserId, OfficeObjectId, Operation, SourceIP
      // Internal recipients of the attacker's sends are the next victims: the stage 4 recipient list, filtered to your domain.
    tested: null
    attack:
      - "T1078.004"
      - "T1534"
  - id: "bec-response/defender/s9-sign-ins-and-mailbox-activity-after-the-revocati"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Defender XDR / Sentinel"
    title: "Sign-ins and mailbox activity after the revocation time"
    why: "Access tokens issued before revocation keep working until they expire (60–90 min for ordinary clients; CAE-capable clients hold tokens up to 28 h but receive the revocation within minutes), and OfficeActivity arrives about an hour late, so a clean result in the first hour is not proof. Re-run at T+2h and T+24h. A success after revocation means a channel was missed: a registered device, an OAuth grant, a delegate, or the still-infected laptop."
    how: null
    fp: "The user's own devices reconnect the moment the account is re-enabled; a hit from a known device, known ASN and the fresh SessionId created at re-enrolment is expected. Anything from the attacker's ASN, or from a SessionId that predates the revocation, is not."
    query: |-
      let revoked = datetime(<revocation time UTC>);
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > revoked
      | where UserPrincipalName in~ (<evicted upns>) and ResultType == "0"
      | project TimeGenerated, Type, UserPrincipalName, IPAddress, AutonomousSystemNumber, AppDisplayName, UserAgent, SessionId
      // Mailbox activity after revocation, from any IP (the attacker may have moved):
      OfficeActivity
      | where TimeGenerated > revoked and (UserId in~ (<evicted upns>) or MailboxOwnerUPN in~ (<evicted upns>))
      | extend SourceIP = coalesce(Client_IPAddress, ClientIP)
      | summarize Operations=make_set(Operation, 10), Count=count(), Last=max(TimeGenerated) by UserId, SourceIP, SessionId, ClientInfoString
    tested: null
    attack:
      - "T1078.004"
      - "T1550.004"
  - id: "bec-response/crowdstrike/s1-successful-sign-ins-for-the-user-first-seen-per"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "CrowdStrike Falcon"
    title: "Successful sign-ins for the user, first seen per IP"
    why: "The earliest sign-in from an IP the user never uses starts the access window; every later question (what was read, what was sent) is bounded by it."
    how: null
    fp: "Mobile carriers and VPN concentrators give the same user a new IP every day; judge on ASN and user agent, not on the IP alone."
    query: |-
      // Entra sign-ins reach Next-Gen SIEM through the Microsoft connector; field names depend on its parser.
      // Search the user over the last 30 days, open one sign-in event, and note the source-IP, ASN and result fields:
      "<upn>"
      // Then group on the fields you found, e.g.
      // | groupBy([<source ip field>, <asn field>], function=[min(@timestamp, as=FirstSeen), max(@timestamp, as=LastSeen), count()])
    tested: null
    attack:
      - "T1078.004"
  - id: "bec-response/crowdstrike/s1-aitm-one-session-replayed-from-two-networks-mfa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "CrowdStrike Falcon"
    title: "AiTM: one session replayed from two networks, MFA carried by the token"
    why: "A proxy phishing kit steals the session cookie after the real MFA, so a password reset alone does not end the access. One session id from two ASNs within minutes, or a sign-in whose MFA was “satisfied by claim in the token” from a new IP, is the replay."
    how: null
    fp: "Office Wi-Fi to phone hotspot changes ASN mid-session; a replay shows two networks within the same minutes, one of them usually a hosting provider."
    query: |-
      // Find the session-id field in one parsed sign-in event, then:
      "<upn>"
      | groupBy([<session id field>], function=[count(<source ip field>, distinct=true, as=IPs), collect([<source ip field>, <asn field>])])
      | IPs > 1
      // MFA satisfied by the token rather than performed:
      "<upn>" "MFA requirement satisfied by claim in the token"
      // Identity Protection (with the Entra ID connector): Identity protection > Detections for the user.
    tested: null
    attack:
      - "T1557"
      - "T1550.004"
      - "T1539"
  - id: "bec-response/crowdstrike/s1-victim-device-infostealer-or-fake-installer-befo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "CrowdStrike Falcon"
    title: "Victim device: infostealer or fake installer before first access"
    why: "If the session cookie or password was stolen by malware on the laptop, a password reset is not enough: the device keeps stealing new ones until it is rebuilt."
    how: null
    fp: "Installers and updaters run from Downloads and Temp all day; the lead is a binary the user cannot explain, launched shortly before the first foreign sign-in, with a hash new to the estate. Exclude the browser, Teams and OneDrive updaters."
    query: |-
      #event_simpleName=ProcessRollup2 ComputerName="<victim host>"
      | ImageFileName=/\\(AppData\\Local\\Temp|Downloads)\\/i
      | table([@timestamp, UserName, ImageFileName, CommandLine, SHA256HashData])
      // Also: Endpoint security > Detections, filter on the host, tactic Credential Access.
    tested: null
    attack:
      - "T1555.003"
      - "T1204.002"
  - id: "bec-response/crowdstrike/s2-inbox-rules-forwarding-permissions-transport-rul"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "CrowdStrike Falcon"
    title: "Inbox rules, forwarding, permissions, transport rules and deletions"
    why: "The rule's creation time and client IP bound the access window and give an attacker IP to pivot on. In the raw audit JSON, Outlook-made rules (UpdateInboxRules) carry the IP in ClientIPAddress and cmdlet records (New-InboxRule, Set-Mailbox) carry it in ClientIP with the target mailbox in ObjectId; delegate grants, transport rules, auto-replies and deletions from the attacker's IP are the same hunt."
    how: null
    fp: "Users make rules and helpdesk staff grant FullAccess for leavers; a grant from an admin IP with a ticket is not the attacker. Attacker rules move mail to RSS Feeds or Archive, or delete it, and match on invoice, payment or bank."
    query: |-
      // Free text plus a regex over all fields; works whatever the parser named the fields.
      "<upn>" /New-InboxRule|Set-InboxRule|UpdateInboxRules|Add-MailboxPermission|Add-RecipientPermission|Add-MailboxFolderPermission|New-TransportRule|Set-TransportRule|Set-MailboxAutoReplyConfiguration|Set-MailboxJunkEmailConfiguration|HardDelete|MoveToDeletedItems/
      // Set-Mailbox only with a forwarding or send-on-behalf parameter:
      "<upn>" "Set-Mailbox" /ForwardingSmtpAddress|ForwardingAddress|DeliverToMailboxAndForward|GrantSendOnBehalfTo/
      // Read ClientIPAddress / ClientIP, ObjectId, SessionId and Parameters from the matching events.
    tested: null
    attack:
      - "T1114.003"
      - "T1564.008"
      - "T1098.002"
      - "T1070.008"
  - id: "bec-response/crowdstrike/s2-oauth-consent-granted-in-the-window"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "CrowdStrike Falcon"
    title: "OAuth consent granted in the window"
    why: "An app the user consented to keeps reading mail through Graph after every reset and revocation; it is removed by deleting the grant. The consent record is in the Entra audit feed."
    how: null
    fp: "Teams add-ins, Adobe, Zoom and signature tools ask for Mail.Read legitimately; a multi-tenant app without publisher verification consented minutes after a foreign sign-in is the one to remove."
    query: |-
      "<upn>" /Consent to application|Add OAuth2PermissionGrant|Add delegated permission grant|Add app role assignment grant to user/
      // Note the app display name and service-principal id in the target resource; remove the grant in Respond (T+20-35).
    tested: null
    attack:
      - "T1528"
      - "T1550.001"
  - id: "bec-response/crowdstrike/s3-mailitemsaccessed-in-the-attacker-s-sessions-dow"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Reading"
    stage_ord: 3
    platform: "CrowdStrike Falcon"
    title: "MailItemsAccessed in the attacker's sessions, down to the message ids"
    why: "Sync access means the whole folder counts as read; Bind access lists each message. Pivot on the SessionId from stage 1, not only the IP. More than 1,000 MailItemsAccessed records in 24 hours stops the logging for 24 hours (IsThrottled in OperationProperties): a gap in the window is a finding, not an all-clear."
    how: null
    fp: "The user's own Outlook and phone sync whole folders every few minutes; without the session or IP filter every message looks read."
    query: |-
      "<upn>" "MailItemsAccessed" ("<attacker ip>" OR "<attacker session id>")
      // In each event: OperationProperties (MailAccessType Bind or Sync, IsThrottled), SessionId, ClientInfoString,
      // and Folders[].FolderItems[].InternetMessageId for the message list that feeds stage 5.
    tested: null
    attack:
      - "T1114.002"
  - id: "bec-response/crowdstrike/s4-mail-sent-as-the-user-and-mail-from-a-lookalike"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Impersonation"
    stage_ord: 4
    platform: "CrowdStrike Falcon"
    title: "Mail sent as the user, and mail from a lookalike domain"
    why: "Everyone the attacker wrote to, from the real mailbox or a lookalike, has to be warned by phone before they act on it. Send, SendAs and SendOnBehalf records carry the subject and client IP (Audit Standard includes Send since 2024); recipients and the lookalike list come from a message trace, with the candidate domains generated by dnstwist rather than guessed."
    how: null
    fp: "The user kept sending mail during the window; separate the attacker's sends by client IP and session from stage 1."
    query: |-
      "<upn>" /"Operation"\s*:\s*"Send(As|OnBehalf)?"/
      // Subject and InternetMessageId are under Item in the raw JSON. Recipients and lookalikes: message trace in the
      // Exchange admin center, SenderAddress domain matched against the dnstwist output.
    tested: null
    attack:
      - "T1534"
      - "T1684.001"
      - "T1583.001"
