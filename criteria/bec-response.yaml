  - id: "bec-response/sentinelone/s9-sign-ins-and-mailbox-activity-after-the-revocati"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "SentinelOne"
    title: "Sign-ins and mailbox activity after the revocation time"
    why: "Access tokens issued before revocation live until they expire (60–90 min; up to 28 h on CAE-capable clients, which do receive the revocation), and the audit feed arrives about an hour late, so a clean result in the first hour is not proof. Re-run at T+2h and T+24h."
    how: null
    fp: "The user's own devices reconnect the moment the account is re-enabled; a known device and ASN with a fresh session id is expected, the attacker's ASN or a pre-revocation session id is not."
    query: |-
      // Set the time range to start at the revocation time.
      dataSource.name = '<m365_source>' <user_field> contains:anycase '<upn>'
      | group ct = count() by <source ip field>, <session id field>
      // And the victim device, still infected?
      indicator.category contains 'InfoStealer' AND endpoint.name = '<victim host>'
    tested: null
    attack:
      - "T1078.004"
      - "T1550.004"
  - id: "bec-response/velociraptor/s1-victim-device-phishing-page-visited-infostealer"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Velociraptor"
    title: "Victim device: phishing page visited, infostealer or fake installer before first access"
    why: "If the session cookie or password was stolen by malware on the laptop, a password reset is not enough: the device keeps stealing new ones until it is rebuilt. If the browser history shows the proxy phishing page just before the first foreign sign-in, the cookie was replayed and the device is clean: the eviction has to kill the session, not the laptop."
    how: null
    fp: "Installers and updaters are new binaries too; the lead is a binary the user cannot explain, run shortly before the first foreign sign-in, with a hash new to the estate."
    query: |-
      Collect on the victim's device:
      Windows.Applications.Chrome.History     (Chrome, Edge, Brave, Vivaldi, Opera profiles)
        URLRegex  = (?i)<phishing or lookalike domain>   (or leave empty and read the visits just before first access)
      Windows.Forensics.Prefetch
        dateAfter = <14 days before first access>        (new binaries: stealer, fake installer, cracked tool)
      Windows.System.Amcache
        (first-execution times for the same window)
    tested: null
    attack:
      - "T1555.003"
      - "T1204.002"
      - "T1557"
  - id: "bec-response/velociraptor/s8-the-stealer-on-any-other-host"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Wider targets"
    stage_ord: 8
    platform: "Velociraptor"
    title: "The stealer on any other host"
    why: "Attackers rarely take one mailbox. The same stealer on a second laptop is a second compromised account that needs the same containment, in the same pass."
    how: null
    fp: "Portable tools (7-Zip, PuTTY, Rufus) match Prefetch and Pslist by name on many hosts; confirm on hash with FileFinder before quarantining a host."
    query: |-
      Hunt across all clients for the binary found on the victim's device:
      Windows.Forensics.Prefetch
        binaryRegex = (?i)<stealer file name>
      Windows.System.Pslist
        ProcessRegex = (?i)<stealer file name>
      Windows.Search.FileFinder
        SearchFilesGlob = C:\Users\*\{AppData\Local\Temp,Downloads}\**
        Calculate_Hash  = Y        (then filter the SHA256 column on the hash from stage 1)
    tested: null
    attack:
      - "T1555.003"
  - id: "bec-response/velociraptor/s9-the-stealer-still-running-on-the-victim-s-device"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Velociraptor"
    title: "The stealer still running on the victim's device after revocation"
    why: "No view of sessions; the endpoint check is whether the stealer still runs, or anything new ran after the revocation time. If it does, the new password and the fresh MFA enrolment are already stolen."
    how: null
    fp: "A rebuild in progress runs installers after the revocation time; compare against the build's software list."
    query: |-
      Windows.System.Pslist
        ProcessRegex = (?i)<stealer file name>
      Windows.Forensics.Prefetch
        dateAfter = <revocation time>
