    attack: []
  - platform: "CrowdStrike Falcon"
    label: "T+20–35 · Device"
    name: "Block the stealer on every host"
    tier: "destructive"
    tier_inferred: false
    why: "if an infostealer took the cookie or password, the same file may be on other machines; a global custom IOC blocks it everywhere, with an expiry so it doesn't outlive the case."
    how: null
    body: |-
      POST /iocs/entities/indicators/v1
      {"indicators": [{"type": "sha256", "value": "<sha256>", "action": "prevent", "platforms": ["windows"],
        "severity": "high", "applied_globally": true, "expiration": "<UTC date>", "description": "BEC case #<n>"}]}
    attack:
      - "T1555.003"
  - platform: "CrowdStrike Falcon"
    label: "T+20–35 · Device"
    name: "Contain the victim's device"
    tier: "destructive"
    tier_inferred: false
    why: "containment stops the stealer sending new credentials, and RTR keeps working on a contained host for collection."
    how: "Host management › Network contain. The API takes several AIDs in one call if the sweep found the stealer elsewhere."
    body: |-
      POST /devices/entities/devices-actions/v2?action_name=contain
      {"ids": ["<AID>"]}
    attack: []
  - platform: "CrowdStrike Falcon"
    label: "Hour 1–24 · Rebuild"
    name: "Collect with RTR, stop it, then rebuild the device"
    tier: "destructive"
    tier_inferred: false
    why: "the binary, its drop location and the persistence it set are evidence and a hunt lead; killing the process only stops it running — the device is rebuilt, not cleaned."
    how: "Upload Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df and Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d under Host setup and management › Response scripts and files first. get is for the snapshot zip and the suspect binary; a RAM image goes to a share the contained host is allowed to reach."
    body: |-
      ps
      netstat
      ls C:\Users\<user>\AppData\Local\Temp
      ls C:\Users\<user>\Downloads
      get C:\path\to\suspect.exe
      put Get-PersistenceSnapshot.ps1
      runscript -Raw=```& .\Get-PersistenceSnapshot.ps1 -Zip```
      put MagnetRESPONSEv172_Self_Extracting_Archive.exe
      get C:\<cwd>\PersistenceSnapshot-<host>-<timestamp>.zip
      kill <pid>
    attack:
      - "T1555.003"
