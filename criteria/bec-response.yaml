    how: "SentinelOne doesn't export the UAL, block senders or revoke Entra sessions. Run the export (T+5–15), the tenant-wide block (T+10–20) and the native eviction sequence (T+20–35) from Respond; SentinelOne covers the devices."
    body: ""
    attack: []
  - platform: "SentinelOne"
    label: "T+20–35 · Device"
    name: "Blocklist the stealer across the tenant"
    tier: "write"
    tier_inferred: true
    why: "if an infostealer took the cookie or password, the same file may be on other machines; a tenant-scope blocklist entry stops it everywhere."
    how: "The blocklist takes the SHA-1 of the file; type must be black_hash, any other value creates an exclusion instead."
    body: |-
      POST /web/api/v2.1/restrictions
      {"data": {"type": "black_hash", "value": "<sha1>", "osType": "windows", "description": "BEC case #<n>"},
       "filter": {"tenant": true}}
    attack:
      - "T1555.003"
  - platform: "SentinelOne"
    label: "T+20–35 · Device"
    name: "Disconnect the victim's device from the network"
    tier: "write"
    tier_inferred: true
    why: "network quarantine stops the stealer sending new credentials; the management connection stays up for collection."
