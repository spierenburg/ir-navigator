  - id: "bec-response/elastic/s1-aitm-one-session-replayed-from-two-networks-mfa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Elastic / Wazuh"
    title: "AiTM: one session replayed from two networks, MFA carried by the token"
    why: "A proxy phishing kit steals the session cookie after the real MFA, so a password reset alone does not end the access. One session id from two ASNs within minutes, or a sign-in whose authentication details read “MFA requirement satisfied by claim in the token” from a new IP, is the replay."
    how: null
    fp: "Office Wi-Fi to phone hotspot changes ASN mid-session; a replay shows two networks within the same minutes, one of them usually a hosting provider. “Satisfied by claim in the token” is normal on a device that did MFA once; it matters only from a new IP or ASN."
    query: |-
      FROM logs-azure.signinlogs*
      | WHERE @timestamp > NOW() - 30 days
        AND azure.signinlogs.properties.user_principal_name == "<upn>" AND event.outcome == "success"
        AND azure.signinlogs.properties.session_id IS NOT NULL
      | STATS asns = COUNT_DISTINCT(source.as.number), ips = VALUES(source.ip), first = MIN(@timestamp), last = MAX(@timestamp)
          BY azure.signinlogs.properties.session_id
      | WHERE asns > 1
      // MFA satisfied by the token rather than performed (authentication_details is a nested array; read it in Discover):
      FROM logs-azure.signinlogs*
      | WHERE @timestamp > NOW() - 30 days AND azure.signinlogs.properties.user_principal_name == "<upn>"
        AND TO_STRING(azure.signinlogs.properties.authentication_details) LIKE "*MFA requirement satisfied by claim in the token*"
      | KEEP @timestamp, source.ip, source.as.number, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.session_id, user_agent.original
    tested: null
    attack:
      - "T1557"
      - "T1550.004"
      - "T1539"
  - id: "bec-response/elastic/s1-victim-device-infostealer-or-fake-installer-befo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Elastic / Wazuh"
    title: "Victim device: infostealer or fake installer before first access"
    why: "If the session cookie or password was stolen by malware on the laptop, a password reset is not enough: the device keeps stealing new ones until it is rebuilt."
    how: null
    fp: "Installers and updaters run from Downloads and AppData all day; the lead is a binary the user cannot explain, launched shortly before the first foreign sign-in, with a hash new to the estate."
    query: |-
      process where event.type == "start" and host.name == "<victim host>" and
        process.executable : ("?:\\Users\\*\\AppData\\*", "?:\\Users\\*\\Downloads\\*") and
        not process.name : ("msedge.exe", "chrome.exe", "Teams.exe", "OneDrive.exe", "ms-teams.exe")
    tested: null
    attack:
      - "T1555.003"
      - "T1204.002"
  - id: "bec-response/elastic/s2-inbox-rules-and-mailbox-forwarding-created-or-ch"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Elastic / Wazuh"
    title: "Inbox rules and mailbox forwarding created or changed"
    why: "The rule's creation time and client IP bound the access window and give an attacker IP to pivot on. Rules made in Outlook desktop arrive as UpdateInboxRules with the IP in o365.audit.ClientIPAddress; cmdlet records (New-InboxRule, Set-InboxRule, Set-Mailbox) carry it in o365.audit.ClientIP with the target mailbox in o365.audit.ObjectId (UserId is whoever ran the cmdlet). Set-Mailbox only matters with a forwarding parameter."
    how: null
    fp: "Users make rules too. Attacker rules move mail to RSS Feeds, Archive or Deleted Items, delete it, or match on invoice, payment, bank or the attacker's own domain."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days AND event.provider == "Exchange"
        AND event.action IN ("New-InboxRule", "Set-InboxRule", "Enable-InboxRule", "UpdateInboxRules", "Set-Mailbox")
        AND (o365.audit.UserId == "<upn>" OR o365.audit.MailboxOwnerUPN == "<upn>" OR o365.audit.ObjectId LIKE "*<mailbox alias>*")
        AND (event.action != "Set-Mailbox"
             OR o365.audit.Parameters.ForwardingSmtpAddress IS NOT NULL
             OR o365.audit.Parameters.ForwardingAddress IS NOT NULL
             OR o365.audit.Parameters.DeliverToMailboxAndForward IS NOT NULL)
      | EVAL src_ip = COALESCE(o365.audit.ClientIPAddress, o365.audit.ClientIP)
      | KEEP @timestamp, event.action, o365.audit.UserId, o365.audit.ObjectId, src_ip, o365.audit.SessionId,
             o365.audit.Parameters.ForwardTo, o365.audit.Parameters.ForwardAsAttachmentTo, o365.audit.Parameters.RedirectTo,
             o365.audit.Parameters.ForwardingSmtpAddress, o365.audit.Parameters.MoveToFolder, o365.audit.Parameters.DeleteMessage
      | SORT @timestamp
    tested: null
    attack:
      - "T1114.003"
      - "T1564.008"
  - id: "bec-response/elastic/s2-permissions-transport-rules-auto-reply-junk-sett"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Elastic / Wazuh"
    title: "Permissions, transport rules, auto-reply, junk settings and deletions from the attacker's IP"
    why: "Delegate and SendAs permissions outlive a password reset; a transport rule is a forwarding rule the mailbox owner never sees; an auto-reply or junk-list entry hides the victim's replies; HardDelete and MoveToDeletedItems from the attacker's IP are the attacker cleaning the hijacked thread."
    how: null
    fp: "Deletions by the owner from the office IP are the user tidying up; keep the IP and SessionId filter. A FullAccess grant from an admin IP with a ticket is not the attacker."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days AND event.provider == "Exchange"
        AND (event.action IN ("Add-MailboxPermission", "Add-RecipientPermission", "Add-MailboxFolderPermission", "Set-MailboxFolderPermission",
             "UpdateFolderPermissions", "New-TransportRule", "Set-TransportRule", "Set-MailboxAutoReplyConfiguration",
             "Set-MailboxJunkEmailConfiguration", "HardDelete", "SoftDelete", "MoveToDeletedItems")
             OR (event.action == "Set-Mailbox" AND o365.audit.Parameters.GrantSendOnBehalfTo IS NOT NULL))
      | EVAL src_ip = COALESCE(o365.audit.ClientIPAddress, o365.audit.ClientIP)
      | WHERE o365.audit.UserId == "<upn>" OR o365.audit.MailboxOwnerUPN == "<upn>" OR o365.audit.ObjectId LIKE "*<mailbox alias>*"
        OR src_ip IN ("<ip1>", "<ip2>")
      | KEEP @timestamp, event.action, o365.audit.UserId, o365.audit.MailboxOwnerUPN, o365.audit.ObjectId, src_ip, o365.audit.SessionId, o365.audit.Parameters.*
      | SORT @timestamp
    tested: null
    attack:
      - "T1098.002"
      - "T1070.008"
  - id: "bec-response/elastic/s2-oauth-consent-granted-in-the-window"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Elastic / Wazuh"
    title: "OAuth consent granted in the window"
    why: "An app the user consented to keeps reading mail through Graph after every reset and revocation; it is removed by deleting the grant. The consent is in the Entra audit log stream."
    how: null
    fp: "Teams add-ins, Adobe, Zoom and signature tools ask for Mail.Read legitimately; a multi-tenant app without publisher verification consented minutes after a foreign sign-in is the one to remove."
    query: |-
      FROM logs-azure.auditlogs*
      | WHERE @timestamp > NOW() - 30 days
        AND azure.auditlogs.operation_name IN ("Consent to application", "Add OAuth2PermissionGrant", "Add delegated permission grant",
            "Add app role assignment grant to user", "Add service principal")
        AND (azure.auditlogs.properties.initiated_by.user.userPrincipalName == "<upn>" OR TO_STRING(azure.auditlogs.properties.target_resources) LIKE "*<upn>*")
      | KEEP @timestamp, azure.auditlogs.operation_name, azure.auditlogs.result, azure.auditlogs.properties.initiated_by.user.ipAddress, azure.auditlogs.properties.target_resources.*
      // Without the Azure integration, the same events reach logs-o365.audit-* as event.provider "AzureActiveDirectory"
      // with a trailing full stop: event.action == "Consent to application."
    tested: null
    attack:
      - "T1528"
      - "T1550.001"
  - id: "bec-response/elastic/s3-mailitemsaccessed-in-the-attacker-s-sessions-dow"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Reading"
    stage_ord: 3
    platform: "Elastic / Wazuh"
    title: "MailItemsAccessed in the attacker's sessions, down to the message ids"
    why: "Sync access means the whole folder counts as read; Bind access lists each message. Pivot on the SessionId from stage 1, not only the IP. More than 1,000 MailItemsAccessed records in 24 hours stops the logging for 24 hours (IsThrottled in OperationProperties): a gap in the window is a finding, not an all-clear."
    how: null
    fp: "The user's own Outlook and phone sync whole folders every few minutes; without the session or IP filter every message looks read."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days AND event.action == "MailItemsAccessed"
        AND o365.audit.MailboxOwnerUPN == "<upn>"
        AND (o365.audit.ClientIPAddress IN ("<ip1>", "<ip2>") OR o365.audit.SessionId IN ("<attacker session id>"))
      | STATS records = COUNT(*), first_seen = MIN(@timestamp), last_seen = MAX(@timestamp), clients = VALUES(o365.audit.ClientInfoString)
          BY o365.audit.SessionId, o365.audit.ClientIPAddress
      // Bind or Sync and IsThrottled: o365.audit.OperationProperties. Message ids: the Folders[].FolderItems[].InternetMessageId
      // array in the raw event (aggregated records: o365.audit.ExchangeAggregatedFolders.FolderItems.InternetMessageId); export the
      // matching documents from Discover and extract the ids there, ES|QL does not unnest the array.
    tested: null
    attack:
      - "T1114.002"
  - id: "bec-response/elastic/s4-mail-sent-as-the-user-and-mail-from-a-lookalike"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Impersonation"
    stage_ord: 4
    platform: "Elastic / Wazuh"
    title: "Mail sent as the user, and mail from a lookalike domain"
    why: "Everyone the attacker wrote to, from the real mailbox or a lookalike, has to be warned by phone before they act on it. Send, SendAs and SendOnBehalf records carry the subject, client IP and session (Audit Standard includes Send since 2024) but not the recipients; those, and the lookalike domains matched against a dnstwist list, come from a message trace. Reply-To is in neither: read it from the.eml headers in a Content Search."
    how: null
    fp: "The user kept sending mail during the window; separate the attacker's sends by client IP and session from stage 1."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days
        AND event.action IN ("Send", "SendAs", "SendOnBehalf") AND (o365.audit.MailboxOwnerUPN == "<upn>" OR o365.audit.UserId == "<upn>")
      | KEEP @timestamp, event.action, o365.audit.UserId, o365.audit.ClientIPAddress, o365.audit.SessionId, o365.audit.Item.Subject, o365.audit.Item.InternetMessageId
      | SORT @timestamp
      // Recipients and lookalikes: Start-HistoricalSearch (Respond, T+5-15) and match the sender domain column against the dnstwist output.
    tested: null
    attack:
      - "T1534"
      - "T1684.001"
      - "T1583.001"
  - id: "bec-response/elastic/s5-payment-and-bank-detail-subjects-the-attacker-se"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Payment request"
    stage_ord: 5
    platform: "Elastic / Wazuh"
    title: "Payment and bank-detail subjects the attacker sent or read"
    why: "The outbound half of the payment request is in the Send records (subject, session); the inbound half is in the message trace or a Content Search. Rank by the message ids from the Bind records at stage 3, then widen with subject keywords; everything that comes back goes to finance by phone."
    how: null
    fp: "A finance mailbox matches the keywords on most of its mail; the Bind ids are the ranking, the keywords only widen the net. Inbound requests and attachments are not here: message trace and Content Search."
    query: |-
      FROM logs-o365.audit-*
      | WHERE @timestamp >= TO_DATETIME("<first access, ISO 8601>") AND @timestamp <= TO_DATETIME("<revocation time, ISO 8601>")
        AND event.action IN ("Send", "SendAs", "SendOnBehalf") AND (o365.audit.MailboxOwnerUPN == "<upn>" OR o365.audit.UserId == "<upn>")
      | EVAL subject = TO_LOWER(o365.audit.Item.Subject)
      | WHERE subject LIKE "*invoice*" OR subject LIKE "*remittance*" OR subject LIKE "*payment*" OR subject LIKE "*wire*"
         OR subject LIKE "*iban*" OR subject LIKE "*bank details*" OR subject LIKE "*factuur*" OR subject LIKE "*betaling*" OR subject LIKE "*rekeningnummer*"
         OR o365.audit.Item.InternetMessageId IN ("<bind id 1>", "<bind id 2>")
      | KEEP @timestamp, event.action, o365.audit.ClientIPAddress, o365.audit.SessionId, o365.audit.Item.Subject, o365.audit.Item.InternetMessageId
      | SORT @timestamp
    tested: null
    attack:
      - "T1684.001"
      - "T1657"
  - id: "bec-response/elastic/s8-other-accounts-on-the-attacker-s-ips-the-same-ru"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Wider targets"
    stage_ord: 8
    platform: "Elastic / Wazuh"
    title: "Other accounts on the attacker's IPs; the same rule elsewhere"
    why: "Attackers rarely take one mailbox. A second account on the same IP or with the same rule name is a second incident that needs the same containment."
    how: null
    fp: "A shared egress IP (office NAT, the company VPN) puts every colleague on the attacker's IP; match on ASN plus user agent, or on the session, before adding an account to the eviction list."
    query: |-
      FROM logs-azure.signinlogs*
      | WHERE @timestamp > NOW() - 30 days AND (source.ip IN (TO_IP("<ip1>"), TO_IP("<ip2>")) OR source.as.number == <asn>) AND event.outcome == "success"
      | STATS first_seen = MIN(@timestamp), signins = COUNT(*) BY azure.signinlogs.properties.user_principal_name, source.ip
      // Same rule pattern or source in other mailboxes:
      FROM logs-o365.audit-*
      | WHERE @timestamp > NOW() - 30 days AND event.action IN ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "New-TransportRule")
      | EVAL src_ip = COALESCE(o365.audit.ClientIPAddress, o365.audit.ClientIP)
      | WHERE src_ip IN ("<ip1>", "<ip2>") OR o365.audit.Parameters.Name LIKE "*<rule name or keyword>*"
      | STATS first_seen = MIN(@timestamp) BY o365.audit.UserId, o365.audit.ObjectId, event.action, src_ip
    tested: null
    attack:
      - "T1078.004"
      - "T1534"
  - id: "bec-response/elastic/s9-sign-ins-and-mailbox-activity-after-the-revocati"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Elastic / Wazuh"
    title: "Sign-ins and mailbox activity after the revocation time"
    why: "Access tokens issued before revocation live until they expire (60–90 min; up to 28 h on CAE-capable clients, which do receive the revocation), and the o365 feed arrives about an hour late, so a clean result in the first hour is not proof. Re-run at T+2h and T+24h. A success after revocation means a channel was missed."
    how: null
    fp: "The user's own devices reconnect the moment the account is re-enabled; a known device and ASN with a fresh session id is expected, the attacker's ASN or a pre-revocation session id is not."
    query: |-
      FROM logs-azure.signinlogs*
      | WHERE @timestamp > TO_DATETIME("<revocation time, ISO 8601>")
        AND azure.signinlogs.properties.user_principal_name IN ("<evicted upn 1>", "<evicted upn 2>") AND event.outcome == "success"
      | KEEP @timestamp, azure.signinlogs.category, azure.signinlogs.properties.user_principal_name, source.ip, source.as.number,
             azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.session_id, user_agent.original
      // Mailbox activity after revocation, from any IP:
      FROM logs-o365.audit-*
      | WHERE @timestamp > TO_DATETIME("<revocation time, ISO 8601>")
        AND (o365.audit.UserId IN ("<evicted upn 1>", "<evicted upn 2>") OR o365.audit.MailboxOwnerUPN IN ("<evicted upn 1>", "<evicted upn 2>"))
      | EVAL src_ip = COALESCE(o365.audit.ClientIPAddress, o365.audit.ClientIP)
      | STATS operations = VALUES(event.action), records = COUNT(*), last = MAX(@timestamp) BY o365.audit.UserId, src_ip, o365.audit.SessionId, o365.audit.ClientInfoString
    tested: null
    attack:
      - "T1078.004"
      - "T1550.004"
  - id: "bec-response/proposed/lure-email-removed-by-zap-after-delivery-check-clicks-before-ruling-the-user-out"
    status: "active"
    source: "T-Minus365 'Token Theft Deep Dive Part 1: Incident Response' WCdTaKVQmzI (t=25:19 ZAP after click, t=26:00 and t=43:48 Explorer Plan 2 vs Plan 1; distill 2026-10-25); single-source practitioner statement, licensing split not separately verified"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Lure email removed by ZAP after delivery: check clicks before ruling the user out"
    why: "Zero-hour auto purge removes a phishing message after delivery, sometimes hours later. A ZAP removal shows the message reached the inbox, not that the user was protected: the user can open it and click the link before it is purged. For every recipient of a ZAP-removed lure, check URL clicks (UrlClickEvents with Defender for Office 365) and sign-ins from new infrastructure in the window between delivery and purge. Ruled out for a recipient when there is no click and no sign-in from new infrastructure between delivery and purge. Without Defender for Office 365 Plan 2 there is no Explorer search across all mail (Plan 1 has real-time detections only); fall back to message trace on sender and subject."
    how: null
    fp: "ZAP also removes bulk mail and newsletters that were reclassified, and most removed lures were never opened, so a ZAP removal alone is not a lead. Link detonation and pre-scanning by mail security tools can log clicks that were not the user's; check the user, device and IP on each click before treating it as one."
    query: |-
      // Recipients of ZAP-removed mail, and that recipient's own clicks on the message before the purge (Defender for Office 365)
      // Joined on message and person: every recipient shares the NetworkMessageId, so a message-only join gives one user's click to all of them.
      // A recipient address that differs from the UPN (alias, shared mailbox) shows no click here; check those by NetworkMessageId alone.
      EmailPostDeliveryEvents
      | where Timestamp > ago(30d)
      | where ActionType in ("Phish ZAP", "Malware ZAP")
      | project PurgeTime=Timestamp, NetworkMessageId, RecipientEmailAddress, Person=tolower(RecipientEmailAddress), ActionType, ActionResult
      | join kind=leftouter (
          UrlClickEvents
          | where Timestamp > ago(30d)
          | project ClickTime=Timestamp, NetworkMessageId, AccountUpn, Person=tolower(AccountUpn), Url, ClickAction=ActionType, IsClickedThrough
        ) on NetworkMessageId, Person
      | extend ClickedBeforePurge = isnotempty(ClickTime) and ClickTime < PurgeTime
      | project PurgeTime, RecipientEmailAddress, ActionType, ActionResult, ClickTime, AccountUpn, Url, ClickAction,
          IsClickedThrough, ClickedBeforePurge
      | order by ClickedBeforePurge desc, PurgeTime asc
      // Delivery time, to bound the delivery-to-purge window for the sign-in check
      EmailEvents
      | where Timestamp > ago(30d) and NetworkMessageId == "<network message id>"
      | project DeliveryTime=Timestamp, RecipientEmailAddress, SenderFromAddress, Subject, DeliveryAction
      // Sign-ins between delivery and purge: the other half of the rule-out. UrlClickEvents sees only Safe Links-wrapped clicks,
      // so a QR-code lure or a link inside an attachment leaves no click row; this check still covers those
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated between (datetime(<delivery time>) .. datetime(<purge time>) + 1d)
      | where UserPrincipalName =~ "<recipient upn>" and ResultType == "0"
      | summarize SignIns=count(), First=min(TimeGenerated), Apps=make_set(AppDisplayName, 10) by IPAddress, AutonomousSystemNumber
      | order by First asc
    tested: null
    attack:
      - "T1566.002"
      - "T1204.001"
  - id: "bec-response/proposed/consent-to-a-known-bec-abused-app-em-client-perfectdata-software-cloudsponge-sig"
    status: "active"
    source: "Datadog default rule 'Consent given to application associated with business email compromise attacks in Microsoft 365' (def-000-ihv); cybercorner.tech 'Common OAuth Apps Used in Business Email Compromise'; entraprotect.io malicious applications database; discovered via T-Minus365 jIdBf7e5v9M (t=32:33, distill 2026-10-25)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 3 · Reading"
    stage_ord: 3
    platform: "Defender XDR / Sentinel"
    title: "Consent to a known BEC-abused app: eM Client, PERFECTDATA SOFTWARE, CloudSponge, SigParser, Supermailer, rclone"
    why: "A small set of legitimate apps is used repeatedly after BEC account takeover: eM Client (full mailbox sync), PERFECTDATA SOFTWARE (mailbox export to PST), CloudSponge (contact export), SigParser (contact scraping), Newsletter Software Supermailer (bulk sending) and rclone (cloud file transfer). A \"Consent to application\" for one of these by the compromised user inside the exposure window, from the attacker's IP, is mailbox exfiltration or a sending channel, and it survives the password reset until the grant is removed. Some community trackers note that items synced by such apps may not be fully recorded in the Unified Audit Log, so absence of MailItemsAccessed rows does not prove nothing was taken. Ruled out when the user installed the app before the window, from their usual network, for a documented business reason."
    how: null
    fp: "eM Client and rclone have real users: someone who has used eM Client as their desktop mail client for months, or an engineering team syncing files with rclone, consents again after a password change or token expiry. Check when the user first consented to the app, from which IP, and whether the tenant has earlier sign-ins for it. A first-ever consent inside the window, from the attacker's IP, is the finding."
    query: |-
      // Consent or grants for one of the known BEC-abused apps, by anyone, with the consenting IP
      // Matched on the whole TargetResources: on grant rows the first target is the resource API (e.g. Microsoft Graph), not the client app.
      // A grant row that names the client only by id will not match; follow TargetId from the consent row instead.
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where OperationName in ("Consent to application", "Add OAuth2PermissionGrant", "Add delegated permission grant",
          "Add app role assignment grant to user", "Add service principal")
      | where tostring(TargetResources) has_any ("eM Client", "PERFECTDATA", "CloudSponge", "SigParser", "Supermailer", "rclone")
      | mv-expand TargetResources
      | project TimeGenerated, OperationName, Result, Target=tostring(TargetResources.displayName), TargetId=tostring(TargetResources.id),
          Actor=tostring(InitiatedBy.user.userPrincipalName), ActorIP=tostring(InitiatedBy.user.ipAddress)
      | order by TimeGenerated asc
      // History of the same apps: months of sign-ins from the user's usual network means a real user
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where AppDisplayName has_any ("eM Client", "PERFECTDATA", "CloudSponge", "SigParser", "Supermailer", "rclone")
      | summarize First=min(TimeGenerated), Last=max(TimeGenerated), SignIns=count(), IPs=make_set(IPAddress, 10)
          by UserPrincipalName, AppDisplayName
    tested: null
    attack:
      - "T1528"
      - "T1550.001"
      - "T1114.002"
  - id: "bec-response/proposed/empty-audit-search-for-rules-or-deletions-prove-the-ual-could-see-the-mailbox-be"
    status: "active"
    source: "https://learn.microsoft.com/en-us/purview/audit-search"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 1 · Mailbox access"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Empty audit search for rules or deletions: prove the UAL could see the mailbox before ruling it out"
    why: "An empty Unified Audit Log result for New-InboxRule, Set-InboxRule, UpdateInboxRules, SoftDelete or HardDelete only clears the mailbox if the log could have recorded them. Four things blind it: ingestion switched off for the tenant (Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $false, read in Exchange Online PowerShell; in Security & Compliance PowerShell the property always reads False), mailbox auditing off for the organisation (AuditDisabled), the mailbox excluded (Set-MailboxAuditBypassAssociation), and without an E5 licence mailbox audit events reach the UAL search only when auditing was enabled on that mailbox explicitly (Set-Mailbox -AuditEnabled $true). Lag is the fifth: Exchange records typically land 60 to 90 minutes after the event and Microsoft guarantees no time, so an attacker active in the last hours is not yet in the log. While any of these holds, read the rules from the mailbox itself (Get-InboxRule -IncludeHidden) and re-run the search at T+2h and T+24h. Ruled out, and the empty result stands, when ingestion and mailbox auditing were on for the whole window, no Set-AdminAuditLogConfig, Set-OrganizationConfig or Set-MailboxAuditBypassAssociation appears in it, the user's AuditBypassEnabled is False, and the window closed more than 24 hours ago."
    how: null
    fp: "A tenant that never turned ingestion on, or a service account bypassed for a documented reason, is a configuration gap and not the attacker's doing: no Set-AdminAuditLogConfig or Set-MailboxAuditBypassAssociation in the window. It still blinds the search, so the empty result still does not clear the mailbox."
    query: |-
      # Exchange Online PowerShell (Security & Compliance PowerShell reports UnifiedAuditLogIngestionEnabled as False even when it is on)
      Get-AdminAuditLogConfig | fl UnifiedAuditLogIngestionEnabled
      Get-OrganizationConfig | fl AuditDisabled
      Get-MailboxAuditBypassAssociation -Identity <upn> | fl AuditBypassEnabled
      Get-Mailbox -Identity <upn> | fl AuditEnabled, DefaultAuditSet
      # Was any of it changed inside the window?
      Search-UnifiedAuditLog -StartDate <window start> -EndDate (Get-Date) -ResultSize 5000 `
        -Operations Set-AdminAuditLogConfig, Set-OrganizationConfig, Set-MailboxAuditBypassAssociation, Set-Mailbox |
        Select-Object CreationDate, UserIds, Operations, AuditData
      # The rules as they stand, whatever the log saw
      Get-InboxRule -Mailbox <upn> -IncludeHidden | fl Name, Enabled, From, SubjectOrBodyContainsWords, MoveToFolder, DeleteMessage, ForwardTo, RedirectTo
    tested: null
    attack:
      - "T1685.002"
      - "T1564.008"
steps:
  - ord: 1
    time: "T+0–5 min"
    title: "Is a payment in flight?"
    why: "Ask finance: any payment requested, approved or sent from a conversation this mailbox was part of, or any bank-detail change? If yes, finance calls the bank's fraud department on the number already on file — never a number from the email — and asks by name for the recall mechanism that fits the rail: SWIFT gpi stop-and-recall for an international wire (the receiving bank is asked to freeze while the funds are still in the gpi chain); SEPA SCT Recall for a euro transfer (the originator bank can raise it for fraud within 10 banking business days of execution; after that only a Request for Recall by the Originator, up to 13 months, which the beneficiary bank may refuse). For a wire from a US bank: an international transfer of USD 50,000 or more, within 72 hours, with the SWIFT recall already raised, qualifies for the FBI IC3 Financial Fraud Kill Chain; file at ic3.gov with the bank's recall reference. Same call: freeze every pending payment to the supplier named in the thread until the bank details are verified by phone on a number from the contract, not the email. Why: the chance of recalling a transfer falls with every hour, and the attacker is watching the mailbox for exactly this call."
    critical: true
  - ord: 2
    time: "T+5–15 min"
    title: "Export first: hold the mailbox, dump the audit, capture rules and grants"
    why: "Litigation hold before any purge or reset, then export what rolls off: Entra sign-ins (30 days on P1/P2, 7 on the free tier), the Unified Audit Log for the user (180 days on Audit Standard, 1 year on Premium), a historical message trace (the live trace covers 10 days, the historical search 90), and the mailbox's rules, forwarding, delegates, folder permissions, OAuth grants, MFA methods and registered devices as they are now. Save the attacker's messages as.eml with full headers from both ends (victim's Sent Items and a recipient's inbox, via Content Search export) so Authentication-Results, Message-ID and Reply-To survive. Raise the mailbox audit age limit from its 90-day default; it only applies forward, so do it now. Native cmdlets only: the archived O365 investigation scripts ( DumpDelegatesandForwardingRules.ps1, RemediateBreachedAccount.ps1 ) depend on MSOnline and AzureAD, retired in 2025. Why: the creation times of the attacker's rules bound the access window, and once purged or reset they are gone as evidence."
    critical: true
  - ord: 3
    time: "T+10–20 min"
    title: "Sweep the tenant for the same pattern — before evicting"
    why: "Look for other mailboxes with forwarding or redirect rules, rules named or shaped like the ones you just captured, tenant transport rules created in the window, sign-ins from the attacker's IP, ASN or session, and internal recipients of the compromised mailbox's outbound mail during the window. Every mailbox this finds goes on the eviction list. If the sweep can't finish in this window, go broad: block the attacker's source in Conditional Access tenant-wide and revoke sessions for every internal recipient of the account's outbound mail. Why: attackers rarely take one mailbox, and the first eviction is the moment they learn to use the others."
    critical: true
  - ord: 4
    time: "T+20–35 min"
    title: "Evict every mailbox on the list in one pass"
    why: "For each mailbox, in this order: disable the account (no new tokens while you work), reset the password, revoke refresh tokens and sessions, then strip every channel the attacker could have added — inbox rules, forwarding, delegates, SendAs and SendOnBehalf, folder permissions, OAuth consent grants, MFA methods and registered devices added in the window (compare with the T+5–15 capture) — close the legacy protocols, verify at T+35–45 and again at T+2h and T+24h, and only then re-enable with a fresh MFA enrolment from a known-good device. All of it together, for every mailbox on the list, not one channel per hour. Attack disruption may already have disabled the user: check the Action center first. The full cmdlet sequence is in the Defender tab under Hunt & Act. Why: refresh tokens survive a password reset, access tokens already issued survive the revocation for 60–90 minutes, inbox rules and OAuth grants survive everything else, and any channel left live is how they come back."
    critical: true
  - ord: 5
    time: "T+35–45 min"
    title: "Verify the containment held — and book the re-checks"
    why: "No successful sign-in, token refresh or mailbox access for any evicted account after the revocation time. A clean result now is not proof: access tokens issued before the revocation keep working for 60–90 minutes (CAE-capable clients hold tokens up to 28 hours but receive the revocation within minutes), and OfficeActivity arrives in Sentinel about an hour late, so at T+45 the query cannot yet show a token that is still being used. Run it now to catch the obvious (a channel you forgot), then put the same query in the case at T+2h and T+24h; the T+24h run is the one that clears the account for re-enable. Anything after revocation means a channel was missed — usually a registered device, an app grant or the still-infected laptop — so widen the containment before moving on. Why: revocation that didn't hold looks exactly like revocation that did, until the logs have caught up."
    critical: true
  - ord: 6
    time: "T+45–60 min"
    title: "Scope what the attacker saw and sent"
    why: "Sent Items and Drafts for anything the attacker sent or left unsent (drafts never audit, so open the folder); the message ids from the MailItemsAccessed Bind records, joined to mail flow and widened with invoice, remittance, IBAN and bank-detail keywords, to list every payment thread the attacker knows (the stage 5 hunt); whether a planted Canarytoken (e.g. \"Wire Transfer Procedures.docx\") was opened; and, for every supplier in those threads, finance checks the vendor master for bank-detail changes in the last 90 days and freezes pending payments to that supplier until the details are verified by phone. On the attacker's messages, read the Authentication-Results header on the copy the recipient received (the.eml from T+5–15): it records the SPF, DKIM and DMARC verdicts the receiving server actually computed for that message, which is the evidence; a DNS lookup of the sending domain today is not. Check Reply-To and the envelope sender against the header From on the same copy. Why: what they sent decides who else must be warned; what they read decides whether this is a personal-data breach and which supplier gets paid next."
    critical: true
actions:
  - platform: "Defender XDR / Sentinel"
    label: "T+5–15 · Export"
    name: "Preserve the evidence before any purge or reset"
    tier: "destructive"
    tier_inferred: false
    why: "a litigation hold keeps the attacker's rules, drafts and the purged messages recoverable; the audit export outlives the 30-day Entra and advanced-hunting retention; the mailbox audit age limit is 90 days by default and only applies forward; a historical message trace is the only trace older than 10 days."
    how: "Exchange Online PowerShell and Microsoft Graph PowerShell. -SessionCommand ReturnLargeSet pages the UAL export in 5,000-record calls; repeat the call with the same -SessionId until it returns nothing. Save the attacker's messages as.eml with full headers from both the victim's Sent Items and a recipient's inbox (Content Search › export), so the Authentication-Results, Message-ID and Reply-To are preserved on both ends."
    body: |-
      Set-Mailbox -Identity <upn> -LitigationHoldEnabled $true
      Set-Mailbox -Identity <upn> -AuditLogAgeLimit 365
      Search-UnifiedAuditLog -StartDate (Get-Date).AddDays(-180) -EndDate (Get-Date) -UserIds <upn> `
        -SessionId "case<n>-ual" -SessionCommand ReturnLargeSet -ResultSize 5000 |
        Select-Object -ExpandProperty AuditData | Add-Content .\case<n>-ual.jsonl   # repeat until empty
      Start-HistoricalSearch -ReportTitle "case<n>-trace" -ReportType MessageTrace -StartDate (Get-Date).AddDays(-90) `
        -EndDate (Get-Date) -SenderAddress <upn> -NotifyAddress <your upn>
      Get-InboxRule -Mailbox <upn> | Export-Clixml .\case<n>-rules.xml
      Get-MgAuditLogSignIn -Filter "userPrincipalName eq '<upn>'" -All | Export-Csv .\case<n>-signins.csv
    attack: []
  - platform: "Defender XDR / Sentinel"
    label: "T+10–20 · Block"
    name: "Block the attacker for the whole tenant"
    tier: "destructive"
    tier_inferred: false
    why: "the lookalike domain and the attacker's sender reach every mailbox, not just the one you are evicting; blocking them tenant-wide stops the next message while you work."
    how: "Defender portal › Email & collaboration › Policies & rules › Threat policies › Tenant Allow/Block Lists. Keep the default 30-day expiry rather than -NoExpiration, so the block doesn't outlive the incident. Attacker sign-in IPs: Entra admin center › Conditional Access › Named locations, then a block policy for that location."
    body: |-
      New-TenantAllowBlockListItems -ListType Sender -Block -Entries "<lookalike-domain>","<attacker-sender>"
      New-TenantAllowBlockListItems -ListType Url -Block -Entries "<phishing-host>"
    attack: []
  - platform: "Defender XDR / Sentinel"
    label: "T+20–35 · Evict"
    name: "Disable, reset, revoke, strip every channel, verify, then re-enable: each mailbox on the list"
    tier: "destructive"
    tier_inferred: false
    why: "attack disruption may already have disabled the user (check the Action center first). The order matters: disable stops new tokens being issued while you work, the reset invalidates the password, the revocation kills refresh tokens, and only then are the rules, forwarding, permissions, OAuth grants, MFA methods and devices removed, so none of them re-opens the door before the others are shut. Native Exchange Online and Graph cmdlets only; the archived O365 investigation scripts depend on MSOnline and AzureAD, retired in 2025."
    how: "Incidents titled “BEC financial fraud attack launched from a compromised account (attack disruption)” may already have acted. Run the block below per account, for every account on the sweep list in the same pass. Re-enable only after the T+35–45 check and its re-runs, with a fresh MFA enrolment from a known-good device."
    body: |-
      # 1 Disable
      Update-MgUser -UserId <upn> -AccountEnabled:$false
      # 2 Reset the password (the user enrols a new one later from a known-good device)
      Update-MgUser -UserId <upn> -PasswordProfile @{ Password = "<random>"; ForceChangePasswordNextSignIn = $true }
      # 3 Revoke refresh tokens and sessions (issued access tokens live on until they expire)
      Revoke-MgUserSignInSession -UserId <upn>
      # 4 Rules, forwarding, delegates, SendAs, SendOnBehalf, folder permissions
      Get-InboxRule -Mailbox <upn> | Remove-InboxRule -Confirm:$false
      Set-Mailbox -Identity <upn> -ForwardingSmtpAddress $null -ForwardingAddress $null -DeliverToMailboxAndForward $false
      Get-MailboxPermission -Identity <upn> | Where-Object { -not $_.IsInherited -and $_.User -ne "NT AUTHORITY\SELF" } |
        ForEach-Object { Remove-MailboxPermission -Identity <upn> -User $_.User -AccessRights $_.AccessRights -Confirm:$false }
      Get-RecipientPermission -Identity <upn> | Where-Object { $_.Trustee -ne "NT AUTHORITY\SELF" } |
        ForEach-Object { Remove-RecipientPermission -Identity <upn> -Trustee $_.Trustee -AccessRights SendAs -Confirm:$false }
      Set-Mailbox -Identity <upn> -GrantSendOnBehalfTo $null
      Remove-MailboxFolderPermission -Identity "<upn>:\Inbox" -User <user added in the window> -Confirm:$false
      # 5 OAuth grants, MFA methods and devices added in the window (compare with the T+5-15 export)
      Get-MgUserOauth2PermissionGrant -UserId <upn> | ForEach-Object { Remove-MgOauth2PermissionGrant -OAuth2PermissionGrantId $_.Id }
      Get-MgUserAuthenticationMethod -UserId <upn>          # then the matching Remove-MgUserAuthentication*Method:
      Remove-MgUserAuthenticationPhoneMethod -UserId <upn> -PhoneAuthenticationMethodId <id>
      Remove-MgUserAuthenticationMicrosoftAuthenticatorMethod -UserId <upn> -MicrosoftAuthenticatorAuthenticationMethodId <id>
      Remove-MgUserAuthenticationSoftwareOathMethod -UserId <upn> -SoftwareOathAuthenticationMethodId <id>
      Remove-MgUserAuthenticationFido2Method -UserId <upn> -Fido2AuthenticationMethodId <id>
      Get-MgUserRegisteredDevice -UserId <upn> | ForEach-Object { Update-MgDevice -DeviceId $_.Id -AccountEnabled:$false }
      # 6 Close the legacy and sync protocols the attacker used (re-open what the user needs after re-enable)
      Set-CASMailbox -Identity <upn> -ActiveSyncEnabled $false -ImapEnabled $false -PopEnabled $false -SmtpClientAuthenticationDisabled $true
      # 7 Verify at T+35-45, T+2h and T+24h (stage 9 hunt), then
      Update-MgUser -UserId <upn> -AccountEnabled:$true
    attack:
      - "T1098.002"
      - "T1114.003"
  - platform: "Defender XDR / Sentinel"
    label: "T+20–35 · Evict"
    name: "Pull the attacker's mail from every mailbox"
    tier: "destructive"
    tier_inferred: false
    why: "the phishing and fraud messages are still sitting in recipients' inboxes; removing them across the tenant stops the next person acting on one. The litigation hold from T+5–15 keeps a recoverable copy."
    how: "Threat Explorer › All email › select the messages › Take action › Move or delete › Soft deleted items; for mail sent from the compromised mailbox also tick Delete sender's copy. Threat Explorer holds 30 days of mail flow. Older messages need a Compliance Search purge (Purview, eDiscovery Manager plus the Search And Purge role; 10 items per mailbox per action). Search-Mailbox is retired; do not reach for it."
    body: |-
      New-ComplianceSearch -Name "case<n>-purge" -ExchangeLocation All `
        -ContentMatchQuery 'from:"<attacker-sender>" AND received>=<yyyy-mm-dd>'
      Start-ComplianceSearch -Identity "case<n>-purge"
      Get-ComplianceSearch -Identity "case<n>-purge" | fl Status, Items     # wait for Completed, check the count
      New-ComplianceSearchAction -SearchName "case<n>-purge" -Purge -PurgeType SoftDelete
    attack:
      - "T1534"
  - platform: "Defender XDR / Sentinel"
    label: "T+20–35 · Device"
    name: "Block the stealer on every device"
    tier: "destructive"
    tier_inferred: false
    why: "if an infostealer took the cookie or password, the same file may be on other machines; a tenant-wide indicator blocks it everywhere, not just on the victim's laptop."
    how: null
    body: |-
      POST https://api.security.microsoft.com/api/indicators
      {"indicatorValue": "<sha256>", "indicatorType": "FileSha256", "action": "BlockAndRemediate",
       "title": "IR case #<n>: infostealer", "description": "BEC case #<n>", "expirationTime": "<UTC date>"}
    attack:
      - "T1555.003"
  - platform: "Defender XDR / Sentinel"
    label: "Hour 1–24 · Rebuild"
    name: "Isolate the victim's device, collect, then rebuild it"
    tier: "destructive"
    tier_inferred: false
    why: "isolation stops the stealer sending new credentials while Live Response still works for collection; the device is rebuilt afterwards, because a cleaned device you can't prove is clean keeps feeding the attacker."
    how: "Device page › Isolate device. Then Live Response: add Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df and Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d to the library, push them with putfile, run the snapshot with -Zip, start RESPONSE elevated for RAM, pagefile and triage files, and getfile the snapshot zip. A RAM image is too large for getfile; stage it to a share the isolated device may still reach, or collect it from the device by hand."
    body: |-
      POST https://api.security.microsoft.com/api/machines/{id}/isolate
      {"Comment": "IR case #<n>", "IsolationType": "Full"}
      # Live Response console:
      putfile Get-PersistenceSnapshot.ps1
      run Get-PersistenceSnapshot.ps1 -parameters "-Zip"
      putfile MagnetRESPONSEv172_Self_Extracting_Archive.exe
      getfile C:\<snapshot folder>\PersistenceSnapshot-<host>-<timestamp>.zip
    attack:
      - "T1555.003"
  - platform: "Defender XDR / Sentinel"
    label: "Ahead of time"
    name: "Sentinel playbook"
    tier: "write"
    tier_inferred: true
    why: "adding the BEC response tasks to the incident automatically keeps the one-pass eviction from being done channel by channel."
    how: "Content hub › SOAR essentials solution › Defender XDR BEC Playbook for SecOps-Tasks."
    body: ""
    attack: []
  - platform: "CrowdStrike Falcon"
    label: "T+5–35 · Identity"
    name: "Export, block and evict in Entra and Exchange"
    tier: "destructive"
    tier_inferred: false
    why: "the mailbox takeover lives in Entra and Exchange, not on the endpoint; the evidence export, the tenant-wide block and the one-pass eviction run there, for every mailbox on the sweep list."
    how: "Falcon doesn't export the UAL, block senders or revoke Entra sessions. Run the export (T+5–15), the tenant-wide block (T+10–20) and the native eviction sequence (T+20–35) from Respond; Falcon covers the devices."
