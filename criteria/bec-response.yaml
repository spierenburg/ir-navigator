    tier: "destructive"
    tier_inferred: false
    why: "browser history shows how the phishing page or download was reached, Prefetch and Amcache what ran and when, memory what was running; stopping the process first loses what was in memory."
    how: "Velociraptor's own artifacts cover the collection: Windows.Memory.Acquisition for RAM, Windows.KapeFiles.Targets (KapeTriage) for the triage files. Where the case needs the same persistence snapshot as the other tabs, run Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df with -Zip through Windows.System.PowerShell after staging it on the host, or Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d elevated from removable media."
    body: |-
      Windows.Memory.Acquisition
      Windows.KapeFiles.Targets        (KapeTriage = Y)
      Windows.Applications.Chrome.History
