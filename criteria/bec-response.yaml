  - id: "bec-response/splunk/s2-inbox-rules-and-mailbox-forwarding-created-or-ch"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Splunk"
    title: "Inbox rules and mailbox forwarding created or changed"
    why: "The rule's creation time and client IP bound the access window and give an attacker IP to pivot on. Rules made in Outlook desktop arrive as UpdateInboxRules with the IP in ClientIPAddress; cmdlet records (New-InboxRule, Set-InboxRule, Set-Mailbox) carry it in ClientIP with the target mailbox in ObjectId (UserId is whoever ran the cmdlet). Set-Mailbox only matters with a forwarding parameter."
    how: null
    fp: "Users make rules too. Attacker rules move mail to RSS Feeds, Archive or Deleted Items, delete it, or match on invoice, payment, bank or the attacker's own domain."
    query: |-
      sourcetype=o365:management:activity Workload=Exchange
        Operation IN ("New-InboxRule", "Set-InboxRule", "Enable-InboxRule", "UpdateInboxRules", "Set-Mailbox")
        (UserId="<upn>" OR MailboxOwnerUPN="<upn>" OR ObjectId="*<mailbox alias>*")
      | search NOT (Operation="Set-Mailbox" AND NOT Parameters{}.Name IN ("ForwardingSmtpAddress", "ForwardingAddress", "DeliverToMailboxAndForward"))
      | eval src_ip=coalesce(ClientIPAddress, ClientIP)
      | table _time Operation UserId ObjectId src_ip SessionId Parameters{}.Name Parameters{}.Value
    tested: null
    attack:
      - "T1114.003"
      - "T1564.008"
  - id: "bec-response/splunk/s2-permissions-transport-rules-auto-reply-junk-sett"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Splunk"
    title: "Permissions, transport rules, auto-reply, junk settings and deletions from the attacker's IP"
    why: "Delegate and SendAs permissions outlive a password reset; a transport rule is a forwarding rule the mailbox owner never sees; an auto-reply or junk-list entry hides the victim's replies; HardDelete and MoveToDeletedItems from the attacker's IP are the attacker cleaning the hijacked thread."
    how: null
    fp: "Deletions by the owner from the office IP are the user tidying up; keep the IP and SessionId filter. A FullAccess grant from an admin IP with a ticket is not the attacker."
    query: |-
      sourcetype=o365:management:activity Workload=Exchange
        (Operation IN ("Add-MailboxPermission", "Add-RecipientPermission", "Add-MailboxFolderPermission", "Set-MailboxFolderPermission",
          "UpdateFolderPermissions", "New-TransportRule", "Set-TransportRule", "Set-MailboxAutoReplyConfiguration",
          "Set-MailboxJunkEmailConfiguration", "HardDelete", "SoftDelete", "MoveToDeletedItems")
         OR (Operation="Set-Mailbox" AND Parameters{}.Name="GrantSendOnBehalfTo"))
      | eval src_ip=coalesce(ClientIPAddress, ClientIP)
      | search (UserId="<upn>" OR MailboxOwnerUPN="<upn>" OR ObjectId="*<mailbox alias>*" OR src_ip IN ("<ip1>", "<ip2>"))
      | table _time Operation UserId MailboxOwnerUPN ObjectId src_ip SessionId Parameters{}.Name Parameters{}.Value AffectedItems{}.Subject
    tested: null
    attack:
      - "T1098.002"
      - "T1070.008"
  - id: "bec-response/splunk/s2-oauth-consent-granted-in-the-window"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Rules"
    stage_ord: 2
    platform: "Splunk"
    title: "OAuth consent granted in the window"
    why: "An app the user consented to keeps reading mail through Graph after every reset and revocation; it is removed by deleting the grant. In the UAL feed the Entra operations carry a trailing full stop."
    how: null
    fp: "Teams add-ins, Adobe, Zoom and signature tools ask for Mail.Read legitimately; a multi-tenant app without publisher verification consented minutes after a foreign sign-in is the one to remove."
    query: |-
      sourcetype=o365:management:activity Workload=AzureActiveDirectory
        Operation IN ("Consent to application.", "Add OAuth2PermissionGrant.", "Add delegated permission grant.", "Add app role assignment grant to user.", "Add service principal.")
        (UserId="<upn>" OR Target{}.ID="*<upn>*")
      | table _time Operation UserId ActorIpAddress Target{}.ID ModifiedProperties{}.Name ModifiedProperties{}.NewValue
    tested: null
    attack:
      - "T1528"
      - "T1550.001"
  - id: "bec-response/splunk/s3-mailitemsaccessed-in-the-attacker-s-sessions-dow"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Reading"
    stage_ord: 3
    platform: "Splunk"
    title: "MailItemsAccessed in the attacker's sessions, down to the message ids"
    why: "Sync access means the whole folder counts as read; Bind access lists each message. Pivot on the SessionId from stage 1, not only the IP. More than 1,000 MailItemsAccessed records in 24 hours stops the logging for 24 hours (IsThrottled in OperationProperties): a gap in the window is a finding, not an all-clear."
    how: null
    fp: "The user's own Outlook and phone sync whole folders every few minutes; without the session or IP filter every message looks read."
    query: |-
      sourcetype=o365:management:activity Workload=Exchange Operation=MailItemsAccessed MailboxOwnerUPN="<upn>"
        (ClientIPAddress IN ("<ip1>", "<ip2>") OR SessionId IN ("<attacker session id>"))
      | spath output=access_type path=OperationProperties{}.Value
      | spath output=msg_ids path=Folders{}.FolderItems{}.InternetMessageId
      | spath output=folders path=Folders{}.Path
      | stats count min(_time) as first_seen max(_time) as last_seen values(ClientInfoString) as client
          values(access_type) as access_type values(folders) as folders values(msg_ids) as message_ids by ClientIPAddress SessionId
      | convert ctime(first_seen) ctime(last_seen)
    tested: null
    attack:
      - "T1114.002"
  - id: "bec-response/splunk/s4-mail-sent-as-the-user-and-mail-from-a-lookalike"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Impersonation"
    stage_ord: 4
    platform: "Splunk"
    title: "Mail sent as the user, and mail from a lookalike domain"
    why: "Everyone the attacker wrote to, from the real mailbox or a lookalike, has to be warned by phone before they act on it. Send, SendAs and SendOnBehalf records carry the subject and client IP (Audit Standard includes Send since 2024); recipients come from the message trace, and lookalikes are matched against a dnstwist list rather than one guessed domain. Reply-To is in neither source: read it from the.eml headers in a Content Search."
    how: null
    fp: "The user kept sending mail during the window; separate the attacker's sends by client IP and session from stage 1. Trim the dnstwist output of registered-but-parked domains your own staff mistype."
    query: |-
      sourcetype=o365:management:activity Workload=Exchange Operation IN ("Send", "SendAs", "SendOnBehalf") (MailboxOwnerUPN="<upn>" OR UserId="<upn>")
      | table _time Operation UserId ClientIPAddress SessionId Item.Subject Item.InternetMessageId
      // Recipients (message trace; field names are camelCase on o365:graph:messagetrace):
      sourcetype IN (o365:graph:messagetrace, o365:reporting:messagetrace) SenderAddress="<upn>" | table _time RecipientAddress Subject Status
      // Lookalikes writing to your people, from a dnstwist lookup file:
      sourcetype IN (o365:graph:messagetrace, o365:reporting:messagetrace)
      | eval sender_domain=lower(mvindex(split(SenderAddress, "@"), 1))
      | lookup dnstwist_<yourdomain>.csv domain as sender_domain OUTPUT domain as lookalike
      | where isnotnull(lookalike) | table _time SenderAddress RecipientAddress Subject Status
    tested: null
    attack:
      - "T1534"
      - "T1684.001"
      - "T1583.001"
  - id: "bec-response/splunk/s5-payment-and-bank-detail-threads-in-the-window-ra"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Payment request"
    stage_ord: 5
    platform: "Splunk"
    title: "Payment and bank-detail threads in the window, ranked by what the attacker read"
    why: "The payment request is a reply inside a thread the attacker already read. Match the message trace in the window against the message ids from the Bind records at stage 3, then widen with subject keywords; everything that comes back goes to finance by phone, attacker-read first."
    how: null
    fp: "A finance mailbox matches the keywords on most of its mail; attacker_read is the ranking, the keywords only widen the net. Attachments are not in the trace; a Content Search covers those."
    query: |-
      sourcetype IN (o365:graph:messagetrace, o365:reporting:messagetrace) (SenderAddress="<upn>" OR RecipientAddress="<upn>")
        earliest="<MM/DD/YYYY:HH:MM:SS first access>" latest="<MM/DD/YYYY:HH:MM:SS revocation>"
      | eval attacker_read=if(match(MessageId, "<id 1>|<id 2>"), 1, 0)
      | search attacker_read=1 OR Subject IN ("*invoice*", "*remittance*", "*payment*", "*wire*", "*IBAN*", "*bank details*", "*factuur*", "*betaling*", "*rekeningnummer*")
      | table _time SenderAddress RecipientAddress Subject attacker_read | sort -attacker_read _time
    tested: null
    attack:
      - "T1684.001"
      - "T1657"
  - id: "bec-response/splunk/s8-other-accounts-on-the-attacker-s-ips-the-same-ru"
