      endpoint.name = '<host>' AND event.type = 'Registry Value Modified'
        AND registry.keyPath contains:anycase ('\\CurrentVersion\\Run', '\\CurrentVersion\\RunOnce', '\\Winlogon', '\\Image File Execution Options')
      | columns event.time, registry.keyPath, registry.valueName, registry.value, src.process.name
      endpoint.name = '<host>' AND event.type = 'File Creation'
        AND (tgt.file.path contains:anycase '\\start menu\\programs\\startup\\' OR tgt.file.path matches "(?i)\\\\client32\\.(exe|ini)$" OR tgt.file.path matches "(?i)\\\\AppData\\\\.+\\.dll$")
