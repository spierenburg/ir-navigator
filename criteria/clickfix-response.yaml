  - id: "clickfix-response/crowdstrike/s2-the-pasted-command-from-the-run-dialog-the-explo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "CrowdStrike Falcon"
    title: "The pasted command, from the Run dialog, the Explorer address bar or a terminal"
    why: "This is the pasted command itself. Per-visitor obfuscation means the command and its URLs are your indicators, not a vendor hash. The strongest single signature is the trailing lure comment ( # I am not a robot, # reCAPTCHA Verification ID, # Ray ID, or a fake # C:\\...\\file.pdf in FileFix). A paste into an open PowerShell window runs in-process; the sensor's CommandHistory event records what was typed or pasted into a console."
    how: null
    fp: "Admin tooling, Intune remediation scripts and installers use -nop -w hidden -ep bypass from explorer.exe daily; the lure comment, a public URL and a non-technical user together are the hit. Exclude your management agents by parent image or signer, not by flag."
    query: |-
      #event_simpleName=ProcessRollup2
      | ParentBaseFileName=/^(explorer|windowsterminal|powershell|pwsh|cmd|conhost)\.exe$/i
      | ImageFileName=/\\(powershell|pwsh|cmd|mshta|curl|msiexec|certutil|bitsadmin|regsvr32|rundll32|wscript|cscript|conhost|finger|ssh)\.exe$/i
      | CommandLine=/http|-enc|-e |-ec |iex|invoke-expression|downloadstring|downloadfile|irm |iwr |-w hidden|-w 1|-nop|-ep bypass|-executionpolicy bypass|urlcache|-decode|\/transfer|--headless|proxycommand|\/i:http|scrobj|javascript:|frombase64string|#\s*(I am not a robot|reCAPTCHA|Ray ID|Verification|Cloudflare|robot|[A-Z]:\\\\.+\.(pdf|docx|txt))/i
      | table([@timestamp, ComputerName, UserName, ParentBaseFileName, ImageFileName, CommandLine])
      // Typed or pasted into an open console (Win+X, Terminal)
      #event_simpleName=CommandHistory
      | CommandHistory=/http|iex|irm |iwr |downloadstring|mshta|curl|certutil|bitsadmin|#\s*(I am not a robot|reCAPTCHA|Ray ID)/i
      | table([@timestamp, ComputerName, UserName, CommandHistory])
      // HTA save-as: a browser or Explorer launching a .hta from Downloads
      #event_simpleName=ProcessRollup2 ImageFileName=/\\mshta\.exe$/i
      | ParentBaseFileName=/^(chrome|msedge|firefox|brave|explorer)\.exe$/i | CommandLine=/\\Downloads\\|\.hta/i
      | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine])
      // RunMRU (Win+R) and TypedPaths (FileFix) are not ASEP keys, so there is no registry event: read them with RTR (Capture, below).
    tested: null
    attack:
      - "T1204.004"
      - "T1059.001"
      - "T1218.005"
