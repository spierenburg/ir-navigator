    why: "In this variant the pasted command is harmless on its own and the payload is the file the browser just saved; the pairing is the finding, and the file's Zone.Identifier stream holds the download URL."
    how: null
    fp: "Users run installers from Downloads all day. A hit matters when the download is a script, an archive or an.hta, or it was run from Run or a terminal rather than by double-click."
