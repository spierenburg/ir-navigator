  - platform: "Elastic / Wazuh"
    label: "T+10–20 · Capture"
    name: "Collect the command, the browser profile, memory and the persistence snapshot (response console)"
    tier: "write"
    tier_inferred: false
    why: "the pasted command and the URLs in it are your indicators; the browser profile says which accounts and sessions were on the host; ActivitiesCache.db keeps the clipboard text when RunMRU was wiped; Prefetch, Amcache, SRUM and the USN journal show what ran and how much it sent; the decoded stager and the stealer's config may only exist in memory."
    how: "upload puts a file on the host and execute runs it; stage Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df and Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d that way. Browser files are locked while the browser runs; copy them with execute first. Wazuh has no file retrieval; use an active-response script that copies the same list to a share. Also export the 30 days of Entra sign-ins for every user of the host ( Get-MgAuditLogSignIn ) before retention takes them."
    body: |-
      execute --command "reg export HKU\<SID>\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU C:\IR\runmru.reg"
      execute --command "reg export HKU\<SID>\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths C:\IR\typedpaths.reg"
      get-file --path "C:\Users\<user>\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt"
      get-file --path "C:\Users\<user>\Downloads\<file>"
      get-file --path "C:\Users\<user>\AppData\Local\ConnectedDevicesPlatform\<id>\ActivitiesCache.db"
      execute --command "cmd /c copy \"C:\Users\<user>\AppData\Local\Google\Chrome\User Data\Default\History\" C:\IR\ & copy \"C:\Users\<user>\AppData\Local\Google\Chrome\User Data\Default\Login Data\" C:\IR\ & copy \"C:\Users\<user>\AppData\Local\Google\Chrome\User Data\Default\Network\Cookies\" C:\IR\ & copy \"C:\Users\<user>\AppData\Local\Google\Chrome\User Data\Local State\" C:\IR\"
      get-file --path "C:\Users\<user>\AppData\Roaming\Mozilla\Firefox\Profiles\<profile>\places.sqlite"
      get-file --path "C:\Windows\System32\sru\SRUDB.dat"
      get-file --path "C:\Windows\appcompat\Programs\Amcache.hve"
      get-file --path "C:\Windows\Prefetch\<PAYLOAD>-<hash>.pf"
      upload --file Get-PersistenceSnapshot.ps1
      execute --command "powershell -ep Bypass -File C:\Windows\Temp\Get-PersistenceSnapshot.ps1 -Zip -OutputPath C:\IR"
      upload --file MagnetRESPONSEv172_Self_Extracting_Archive.exe
      execute --command "C:\Windows\Temp\MagnetRESPONSEv172_Self_Extracting_Archive.exe /accepteula /unattended /output:C:\IR /caseref:<n> /captureram /capturepagefile /capturevolatile /saveitems" --timeout 60m
      processes
    attack:
      - "T1204.004"
