# Source of truth for this playbook's IR criteria.
# Hand-edit freely. Re-run 'bun run build:index' after any change.
playbook: "clickfix-response"
title: "ClickFix Response"
platforms:
  - "Defender XDR / Sentinel"
  - "CrowdStrike Falcon"
  - "SentinelOne"
  - "Velociraptor"
  - "Splunk"
  - "Elastic / Wazuh"
scenarios:
  - id: "1"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Win+R (Run dialog)"
    indicators: "explorer.exe starting PowerShell, cmd, mshta, curl, certutil, bitsadmin or msiexec with a public URL and the trailing lure comment; a new RunMRU value."
    discriminator: "RunMRU holds the command, but only when the launch succeeded (a failed launch writes nothing) and only until the stager clears it — a wiped RunMRU on a host whose Timeline clipboard record holds the command is itself a finding. Block Win+R for non-technical users after the incident."
    attack: []
  - id: "2"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Win+X / Terminal"
    indicators: "Windows Terminal or PowerShell started by the user, then PowerShell itself fetching the stager (no new process for the paste), or mshta, curl or msiexec as children of powershell.exe; nothing in RunMRU."
    discriminator: "The paste runs inside the already-open shell, so the command is in the PowerShell history file ( ConsoleHost_history.txt ), in event 4104 (the decoded block) and in event 400's HostApplication, not in RunMRU and often not as a separate process. Detections written for an explorer.exe parent do not fire here."
    attack: []
  - id: "3"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "FileFix (Explorer address bar)"
    indicators: "the lure opens a file-picker or \"open file location\" prompt; explorer.exe starts PowerShell or cmd with a command line that ends in a fake path comment such as # C:\\Company\\Internal\\Policy.pdf; a new value under HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\TypedPaths, nothing in RunMRU."
    discriminator: "The user pastes into the File Explorer address bar, which executes commands the way Run does; the path at the end is padding so the visible part of the bar looks like a file. Collect TypedPaths and the clipboard record, and extend any Win+R detection that keys on RunMRU to TypedPaths."
    attack: []
  - id: "4"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Download-folder staging and HTA save-as"
    indicators: "a file created in Downloads by the browser, and minutes later a pasted command that only runs that local file; or mshta.exe started by chrome.exe, msedge.exe or explorer.exe on a.hta the lure told the user to \"save as\"."
    discriminator: "The command looks harmless, or there is no command at all; the payload is the downloaded file. Collect it and its Zone.Identifier stream, which records the URL it came from and the referrer (Sysmon 15 logs the same contents fleet-wide). In the HTA variant the parent of mshta.exe is the browser, not explorer.exe or a shell."
    attack: []
  - id: "5"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "macOS (Terminal)"
    indicators: "Terminal started by the user, then curl or bash -c fetching a script, osascript prompting for the password, a new binary under /tmp, ~/Library or /Users/Shared; Atomic Stealer (AMOS) is the usual payload."
    discriminator: "The pasted line is curl -fsSL <url> | bash or a base64 echo | base64 -d | sh. It is in ~/.zsh_history (written on shell exit, so collect after the user closes Terminal or read it from the EDR's process events), the stealer's osascript password dialog is in the process tree, and the Keychain, browser profiles and ~/.ssh are what it takes. Revoke and reset as for Windows; the Keychain password is the login password, so the reset is the Keychain rotation."
    attack: []
  - id: "6"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Linux"
    indicators: "a shell started by the user, then curl or wget piped to sh or bash, a new file under /tmp, /dev/shm or ~/.config, a new cron entry, systemd user unit or ~/.ssh/authorized_keys line."
    discriminator: "Rare, and aimed at developers and admins: the paste is a \"dependency fix\" or a fake CAPTCHA served to a Linux user agent. ~/.bash_history is written on exit; auditd execve records or the EDR's process events have it live. Run get-persistence-snapshot.sh 8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67 for cron, systemd, SSH keys, PAM, ld.so.preload and SUID in one pass, and --compare-to a clean host."
    attack: []
criteria:
  - id: "clickfix-response/defender/s1-which-page-served-the-lure-and-who-else-clicked"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Which page served the lure, and who else clicked it"
    why: "The lure URL is the durable indicator and the provenance question (SEO result, ad, compromised site, mail link) decides who else you report it to. UrlClickEvents only sees links in mail, Teams and Office; a search or ad lure leaves its trace in the browser's connections just before the paste."
    how: null
    fp: "Five minutes of browser traffic is ads, CDNs and telemetry; read it bottom-up from the paste time and stop at the first domain the user does not recognise. RemoteUrl is empty for many connections; fall back to RemoteIP and the proxy."
    query: |-
      // Mail or Teams link (Defender for Office 365 Safe Links; Workload says which)
      UrlClickEvents
      | where Timestamp > ago(30d) and Url has "<lure domain>"
      | project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, Workload, NetworkMessageId
      // What the browser reached in the five minutes before the paste on the reporting host
      DeviceNetworkEvents
      | where DeviceName == "<host>" and Timestamp between ((datetime(<paste time>) - 5m) .. datetime(<paste time>))
      | where InitiatingProcessFileName in~ ("chrome.exe","msedge.exe","firefox.exe","brave.exe") and isnotempty(RemoteUrl)
      | project Timestamp, RemoteUrl, RemoteIP, InitiatingProcessFileName
      | order by Timestamp asc
      // The referrer of anything the browser saved to Downloads (download-folder and HTA variants)
      DeviceFileEvents
      | where DeviceName == "<host>" and Timestamp > ago(7d) and FolderPath has @"\Downloads\" and isnotempty(FileOriginUrl)
      | project Timestamp, FileName, FileOriginUrl, FileOriginReferrerUrl, InitiatingProcessFileName
    tested: null
    attack:
      - "T1189"
      - "T1566.002"
  - id: "clickfix-response/defender/s2-the-pasted-command-from-the-run-dialog-the-explo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "The pasted command, from the Run dialog, the Explorer address bar or a terminal"
    why: "This is the pasted command itself. Per-visitor obfuscation means the command and its URLs are your indicators, not a vendor hash. The strongest single signature is the trailing lure comment ( # I am not a robot, # reCAPTCHA Verification ID, # Ray ID, or a fake # C:\\...\\file.pdf path in FileFix); the flags and LOLBins catch the rest. Win+R and FileFix start the child from explorer.exe; a paste into an already-open PowerShell window runs in-process, so there the evidence is the child it spawns, 4104 (next hunt) or the history file."
    how: null
    fp: "Admin tooling, Intune remediation scripts and installers use -nop -w hidden -ep bypass from explorer.exe daily; the lure comment, a public URL and a non-technical user together are the hit. Exclude your management agents by InitiatingProcessFileName or signer, not by flag."
    query: |-
      DeviceProcessEvents
      | where Timestamp > ago(7d)
      | where InitiatingProcessFileName in~ ("explorer.exe","windowsterminal.exe","powershell.exe","pwsh.exe","cmd.exe","conhost.exe")
      | where FileName in~ ("powershell.exe","pwsh.exe","cmd.exe","mshta.exe","curl.exe","msiexec.exe","certutil.exe","bitsadmin.exe",
                            "regsvr32.exe","rundll32.exe","wscript.exe","cscript.exe","conhost.exe","finger.exe","ssh.exe")
      | where ProcessCommandLine has_any ("http","-enc","-e ","-ec ","iex","invoke-expression","downloadstring","downloadfile","irm","iwr",
                                          "-w hidden","-w 1","-nop","-noprofile","-ep bypass","-executionpolicy bypass",
                                          "urlcache","-decode","/transfer","--headless","proxycommand","/i:http","scrobj","javascript:","frombase64string")
            or ProcessCommandLine matches regex @"(?i)#\s*(I am not a robot|reCAPTCHA|Ray ID|Verification|Cloudflare|robot|[A-Z]:\\[^""]+\.(pdf|docx|txt))"
      | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine
      // HTA save-as: the browser or Explorer launches a .hta the user just saved
      DeviceProcessEvents
      | where Timestamp > ago(7d) and FileName =~ "mshta.exe"
      | where InitiatingProcessFileName in~ ("chrome.exe","msedge.exe","firefox.exe","brave.exe","explorer.exe") and ProcessCommandLine has_any (@"\Downloads\", ".hta")
      | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, ProcessCommandLine
      // Win+R writes RunMRU and FileFix writes TypedPaths. Neither key is guaranteed to be in the curated set DeviceRegistryEvents records;
      // test on one host, and otherwise read them with Live Response (Capture, below).
      DeviceRegistryEvents
      | where Timestamp > ago(7d) and RegistryKey has_any (@"\Explorer\RunMRU", @"\Explorer\TypedPaths")
      | project Timestamp, DeviceName, RegistryKey, RegistryValueName, RegistryValueData
    tested: null
    attack:
      - "T1204.004"
      - "T1059.001"
      - "T1218.005"
  - id: "clickfix-response/defender/s2-download-folder-staging-a-browser-download-run-m"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Download-folder staging: a browser download run minutes later from a pasted command"
    why: "In this variant the pasted command is harmless on its own and the payload is the file the browser just saved; the pairing is the finding and FileOriginUrl on the download is the lure's download host."
    how: null
    fp: "Users run installers from Downloads all day. A hit matters when the download is a script, an archive or an.hta, the command came from Run or a terminal rather than a double-click, or DownloadUrl is not a vendor site."
    query: |-
      let dl = DeviceFileEvents
      | where Timestamp > ago(7d) and ActionType == "FileCreated" and FolderPath has @"\Downloads\"
      | where InitiatingProcessFileName in~ ("chrome.exe","msedge.exe","firefox.exe","brave.exe")
      | project DeviceName, DownloadedFile = FileName, DownloadUrl = FileOriginUrl, DlTime = Timestamp;
      DeviceProcessEvents
      | where Timestamp > ago(7d) and InitiatingProcessFileName in~ ("explorer.exe","windowsterminal.exe","powershell.exe","cmd.exe")
      | join kind=inner dl on DeviceName
      | where Timestamp between (DlTime .. (DlTime + 10m)) and ProcessCommandLine has DownloadedFile
      | project Timestamp, DeviceName, AccountName, DownloadedFile, DownloadUrl, FileName, ProcessCommandLine
    tested: null
    attack:
      - "T1204.004"
      - "T1204.002"
  - id: "clickfix-response/defender/s3-the-decoded-stager-4104-script-block-text-powers"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Stage 2"
    stage_ord: 3
    platform: "Defender XDR / Sentinel"
    title: "The decoded stager (4104 script-block text, PowerShellCommand) and LOLBin loaders from user paths"
    why: "The command line only shows the obfuscated outer layer. Script-block logging (event 4104) records the decoded text PowerShell actually ran, including the stage-2 URL; Windows writes 4104 at Warning level for suspicious blocks even when the policy is off. Advanced hunting carries a slimmer record of the cmdlets as PowerShellCommand events; the full 4104 text needs Sentinel with a DCR on the PowerShell/Operational channel."
    how: null
    fp: "Configuration-management and software-deployment agents run these cmdlets constantly; exclude them by InitiatingProcessCommandLine and keep the rest. A 4104 block over a few KB of base64 or [char] arithmetic is the stager even if every cmdlet in it looks ordinary."
    query: |-
      DeviceEvents
      | where Timestamp > ago(7d) and ActionType == "PowerShellCommand"
      | extend Command = tostring(parse_json(AdditionalFields).Command)
      | where Command has_any ("Invoke-WebRequest","Invoke-RestMethod","Invoke-Expression","DownloadString","DownloadFile","FromBase64String",
                               "Start-BitsTransfer","Expand-Archive","Add-MpPreference","Set-MpPreference","Start-Process")
      | project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessCommandLine, Command
      // Sentinel, PowerShell/Operational forwarded by a DCR: the decoded block itself
      Event
      | where TimeGenerated > ago(7d) and EventLog == "Microsoft-Windows-PowerShell/Operational" and EventID == 4104
      | extend ScriptBlockText = extract(@"<Data Name=""ScriptBlockText"">([\s\S]*?)</Data>", 1, EventData)
      | where ScriptBlockText has_any ("DownloadString","Invoke-WebRequest","iwr","irm","FromBase64String","-join","[char]","Add-MpPreference")
      | project TimeGenerated, Computer, ScriptBlockText
      // Loaders started from user-writable paths after the paste
      DeviceProcessEvents
      | where Timestamp > ago(7d)
      | where (FileName in~ ("mshta.exe","regsvr32.exe","rundll32.exe") and ProcessCommandLine has_any ("http", @"\AppData\", @"\Temp\", @"\Downloads\", @"\ProgramData\"))
           or (FileName in~ ("curl.exe","certutil.exe","bitsadmin.exe") and ProcessCommandLine has_any (@"\AppData\", @"\Temp\", @"\Downloads\", @"\ProgramData\", "-o ", "-decode", "/transfer"))
           or (FileName =~ "msiexec.exe" and ProcessCommandLine has_any ("http", @"\AppData\", @"\Temp\", @"\Downloads\"))
           or (FileName in~ ("powershell.exe","pwsh.exe") and ProcessCommandLine has "Add-MpPreference")
      | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine
    tested: null
    attack:
      - "T1059.001"
      - "T1105"
      - "T1218.005"
      - "T1027"
  - id: "clickfix-response/defender/s4-what-the-stager-left-behind-new-binaries-sideloa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Payload"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "What the stager left behind: new binaries, sideloaded DLLs and injection from user-writable paths"
    why: "Stealer, loader or RAT decides the rest of the response. Stealers run once from AppData or Temp and exit; loaders and RATs stay resident, sideload a DLL next to a signed binary, or inject into a legitimate process. NetSupport shows up as client32.exe with a client32.ini beside it; Lumma injects into BitLockerToGo.exe or more.com."
    how: null
    fp: "Teams, OneDrive, Zoom and other per-user installers live in AppData\\Local and update themselves; a signed Microsoft or vendor ProcessVersionInfoCompanyName with a matching product name is normal. Unsigned, no version info, a random name, or a signed binary whose DLL beside it is unsigned is the payload."
    query: |-
      DeviceProcessEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>)
      | where FolderPath has_any (@"\AppData\", @"\Temp\", @"\Downloads\", @"\ProgramData\", @"\Users\Public\")
      | summarize First = min(Timestamp), Runs = count(), Cmd = any(ProcessCommandLine), Parent = any(InitiatingProcessFileName)
          by FileName, FolderPath, SHA256, ProcessVersionInfoCompanyName, ProcessVersionInfoProductName
      | order by First asc
      // DLLs loaded from user-writable paths by binaries in user-writable paths (sideloading)
      DeviceImageLoadEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>)
      | where FolderPath has_any (@"\AppData\", @"\Temp\", @"\Downloads\", @"\ProgramData\") and FolderPath !endswith @"\System32\"
      | summarize Loads = count(), By = make_set(InitiatingProcessFileName) by FileName, FolderPath, SHA1
      // Injection into a legitimate process
      DeviceEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>) and ActionType == "CreateRemoteThreadApiCall"
      | project Timestamp, InitiatingProcessFileName, InitiatingProcessFolderPath, FileName, FolderPath
      // What Defender itself classified
      AlertInfo | where TimeGenerated > ago(7d) | join AlertEvidence on AlertId | where DeviceName == "<host>"
      | project TimeGenerated, Title, ThreatFamily, Category, FileName, SHA256
    tested: null
    attack:
      - "T1574.001"
      - "T1055"
      - "T1219"
  - id: "clickfix-response/defender/s5-browser-credential-stores-read-by-something-that"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Theft"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Browser credential stores read by something that is not the browser; the remote-debugging bypass"
    why: "Since Chrome 127 (App-Bound Encryption) a stealer cannot decrypt cookies by reading the files, so Lumma, StealC and SectopRAT start the browser themselves with --remote-debugging-port and ask it for the cookies. chrome.exe with that flag and a parent that is not explorer.exe or the browser is theft with few false positives. Copies of Login Data, Cookies, Local State, Firefox key4.db and logins.json outside the profile folder are the older method."
    how: null
    fp: "Developers and test automation (Selenium, Playwright, Puppeteer) start Chrome with --remote-debugging-port and --headless from node.exe, python.exe or an IDE; exclude those parents on developer hosts. A stealer that reads the files in place leaves no file event at all; absence here is not absence of theft, and the users who signed in on that host are treated as compromised regardless."
    query: |-
      DeviceProcessEvents
      | where Timestamp > ago(7d)
      | where FileName in~ ("chrome.exe","msedge.exe","brave.exe")
      | where ProcessCommandLine has_any ("--remote-debugging-port","--remote-debugging-pipe","--remote-allow-origins","--headless","--user-data-dir","--restore-last-session")
      | where InitiatingProcessFileName !in~ ("explorer.exe","chrome.exe","msedge.exe","brave.exe","svchost.exe","userinit.exe")
      | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessFolderPath, ProcessCommandLine
      // Profile files copied out of the profile (reads are not logged; only a copy or rename shows)
      DeviceFileEvents
      | where Timestamp > ago(7d) and ActionType in ("FileCreated","FileRenamed")
      | where FileName in~ ("Login Data","Cookies","Web Data","Local State","key4.db","logins.json","cookies.sqlite","places.sqlite","wallet.dat")
      | where FolderPath !has @"\User Data\" and FolderPath !has @"\Firefox\Profiles\"
      | project Timestamp, DeviceName, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessFolderPath
    tested: null
    attack:
      - "T1555.003"
      - "T1539"
      - "T1552.001"
  - id: "clickfix-response/defender/s6-outbound-connections-from-user-path-binaries-and"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Exfiltration"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Outbound connections from user-path binaries and script hosts after the paste"
    why: "A stealer uploads within minutes of running, usually to a plain HTTPS C2, a Telegram bot ( api.telegram.org ) or a Discord webhook; a loader's second connection is the next stage. The first connection after the paste from a process in AppData, Temp or a script host is the upload. DeviceNetworkEvents carries no byte counts; size and duration come from the proxy or firewall."
    how: null
    fp: "Teams, OneDrive, Slack and browser updaters in AppData\\Local talk to Microsoft, Slack and Google CDNs; exclude by signer or by destination ASN. Anything to a bare IP, a fresh domain, Telegram or a paste site from a process you cannot name is the upload."
    query: |-
      DeviceNetworkEvents
      | where DeviceName == "<host>" and Timestamp between (datetime(<paste time>) .. (datetime(<paste time>) + 2h))
      | where ActionType == "ConnectionSuccess" and RemoteIPType == "Public"
      | where InitiatingProcessFolderPath has_any (@"\AppData\", @"\Temp\", @"\Downloads\", @"\ProgramData\", @"\Users\Public\")
           or InitiatingProcessFileName in~ ("powershell.exe","pwsh.exe","mshta.exe","curl.exe","rundll32.exe","regsvr32.exe","msbuild.exe","regasm.exe","installutil.exe","bitlockertogo.exe","more.com")
      | summarize First = min(Timestamp), Connections = count(), Ports = make_set(RemotePort), Urls = make_set(RemoteUrl)
          by InitiatingProcessFileName, InitiatingProcessFolderPath, RemoteIP
      | order by First asc
    tested: null
    attack:
      - "T1041"
      - "T1567"
      - "T1071.001"
  - id: "clickfix-response/defender/s7-the-host-s-users-signing-in-from-new-ips-or-netw"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Session reuse"
    stage_ord: 7
    platform: "Defender XDR / Sentinel"
    title: "The host's users signing in from new IPs or networks"
    why: "Stolen cookies and passwords are used from the attacker's infrastructure, often days later after resale. A replayed cookie is a non-interactive sign-in with no MFA prompt, so query both tables. The window is bounded by the Entra retention (30 d on P1/P2, 7 d free) unless Sentinel keeps the tables longer; export the 30 days now (Capture, below) because resale takes time."
    how: null
    fp: "Mobile networks and VPN egress rotate IPs; a new IP in the same ASN and country is usually the user. A new ASN, a hosting provider, an impossible-travel pair, or a sign-in with an empty deviceId where the user's sessions always carry one is the replay."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where UserPrincipalName in~ ("<upn1>", "<upn2>") and ResultType == "0"
      | summarize FirstSeen = min(TimeGenerated), Count = count(), Apps = make_set(AppDisplayName), Interactive = countif(Type == "SigninLogs")
          by UserPrincipalName, IPAddress, AutonomousSystemNumber, tostring(DeviceDetail.deviceId)
      | order by FirstSeen asc
      // Non-Entra sessions: Google Workspace login audit (Admin console, Reporting > Audit > Login), Okta System Log (eventType user.session.start),
      // Slack Audit Logs (user_login), GitHub audit log (user.login), AWS CloudTrail ConsoleLogin. Same question: new IP or ASN after the paste.
    tested: null
    attack:
      - "T1550.004"
      - "T1078.004"
  - id: "clickfix-response/defender/s8-everything-that-survives-a-reboot-created-after"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Persistence"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Everything that survives a reboot, created after the paste"
    why: "Persistence means a loader or RAT, not only a stealer: this is a foothold, and the ransomware pre-encryption response applies. Look wider than Run keys: the startup folder, a task imported from XML, a WMI subscription, a new service, a DLL dropped beside a signed binary in AppData, and NetSupport's client32.exe with client32.ini under AppData\\Roaming."
    how: null
    fp: "Installers and updaters register tasks, services and Run values legitimately; keep only what was created after the paste time on that host, and anything whose target path is in AppData, Temp or ProgramData. For a full read-only baseline diff run Get-PersistenceSnapshot.ps1 (Capture, below)."
    query: |-
      DeviceRegistryEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>)
      | where RegistryKey has_any (@"\CurrentVersion\Run", @"\CurrentVersion\RunOnce", @"\Winlogon", @"\Explorer\Shell Folders", @"\Image File Execution Options")
      | project Timestamp, RegistryKey, RegistryValueName, RegistryValueData, InitiatingProcessFileName
      DeviceFileEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>) and ActionType == "FileCreated"
      | where FolderPath has @"\Start Menu\Programs\Startup\" or FileName in~ ("client32.exe","client32.ini") or (FolderPath has @"\AppData\" and FileName endswith ".dll")
      | project Timestamp, FolderPath, FileName, SHA256, InitiatingProcessFileName
      DeviceEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>)
      | where ActionType in ("ScheduledTaskCreated","ServiceInstalled","WmiBindEventFilterToConsumer")
      | project Timestamp, ActionType, InitiatingProcessFileName, InitiatingProcessCommandLine, AdditionalFields
      DeviceProcessEvents
      | where DeviceName == "<host>" and Timestamp > datetime(<paste time>)
      | where (FileName =~ "schtasks.exe" and ProcessCommandLine has_any ("/create", "/xml")) or (FileName =~ "sc.exe" and ProcessCommandLine has "create") or FileName =~ "client32.exe"
      | project Timestamp, FileName, ProcessCommandLine, InitiatingProcessFileName
    tested: null
    attack:
      - "T1547.001"
      - "T1053.005"
      - "T1546.003"
      - "T1543.003"
      - "T1574.001"
      - "T1219"
  - id: "clickfix-response/defender/s9-other-hosts-that-reached-the-lure-or-ran-the-sam"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Spread"
    stage_ord: 9
    platform: "Defender XDR / Sentinel"
    title: "Other hosts that reached the lure or ran the same command shape"
    why: "ClickFix pages sit on compromised sites and ads; everyone who visited the same page is a candidate victim, and anyone who pasted gets the same command shape with a different obfuscation. Run the stage-2 hunt fleet-wide without the host filter; this one adds the network side."
    how: null
    fp: "A lure on a compromised legitimate site means the domain alone is not proof; a visit to the site from a host with no stage-2 hit is a candidate, not a victim. Pair every network hit with the stage-2 process hunt before isolating."
    query: |-
      DeviceNetworkEvents
      | where Timestamp > ago(30d) and RemoteUrl has_any ("<lure domain>", "<payload domain>")
      | summarize FirstSeen = min(Timestamp), Hosts = dcount(DeviceName), Users = make_set(InitiatingProcessAccountName) by RemoteUrl
      DeviceFileEvents
      | where Timestamp > ago(30d) and (FileOriginUrl has_any ("<lure domain>", "<payload domain>") or FileOriginReferrerUrl has "<lure domain>")
      | summarize Hosts = make_set(DeviceName), Files = make_set(FileName) by FileOriginUrl
      UrlClickEvents
      | where Timestamp > ago(30d) and Url has "<lure domain>"
      | summarize Clicks = count(), Users = make_set(AccountUpn) by Url, ActionType
    tested: null
    attack:
      - "T1189"
      - "T1204.004"
  - id: "clickfix-response/crowdstrike/s1-which-page-served-the-lure"
    status: "active"
