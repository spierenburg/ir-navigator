  - id: "clickfix-response/sentinelone/s3-lolbin-loaders-from-user-paths-the-decoded-stage"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Stage 2"
    stage_ord: 3
    platform: "SentinelOne"
    title: "LOLBin loaders from user paths; the decoded stager lives in 4104 or memory"
    why: "Deep Visibility records process, file and network events, not PowerShell script-block text, so the decoded stager is read from Windows event 4104 in your SIEM (Splunk or Elastic tab), from the Storyline's child processes and file writes, or from memory (Capture, below). What the agent does see well is the loader the stager starts."
    how: null
    fp: "Configuration-management agents run these binaries from ProgramData legitimately; exclude by src.process.name. Files written to Temp or AppData\\Local within a minute of the paste are the stage-2 payload regardless of name."
    query: |-
      event.type = 'Process Creation'
        AND tgt.process.name in:anycase ('mshta.exe','regsvr32.exe','rundll32.exe','curl.exe','certutil.exe','bitsadmin.exe','msiexec.exe')
        AND tgt.process.cmdline contains:anycase ('http','\\appdata\\','\\temp\\','\\downloads\\','\\programdata\\','-decode','/transfer')
      | columns event.time, endpoint.name, src.process.name, tgt.process.cmdline, src.process.storyline.id
      // Everything the paste did, in one shot:
      src.process.storyline.id = '<storyline id from the stage-2 hit>'
      | columns event.time, event.type, src.process.name, tgt.process.name, tgt.process.cmdline, tgt.file.path, event.dns.request
