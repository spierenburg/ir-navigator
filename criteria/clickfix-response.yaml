  - id: "clickfix-response/velociraptor/s2-the-pasted-command-from-runmru-typedpaths-the-po"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "Velociraptor"
    title: "The pasted command, from RunMRU, TypedPaths, the PowerShell history and the clipboard cache"
    why: "Win+R leaves the command in RunMRU (only when the launch succeeded), FileFix leaves it in TypedPaths, a terminal paste in the PSReadLine history file, and every variant in Windows Timeline's ActivitiesCache.db clipboard records, which survive the stager wiping RunMRU."
    how: null
    fp: "PSReadLine history is every command the user ever typed; SearchStrings keeps it to the shapes above. An empty RunMRU on a host where the user says they used Win+R means either the launch failed (no entry is written) or the stager wiped it; the Timeline clipboard entry settles which."
    query: |-
      Hunt: Windows.Timeline.Registry.RunMRU        (Win+R)
        dateAfter  = <start of the window>
      Hunt: Windows.Registry.NTUser                 (FileFix: Explorer address bar)
        KeyGlob = Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\*
      Hunt: Windows.System.Powershell.PSReadline    (Win+X / Terminal)
        SearchStrings = http|iex|irm|iwr|downloadstring|mshta|curl|certutil|bitsadmin|I am not a robot|reCAPTCHA|Ray ID
        UploadFiles   = true
      Hunt: Windows.Forensics.Timeline              (ActivitiesCache.db: clipboard history; filter the notebook on the paste window)
    tested: null
    attack:
      - "T1204.004"
      - "T1059.001"
      - "T1115"
