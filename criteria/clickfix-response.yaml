  - id: "clickfix-response/sentinelone/s2-the-pasted-command-from-the-run-dialog-the-explo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "SentinelOne"
    title: "The pasted command, from the Run dialog, the Explorer address bar or a terminal"
    why: "This is the pasted command itself. Per-visitor obfuscation means the command and its URLs are your indicators, not a vendor hash. The strongest single signature is the trailing lure comment ( # I am not a robot, # reCAPTCHA Verification ID, # Ray ID, or a fake # C:\\...\\file.pdf in FileFix). Remember the namespace, src.* is the parent and tgt.* the child."
    how: null
    fp: "Admin tooling, Intune remediation scripts and installers use -nop -w hidden -ep bypass from explorer.exe daily; the lure comment, a public URL and a non-technical user together are the hit. Exclude your management agents by src.process.name or publisher, not by flag."
    query: |-
      event.type = 'Process Creation'
        AND src.process.name in:anycase ('explorer.exe','windowsterminal.exe','powershell.exe','pwsh.exe','cmd.exe','conhost.exe')
        AND tgt.process.name in:anycase ('powershell.exe','pwsh.exe','cmd.exe','mshta.exe','curl.exe','msiexec.exe','certutil.exe','bitsadmin.exe','regsvr32.exe','rundll32.exe','wscript.exe','cscript.exe','conhost.exe','finger.exe','ssh.exe')
        AND (tgt.process.cmdline contains:anycase ('http','-enc','-e ','-ec ','iex','invoke-expression','downloadstring','downloadfile','irm ','iwr ','-w hidden','-w 1','-nop','-ep bypass','-executionpolicy bypass','urlcache','-decode','/transfer','--headless','proxycommand','/i:http','scrobj','javascript:','frombase64string')
             OR tgt.process.cmdline matches "(?i)#\\s*(I am not a robot|reCAPTCHA|Ray ID|Verification|Cloudflare|robot|[A-Z]:\\\\.+\\.(pdf|docx|txt))")
      | columns event.time, endpoint.name, src.process.user, src.process.name, tgt.process.name, tgt.process.cmdline, src.process.storyline.id
      // HTA save-as
      event.type = 'Process Creation' AND tgt.process.name in:anycase ('mshta.exe')
        AND src.process.name in:anycase ('chrome.exe','msedge.exe','firefox.exe','brave.exe','explorer.exe')
      | columns event.time, endpoint.name, src.process.name, tgt.process.cmdline
      // Win+R writes RunMRU, FileFix writes TypedPaths (registry events, if the agent records these keys; confirm on one host)
      event.type = 'Registry Value Modified' AND registry.keyPath contains:anycase ('\\Explorer\\RunMRU', '\\Explorer\\TypedPaths')
      | columns event.time, endpoint.name, registry.keyPath, registry.valueName, registry.value
    tested: null
    attack:
      - "T1204.004"
      - "T1059.001"
      - "T1218.005"
