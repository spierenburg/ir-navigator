  - id: "clickfix-response/splunk/s1-which-page-served-the-lure-and-where-the-downloa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "Splunk"
    title: "Which page served the lure, and where the download came from"
    why: "The lure URL is the durable indicator and its provenance (search result, ad, compromised site, mail link) decides who else you report it to. Sysmon 22 has the browser's DNS; Sysmon 15 records the Zone.Identifier stream the browser writes on every download, including HostUrl and ReferrerUrl."
    how: null
    fp: "Five minutes of browser DNS is ads, CDNs and telemetry; read it bottom-up from the paste time and stop at the first domain the user does not recognise. Sysmon 15 only carries the stream contents when the config enables it for the stream."
    query: |-
      index=windows host="<host>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=22
        (Image="*\\chrome.exe" OR Image="*\\msedge.exe" OR Image="*\\firefox.exe" OR Image="*\\brave.exe")
        earliest="<paste time minus 5m>" latest="<paste time>"
      | table _time QueryName Image | sort _time
      // The download's origin (Sysmon 15, FileCreateStreamHash)
      index=windows host="<host>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=15 TargetFilename="*:Zone.Identifier"
      | rex field=Contents "HostUrl=(?<HostUrl>\S+)" | rex field=Contents "ReferrerUrl=(?<ReferrerUrl>\S+)"
      | table _time TargetFilename HostUrl ReferrerUrl Image
      // Mail links: Safe Links click records in the O365 input (Defender for Office 365), search the lure domain as free text in sourcetype=o365:management:activity.
    tested: null
    attack:
      - "T1189"
      - "T1566.002"
  - id: "clickfix-response/splunk/s2-the-pasted-command-from-the-run-dialog-the-explo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "Splunk"
    title: "The pasted command, from the Run dialog, the Explorer address bar or a terminal"
    why: "This is the pasted command itself. Per-visitor obfuscation means the command and its URLs are your indicators, not a vendor hash. The strongest single signature is the trailing lure comment ( # I am not a robot, # reCAPTCHA Verification ID, # Ray ID, or a fake # C:\\...\\file.pdf in FileFix). Event 400 in the classic Windows PowerShell log carries HostApplication, which is the full command line of the host that started PowerShell, and fires once per host start, so it is the stage-2 record for a Terminal paste rather than a noise source."
    how: null
    fp: "Admin tooling, Intune remediation scripts and installers use -nop -w hidden -ep bypass from explorer.exe daily; the lure comment, a public URL and a non-technical user together are the hit. Exclude your management agents by ParentImage, not by flag. If Sysmon is not deployed, Security 4688 with command-line auditing ( Process_Command_Line ) carries the same filter."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1
        (ParentImage="*\\explorer.exe" OR ParentImage="*\\WindowsTerminal.exe" OR ParentImage="*\\powershell.exe" OR ParentImage="*\\pwsh.exe" OR ParentImage="*\\cmd.exe" OR ParentImage="*\\conhost.exe")
        (Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\cmd.exe" OR Image="*\\mshta.exe" OR Image="*\\curl.exe" OR Image="*\\msiexec.exe" OR Image="*\\certutil.exe" OR Image="*\\bitsadmin.exe" OR Image="*\\regsvr32.exe" OR Image="*\\rundll32.exe" OR Image="*\\wscript.exe" OR Image="*\\cscript.exe" OR Image="*\\conhost.exe" OR Image="*\\finger.exe" OR Image="*\\ssh.exe")
      | regex CommandLine="(?i)http|-enc|-e |-ec |iex|invoke-expression|downloadstring|downloadfile|irm |iwr |-w hidden|-w 1|-nop|-ep bypass|-executionpolicy bypass|urlcache|-decode|/transfer|--headless|proxycommand|/i:http|scrobj|javascript:|frombase64string|#\s*(I am not a robot|reCAPTCHA|Ray ID|Verification|Cloudflare|robot|[A-Z]:\\\\.+\.(pdf|docx|txt))"
      | table _time host User ParentImage Image CommandLine
      // Win+R writes RunMRU, FileFix writes TypedPaths (Sysmon 13, if the config includes the keys)
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13 (TargetObject="*\\Explorer\\RunMRU\\*" OR TargetObject="*\\Explorer\\TypedPaths\\*")
      | table _time host TargetObject Details
      // Which host application ran PowerShell (Terminal paste vs script host)
      index=windows source="XmlWinEventLog:Windows PowerShell" EventCode=400
      | rex "HostApplication=(?<HostApplication>[^\r\n]+)" | rex "HostName=(?<HostName>[^\r\n]+)"
      | search HostApplication="*http*" OR HostApplication="*-enc*" OR HostApplication="*iex*" OR HostApplication="*hidden*" OR HostApplication="*bypass*"
      | table _time host HostName HostApplication
    tested: null
    attack:
      - "T1204.004"
      - "T1059.001"
      - "T1218.005"
  - id: "clickfix-response/splunk/s2-download-folder-staging-a-browser-download-run-m"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "Splunk"
    title: "Download-folder staging: a browser download run minutes later from a pasted command"
    why: "In this variant the pasted command is harmless on its own and the payload is the file the browser just saved; the pairing is the finding."
    how: null
    fp: "Users run installers from Downloads all day. A hit matters when the download is a script, an archive or an.hta, or the command came from Run or a terminal rather than a double-click."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" (EventCode=11 OR EventCode=1)
        ((EventCode=11 (Image="*\\chrome.exe" OR Image="*\\msedge.exe" OR Image="*\\firefox.exe" OR Image="*\\brave.exe") TargetFilename="*\\Downloads\\*")
         OR (EventCode=1 (ParentImage="*\\explorer.exe" OR ParentImage="*\\WindowsTerminal.exe" OR ParentImage="*\\powershell.exe" OR ParentImage="*\\cmd.exe") CommandLine="*\\Downloads\\*"))
      | transaction host maxspan=10m startswith="EventCode=11" endswith="EventCode=1"
      | table _time host TargetFilename ParentImage CommandLine
    tested: null
    attack:
      - "T1204.004"
      - "T1204.002"
  - id: "clickfix-response/splunk/s3-the-decoded-stager-4104-script-block-text-and-lo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Stage 2"
    stage_ord: 3
    platform: "Splunk"
    title: "The decoded stager (4104 script-block text) and loaders from user paths"
    why: "The command line only shows the obfuscated outer layer. Script-block logging (event 4104) records the decoded text PowerShell actually ran, including the stage-2 URL; Windows writes 4104 at Warning level for suspicious blocks even when the policy is off, so the query is worth running on tenants that never enabled it."
    how: null
    fp: "Configuration-management agents and signed vendor scripts produce 4104 blocks constantly; filter on the host and the paste window first. A block over a few KB of base64 or [char] arithmetic is the stager even if every cmdlet in it looks ordinary."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104
      | regex ScriptBlockText="(?i)DownloadString|Invoke-WebRequest|iwr |irm |FromBase64String|-join|\[char\]|Add-MpPreference|Start-BitsTransfer|Expand-Archive"
      | stats min(_time) as first_seen count values(ScriptBlockText) as blocks by host
      | convert ctime(first_seen)
      // Loaders from user-writable paths
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1
        (Image="*\\mshta.exe" OR Image="*\\regsvr32.exe" OR Image="*\\rundll32.exe" OR Image="*\\curl.exe" OR Image="*\\certutil.exe" OR Image="*\\bitsadmin.exe" OR Image="*\\msiexec.exe")
        (CommandLine="*http*" OR CommandLine="*\\AppData\\*" OR CommandLine="*\\Temp\\*" OR CommandLine="*\\Downloads\\*" OR CommandLine="*\\ProgramData\\*" OR CommandLine="*-decode*" OR CommandLine="*/transfer*")
      | table _time host User ParentImage Image CommandLine
    tested: null
    attack:
      - "T1059.001"
      - "T1105"
      - "T1218.005"
      - "T1027"
  - id: "clickfix-response/splunk/s4-what-the-stager-left-behind-new-binaries-sideloa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Payload"
    stage_ord: 4
    platform: "Splunk"
    title: "What the stager left behind: new binaries, sideloaded DLLs and injection from user-writable paths"
    why: "Stealer, loader or RAT decides the rest of the response. Stealers run once from AppData or Temp and exit; loaders and RATs stay resident, sideload a DLL next to a signed binary (Sysmon 7 with Signed=false ), or inject into a legitimate process (Sysmon 8). NetSupport is client32.exe with client32.ini beside it."
    how: null
    fp: "Teams, OneDrive, Zoom and other per-user installers live in AppData\\Local and update themselves; a known Company with a matching Product is normal. Empty version info, a random name, or a signed binary loading an unsigned DLL beside it is the payload."
    query: |-
      index=windows host="<host>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 earliest="<paste time>"
        (Image="*\\AppData\\*" OR Image="*\\Temp\\*" OR Image="*\\Downloads\\*" OR Image="*\\ProgramData\\*" OR Image="*\\Users\\Public\\*")
      | stats min(_time) as first_seen count values(CommandLine) as cmd values(ParentImage) as parent by Image Hashes Company Product OriginalFileName
      | convert ctime(first_seen) | sort first_seen
      // Sideloaded DLLs and injection
      index=windows host="<host>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=7 earliest="<paste time>"
        (ImageLoaded="*\\AppData\\*" OR ImageLoaded="*\\Temp\\*" OR ImageLoaded="*\\ProgramData\\*") Signed=false
      | stats count values(Image) as loaded_by by ImageLoaded Hashes
      index=windows host="<host>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=8 earliest="<paste time>"
      | table _time SourceImage TargetImage StartFunction
    tested: null
    attack:
      - "T1574.001"
      - "T1055"
      - "T1219"
  - id: "clickfix-response/splunk/s5-browser-credential-stores-read-by-something-that"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Theft"
    stage_ord: 5
    platform: "Splunk"
    title: "Browser credential stores read by something that is not the browser; the remote-debugging bypass"
    why: "Since Chrome 127 (App-Bound Encryption) a stealer cannot decrypt cookies by reading the files, so Lumma, StealC and SectopRAT start the browser themselves with --remote-debugging-port and ask it for the cookies. chrome.exe with that flag and a parent that is not explorer.exe or the browser is theft with few false positives."
    how: null
    fp: "Developers and test automation (Selenium, Playwright, Puppeteer) start Chrome with --remote-debugging-port from node.exe, python.exe or an IDE; exclude those parents on developer hosts. A stealer that reads the files in place leaves no file event; absence here is not absence of theft."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1
        (Image="*\\chrome.exe" OR Image="*\\msedge.exe" OR Image="*\\brave.exe")
        (CommandLine="*--remote-debugging-port*" OR CommandLine="*--remote-debugging-pipe*" OR CommandLine="*--remote-allow-origins*" OR CommandLine="*--headless*" OR CommandLine="*--user-data-dir*" OR CommandLine="*--restore-last-session*")
        NOT (ParentImage="*\\explorer.exe" OR ParentImage="*\\chrome.exe" OR ParentImage="*\\msedge.exe" OR ParentImage="*\\brave.exe" OR ParentImage="*\\svchost.exe" OR ParentImage="*\\userinit.exe")
      | table _time host User ParentImage CommandLine
      // Profile files copied out of the profile (Sysmon 11; reads are not logged)
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11
        (TargetFilename="*\\Login Data" OR TargetFilename="*\\Cookies" OR TargetFilename="*\\Web Data" OR TargetFilename="*\\Local State" OR TargetFilename="*\\key4.db" OR TargetFilename="*\\logins.json" OR TargetFilename="*\\cookies.sqlite" OR TargetFilename="*\\places.sqlite")
        NOT TargetFilename="*\\User Data\\*" NOT TargetFilename="*\\Firefox\\Profiles\\*"
      | table _time host Image TargetFilename
    tested: null
    attack:
      - "T1555.003"
      - "T1539"
      - "T1552.001"
  - id: "clickfix-response/splunk/s6-outbound-connections-from-user-path-binaries-and"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Exfiltration"
    stage_ord: 6
    platform: "Splunk"
    title: "Outbound connections from user-path binaries and script hosts after the paste"
    why: "A stealer uploads within minutes of running, usually to plain HTTPS, a Telegram bot or a Discord webhook; a loader's second connection is the next stage. Sysmon 3 names the process and destination; the byte count comes from the proxy or firewall index, joined on the host's IP and the minute."
    how: null
    fp: "Teams, OneDrive, Slack and browser updaters in AppData\\Local talk to Microsoft, Slack and Google CDNs; exclude by DestinationHostname. Anything to a bare IP, a fresh domain, Telegram or a paste site from a process you cannot name is the upload."
    query: |-
      index=windows host="<host>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=3 Initiated=true
        earliest="<paste time>" latest="<paste time plus 2h>"
        NOT (DestinationIp=10.0.0.0/8 OR DestinationIp=172.16.0.0/12 OR DestinationIp=192.168.0.0/16)
        (Image="*\\AppData\\*" OR Image="*\\Temp\\*" OR Image="*\\Downloads\\*" OR Image="*\\ProgramData\\*" OR Image="*\\Users\\Public\\*"
         OR Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\mshta.exe" OR Image="*\\curl.exe" OR Image="*\\rundll32.exe" OR Image="*\\regsvr32.exe" OR Image="*\\msbuild.exe" OR Image="*\\regasm.exe" OR Image="*\\installutil.exe" OR Image="*\\BitLockerToGo.exe" OR Image="*\\more.com")
      | stats min(_time) as first_seen count values(DestinationPort) as ports by Image DestinationIp DestinationHostname
      | convert ctime(first_seen) | sort first_seen
      // Bytes: join the proxy index on src_ip and _time; look for a single POST of tens of MB.
    tested: null
    attack:
      - "T1041"
      - "T1567"
      - "T1071.001"
  - id: "clickfix-response/splunk/s7-the-host-s-users-signing-in-from-new-ips-or-netw"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Session reuse"
    stage_ord: 7
    platform: "Splunk"
    title: "The host's users signing in from new IPs or networks"
    why: "Stolen cookies and passwords are used from the attacker's infrastructure, often days later after resale, and a replayed cookie is a non-interactive sign-in with no MFA prompt. Entra keeps 30 d on P1/P2 and 7 d free; your index keeps what the add-on pulled. Okta and Google Workspace have their own add-ons; same question, their field names."
    how: null
    fp: "Mobile networks and VPN egress rotate IPs; a new IP in the same ASN and country is usually the user. A new ASN, a hosting provider, or a non-interactive sign-in from an IP the interactive logs never show is the replay."
    query: |-
      sourcetype=azure:monitor:aad (category=SignInLogs OR category=NonInteractiveUserSignInLogs) user IN ("<upn1>", "<upn2>") properties.status.errorCode=0
      | stats min(_time) as first_seen count values(category) as kinds values(properties.appDisplayName) as apps by user src properties.autonomousSystemNumber
      | convert ctime(first_seen) | sort first_seen
      // Okta (Splunk Add-on for Okta Identity Cloud):  sourcetype="OktaIM2:log" eventType="user.session.start" actor.alternateId="<upn>" | stats min(_time) count by client.ipAddress client.geographicalContext.country
      // Google Workspace (Splunk Add-on for Google Workspace):  sourcetype="gws:reports:login" "<upn>" | stats min(_time) count by ipAddress
    tested: null
    attack:
      - "T1550.004"
      - "T1078.004"
  - id: "clickfix-response/splunk/s8-everything-that-survives-a-reboot-created-after"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Persistence"
    stage_ord: 8
    platform: "Splunk"
    title: "Everything that survives a reboot, created after the paste"
    why: "Persistence means a loader or RAT, not only a stealer: this is a foothold, and the ransomware pre-encryption response applies. Look wider than Run keys: the startup folder (Sysmon 11), a task imported from XML (4698 and the schtasks command line), a WMI subscription (Sysmon 19, 20, 21), a new service (System 7045), a DLL dropped beside a signed binary in AppData, and NetSupport's client32.ini."
    how: null
    fp: "Installers and updaters register tasks, services and Run values legitimately; keep only what was created after the paste time on that host, and anything whose target path is in AppData, Temp or ProgramData. Sysmon 19 to 21 need the WMI events in your Sysmon config."
    query: |-
      index=windows host="<host>" earliest="<paste time>" source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
        ((EventCode=13 (TargetObject="*\\CurrentVersion\\Run*" OR TargetObject="*\\Winlogon\\*" OR TargetObject="*\\Image File Execution Options\\*"))
         OR (EventCode=11 (TargetFilename="*\\Start Menu\\Programs\\Startup\\*" OR TargetFilename="*\\client32.ini" OR TargetFilename="*\\client32.exe" OR (TargetFilename="*\\AppData\\*" TargetFilename="*.dll")))
         OR EventCode=19 OR EventCode=20 OR EventCode=21
         OR (EventCode=1 ((Image="*\\schtasks.exe" (CommandLine="*/create*" OR CommandLine="*/xml*")) OR (Image="*\\sc.exe" CommandLine="*create*"))))
      | table _time EventCode Image TargetObject Details TargetFilename CommandLine
      index=windows host="<host>" earliest="<paste time>" (source="XmlWinEventLog:Security" EventCode=4698) OR (source="XmlWinEventLog:System" EventCode=7045)
      | table _time EventCode TaskName TaskContent ServiceName ImagePath SubjectUserName
    tested: null
    attack:
      - "T1547.001"
      - "T1053.005"
      - "T1546.003"
      - "T1543.003"
      - "T1574.001"
      - "T1219"
  - id: "clickfix-response/splunk/s9-other-hosts-that-resolved-the-lure-or-payload-do"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Spread"
    stage_ord: 9
    platform: "Splunk"
    title: "Other hosts that resolved the lure or payload domains, or ran the same command shape"
    why: "ClickFix pages sit on compromised sites and ads; everyone who visited the same page is a candidate victim, and anyone who pasted gets the same command shape with a different obfuscation. Run the stage-2 search without the host filter too."
    how: null
    fp: "A lure on a compromised legitimate site means the domain alone is not proof; pair every DNS hit with the stage-2 process hunt before isolating."
    query: |-
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=22
        (QueryName="*<lure domain>" OR QueryName="*<payload domain>")
      | stats min(_time) as first_seen dc(host) as hosts values(host) as host_list by QueryName
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 CommandLine="*<distinctive fragment of the pasted command>*"
      | stats values(User) as users by host CommandLine
    tested: null
    attack:
      - "T1189"
      - "T1204.004"
  - id: "clickfix-response/elastic/s1-which-page-served-the-lure"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Lure"
    stage_ord: 1
    platform: "Elastic / Wazuh"
    title: "Which page served the lure"
    why: "The lure URL is the durable indicator and its provenance (search result, ad, compromised site, mail link) decides who else you report it to. Elastic Defend records the browser's DNS; the full URL and the download's referrer come from the browser history (Capture, below) or the proxy."
    how: null
    fp: "Five minutes of browser DNS is ads, CDNs and telemetry; read it bottom-up from the paste time and stop at the first domain the user does not recognise. Cached names never appear; the browser history is the authoritative list."
    query: |-
      FROM logs-endpoint.events.network-*
      | WHERE host.name == "<host>" AND process.name IN ("chrome.exe","msedge.exe","firefox.exe","brave.exe") AND dns.question.name IS NOT NULL
      | WHERE @timestamp >= "<paste time minus 5m>" AND @timestamp <= "<paste time>"
      | KEEP @timestamp, dns.question.name, process.name
      | SORT @timestamp
      // Mail links: Microsoft 365 Defender integration, UrlClickEvents (Safe Links) where url.full contains the lure domain.
    tested: null
    attack:
      - "T1189"
      - "T1566.002"
  - id: "clickfix-response/elastic/s2-the-pasted-command-from-the-run-dialog-the-explo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Paste and run"
    stage_ord: 2
    platform: "Elastic / Wazuh"
    title: "The pasted command, from the Run dialog, the Explorer address bar or a terminal"
    why: "This is the pasted command itself. Per-visitor obfuscation means the command and its URLs are your indicators, not a vendor hash. The strongest single signature is the trailing lure comment ( # I am not a robot, # reCAPTCHA Verification ID, # Ray ID, or a fake # C:\\...\\file.pdf in FileFix). Event 400 ( HostApplication, mapped to process.command_line in the powershell dataset) fires once per PowerShell host start and names what started it, which separates a Terminal paste from a script host."
    how: null
    fp: "Admin tooling, Intune remediation scripts and installers use -nop -w hidden -ep bypass from explorer.exe daily; the lure comment, a public URL and a non-technical user together are the hit. Exclude your management agents by process.parent.executable or process.code_signature.subject_name, not by flag."
    query: |-
      process where event.type == "start" and
        process.parent.name : ("explorer.exe", "WindowsTerminal.exe", "powershell.exe", "pwsh.exe", "cmd.exe", "conhost.exe") and
        process.name : ("powershell.exe", "pwsh.exe", "cmd.exe", "mshta.exe", "curl.exe", "msiexec.exe", "certutil.exe", "bitsadmin.exe", "regsvr32.exe", "rundll32.exe", "wscript.exe", "cscript.exe", "conhost.exe", "finger.exe", "ssh.exe") and
        (process.command_line : ("*http*", "*-enc*", "*-e *", "*-ec *", "*iex*", "*invoke-expression*", "*downloadstring*", "*downloadfile*", "*irm *", "*iwr *",
                                 "*-w hidden*", "*-w 1*", "*-nop*", "*-ep bypass*", "*-executionpolicy bypass*", "*urlcache*", "*-decode*", "*/transfer*",
                                 "*--headless*", "*proxycommand*", "*/i:http*", "*scrobj*", "*javascript:*", "*frombase64string*")
         or process.command_line regex~ """.*#\s*(I am not a robot|reCAPTCHA|Ray ID|Verification|Cloudflare|robot|[A-Z]:\\.+\.(pdf|docx|txt)).*""")
      // HTA save-as
      process where event.type == "start" and process.name : "mshta.exe" and
        process.parent.name : ("chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "explorer.exe") and process.command_line : ("*\\Downloads\\*", "*.hta*")
      // Win+R writes RunMRU, FileFix writes TypedPaths
      registry where registry.path : ("*\\Explorer\\RunMRU\\*", "*\\Explorer\\TypedPaths\\*")
      // Which host application started PowerShell (event 400, classic Windows PowerShell log)
      any where event.dataset == "windows.powershell" and event.code == "400" and process.command_line : ("*http*", "*-enc*", "*iex*", "*hidden*", "*bypass*")
    tested: null
    attack:
      - "T1204.004"
      - "T1059.001"
      - "T1218.005"
  - id: "clickfix-response/elastic/s2-download-folder-staging-a-browser-download-run-m"
    status: "active"
    source: "landing-page@2026-10-10"
