    title: "Which page served the lure"
    why: "The lure URL is the durable indicator and its provenance (search result, ad, compromised site, mail link) decides who else you report it to. The sensor sees the browser's DNS lookups, not URLs; the full URL comes from the browser history (RTR, below) or the proxy."
    how: null
