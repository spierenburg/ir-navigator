  - id: "clickfix-response/sentinelone/s4-what-the-stager-left-behind-new-binaries-and-inj"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Payload"
    stage_ord: 4
    platform: "SentinelOne"
    title: "What the stager left behind: new binaries and injection from user-writable paths"
    why: "Stealer, loader or RAT decides the rest of the response. Stealers run once from AppData or Temp and exit; loaders and RATs stay resident, sideload a DLL next to a signed binary, or inject into a legitimate process. NetSupport is client32.exe with client32.ini beside it."
    how: null
    fp: "Teams, OneDrive, Zoom and other per-user installers live in AppData\\Local and update themselves; a known tgt.process.publisher with a matching displayName is normal. Empty publisher and a random name is the payload."
    query: |-
      endpoint.name = '<host>' AND event.type = 'Process Creation'
        AND tgt.process.image.path contains:anycase ('\\appdata\\','\\temp\\','\\downloads\\','\\programdata\\','\\users\\public\\')
      | group first = min(event.time), runs = count(), cmdlines = array_agg_distinct(tgt.process.cmdline) by tgt.process.image.path, tgt.process.publisher, tgt.process.displayName
      | sort first
      // NetSupport and sideloads
      endpoint.name = '<host>' AND (tgt.process.name in:anycase ('client32.exe') OR tgt.file.path contains:anycase ('\\client32.ini'))
      | columns event.time, event.type, tgt.process.name, tgt.file.path
      // The threat page (Threats > Storyline) names the family the engine classified; an unsigned binary with no displayName from Temp is the payload otherwise.
    tested: null
    attack:
      - "T1574.001"
      - "T1055"
      - "T1219"
  - id: "clickfix-response/sentinelone/s5-browser-credential-stores-read-by-something-that"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Theft"
    stage_ord: 5
    platform: "SentinelOne"
    title: "Browser credential stores read by something that is not the browser; the remote-debugging bypass"
    why: "Since Chrome 127 (App-Bound Encryption) a stealer cannot decrypt cookies by reading the files, so Lumma, StealC and SectopRAT start the browser themselves with --remote-debugging-port and ask it for the cookies. chrome.exe with that flag and a parent that is not explorer.exe or the browser is theft with few false positives."
    how: null
    fp: "Developers and test automation (Selenium, Playwright, Puppeteer) start Chrome with --remote-debugging-port from node.exe, python.exe or an IDE; exclude those parents on developer hosts. A stealer that reads the files in place leaves no file event; absence here is not absence of theft."
    query: |-
      event.type = 'Process Creation'
        AND tgt.process.name in:anycase ('chrome.exe','msedge.exe','brave.exe')
        AND tgt.process.cmdline contains:anycase ('--remote-debugging-port','--remote-debugging-pipe','--remote-allow-origins','--headless','--user-data-dir','--restore-last-session')
        AND !(src.process.name in:anycase ('explorer.exe','chrome.exe','msedge.exe','brave.exe','svchost.exe','userinit.exe'))
      | columns event.time, endpoint.name, src.process.user, src.process.name, src.process.image.path, tgt.process.cmdline
      // Profile files copied out of the profile (reads are not logged)
      event.type = 'File Creation'
        AND tgt.file.path matches "(?i)\\\\(Login Data|Cookies|Web Data|Local State|key4\\.db|logins\\.json|cookies\\.sqlite|places\\.sqlite)$"
        AND !(tgt.file.path contains:anycase ('\\user data\\','\\firefox\\profiles\\'))
      | columns event.time, endpoint.name, src.process.name, src.process.image.path, tgt.file.path
    tested: null
    attack:
      - "T1555.003"
      - "T1539"
      - "T1552.001"
  - id: "clickfix-response/sentinelone/s6-outbound-connections-from-user-path-binaries-and"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Exfiltration"
    stage_ord: 6
    platform: "SentinelOne"
    title: "Outbound connections from user-path binaries and script hosts after the paste"
    why: "A stealer uploads within minutes of running, usually to plain HTTPS, a Telegram bot or a Discord webhook; a loader's second connection is the next stage. The first outbound connection after the paste from a process in AppData, Temp or a script host is the upload. Byte counts come from the proxy or firewall."
    how: null
    fp: "Teams, OneDrive, Slack and browser updaters in AppData\\Local talk to Microsoft, Slack and Google CDNs; exclude by publisher or by destination. Anything to a bare IP, a fresh domain, Telegram or a paste site from a process you cannot name is the upload."
    query: |-
      endpoint.name = '<host>' AND event.type = 'IP Connect' AND event.network.direction = 'OUTGOING'
        AND (src.process.image.path contains:anycase ('\\appdata\\','\\temp\\','\\downloads\\','\\programdata\\','\\users\\public\\')
             OR src.process.name in:anycase ('powershell.exe','pwsh.exe','mshta.exe','curl.exe','rundll32.exe','regsvr32.exe','msbuild.exe','regasm.exe','installutil.exe','bitlockertogo.exe','more.com'))
      | group first = min(event.time), connections = count() by src.process.name, src.process.image.path, dst.ip.address, dst.port.number
      | sort first
      // Pair with event.type = 'DNS Resolved' on the same src.process.storyline.id for the hostname.
    tested: null
    attack:
      - "T1041"
      - "T1567"
      - "T1071.001"
  - id: "clickfix-response/sentinelone/s7-the-host-s-users-signing-in-from-new-ips-or-netw"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Session reuse"
    stage_ord: 7
    platform: "SentinelOne"
    title: "The host's users signing in from new IPs or networks"
    why: "Stolen cookies and passwords are used from the attacker's infrastructure, often days later after resale, and a replayed cookie is a sign-in without an MFA prompt. The agent does not see this; the Data Lake only has it if Entra, Okta or Google Workspace logs are ingested. Entra keeps 30 d on P1/P2 and 7 d free, so export the sign-ins now (Capture, below)."
    how: null
    fp: "Mobile networks and VPN egress rotate IPs; a new IP in the same ASN and country is usually the user. A new ASN, a hosting provider or an impossible-travel pair is the replay."
    query: |-
      // M365 / Entra field names differ per parser. Discover first:
      dataSource.name = '<entra_signin_source>' AND * contains '<upn>'
      | limit 1 | columns *
      // then group by the IP and ASN fields you found:
      dataSource.name = '<entra_signin_source>' AND * contains '<upn>'
      | group first = min(event.time), events = count() by <ip_field>, <asn_field>
      | sort first
      // Okta and Google Workspace sources: same shape, eventType user.session.start / login_success. No ingestion: ask the IdP's own console.
    tested: null
    attack:
      - "T1550.004"
      - "T1078.004"
  - id: "clickfix-response/sentinelone/s8-everything-that-survives-a-reboot-created-after"
