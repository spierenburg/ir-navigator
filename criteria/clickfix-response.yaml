  - id: "clickfix-response/velociraptor/s3-the-decoded-stager-from-script-block-logging-and"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Stage 2"
    stage_ord: 3
    platform: "Velociraptor"
    title: "The decoded stager from script-block logging, and loaders from user paths"
    why: "The command line only shows the obfuscated outer layer. Script-block logging (event 4104) records the decoded text PowerShell actually ran, including the stage-2 URL; Windows writes 4104 at Warning level for suspicious blocks even when the policy is off. Event 400 in the classic Windows PowerShell log names the host application that ran it, which separates a Terminal paste from a script host."
    how: null
    fp: "Configuration-management agents and signed vendor scripts produce 4104 blocks constantly; filter on the host and the paste window first. A block over a few KB of base64 or [char] arithmetic is the stager even if every cmdlet in it looks ordinary."
    query: |-
      Hunt: Windows.EventLogs.PowershellScriptblock
        SearchStrings = DownloadString|Invoke-WebRequest|iwr |irm |FromBase64String|-join|\[char\]|Add-MpPreference
      Hunt: Windows.EventLogs.EvtxHunter
        ChannelRegex = (?i)^Windows PowerShell$
        IdRegex      = ^400$
        IocRegex     = HostApplication=(?!.*(ServerRemoteHost|ConfigurationManager))
      Hunt: Windows.Analysis.EvidenceOfExecution   (Prefetch, Amcache, BAM: mshta, curl, certutil, msiexec, regsvr32 and anything from AppData or Temp)
    tested: null
    attack:
      - "T1059.001"
      - "T1105"
      - "T1218.005"
      - "T1027"
