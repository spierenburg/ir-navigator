      | TargetFileName=/\\Start Menu\\Programs\\Startup\\|\\client32\.(exe|ini)$|\\AppData\\.+\.dll$/i
      | table([@timestamp, ContextBaseFileName, TargetFileName])
      // WMI subscriptions and the full read-only diff: RTR  runscript -CloudFile="Get-PersistenceSnapshot" -CommandLine="-Zip"
