    title: "Everything that survives a reboot, created after the paste"
    why: "Persistence means a loader or RAT, not only a stealer: this is a foothold, and the ransomware pre-encryption response applies. Look wider than Run keys: the startup folder, a task imported from XML, a WMI subscription, a new service, a DLL dropped beside a signed binary in AppData, and NetSupport's client32.ini."
