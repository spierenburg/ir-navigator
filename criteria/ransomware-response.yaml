  - platform: "Linux / ESXi"
    label: "T+15–30 · Collect"
    name: "Copy the logs and take a memory-inclusive snapshot before anything else"
    tier: "write"
    tier_inferred: false
    why: "ESXi logs live on a ramdisk and are gone at reboot; vm-support bundles every log and configuration file with a manifest, and a VM snapshot with memory preserves the running state of each guest while the host stays up. On Linux and NAS, get-persistence-snapshot.sh 8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67 records every persistence location with hashes and package verification; AVML or LiME takes the memory. There is no RAM acquisition for the ESXi kernel itself; the per-VM snapshot is the memory evidence."
    how: "Everything below is read-only or additive. Write to a datastore or USB that the encryptor has not touched, and record the SHA256 of each output in the case."
    body: |-
      # ESXi
      vm-support -w /vmfs/volumes/<clean-datastore>/ir            # full log and config bundle, with manifest
      tar czf /vmfs/volumes/<clean-datastore>/ir/logs-$(hostname)-$(date -u +%Y%m%dT%H%MZ).tgz /var/run/log /etc/rc.local.d /etc/ssh
      for v in $(vim-cmd vmsvc/getallvms | awk 'NR>1{print $1}'); do vim-cmd vmsvc/snapshot.create $v "IR-<case>" "pre-response, with memory" 1 0; done
      sha256sum /vmfs/volumes/<clean-datastore>/ir/*
      # Linux / NAS
      mkdir -p /tmp/ir && curl -fsSLo /tmp/ir/gps.sh https://<evidence-server>/ir/get-persistence-snapshot.sh && echo "8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67  /tmp/ir/gps.sh" | sha256sum -c && sudo bash /tmp/ir/gps.sh --zip -o /tmp/ir/persistence
      sudo ./avml /tmp/ir/memory-$(hostname).lime && sha256sum /tmp/ir/memory-*.lime
      sudo tar czf /tmp/ir/logs-$(hostname).tgz /var/log /etc/cron* /etc/systemd /etc/ssh /root/.ssh /home/*/.ssh
      Velociraptor: Linux.Sys.BashShell (Command=<the lines above>) ; Linux.Search.FileFinder (SearchFilesGlob=/tmp/ir/**, Upload_File=Y)
    attack: []
  - platform: "Linux / ESXi"
    label: "T+15–30 · Stop"
    name: "Freeze the encryptor, keep the binary"
    tier: "destructive"
    tier_inferred: false
    why: "kill -STOP halts the process without destroying its memory, which may still hold the key; copy the binary out of /proc first because many encryptors delete themselves from disk. Kill it only after memory is captured."
    how: null
    body: |-
      # ESXi (busybox): find the writer, freeze it, keep the binary
      ps -c | grep -vE "vmx|hostd|vpxa" | head
      kill -STOP <pid>
      cp /proc/<pid>/exe /vmfs/volumes/<clean-datastore>/ir/encryptor.bin 2>/dev/null; sha256sum /vmfs/volumes/<clean-datastore>/ir/encryptor.bin
      # Linux / NAS
      kill -STOP <pid>; cp /proc/<pid>/exe /tmp/ir/encryptor.bin; sha256sum /tmp/ir/encryptor.bin
    attack:
      - "T1486"
  - platform: "Linux / ESXi"
    label: "T+15–30 · Isolate"
    name: "Close the shell, re-enter lockdown, cut the management path"
    tier: "destructive"
    tier_inferred: false
    why: "the attacker's path into ESXi is SSH or the shell they enabled; closing it and re-entering lockdown mode makes vCenter the only way in. Do this after the logs are copied: the commands themselves land in shell.log and you want the attacker's entries intact first. The NAS admin interface is isolated at the firewall or switch, not on the appliance."
    how: null
    body: |-
      vim-cmd hostsvc/disable_ssh
      vim-cmd hostsvc/disable_esx_shell
      vim-cmd hostsvc/disable_remote_tsm
      vim-cmd vimsvc/auth/lockdown_mode_enter
      esxcli network firewall ruleset set --ruleset-id sshServer --enabled false
      esxcli system settings advanced set -o /Config/HostAgent/plugins/hostsvc/esxAdminsGroup -s "IR-no-such-group"
      # Linux / NAS: Velociraptor Linux.Remediation.Quarantine on labelled clients; otherwise the switch port
    attack:
      - "T1021.004"
  - platform: "Linux / ESXi"
    label: "Hour 1–24 · Kill auth"
    name: "Rotate root, vCenter SSO and every account that reaches the management plane"
    tier: "destructive"
    tier_inferred: false
    why: "the credential they used is still valid until it is changed, and a root password reset on one host does not touch the others or vCenter. Rotate root on every host, reset administrator@vsphere.local with vdcadmintool on the VCSA, remove the AD group mapping, and change the NAS admin and every service account (backup proxy, monitoring) that can log in to these hosts. Then verify the new credentials work before the old sessions are killed, from a known-good workstation."
    how: null
    body: |-
      # every ESXi host
      esxcli system account set -i root -p '<new>' -c '<new>'
      esxcli system account list
      # VCSA: reset the SSO administrator
      /usr/lib/vmware-vmdir/bin/vdcadmintool          # option 3: Reset account password, administrator@vsphere.local
      # Linux / NAS
      passwd root; for u in $(awk -F: '$3>=1000 && $1!="nobody"{print $1}' /etc/passwd); do passwd -e $u; done
      find / -xdev -name authorized_keys -newermt "-<dwell> days" 2>/dev/null
    attack:
      - "T1078"
