    name: "Block the payload and C2 outside Velociraptor"
    tier: "destructive"
    tier_inferred: false
    why: "Velociraptor has no blocklist. The quarantine covers the clients you labelled; hosts you have not found yet need the hash blocked in your EDR or AV and the C2 blocked at the firewall."
    how: null
    body: ""
    attack: []
  - platform: "Velociraptor"
    label: "T+15–30 · Collect"
    name: "Collect before you stop anything"
    tier: "destructive"
    tier_inferred: false
    why: "memory, the process tree and persistence are what scope the rest of the estate; stopping or rebuilding first destroys them. Run these as a hunt over the same label. Full memory: Windows.Memory.Acquisition (WinPmem) is the native route; Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d adds the pagefile and triage files when you want one package for the IR firm. Persistence: Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df and get-persistence-snapshot.sh 8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67. The cleanest way to push a file is a custom artifact with a tools: entry (the server serves the binary and checks its hash); the quick way is Windows.System.PowerShell / Linux.Sys.BashShell with the URL of your evidence share, as below. Windows.Memory.ProcessDump takes ProcessRegex or PidRegex."
    how: null
    body: |-
      Windows.System.Pslist
      Windows.Network.NetstatEnriched
      Windows.System.TaskScheduler
      Windows.System.Services
      Windows.Sys.StartupItems
      Windows.Sysinternals.Autoruns
      Windows.Memory.Acquisition
      Windows.Memory.ProcessDump
      Windows.EventLogs.EvtxHunter
      Windows.System.PowerShell
        Command = Invoke-WebRequest https://<evidence-server>/ir/MagnetRESPONSEv172_Self_Extracting_Archive.exe -OutFile C:\IR\magnet.exe; if ((Get-FileHash C:\IR\magnet.exe).Hash -ne 'D315C63D1AD4B89E03C7688B29169E977C2ABC4559C23B9F6B2282F3C91A6C7D') { throw 'hash' }; Start-Process C:\IR\magnet.exe -ArgumentList '/accepteula /unattended /output:C:\IR\magnet /capturesystemfiles /captureram /capturepagefile' -Wait
      Windows.System.PowerShell
        Command = Invoke-WebRequest https://<evidence-server>/ir/Get-PersistenceSnapshot.ps1 -OutFile C:\IR\gps.ps1; C:\IR\gps.ps1 -Zip -OutputPath C:\IR\persistence
        StdoutUpload = Y
      Linux.Sys.BashShell
        Command = curl -fsSLo /tmp/gps.sh https://<evidence-server>/ir/get-persistence-snapshot.sh && echo "8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67  /tmp/gps.sh" | sha256sum -c && bash /tmp/gps.sh --zip -o /tmp/ir-persistence
      Linux.Search.FileFinder
        SearchFilesGlob = /tmp/ir-persistence*.tar.gz
        Upload_File = Y
    attack: []
  - platform: "Velociraptor"
    label: "T+15–30 · Stop"
    name: "Stop the running payload"
    tier: "destructive"
    tier_inferred: false
    why: "this stops execution and nothing more. The host is rebuilt from a known-good image."
    how: null
    body: |-
      Windows.System.PowerShell
        Command = Stop-Process -Id <pid> -Force
      Linux.Sys.BashShell
        Command = kill -STOP <pid>    (freeze rather than kill while memory is still being collected)
    attack:
      - "T1486"
  - platform: "Velociraptor"
