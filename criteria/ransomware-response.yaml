    name: "Collect through the EDR, and export the searches that scoped the case"
    tier: "write"
    tier_inferred: false
    why: "memory and persistence are collected with the EDR's push mechanism (Live Response, RTR, RemoteOps or Velociraptor tabs) using Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d, Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df and get-persistence-snapshot.sh 8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67. What Splunk owns is the timeline: export every search above as raw events before the index rolls (hot/warm retention is yours to check with | rest /services/data/indexes ), and freeze the buckets for the dwell window."
    how: null
