      #event_simpleName=ProcessRollup2
      | ImageFileName=/\\(adfind|sharphound|netscan|nltest|dsquery|advanced_ip_scanner[^\\]*)\.exe$/i
        or CommandLine=/trustdmp|domain_trusts|-collectionmethod|objectcategory=computer|samaccounttype=805306368|Get-DomainComputer|Get-NetSession|\/dclist/i
      | table([@timestamp, ComputerName, UserName, ImageFileName, CommandLine])
    tested: null
    attack:
      - "T1087.002"
      - "T1482"
      - "T1046"
      - "T1018"
  - id: "ransomware-response/crowdstrike/s4-credential-dumping-lsass-tools-ntds-dit-kerberoa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Privilege"
    stage_ord: 4
    platform: "CrowdStrike Falcon"
    title: "Credential dumping — LSASS tools, NTDS.dit, Kerberoasting"
    why: "A LSASS dump means every credential cached on that host is the attacker's; an NTDS copy is every hash in the domain. The sensor has no LSASS-handle event in the search index; Falcon raises its own Credential Access detections for handle-based dumping (including nanodump), so pair this query with the detections list. DCSync has no sensor event at all — Falcon Identity Protection alerts on it, otherwise 4662 on the DCs lives in your SIEM (Splunk or Elastic tab)."
    how: null
    fp: "Backup agents create shadow copies on schedule and some IFM media is legitimate; match account and time to the backup job. The LSASS and Kerberoast patterns have no legitimate use."
    query: |-
      #event_simpleName=ProcessRollup2
      | CommandLine=/comsvcs.*MiniDump|procdump.*lsass|sekurlsa|nanodump|lsassy|pypykatz|dumpert|handlekatz|mimikatz|taskmgr.*lsass/i
        or (ImageFileName=/\\ntdsutil\.exe$/i CommandLine=/ifm|create full/i)
        or (ImageFileName=/\\vssadmin\.exe$/i CommandLine=/create shadow/i)
        or CommandLine=/ntds\.dit|reg(\.exe)? save hklm\\system/i
        or CommandLine=/kerberoast|GetUserSPNs|Invoke-Kerberoast|asktgs/i
      | table([@timestamp, ComputerName, UserName, ImageFileName, CommandLine])
    tested: null
    attack:
      - "T1003.001"
      - "T1003.003"
      - "T1558.003"
  - id: "ransomware-response/crowdstrike/s5-one-account-or-source-reaching-many-hosts"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Lateral movement"
    stage_ord: 5
    platform: "CrowdStrike Falcon"
    title: "One account or source reaching many hosts"
    why: "Fan-out from one source is how the payload is staged; the source host and account are what to contain first."
    how: null
    fp: "DCs, vulnerability scanners, backup servers, SCCM and monitoring pollers reach dozens of hosts; exclude their source addresses and service accounts first."
    query: |-
      #event_simpleName=UserLogon
      | LogonType=3 or LogonType=10
      | groupBy([UserName, RemoteAddressIP4], function=[count(ComputerName, distinct=true, as=Targets), min(@timestamp, as=First), max(@timestamp, as=Last)])
      | Targets > 10
      | sort(Targets, order=desc)
    tested: null
    attack:
      - "T1021.001"
      - "T1021.002"
  - id: "ransomware-response/crowdstrike/s5-remote-execution-services-and-tasks-created-remo"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Lateral movement"
    stage_ord: 5
    platform: "CrowdStrike Falcon"
    title: "Remote execution — services and tasks created remotely, WMI, WinRM and Impacket"
    why: "ServiceStarted and ScheduledTaskRegistered carry ClientComputerName and RemoteAddressIP4 when the request came over the network, which is exactly the PsExec-clone and remote-task case. The second query catches WMI, WinRM and Impacket, which create no service."
    how: null
    fp: "SCCM, Intune and monitoring agents register services and tasks remotely on every host from the management server; exclude those RemoteAddressIP4 values. A random eight-letter or hex service name is the PsExec-clone signature."
    query: |-
      #event_simpleName=/^(ServiceStarted|ScheduledTaskRegistered)$/
      | RemoteAddressIP4=* RemoteAddressIP4!="127.0.0.1"
      | ServiceDisplayName=* or TaskName=*
      | groupBy([#event_simpleName, ServiceDisplayName, TaskName, RemoteAddressIP4, ClientComputerName], function=[count(aid, distinct=true, as=Hosts), collect([ImageFileName, CommandLine, TaskExecCommand], limit=3)])
      | sort(Hosts, order=desc)
      #event_simpleName=ProcessRollup2
      | (ParentBaseFileName=/^(wmiprvse|wsmprovhost)\.exe$/i FileName=/^(cmd|powershell|pwsh|rundll32|mshta)\.exe$/i)
        or (FileName=/^cmd\.exe$/i CommandLine=/\/Q \/c .*(ADMIN\$|\\\\127\.0\.0\.1\\|2>&1)/i)
      | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine])
    tested: null
    attack:
      - "T1569.002"
      - "T1053.005"
      - "T1047"
      - "T1021.006"
  - id: "ransomware-response/crowdstrike/s6-who-touched-the-backup-servers-the-veeam-console"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Recovery planes"
    stage_ord: 6
    platform: "CrowdStrike Falcon"
    title: "Who touched the backup servers; the Veeam console by user"
    why: "The backup server is a Windows host with a sensor, so logons to it and the Veeam console process are visible even when the backup product's own audit log is not. ESXi and vCenter run no sensor; their evidence is syslog in the SIEM or the host logs themselves (Linux / ESXi tab)."
    how: null
    fp: "Backup admins open the console daily, usually from the same workstation. A new user, a new source address, or the console on a host that is not the backup server is the lead; PowerCLI from a workstation that is not the virtualisation team's is the lead for ESXi."
    query: |-
      #event_simpleName=UserLogon
      | ComputerName=/^(vbr01|vbr-proxy01)$/i
      | LogonType=2 or LogonType=10 or LogonType=3
      | groupBy([ComputerName, UserName, RemoteAddressIP4, LogonType], function=[count(as=Logons), min(@timestamp, as=First)])
      | sort(First, order=asc)
      #event_simpleName=ProcessRollup2
      | FileName=/^(Veeam\.Backup\.Shell|Veeam\.Backup\.Manager|VeeamBackupShell|vmware-cmd|govc|vmrun)\.exe$/i
        or ImageFileName=/\\Veeam\.Backup\.PowerShell|\\VMware\.PowerCLI/i
      | groupBy([ComputerName, UserName, FileName], function=[count(as=Runs), min(@timestamp, as=First), collect([CommandLine], limit=3)])
    tested: null
    attack:
      - "T1078"
      - "T1490"
  - id: "ransomware-response/crowdstrike/s7-transfer-tools-cloud-storage-destinations-and-ar"
