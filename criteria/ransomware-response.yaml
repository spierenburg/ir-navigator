  - platform: "SentinelOne"
    label: "T+15–30 · Isolate"
    name: "Blocklist the payload hash for the whole tenant"
    tier: "destructive"
    tier_inferred: false
    why: "a global blocklist entry stops the payload on endpoints you have not found yet. The type must be black_hash; any other value creates an exclusion instead."
    how: null
    body: |-
      POST /web/api/v2.1/restrictions
      {"filter": {"tenant": true},
       "data": {"type": "black_hash", "sha256Value": "<sha256>",
                "osType": "windows", "description": "IR case #<n>"}}
    attack:
      - "T1486"
  - platform: "SentinelOne"
    label: "T+15–30 · Collect"
    name: "Collect before you stop anything"
    tier: "destructive"
    tier_inferred: false
    why: "mitigation kills and quarantines the payload; collect it, its persistence and memory first. Upload Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df and get-persistence-snapshot.sh 8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67 to the RemoteOps Script Library and run them against the affected group with the output set to Fetch. Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d is a binary: stage it on an internal share and have a RemoteOps PowerShell script copy it down and run it, as below. Verify the SHA256 on the host before running."
    how: "Fetch Files: ransom note, payload, event logs (Security, System, Sysmon). RemoteOps script (PowerShell) across the affected group, or Remote Shell on one host:"
    body: |-
      New-Item -ItemType Directory -Force C:\IR | Out-Null
      Copy-Item \\<evidence-share>\ir\MagnetRESPONSEv172_Self_Extracting_Archive.exe C:\IR\
      if ((Get-FileHash C:\IR\MagnetRESPONSEv172_Self_Extracting_Archive.exe).Hash -ne 'D315C63D1AD4B89E03C7688B29169E977C2ABC4559C23B9F6B2282F3C91A6C7D') { throw 'hash mismatch' }
      Start-Process C:\IR\MagnetRESPONSEv172_Self_Extracting_Archive.exe -ArgumentList '/accepteula /unattended /output:C:\IR\magnet /capturesystemfiles /captureram /capturepagefile' -Wait
      .\Get-PersistenceSnapshot.ps1 -Zip -OutputPath C:\IR\persistence
      Get-Process | Select-Object Id, ProcessName, Path, StartTime
      Get-NetTCPConnection -State Established | Select-Object LocalPort, RemoteAddress, RemotePort, OwningProcess
      Get-ScheduledTask | Where-Object State -ne 'Disabled' | Select-Object TaskName, TaskPath
    attack: []
  - platform: "SentinelOne"
    label: "T+15–30 · Stop"
    name: "Stop the payload; roll back only what you need"
    tier: "destructive"
    tier_inferred: false
    why: "kill and quarantine stop execution. Rollback restores files from VSS on Windows if the shadow copies survived. Neither makes the host trustworthy again: it is rebuilt from a known-good image."
    how: "Console: Threat › Mitigation › Kill, Quarantine (then Rollback if needed)."
    body: ""
    attack:
      - "T1486"
  - platform: "SentinelOne"
    label: "Day 1–7 · Scoped"
    name: "Reconnect one endpoint at a time, after the eradication gate"
    tier: "write"
    tier_inferred: true
    why: "reconnecting puts the host back on the network. Do it per endpoint, once it is rebuilt and the restore gate is met."
    how: null
    body: |-
      POST /web/api/v2.1/agents/actions/connect
      {"filter": {"ids": ["<agentId>"]}}
