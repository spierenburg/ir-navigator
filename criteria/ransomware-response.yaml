  - id: "ransomware-response/crowdstrike/s8-shadow-copy-boot-recovery-and-backup-catalog-del"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Impact preparation"
    stage_ord: 8
    platform: "CrowdStrike Falcon"
    title: "Shadow-copy, boot-recovery and backup-catalog deletion; security services stopped"
    why: "These run minutes before encryption. A hit with no encryption yet means contain now."
    how: null
    fp: "Patch cycles and DBAs stop SQL and backup services; a stop command across many hosts from one account, or delete shadows /all, is the finding."
    query: |-
      #event_simpleName=ProcessRollup2
      | CommandLine=/vssadmin.*delete.*shadows|vssadmin.*resize.*shadowstorage|shadowcopy.*delete|bcdedit.*(recoveryenabled|bootstatuspolicy)|wbadmin.*delete.*catalog|Win32_ShadowCopy.*Delete/i
        or CommandLine=/Set-MpPreference.*Disable|DisableRealtimeMonitoring|(net|sc)(\.exe)? (stop|config|delete) .*(WinDefend|Sense|MsMpSvc|CSFalconService|SentinelAgent|veeam|sql|vss|backup)/i
        or (ImageFileName=/\\taskkill\.exe$/i CommandLine=/sql|veeam|backup/i)
      | table([@timestamp, ComputerName, UserName, CommandLine])
      | sort(@timestamp, order=asc)
    tested: null
    attack:
      - "T1490"
      - "T1685"
      - "T1489"
  - id: "ransomware-response/crowdstrike/s9-ransomware-detections-and-ransom-note-creation"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Encryption"
    stage_ord: 9
    platform: "CrowdStrike Falcon"
    title: "Ransomware detections and ransom-note creation"
    why: "Falcon raises its own ransomware detections (tactic Impact); the process tree in the detection is patient zero's payload. The note name identifies the variant and its contents give the extortion channel."
    how: null
    fp: "Detections are already tuned; the search is to find hosts the detection did not fire on because the sensor was killed first. Treat every host in the note query as encrypted until proven otherwise."
    query: |-
      Endpoint security > Detections: filter Tactic = Impact, Technique = Data Encrypted for Impact; open the process tree.
      // Notes written across many hosts
      #event_simpleName=/^(NewScriptWritten|NewExecutableWritten)$/ or #event_simpleName=ProcessRollup2
      | FileName=/^(readme|restore|recover|decrypt|how_to|how-to|!!!|_readme|unlock)[^\\]*\.(txt|html?|hta)$/i
      | groupBy([FileName, ContextBaseFileName], function=[count(aid, distinct=true, as=Hosts), min(@timestamp, as=First)])
    tested: null
    attack:
      - "T1486"
  - id: "ransomware-response/sentinelone/s1-rdp-and-network-logons-from-public-addresses-fir"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Initial access"
    stage_ord: 1
    platform: "SentinelOne"
    title: "RDP and network logons from public addresses; first external logon per account"
    why: "Most ransomware cases start with a VPN or RDP logon on a valid account, or an unpatched edge device. The first external logon on the account later seen moving laterally dates the intrusion. VPN authentication itself is in the appliance or SIEM, not the agent."
    how: null
    fp: "A published RDP gateway or a NAT'd VPN concentrator shows one public address on every logon; exclude those hosts and that address. Hosting-provider addresses on a user account are the lead."
    query: |-
      event.type = 'Login' AND event.login.loginIsSuccessful = true
        AND event.login.type in ('REMOTE_INTERACTIVE','NETWORK')
        AND NOT (src.endpoint.ip.address matches '^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|127\\.)')
      | group First = min(event.time), Hosts = estimate_distinct(endpoint.name), Logons = count() by event.login.userName, src.endpoint.ip.address
      | sort - First
    tested: null
    attack:
      - "T1133"
      - "T1078"
  - id: "ransomware-response/sentinelone/s2-remote-access-and-tunnelling-tools-first-seen-pe"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Foothold"
    stage_ord: 2
    platform: "SentinelOne"
    title: "Remote-access and tunnelling tools, first seen per tool"
    why: "Operators install legitimate RMM tools for persistent access and tunnel through them when the EDR blocks their C2. A tool first seen in the last days, on few hosts, is the lead."
    how: null
    fp: "Helpdesk RMM is legitimate on every host; the lead is a second RMM product, or the house product on servers where helpdesk never connects. Filter on tgt.process.signedStatus and the install path your deployment uses."
    query: |-
      event.type = 'Process Creation' AND (tgt.process.name contains ('anydesk','screenconnect','atera','splashtop','teamviewer','rustdesk','meshagent','client32','simplehelp','syncro','tacticalrmm','ngrok','chisel','plink','ligolo','cloudflared','gost','frpc')
        OR tgt.process.cmdline contains ('--reverse','-R 0.0.0.0','tunnel run','client -connect'))
      | group First = min(event.time), Events = count(), Hosts = estimate_distinct(endpoint.name) by tgt.process.name
      | sort - First
    tested: null
    attack:
      - "T1219"
      - "T1572"
  - id: "ransomware-response/sentinelone/s2-beacon-indicators-hollow-rundll32-and-sentinelon"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Foothold"
    stage_ord: 2
    platform: "SentinelOne"
    title: "Beacon indicators — hollow rundll32 and SentinelOne's injection indicators"
    why: "Cobalt Strike, Brute Ratel and Sliver loaders run under rundll32.exe with no arguments or inject into a signed process. The agent's behavioural indicators flag the injection even when the loader is new; the story line gives the parent."
    how: null
    fp: "AV, DLP and performance agents inject from Program Files and are excluded by the path filter; anything from a user-writable path is the lead."
    query: |-
      event.type = 'Process Creation' AND tgt.process.name = 'rundll32.exe' AND tgt.process.cmdline matches 'rundll32(\\.exe)?"?\\s*$'
      | columns event.time, endpoint.name, src.process.name, src.process.cmdline
      indicator.category in ('Injection','Evasion') AND src.process.image.path contains ('\\Users\\','\\ProgramData\\','\\Temp\\')
      | group Hits = count(), Hosts = estimate_distinct(endpoint.name) by src.process.name, src.process.image.path, indicator.name
    tested: null
    attack:
      - "T1055"
      - "T1218.011"
  - id: "ransomware-response/sentinelone/s3-ad-and-network-reconnaissance-tools"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Discovery"
    stage_ord: 3
    platform: "SentinelOne"
    title: "AD and network reconnaissance tools"
    why: "AdFind, SharpHound and network scanners run days before encryption; they date the dwell time."
    how: null
    fp: "Admin jump hosts run nltest and dsquery daily; a user workstation running them, or any host running SharpHound, is the finding."
