    title: "Transfer tools, cloud-storage destinations and archive staging"
    why: "rclone to MEGA is still the most common path, but Dropbox, pCloud, Backblaze B2, Gofile and temp.sh are the alternates, and the data is usually archived with 7-Zip or WinRAR first. A hit makes this a data breach. The sensor has no byte counts; egress volume per host is a firewall or NetFlow question for the SIEM."
