  - platform: "Elastic / Wazuh"
    label: "T+15–30 · Isolate"
    name: "Blocklist the payload hash"
    tier: "destructive"
    tier_inferred: false
    why: "a blocklist entry stops the payload on endpoints you have not found yet. Apply it globally, not to one policy."
    how: "Console: Artifacts › Blocklist tab (the Blocklist page before 9.4) › Add blocklist entry › hash, Assignment: Global."
    body: ""
    attack:
      - "T1486"
  - platform: "Elastic / Wazuh"
    label: "T+15–30 · Collect"
    name: "Collect before you stop anything"
    tier: "destructive"
    tier_inferred: false
    why: "the running process and the note identify the payload and the variant; killing first loses them. Full memory: Magnet RESPONSE 1.7.2 d315c63d1ad4b89e03c7688b29169e977c2abc4559c23b9f6b2282f3c91a6c7d. Persistence: Get-PersistenceSnapshot.ps1 a9534865f9e8e7b1f5077b4e1cfd8c29e7e32f6e9e49a4918ce4f8fb713e64df on Windows, get-persistence-snapshot.sh 8fe386a7d6ebd50225b04ad83581ee3e5d504a10a4263253b5a11b8a61eeca67 on Linux. upload pushes a file from your workstation to the host; execute runs it with cmd.exe (Windows) or bash (Linux); get-file brings the output back. execute and upload need the matching response-action privileges on the Kibana role."
    how: "In the Elastic response console:"
    body: |-
