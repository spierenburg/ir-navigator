  - id: "ransomware-response/velociraptor/s1-first-external-rdp-logon-per-account-ssh-logins"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · Initial access"
    stage_ord: 1
    platform: "Velociraptor"
    title: "First external RDP logon per account; SSH logins on Linux"
    why: "The first external logon on the account later seen moving laterally dates the intrusion. The RDP artifact parses Security 4624/4625 type 10, the TerminalServices 1149 and LocalSessionManager 21/25 logs together; the VPN appliance itself is in your SIEM."
    how: null
    fp: "A published RDP gateway or a NAT'd VPN concentrator shows one public address on every logon; filter it with UserNameWhitelist and the gateway host. Hosting-provider addresses on a user account are the lead."
    query: |-
      Hunt: Windows.EventLogs.RDPAuth
        SourceIPRegex = ^(?!10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)
        DateAfter     = <start of the window>
      Hunt: Linux.Syslog.SSHLogin   (accepted logins by user and source, from auth.log / secure)
    tested: null
    attack:
      - "T1133"
      - "T1078"
  - id: "ransomware-response/velociraptor/s2-remote-access-and-tunnelling-tools-first-seen-pe"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · Foothold"
    stage_ord: 2
    platform: "Velociraptor"
    title: "Remote-access and tunnelling tools, first seen per tool; Cobalt Strike configs in memory"
    why: "Operators install legitimate RMM tools for persistent access and tunnel through them when the EDR blocks their C2. Prefetch dates the first run even after the binary is deleted; the Cobalt Strike carver finds beacon configuration in running processes and gives the C2 address."
    how: null
    fp: "Helpdesk RMM is legitimate on every host; the lead is a second RMM product, or the house product on servers where helpdesk never connects. The carver scans every svchost.exe; it is slow on busy servers, so run it against the labelled hosts rather than the fleet."
    query: |-
      Hunt: Windows.System.Pslist
        ProcessRegex = (?i)anydesk|screenconnect|atera|splashtop|teamviewer|rustdesk|meshagent|client32|simplehelp|syncro|tacticalrmm|ngrok|chisel|plink|ligolo|cloudflared|gost|frpc
      Hunt: Windows.Forensics.Prefetch
        binaryRegex  = (?i)anydesk|screenconnect|atera|splashtop|teamviewer|rustdesk|meshagent|client32|simplehelp|syncro|tacticalrmm|ngrok|chisel|plink|ligolo|cloudflared|gost|frpc
      Hunt: Windows.Carving.CobaltStrike
        ProcessRegex = (?i)rundll32|regsvr32|mshta|dllhost|werfault|notepad|svchost
      Hunt: Windows.EventLogs.EvtxHunter     (Sysmon 17/18 named pipes, if Sysmon is deployed)
        IocRegex = (?i)\\(msagent_[a-f0-9]{2}|postex_[a-f0-9]{4}|MSSE-\d+-server|status_\d+|mojo\.5688\.8052\.|DserNamePipe|SearchTextHarvester)
    tested: null
    attack:
      - "T1219"
      - "T1572"
      - "T1055"
  - id: "ransomware-response/velociraptor/s3-ad-and-network-reconnaissance-tools"
