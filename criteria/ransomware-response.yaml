    label: "T+15–30 · Isolate"
    name: "Quarantine every client in scope with one hunt"
    tier: "destructive"
    tier_inferred: false
    why: "a hunt runs the quarantine on every client with the label at once. The IPsec policy (Windows) or nftables table (Linux) leaves only DNS, DHCP and the Velociraptor server reachable, so collection keeps working."
    how: "Label the in-scope clients, then Hunt Manager › New Hunt › Include Condition: Match by label › artifact:"
    body: |-
      Windows.Remediation.Quarantine
      Linux.Remediation.Quarantine
    attack:
      - "T1489"
  - platform: "Velociraptor"
