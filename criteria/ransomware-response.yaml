  - id: "ransomware-response/sentinelone/s4-credential-dumping-lsass-handles-known-tools-ntd"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Privilege"
    stage_ord: 4
    platform: "SentinelOne"
    title: "Credential dumping — LSASS handles, known tools, NTDS.dit, Kerberoasting"
    why: "A LSASS dump means every credential cached on that host is the attacker's; an NTDS copy is every hash in the domain. The cross-process event sees the handle itself, which catches nanodump and renamed tools that the command-line patterns miss. DCSync has no agent event; 4662 on the DCs lives in your SIEM (Splunk or Elastic tab)."
    how: null
    fp: "AV and backup agents open LSASS from Program Files or System32 and are excluded; anything else opening LSASS from a user-writable path is a finding. Backup agents create shadow copies on schedule; match account and time to the job."
    query: |-
      event.type = 'Open Remote Process Handle' AND tgt.process.name = 'lsass.exe'
        AND NOT src.process.image.path contains ('\\Windows\\System32\\','\\Program Files')
      | group Opens = count(), First = min(event.time) by endpoint.name, src.process.name, src.process.image.path, src.process.image.sha256
      | sort - Opens
      event.type = 'Process Creation' AND (
           (tgt.process.cmdline contains 'comsvcs' AND tgt.process.cmdline contains 'MiniDump')
        OR (tgt.process.name contains 'procdump' AND tgt.process.cmdline contains 'lsass')
        OR tgt.process.cmdline contains ('sekurlsa','nanodump','lsassy','pypykatz','dumpert','handlekatz','mimikatz')
        OR (tgt.process.name = 'ntdsutil.exe' AND tgt.process.cmdline contains ('ifm','create full'))
        OR (tgt.process.name = 'vssadmin.exe' AND tgt.process.cmdline contains 'create shadow')
        OR tgt.process.cmdline contains ('ntds.dit','kerberoast','GetUserSPNs','Invoke-Kerberoast'))
      | columns event.time, endpoint.name, src.process.user, tgt.process.name, tgt.process.cmdline
    tested: null
    attack:
      - "T1003.001"
      - "T1003.003"
      - "T1558.003"
  - id: "ransomware-response/sentinelone/s5-one-account-or-source-reaching-many-hosts"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Lateral movement"
    stage_ord: 5
    platform: "SentinelOne"
    title: "One account or source reaching many hosts"
    why: "Fan-out from one source is how the payload is staged; the source host and account are what to contain first."
    how: null
    fp: "DCs, vulnerability scanners, backup servers, SCCM and monitoring pollers reach dozens of hosts; exclude their source addresses and service accounts first."
    query: |-
      event.type = 'Login' AND event.login.loginIsSuccessful = true AND event.login.type in ('NETWORK','REMOTE_INTERACTIVE')
      | group Targets = estimate_distinct(endpoint.name), First = min(event.time), Last = max(event.time) by event.login.userName, src.endpoint.ip.address
      | filter Targets > 10
      | sort - Targets
    tested: null
    attack:
      - "T1021.001"
      - "T1021.002"
  - id: "ransomware-response/sentinelone/s5-remote-execution-services-tasks-wmi-winrm-and-im"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Lateral movement"
    stage_ord: 5
    platform: "SentinelOne"
    title: "Remote execution — services, tasks, WMI, WinRM and Impacket"
    why: "PsExec is the minority. Most tooling installs a service with a random name, registers a task, or runs through WMI or WinRM; Impacket's wmiexec / smbexec leave a fixed cmd.exe /Q /c … \\\\127.0.0.1\\ADMIN$ shape. Each hit is a target host for the isolation list."
    how: null
    fp: "wmiprvse.exe spawning powershell.exe is also how SCCM and some RMMs run scripts; match the script path. The eight-letter name under Windows is the PsExec-clone signature."
    query: |-
      event.type = 'Process Creation' AND (
           (src.process.name in ('wmiprvse.exe','wsmprovhost.exe') AND tgt.process.name in ('cmd.exe','powershell.exe','pwsh.exe','rundll32.exe','mshta.exe'))
        OR (tgt.process.name = 'cmd.exe' AND tgt.process.cmdline contains '/Q /c' AND tgt.process.cmdline contains ('ADMIN$','\\127.0.0.1\\','2>&1'))
        OR (src.process.name = 'services.exe' AND tgt.process.name in ('psexesvc.exe','paexec.exe','csexec.exe','remcomsvc.exe'))
        OR (src.process.name = 'services.exe' AND tgt.process.image.path matches '\\\\Windows\\\\[A-Za-z]{8}\\.exe$'))
      | group Hosts = estimate_distinct(endpoint.name), First = min(event.time) by src.process.name, tgt.process.name, tgt.process.cmdline
      | sort - Hosts
    tested: null
    attack:
      - "T1569.002"
      - "T1053.005"
      - "T1047"
      - "T1021.006"
  - id: "ransomware-response/sentinelone/s6-who-touched-the-backup-servers-the-veeam-console"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Recovery planes"
    stage_ord: 6
    platform: "SentinelOne"
    title: "Who touched the backup servers; the Veeam console by user"
    why: "The backup server is a Windows host with an agent, so logons to it and the Veeam console process are visible even when the backup product's own audit log is not. ESXi and vCenter run no agent; their evidence is syslog in the SIEM or the host logs themselves (Linux / ESXi tab)."
    how: null
    fp: "Backup admins open the console daily from the same workstation. A new user, a new source address, or the console on a host that is not the backup server is the lead; PowerCLI from a workstation that is not the virtualisation team's is the lead for ESXi."
    query: |-
      event.type = 'Login' AND event.login.loginIsSuccessful = true AND endpoint.name in ('vbr01','vbr-proxy01')
      | group Logons = count(), First = min(event.time) by endpoint.name, event.login.userName, src.endpoint.ip.address, event.login.type
      | sort - First
      event.type = 'Process Creation' AND (tgt.process.name in ('Veeam.Backup.Shell.exe','Veeam.Backup.Manager.exe','govc.exe','vmrun.exe')
        OR tgt.process.cmdline contains ('Veeam.Backup.PowerShell','VMware.PowerCLI','Connect-VIServer'))
      | group Runs = count(), First = min(event.time) by endpoint.name, src.process.user, tgt.process.name
    tested: null
    attack:
      - "T1078"
      - "T1490"
  - id: "ransomware-response/sentinelone/s7-transfer-tools-cloud-storage-destinations-and-ar"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Exfiltration"
    stage_ord: 7
    platform: "SentinelOne"
    title: "Transfer tools, cloud-storage destinations and archive staging"
    why: "rclone to MEGA is still the most common path, but Dropbox, pCloud, Backblaze B2, Gofile and temp.sh are the alternates, and the data is usually archived with 7-Zip or WinRAR first. A hit makes this a data breach. Byte counts per host are a firewall or NetFlow question for the SIEM."
    how: null
    fp: "Corporate Dropbox or Backblaze agents resolve the same domains from every host; exclude by src.process.name. An admin account archiving with a password on a file server at night is the attacker."
    query: |-
      (event.type = 'Process Creation' AND (tgt.process.name contains ('rclone','megasync','megacmd','winscp','filezilla','restic')
          OR tgt.process.cmdline contains ('rclone','mega-put','--transfers','b2 upload','ftp://')
          OR (tgt.process.name in ('7z.exe','7za.exe','rar.exe','winrar.exe') AND tgt.process.cmdline contains ' a ' AND tgt.process.cmdline contains ('-p','-hp','-mhe','-r','-v'))))
        OR dns.request contains ('mega.nz','mega.io','mega.co.nz','dropbox.com','dropboxapi.com','pcloud.com','backblazeb2.com','backblaze.com','gofile.io','temp.sh','file.io','ufile.io','filetransfer.io','transfer.sh','put.io','storj.io','wasabisys.com')
      | columns event.time, endpoint.name, src.process.user, src.process.name, tgt.process.cmdline, dns.request
    tested: null
    attack:
      - "T1567.002"
      - "T1560.001"
      - "T1048"
  - id: "ransomware-response/sentinelone/s8-shadow-copy-boot-recovery-and-backup-catalog-del"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Impact preparation"
    stage_ord: 8
    platform: "SentinelOne"
    title: "Shadow-copy, boot-recovery and backup-catalog deletion; security services stopped"
    why: "These run minutes before encryption. A hit with no encryption yet means contain now."
    how: null
    fp: "Patch cycles and DBAs stop SQL and backup services; a stop command across many hosts from one account, or delete shadows /all, is the finding."
    query: |-
      event.type = 'Process Creation' AND (
           (tgt.process.name = 'vssadmin.exe' AND tgt.process.cmdline contains ('delete','resize'))
        OR (tgt.process.cmdline contains 'shadowcopy' AND tgt.process.cmdline contains 'delete')
        OR (tgt.process.name = 'bcdedit.exe' AND tgt.process.cmdline contains ('recoveryenabled','bootstatuspolicy'))
        OR (tgt.process.name = 'wbadmin.exe' AND tgt.process.cmdline contains 'catalog')
        OR tgt.process.cmdline contains ('Set-MpPreference','DisableRealtimeMonitoring')
        OR (tgt.process.name in ('net.exe','net1.exe','sc.exe') AND tgt.process.cmdline contains ('stop','config','delete') AND tgt.process.cmdline contains ('WinDefend','Sense','SentinelAgent','veeam','sql','vss','backup'))
        OR (tgt.process.name = 'taskkill.exe' AND tgt.process.cmdline contains ('sql','veeam','backup')))
      | columns event.time, endpoint.name, src.process.user, tgt.process.cmdline
    tested: null
    attack:
      - "T1490"
      - "T1685"
      - "T1489"
  - id: "ransomware-response/sentinelone/s9-ransomware-indicators-and-ransom-note-creation"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Encryption"
    stage_ord: 9
    platform: "SentinelOne"
    title: "Ransomware indicators and ransom-note creation"
    why: "The agent's ransomware indicators name the writing process, which is patient zero's payload; the note name identifies the variant."
