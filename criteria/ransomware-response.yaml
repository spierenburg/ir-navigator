  - platform: "SentinelOne"
    label: "T+15–30 · Isolate"
    name: "Disconnect every agent in scope with one filter"
    tier: "destructive"
    tier_inferred: false
    why: "the disconnect action takes a filter — a list of agent IDs or a whole group — so the scope goes dark in one call. The management connection stays up."
    how: "Console: Endpoints › select the endpoints › Actions › Disconnect from network."
    body: |-
      POST /web/api/v2.1/agents/actions/disconnect
      {"filter": {"groupIds": ["<groupId>"]}}
