      event.type = 'Process Creation' AND (tgt.process.name contains ('adfind','sharphound','netscan','nltest','dsquery','advanced_ip_scanner')
        OR tgt.process.cmdline contains ('trustdmp','domain_trusts','-collectionmethod','objectcategory=computer','samaccounttype=805306368','Get-DomainComputer','Get-NetSession'))
      | columns event.time, endpoint.name, src.process.user, tgt.process.name, tgt.process.cmdline
    tested: null
