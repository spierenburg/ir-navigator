  - id: "identity-breach-response/elastic/s8-conditional-access-users-apps-credentials-federa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Tenant changes"
    stage_ord: 8
    platform: "Elastic / Wazuh"
    title: "Conditional Access, users, apps, credentials, federation, partners, transport rules and audit settings changed in the window"
    why: "A changed CA policy, a new federated domain, a GDAP partner or a credential on an existing privileged app is a back door that survives every per-user action on this page. A switched-off audit log is the point past which you are blind; date it."
    how: null
    fp: "CA-as-code pipelines and Entra Connect write policies and users on a schedule; match on actor, app and time, not on the operation alone."
    query: |-
      FROM logs-azure.auditlogs-*
      | WHERE @timestamp >= TO_DATETIME("<window start>") AND @timestamp <= TO_DATETIME("<window end>")
        AND (azure.auditlogs.operation_name LIKE "*Conditional Access policy*" OR azure.auditlogs.operation_name LIKE "*named location*"
          OR azure.auditlogs.operation_name LIKE "*security defaults*" OR azure.auditlogs.operation_name LIKE "*Certificates and secrets management*"
          OR azure.auditlogs.operation_name LIKE "*authorization policy*"
          OR azure.auditlogs.operation_name IN ("Add user", "Add application", "Add service principal", "Add service principal credentials",
              "Add owner to application", "Add owner to service principal", "Set federation settings on domain", "Set domain authentication",
              "Add unverified domain", "Verify domain", "Add partner to company"))
      | KEEP @timestamp, azure.auditlogs.category, azure.auditlogs.operation_name, azure.auditlogs.properties.initiated_by.user.userPrincipalName,
             azure.auditlogs.properties.initiated_by.app.displayName, azure.auditlogs.properties.initiated_by.user.ipAddress,
             azure.auditlogs.properties.target_resources.0.display_name
      | SORT @timestamp ASC
      // Exchange tenant settings
      FROM logs-o365.audit-*
      | WHERE @timestamp >= TO_DATETIME("<window start>") AND @timestamp <= TO_DATETIME("<window end>")
        AND o365.audit.Operation IN ("New-TransportRule", "Set-TransportRule", "Remove-TransportRule", "New-InboundConnector", "Set-InboundConnector",
            "Set-AdminAuditLogConfig", "Set-OrganizationConfig", "Set-AuthenticationPolicy", "Set-MailboxAuditBypassAssociation",
            "Add-RoleGroupMember", "New-ManagementRoleAssignment", "New-ApplicationAccessPolicy")
      | KEEP @timestamp, o365.audit.Operation, o365.audit.UserId, o365.audit.ClientIP, o365.audit.Parameters
      // Set-AdminAuditLogConfig with UnifiedAuditLogIngestionEnabled false: the UAL was switched off; your evidence ends there.
    tested: null
    attack:
      - "T1556.009"
      - "T1484.002"
      - "T1136.003"
      - "T1098.001"
  - id: "identity-breach-response/elastic/s9-token-use-after-the-revocation-time"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Elastic / Wazuh"
    title: "Token use after the revocation time"
    why: "revokeSignInSessions invalidates refresh tokens and session cookies; access tokens already issued live until they expire, 60–90 minutes by default and up to 28 hours on CAE-capable clients unless CAE pushed the revocation. A success after that window means containment missed a device, an app grant or a refresh token."
    how: null
    fp: "Successes inside the first 90 minutes from the user's own devices are cached access tokens expiring, not a missed channel."
    query: |-
      FROM logs-azure.signinlogs-*
      | WHERE @timestamp > TO_DATETIME("<revocation time, ISO 8601>")
        AND azure.signinlogs.properties.user_principal_name == "<upn>" AND event.outcome == "success"
      | STATS signins = COUNT(*), first = MIN(@timestamp), last = MAX(@timestamp)
          BY azure.signinlogs.category, source.ip, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.incoming_token_type
      | SORT first ASC
    tested: null
    attack:
      - "T1550.001"
  - id: "identity-breach-response/defender/s4-app-only-data-access-by-a-vendor-appid-the-scope"
    status: "active"
    source: "Microsoft Security Blog 2026-10-21 Storm-0940 (successful authentication does not necessarily indicate data access); Huntress ConnectWise/SkyKick advisory; distill 2026-10-25 of T-Minus365 video (t=11:48 Mail.Read app-only demo, t=35:06 Purview extension)"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 4 · Data access"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "App-only data access by a vendor AppId: the scope is every mailbox and site, not one user"
    why: "An application permission (Mail.Read, Files.Read.All, Sites.Read.All) with admin consent reaches every mailbox and site in the tenant without a signed-in user. The per-user data-access hunts (split MailItemsAccessed by the victim's ClientIP) do not frame it: here there is no victim account, only an AppId. Scope the reads by AppId and source IP across all mailboxes, and treat the breadth of mailboxes touched as the notifiability input. Graph activity logs answer this only if they were enabled before the window. Without them, fall back to MailItemsAccessed in the unified audit log filtered on the app id, keeping in mind the per-mailbox 1,000-records / 24h throttle (IsThrottled) under-states a bulk read. Microsoft's own caution: a successful sign-in by the app does not by itself show that data was accessed."
    how: null
    fp: "The vendor's own backup job reads every mailbox and site legitimately. Compare volume, endpoints and source ranges with its pattern before the window; calls that match that baseline, with none from the IoC IPs, are benign. A throttled MailItemsAccessed row (IsThrottled) means more was read than you can see, not less."
    query: |-
      // Example values from the ConnectWise advisory (Cloud Backup app id, IoC IP); replace with your vendor's app ids and IoCs.
      let vendorAppIds = dynamic(["506e08f9-6e9a-4da4-942b-a099a03644ae"]);
      let iocIPs = dynamic(["144.172.64.128"]);
      MicrosoftGraphActivityLogs
      | where TimeGenerated > ago(30d)
      | where AppId in (vendorAppIds) and isempty(UserId)
      | extend Workload = case(RequestUri has_any ("/messages","/mailFolders"), "mail", RequestUri has_any ("/drive","/drives","/sites"), "files", RequestUri has "/users", "directory", "other")
      // Target = the mailbox, site or drive the call touched; counts users, sites and drives alike.
      | extend Target = extract(@"/((?:users|sites|drives)/[^/?]+)", 1, RequestUri)
      | summarize Calls = count(), Targets = dcountif(Target, isnotempty(Target)), First = min(TimeGenerated), Last = max(TimeGenerated) by AppId, IPAddress, Workload, IsIoC = IPAddress in (iocIPs)
      | order by IsIoC desc, Calls desc
      // No MicrosoftGraphActivityLogs for the window? An empty table here means no logging, not no reads. Fall back to the unified audit log:
      //   One call returns at most 5,000 rows; page with a session id until a short page comes back.
      //   ReturnLargeSet stops at 50,000 rows per session, so split a bulk read into one session per day.
      //   $sid = [guid]::NewGuid().ToString(); $rows = @()
      //   do { $page = Search-UnifiedAuditLog -StartDate <day start> -EndDate <day end> -Operations MailItemsAccessed `
      //          -SessionId $sid -SessionCommand ReturnLargeSet -ResultSize 5000; $rows += $page } while ($page.Count -eq 5000)
      //   $rows | ? { ($_.AuditData | ConvertFrom-Json).AppId -in @('<vendor app id>') } |
      //     Group-Object { ($_.AuditData | ConvertFrom-Json).MailboxOwnerUPN } | Measure-Object   # mailboxes touched
    tested: null
    attack:
      - "T1114.002"
      - "T1530"
  - id: "identity-breach-response/defender/s8-individual-security-defaults-rule-turned-off-in"
    status: "active"
    source: "https://github.com/MicrosoftDocs/entra-docs/commit/bb7280b7cd3538710cff4da36c4fd818bb436af1 (security-defaults.md, individual protections preview + phased rollout, 2026-10-14); discovered via T-Minus365 YouTube"
    validated_at: "2026-10-25"
    supersedes: null
    stage: "Stage 8 · Tenant changes"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Individual Security Defaults rule turned off in the window (MFA for all users, legacy-auth block, device-code block)"
    why: "With individual Security Defaults protections, an attacker with Security Administrator, Conditional Access Administrator or Global Administrator rights can turn off one rule instead of the whole baseline. That is a much quieter change. Turning off \"Block legacy authentication\" reopens password spray against legacy endpoints that check the password before MFA. Turning off \"Require MFA for all users\" takes MFA away from every non-admin. Turning off \"Block device code flow\" reopens the device-code lure. Like a Conditional Access change, any of these survives every per-user action. The existing Stage 8 query filters only on OperationName containing \"security defaults\". Microsoft doesn't document what a single-rule toggle writes, and if it logs as a generic \"Update policy\" with Security Defaults as the target, that filter misses it, so this query also matches on the target. On P1/P2 tenants the same baseline is a Microsoft-managed \"Security Defaults policy plan\" inside Conditional Access, and changes there appear as Conditional Access policy operations."
    how: null
    fp: "Microsoft changes rule states itself during the phased rollout of individual protections; a Microsoft or service actor writing the policy inside the window is the rollout, not the attacker. An interactive admin turning a rule off from an unfamiliar IP, or close to the first malicious sign-in, is the finding. Unverified: the audit entry a single-rule toggle writes is undocumented while the feature is in private preview."
    query: |-
      AuditLogs
      | where TimeGenerated between (datetime(<window start>) .. datetime(<window end>))
      | where OperationName has "security defaults"
           or tostring(TargetResources) has_any ("Security Defaults", "identitySecurityDefaultsEnforcementPolicy")
      | project TimeGenerated, OperationName, Result, Actor=tostring(InitiatedBy.user.userPrincipalName),
                App=tostring(InitiatedBy.app.displayName), ActorIP=tostring(InitiatedBy.user.ipAddress),
                Target=tostring(TargetResources[0].displayName), Modified=TargetResources[0].modifiedProperties
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1556.009"
      - "T1685"
  - id: "identity-breach-response/proposed/bulk-intune-remote-wipe-retire-delete-by-an-admin-account-and-new-global-adminis"
    status: "active"
    source: "BleepingComputer via SOCRadar 'Stryker Cyberattack: What You Need to Know' (80k devices, 05:00-08:00 UTC 2026-03-11, new GA created); The Record 2026-03-16; Sygnia advisory 2026-03-22; Microsoft Tech Community 'Best practices for securing Microsoft Intune' 2026-03-14; Microsoft Learn 'Use Multi Admin Approval in Intune' (3-day expiry, no self-approval); discovered via T-Minus365 kJS2otskhYk (distill 2026-10-25, t=00:00:08, t=00:09:20)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 8 · Tenant changes"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Bulk Intune remote wipe/retire/delete by an admin account, and new Global Administrators created in the window"
    why: "Intune remote wipe is a destructive action with no malware involved: an attacker holding Global Administrator or Intune Administrator can erase the whole managed fleet from the console or through Graph. Stryker, 11 March 2026: about 80,000 devices were wiped between 05:00 and 08:00 UTC after an admin account was compromised and, per reporting, a new Global Administrator was created first. A burst of wipe, retire or delete remote actions from one admin, especially one created or elevated in the window, is the impact stage of an identity breach, not an endpoint incident. Contain at the role layer first (remove the attacker's role assignments, freeze role assignment, disable the new admin accounts), then enforce Multi Admin Approval on wipe/retire/delete. MAA alone does not stop an attacker who holds Global Administrator: they can create a second admin to approve their own requests (MAA only blocks self-approval), so it slows them down rather than ending access. Pending or expired MAA requests (they expire after 3 days) are evidence of attempts. Treat the attacker's own claims about scale and data theft as unverified: Handala claimed 200,000 systems and 50 TB, while reporting close to the investigation said about 80,000 devices and no indication of exfiltration."
    how: null
    fp: "Device refreshes, offboarding runs and lost-device workflows wipe or retire devices every day, often in batches from a service account or automation app. The finding is a burst far above the tenant's normal daily count from an interactive admin who is new, newly elevated or signing in from an unfamiliar IP, especially across device groups that are never wiped together. MSP technicians acting through delegated admin access wipe customer devices legitimately; match those against the ticket."
    query: |-
      // Destructive Intune remote actions in the window, per actor (needs the Intune diagnostic setting sending AuditLogs to the workspace)
      // Operation names and the Properties keys come from community write-ups on the Stryker attack, not from Microsoft's table reference
      IntuneAuditLogs
      | where TimeGenerated between (datetime(<window start>) .. datetime(<window end>))
      | where OperationName in~ ("wipe ManagedDevice", "retire ManagedDevice", "Delete ManagedDevice")
      | extend p = parse_json(Properties)
      | summarize Actions=count(), First=min(TimeGenerated), Last=max(TimeGenerated),
          Devices=make_set(tostring(p.TargetDisplayNames), 20) by Actor=Identity, OperationName, ResultType
      | order by Actions desc
      // Normal volume: the same actions per day over the 30 days before the window
      IntuneAuditLogs
      | where TimeGenerated between ((datetime(<window start>) - 30d) .. datetime(<window start>))
      | where OperationName in~ ("wipe ManagedDevice", "retire ManagedDevice", "Delete ManagedDevice")
      | summarize PerDay=count() by bin(TimeGenerated, 1d), OperationName
      // Entra: accounts created, roles assigned or activated through PIM, and group memberships in the window, and who did it
      AuditLogs
      | where TimeGenerated between (datetime(<window start>) .. datetime(<window end>))
      | where (Category == "UserManagement" and OperationName == "Add user")
         or (Category == "RoleManagement" and (OperationName startswith "Add member to role" or OperationName startswith "Add eligible member to role"))
         or (Category == "GroupManagement" and OperationName == "Add member to group")
      | project TimeGenerated, Category, OperationName, Result, Actor=tostring(InitiatedBy.user.userPrincipalName),
          ActorIP=tostring(InitiatedBy.user.ipAddress), App=tostring(InitiatedBy.app.displayName), TargetResources
      | order by TimeGenerated asc
      // "Add member to group" is a role grant only for role-assignable groups: check with Get-MgGroup -GroupId <id> -Property IsAssignableToRole
    tested: null
    attack:
      - "T1485"
      - "T1072"
      - "T1136.003"
      - "T1098.003"
      - "T1078.004"
  - id: "identity-breach-response/proposed/aitm-sign-in-blocked-by-device-based-conditional-access-the-password-and-mfa-wer"
    status: "active"
    source: "T-Minus365 'Token Theft | Disrupt the Kill Chain' jIdBf7e5v9M (speaker's own Evilginx demo, t=27:36; distill 2026-10-25); single-source demo, the CA error code to match on is not given in the source and needs confirming"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "AiTM sign-in blocked by device-based Conditional Access: the password, and MFA if it was prompted, were still captured"
    why: "When a managed-device or compliant-device Conditional Access policy is in place, an adversary-in-the-middle proxy (Evilginx-style) still relays the user's password and MFA, but Entra refuses to issue the session token, so the sign-in from the proxy's IP shows a correct password and MFA followed by a Conditional Access failure. That is not \"blocked, nothing to do\": the password is in the attacker's hands and the lure reached this user. Reset the password, check for a second attempt from other infrastructure, and use the same proxy IP to find the other users the lure reached. Ruled out when the failing sign-in comes from the user's own known device or network (an unenrolled new laptop fails the same way), not a hosting provider."
    how: null
    fp: "Conditional Access failures after a correct password are routine: a new or unenrolled laptop, a personal phone, a device whose compliance state has lapsed. The source tells them apart. The user's own device id or usual ISP is benign; a hosting-provider ASN with no device id, minutes after the user clicked a link, is the proxy."
    query: |-
      // Interactive sign-ins Conditional Access refused: 53000 = device not compliant, 53001 = device not domain or hybrid joined,
      // 53003 = blocked by policy (any policy, not only device ones: read ConditionalAccessPolicies for which one failed)
      // Read AuthenticationDetails: a correct password (and MFA, if it was prompted) before the refusal means the proxy captured them
      // SigninLogs only: the proxy's sign-in is interactive, and a union with the non-interactive table splits DeviceDetail and AuthenticationDetails by type
      SigninLogs
      | where TimeGenerated > ago(30d)
      | where ResultType in ("53000", "53001", "53003")
      | where UserPrincipalName =~ "<upn>" or IPAddress in ("<proxy ip>")
      | project TimeGenerated, UserPrincipalName, IPAddress, AutonomousSystemNumber, AppDisplayName, ResultType,
          DeviceId=tostring(DeviceDetail.deviceId), IsManaged=tostring(DeviceDetail.isManaged), UserAgent,
          AuthenticationDetails, ConditionalAccessPolicies
      | order by TimeGenerated asc
      // Every user the same proxy IP reached, refused or not: the lure's reach
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and IPAddress in ("<proxy ip>")
      | summarize Attempts=count(), Results=make_set(ResultType), First=min(TimeGenerated) by UserPrincipalName
      | order by First asc
    tested: null
    attack:
      - "T1557"
      - "T1566.002"
  - id: "identity-breach-response/proposed/activity-after-revocation-through-an-application-s-own-session-cookie"
    status: "active"
    source: "Microsoft Learn 'Revoke user access in an emergency in Microsoft Entra ID', section Session tokens (cookies); contradicts T-Minus365 gNflVkmr6RA claim (t=4:53) that revocation ends the session 'immediately' (distill 2026-10-25)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Defender XDR / Sentinel"
    title: "Activity after revocation through an application's own session cookie"
    why: "revokeSignInSessions ends the session cookies and refresh tokens that Entra issued. Once a browser app has issued its own session token, the application controls access, and Microsoft documents that Entra cannot directly revoke an app-issued session token. The app may not send the user back to Entra while that token is valid. Access tokens the attacker already holds also outlive the revocation: 60–90 minutes by default, and up to 28 hours on CAE-capable clients unless CAE pushed the revocation. Activity from the attacker's IP in a browser workload with no new Entra sign-in row is therefore a still-valid access token while inside that window, and only after it can it be a surviving app session rather than a missed device or grant. End it in the app (sign the user out of all sessions in that service) or wait for the app token to expire, and say which in the containment record. Ruled out when the post-revocation activity has a fresh Entra sign-in behind it, which points back to the existing device, grant or refresh-token checks."
    how: null
    fp: "Access tokens already issued keep working until they expire (60–90 minutes by default), so activity from the user's own devices and usual IP soon after revocation is expected. Delegates on the mailbox and service accounts acting on it also produce post-revocation activity with no sign-in by the user; check the actor before calling it a surviving session."
    query: |-
      let revoked = datetime(<revocation time, UTC>);
      // Workload activity for the account after the revocation, per app and IP
      CloudAppEvents
      | where Timestamp > revoked and AccountObjectId == "<object id>"
      | summarize Actions=count(), First=min(Timestamp), Last=max(Timestamp), Types=make_set(ActionType, 20)
          by Application, IPAddress, UserAgent
      | order by First asc
      // Entra sign-ins after the revocation: an IP above with activity but no sign-in here, past the access-token lifetime, is a surviving app session
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > revoked and UserPrincipalName =~ "<upn>" and ResultType == "0"
      | summarize SignIns=count(), First=min(TimeGenerated) by IPAddress, AppDisplayName
    tested: null
    attack:
      - "T1550.004"
      - "T1539"
  - id: "identity-breach-response/proposed/empty-or-detail-less-identity-protection-view-on-free-and-p1-tenants-is-a-licenc"
    status: "active"
    source: "Microsoft Learn 'Microsoft Entra licensing' (ID Protection capability table) and 'What are risk detections?'; corrects T-Minus365 WCdTaKVQmzI (t=18:28) licensing statement (distill 2026-10-25)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "Empty or detail-less Identity Protection view on Free and P1 tenants is a licence limit, not a clean result"
    why: "On Entra ID Free and P1, the Risky users report shows only medium- and high-risk users, with no detail drawer or risk history. Most risk detections arrive as 'Additional risk detected' without details, and risk-based Conditional Access policies need P2. On these tenants an empty or vague risk view does not rule out compromise: read the sign-in logs directly (IP, ASN, device id, how MFA was satisfied). Ruled out only on a P2 tenant where full detections are visible for the window."
    how: null
    fp: "On a P2 tenant a quiet risk view for the window is a real negative; confirm the licence before reading anything into it. On Free and P1, medium- and high-risk users do still appear, so a listed user is a real lead; it is the absence of a user that proves nothing."
    query: |-
      // Is Identity Protection detail available? "hidden" risk levels mean the tenant is not on P2: an empty risk view proves nothing
      SigninLogs
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>"
      | summarize SignIns=count() by RiskLevelDuringSignIn, RiskLevelAggregated
      // Detections that did arrive: RiskEventType "generic" is "Additional risk detected" with the detail withheld on Free/P1
      // This table only fills if user risk events are exported to the workspace; check the diagnostic setting before reading an empty result
      AADUserRiskEvents
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>"
      | summarize Detections=count(), First=min(TimeGenerated), IPs=make_set(IpAddress, 10) by RiskEventType, RiskLevel
    tested: null
    attack:
      - "T1078.004"
  - id: "identity-breach-response/proposed/entra-backup-and-recovery-difference-report-as-an-inventory-of-tenant-changes-an"
    status: "active"
    source: "Microsoft Learn 'Microsoft Entra Backup and Recovery overview', 'Recover objects', 'Create and review difference reports'; discovered via T-Minus365 uGXvEHO9NAw (t=7:05-10:05 demo; video's '5-day' window and hard-delete opening scenario contradicted by current docs; distill 2026-10-25)"
    validated_at: "2026-10-26"
    supersedes: null
    stage: "Stage 8 · Tenant changes"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Entra Backup and Recovery: difference report as an inventory of tenant changes, and its limits"
    why: "Entra Backup and Recovery takes one backup a day and keeps up to seven days. A difference report against a backup that predates the first malicious activity lists every supported object created, modified, soft-deleted or restored since then: users, groups, apps, service principals, Conditional Access policies, named locations, the authentication methods policy and the authorization policy. That is a complete inventory of attacker changes to those objects, and recovery can roll back the supported properties (for example a disabled CA policy and an added exclusion) in one job. It does not apply when the first malicious change is more than seven days old (there is no clean backup), when objects were hard-deleted (they cannot be recovered or recreated), for properties outside the supported set (recovery is per property, not whole objects), or on tenants without P1/P2. Only one difference report or recovery job runs at a time. The report also lists every legitimate change, so match it against change records before recovering. Global Administrator includes Backup Administrator, so an attacker could start a recovery that reverses containment; recovery jobs in the audit log during the incident that IR did not start are a lead (an inference, not documented attacker behaviour)."
    how: null
    fp: "Every legitimate change since the backup is in the difference report too: group membership churn from joiners and leavers, Conditional Access edits by the identity team, Entra Connect sync writes. Match each changed object against the change log and the actor in the audit log before recovering it. A recovery job started by the response team is not a lead; one started from an account under investigation is."
    query: |-
      // Backup and Recovery actions in the window. Microsoft documents that recovery actions are audited but not their
      // operation names: this filter is deliberately broad; confirm the names in a test tenant and narrow it
      AuditLogs
      | where TimeGenerated between (datetime(<window start>) .. datetime(<window end>))
      | where OperationName contains "recover" or OperationName contains "restore" or OperationName contains "backup" or LoggedByService contains "Backup"
      | project TimeGenerated, LoggedByService, Category, OperationName, Result, Actor=tostring(InitiatedBy.user.userPrincipalName),
          ActorIP=tostring(InitiatedBy.user.ipAddress), App=tostring(InitiatedBy.app.displayName), TargetResources
      | order by TimeGenerated asc
      // The difference report itself is not in Log Analytics: create it in the Entra admin center (Backup and recovery) or through
      // the Microsoft Graph Backup and Recovery API, against the last backup taken before the first malicious activity
    tested: null
    attack:
      - "T1556.009"
      - "T1098.001"
      - "T1136.003"
steps:
  - ord: 1
    time: "T+0–2 min"
    title: "Disable the account"
    why: "Blocks every new token issuance and is a CAE critical event, so CAE-capable clients (Office, Teams, OneDrive, Edge) lose access within minutes instead of at token expiry. The user is locked out; that is the point. Hybrid: Entra refuses AccountEnabled on a synced user. Disable in AD and force a delta sync. With password hash sync the attacker holds the on-premises password too, so the AD reset at Hour 4–24 is not optional; with pass-through authentication the AD disable is the only disable there is."
    critical: true
  - ord: 2
    time: "T+2–4 min"
    title: "Revoke all sessions, then confirm the user compromised"
    why: "Invalidates every refresh token and session cookie issued to the identity, for public and confidential clients alike. It does not recall access tokens already issued: those live 60–90 minutes by default, and up to 28 hours on a CAE client that has not received the critical event. \"Confirm compromised\" sets user risk to high so risk-based Conditional Access fires on any sign-in that gets through; against residential-proxy sources an IP block cannot keep up with, this is the control that holds."
    critical: true
  - ord: 3
    time: "T+4–6 min"
    title: "Record, then remove, attacker-added MFA methods and Temporary Access Passes"
    why: "The attacker may have enrolled their own authenticator, phone or a TAP. List every method with its id, export the list, then remove with the per-type cmdlet; there is no generic remove. Remove what was added inside the exposure window (date it from the \"User registered security info\" and \"Admin registered security info\" audit events); the user's original methods stay until the Hour 4–24 re-enrolment."
    critical: true
  - ord: 4
    time: "T+6–8 min"
    title: "Disable attacker device registrations (PRT persistence)"
    why: "A registered device produces a Primary Refresh Token for silent SSO across the tenant; a session revocation does not unregister it. Any device registered or joined during the exposure window is suspect. Use registered devices, not owned ones: the attacker's device can list the user as a registered user without being owned. Disable now, snapshot the objects (T+12–15), delete after the case closes."
    critical: true
  - ord: 5
    time: "T+8–10 min"
    title: "Revoke OAuth grants and app-role assignments made in the exposure window; disable the service principal first"
    why: "A consented app keeps access independent of the user's password, sessions and devices. Graph ignores oAuth2PermissionGrant.startTime (it is normally 0001-01-01), so a date filter on the grant object returns nothing: date the consent from the audit log. Export first. Disable the service principal before deleting anything: removing the grant alone leaves the app's existing refresh token working until it next needs a new one, and deleting the SP destroys the grant records you have not exported. The app registration itself lives in the attacker's tenant; what you control is the service principal in yours. If the app id is in the FOCI family, one refresh token also serves Office, Teams, Outlook, OneDrive, Azure CLI and Azure PowerShell: hunt those app ids from the attacker IP (Stage 9, Defender tab)."
    critical: true
  - ord: 6
    time: "T+10–12 min"
    title: "Export, then purge inbox rules, forwarding and delegation"
    why: "The persistence that survives everything above. Rules created in Outlook or OWA are logged as UpdateInboxRules in the mailbox audit, not as New-InboxRule; hunt both. Export before removing: the rule names and conditions are the signature for the tenant-wide hunt, and the export is evidence. Check Full Access and Send As delegation on the mailbox, and transport rules at tenant level, in the same pass."
    critical: true
  - ord: 7
    time: "T+12–15 min"
    title: "Export first: sign-in, audit and unified audit logs, message trace, mailbox hold, device objects"
    why: "Retention is shorter than the case. Entra sign-in and audit logs: 30 days on P1/P2, 7 on Free, unless the diagnostic setting ships them to Log Analytics. Unified audit log: 180 days (Audit Standard) or one year (Premium). Microsoft Graph activity: nothing is kept unless the MicrosoftGraphActivityLogs diagnostic setting is on. Message trace: 90 days, 10 days per query. Put the mailbox on litigation hold before any purge so deleted phish and rule-created folders stay recoverable, and snapshot the device objects before anyone deletes them."
    critical: true
  - ord: 8
    time: "T+0–15 min, in parallel"
    title: "Can you rule out spread? If not, go broad"
    why: "Three quick checks decide whether one account is the whole scope: (a) did this account send internal mail during the access window, (b) does it hold or is it eligible for an admin role, (c) are other accounts signing in from the attacker's IP or user agent? If any answer is yes or unknown, contain at the wider level now, not after the investigation: disable and revoke every internal recipient who clicked (Stage 5), disable and revoke all privileged accounts if a role was in reach, and block the attacker's source in Conditional Access tenant-wide with the break-glass accounts excluded. Broad containment costs some user friction; narrow containment against a wider attacker costs the eviction."
    critical: true
actions:
  - platform: "Defender XDR / Sentinel"
    label: "T+0–15 · Contain"
    name: "Disable, then revoke, every account in scope at once; confirm compromised"
    tier: "destructive"
    tier_inferred: false
    why: "disabling blocks new tokens and is a CAE critical event; revoking kills the refresh tokens and cookies the attacker already holds. In that order, so there is no gap in which the still-valid password mints a fresh session. One account at a time warns the attacker while a second account stays live."
    how: "Portal, per user: identity page › Disable / Revoke session / Mark as compromised. From an advanced hunting result: Take actions › Disable user (the query must return AccountObjectId). Defender for Cloud Apps: Suspend user, and Revoke app for a consented OAuth app. Synced users: Entra refuses AccountEnabled on them; disable in AD and run Start-ADSyncSyncCycle -PolicyType Delta, then revoke in Entra. With password hash sync the attacker holds the on-premises password too: reset it in AD. For the whole list, script it:"
    body: |-
      $scope = Get-Content .\accounts-in-scope.txt   # one UPN per line
      foreach ($u in $scope) {
        Update-MgUser -UserId $u -AccountEnabled:$false            # first: no new tokens; CAE clients drop within minutes
        Revoke-MgUserSignInSession -UserId $u                      # then: refresh tokens and session cookies gone
        Confirm-MgRiskyUserCompromised -UserIds (Get-MgUser -UserId $u).Id   # Identity Protection: risk high, risk policies fire
      }
    attack: []
  - platform: "Defender XDR / Sentinel"
    label: "T+0–15 · Contain"
    name: "Block the attacker's source tenant-wide, with the break-glass accounts excluded"
    tier: "destructive"
    tier_inferred: false
    why: "a blocked source stops the same infrastructure reaching any other account while you are still scoping. Against residential-proxy kits the block buys hours, not days; \"Confirm compromised\" plus a user-risk policy is what holds."
    how: "Entra: Conditional Access › Named locations › add the attacker IPs, then a block policy for that location, all users, with the break-glass accounts excluded: an IP block that catches your own emergency access is the outage you cannot fix. On devices: Settings › Endpoints › Indicators › IP addresses (enforcement needs network protection in block mode), or via the API:"
    body: |-
      POST https://api.security.microsoft.com/api/indicators
      {"indicatorValue": "<attacker IP>", "indicatorType": "IpAddress", "action": "Block",
       "title": "IR case #<n>", "description": "Attacker source, identity breach", "expirationTime": "<ISO date>"}
    attack: []
  - platform: "Defender XDR / Sentinel"
    label: "T+0–15 · Contain"
    name: "Isolate every victim device (infostealer or cookie theft)"
    tier: "destructive"
    tier_inferred: false
    why: "a device that is still stealing tokens re-compromises the account the moment it is re-enabled."
    how: "Device page › Isolate device (Full); Live Response keeps working. The API isolates one device per call — run it for each device in scope:"
    body: |-
      POST https://api.security.microsoft.com/api/machines/{id}/isolate
      {"Comment": "IR case #<n>", "IsolationType": "Full"}
    attack: []
