        AND o365.audit.Operation IN ("MailItemsAccessed", "FileDownloaded", "FileSyncDownloadedFull", "FileAccessed",
            "SearchQueryInitiatedExchange", "MoveToDeletedItems", "SoftDelete", "HardDelete")
      | STATS events = COUNT(*), first = MIN(@timestamp), last = MAX(@timestamp), clients = VALUES(o365.audit.ClientInfoString), logon_types = VALUES(o365.audit.LogonType)
          BY o365.audit.Operation, o365.audit.Workload, o365.audit.ClientIP
      | SORT first ASC
