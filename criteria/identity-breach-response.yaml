  - id: "identity-breach-response/splunk/s8-conditional-access-users-apps-credentials-federa"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Tenant changes"
    stage_ord: 8
    platform: "Splunk"
    title: "Conditional Access, users, apps, credentials, federation, partners, transport rules and audit settings changed in the window"
    why: "A changed CA policy, a new federated domain, a GDAP partner or a credential on an existing privileged app is a back door that survives every per-user action on this page. A switched-off audit log is the point past which you are blind; date it."
    how: null
    fp: "CA-as-code pipelines and Entra Connect write policies and users on a schedule; match on actor and time, not on the operation alone."
    query: |-
      index=<index> sourcetype="azure:aad:audit" earliest="<window start>" latest="<window end>"
        (activityDisplayName="*Conditional Access policy*" OR activityDisplayName="*named location*" OR activityDisplayName="*security defaults*"
         OR activityDisplayName IN ("Add user","Add application","Add service principal","Add service principal credentials",
           "Add owner to application","Add owner to service principal","Set federation settings on domain","Set domain authentication",
           "Add unverified domain","Verify domain","Add partner to company")
         OR activityDisplayName="*Certificates and secrets management*" OR activityDisplayName="*authorization policy*")
      | table _time category activityDisplayName result initiatedBy.user.userPrincipalName initiatedBy.app.displayName initiatedBy.user.ipAddress targetResources{}.displayName
      | sort _time
      // Exchange tenant settings
      index=<index> sourcetype="o365:management:activity" earliest="<window start>" latest="<window end>"
        Operation IN ("New-TransportRule","Set-TransportRule","Remove-TransportRule","New-InboundConnector","Set-InboundConnector",
          "Set-AdminAuditLogConfig","Set-OrganizationConfig","Set-AuthenticationPolicy","Set-MailboxAuditBypassAssociation",
          "Add-RoleGroupMember","New-ManagementRoleAssignment","New-ApplicationAccessPolicy")
      | table _time Operation UserId ClientIP Parameters{}.Name Parameters{}.Value
      // Set-AdminAuditLogConfig with UnifiedAuditLogIngestionEnabled false: the UAL was switched off; your evidence ends there.
    tested: null
    attack:
      - "T1556.009"
      - "T1484.002"
      - "T1136.003"
      - "T1098.001"
