# Source of truth for this playbook's IR criteria.
# Hand-edit freely. Re-run 'bun run build:index' after any change.
playbook: "identity-breach-response"
title: "Identity Breach Response"
platforms:
  - "Defender XDR / Sentinel"
  - "CrowdStrike Falcon"
  - "SentinelOne"
  - "Velociraptor"
  - "Splunk"
  - "Elastic / Wazuh"
scenarios:
  - id: "1"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Standard Account Takeover (credential reuse, infostealer log, password spray)"
    indicators: "successful sign-in from an atypical IP with AuthenticationRequirement singleFactorAuthentication and no AiTM artefacts. No MFA prompt means MFA was not required for that app, location or user (a Conditional Access gap or exclusion), or the user approved a push; a TOTP code cannot be replayed without a prompt. Basic authentication for EWS, POP, IMAP, ActiveSync and remote PowerShell has been off in Exchange Online since 2022–23; the one legacy path still subject to a retirement timeline is SMTP AUTH client submission, so check Get-CASMailbox <upn> | fl SmtpClientAuthenticationDisabled and Get-TransportConfig | fl SmtpClientAuthenticationDisabled before blaming \"legacy protocols\"."
    discriminator: "Follow the universal timeline. Add: block the source IP in a Conditional Access named location (break-glass excluded) and close the MFA gap that let a password alone through. Hunt for the same IP across all users in the tenant — password spray is rarely a single-user event — and check the user's credentials against infostealer-log feeds; a stealer log means the device is in scope too."
    attack: []
    window: null
  - id: "2"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "AiTM Proxy Phishing (Evilginx, Tycoon 2FA, Cloudflare Worker)"
    indicators: "successful sign-in WITH MFA passed but from atypical device fingerprint, often from a residential proxy IP. Session cookie was harvested mid-auth."
    discriminator: "Token revocation is the only meaningful containment — the credential itself wasn't useful to the attacker, the cookie was. After eradication, accelerate FIDO2 rollout for the affected role — origin binding makes the proxy class structurally impossible."
    attack: []
    window: null
  - id: "3"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Device-Code Phishing (Storm-2372, EvilTokens, FlowerStorm)"
    indicators: "authenticationProtocol = \"deviceCode\" in Entra sign-in logs, often successful with no MFA challenge (victim's session satisfied IdP), attacker's device immediately requests tokens."
    discriminator: "Containment is identical — revoke sessions, kill device registrations, audit OAuth grants. Critical posture fix during T+4–24h: add Conditional Access policy restricting Device Authorization Grant flow to apps/users with legitimate need. Block entirely for privileged roles. The Conditional Access policy needs Entra ID P1; on Entra ID Free, use the Security Defaults device-code block instead. Response checklist: Device Code Abuse Response (12 steps). Detection and prevention: Device Code Abuse — 8 Sentinel hunts (including IP-divergence detection that catches the attacker's token use after the victim's auth) and the step-by-step CA policy build with Report-only rollout."
    attack: []
    window: null
  - id: "4"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "OAuth Consent Abuse (rogue app granted permissions)"
    indicators: "a new Enterprise App in Entra with broad scopes ( Mail.Read, Files.ReadWrite.All, offline_access ) consented by a regular user; access continues despite password reset."
    discriminator: "Revoking the user's sessions and resetting the password is insufficient — the app holds its own refresh token. The app registration lives in the attacker's tenant and you cannot delete it; what is in your tenant is the service principal (the Enterprise App). Disable it first ( Update-MgServicePrincipal -AccountEnabled:$false ), which stops token issuance for every user who consented, export its grants and app-role assignments, remove them ( Remove-MgOauth2PermissionGrant, Remove-MgServicePrincipalAppRoleAssignedTo ), then delete the SP ( Remove-MgServicePrincipal ). Deleting first destroys the grant records. Check whether the same app id was consented by anyone else ( Get-MgServicePrincipalOauth2PermissionGrant ). After eradication: restrict user consent to verified publishers and low-impact scopes, require admin consent for the rest, and alert on \"Consent to application\"."
    attack: []
    window: null
  - id: "5"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Refresh-Token / PRT Persistence (post-password-reset re-entry)"
    indicators: "user reports their account \"keeps getting taken over\" despite password resets; sign-in logs show interactive token use with no fresh authentication; unexpected device in registered devices list."
    discriminator: "The previous IR was incomplete — the account was revoked before it was disabled, the registered device wasn't removed, or a FOCI refresh token kept minting tokens for Office, Teams and Outlook from the attacker's machine. Re-run the full T+0–15 playbook in order (disable, revoke, devices, grants, export), and run the Stage 2 and Stage 9 hunts for IncomingTokenType == \"primaryRefreshToken\" from an unmanaged device and for the FOCI app ids from the attacker IP. Refresh-token lifetime cannot be reduced: those policies were retired in 2021 and the 90-day inactivity window is fixed. The levers are Conditional Access sign-in frequency for the user's apps, persistent browser session off, and Token Protection so the next stolen token is bound to the device it was issued to."
    attack: []
    window: null
  - id: "6"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Non-Human Identity Compromise (API key, service principal, NHI)"
    indicators: "API key from CI/CD, package registry, AI platform (OpenAI/Anthropic), or cloud provider (AWS/Azure/GCP) appears in an infostealer log, paste site, or public GitHub repo. Or: anomalous activity from a service principal — new ASN, off-hours, unusual data volume."
    discriminator: "No user to \"reset\" and no sessions to revoke: app-only tokens are minted from the credential, not from a refresh token, so Revoke-MgUserSignInSession has nothing to act on. Identify the named owner from your NHI inventory. Disable the service principal ( Update-MgServicePrincipal -AccountEnabled:$false ) so no new tokens are issued, remove every secret and certificate ( Remove-MgServicePrincipalPassword, Remove-MgServicePrincipalKey; on the app object Remove-MgApplicationPassword, Remove-MgApplicationKey ), then issue new ones and re-enable; an access token already issued lives out its 60–90 minutes. Audit AADServicePrincipalSignInLogs and MicrosoftGraphActivityLogs for the SP's calls by IP. If no inventory exists, the key may be orphaned — coordinate with engineering to identify systems calling it before the disable breaks production. After eradication: enforce a rotation policy (&le; 12 months for SP secrets, &le; 6 months for API keys), prefer workload identity federation or managed identities over secrets, and assign a named owner per credential."
    attack: []
    window: null
  - id: "7"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Privileged Account Compromise (Global Admin, Subscription Owner)"
    indicators: "any sign-in to an account holding Global Administrator, Privileged Role Administrator, Application Administrator, or cloud-subscription Owner role from an unexpected context."
    discriminator: "Tenant-wide incident, not a user incident. Assume the attacker has tenant takeover capability and has already placed a back door that survives every per-user action. Containment escalates: disable then revoke every privileged identity (break-glass accounts excluded and their passwords rotated by hand), then audit the window for the doors that outlive a user: federation ( Get-MgDomain | fl Id, AuthenticationType and Get-MgDomainFederationConfiguration: a new federated domain or a changed signing certificate is a golden-SAML persistence), pass-through authentication agents (a rogue PTA agent sees every password; list them in Entra Connect health and Get-MgBetaOnPremisesPublishingProfileAgent ), the Entra Connect server itself (its sync account holds directory write rights; treat the server as tier 0 and in scope), GDAP and DAP partner relationships (Entra › Delegated admin partners; \"Add partner to company\" in the audit log), Conditional Access as a diff, not a glance ( Get-MgIdentityConditionalAccessPolicy -All | ConvertTo-Json -Depth 10 against last week's export; look for new exclusions, named locations and report-only flips), the UAL ingestion switch ( Get-AdminAuditLogConfig | fl UnifiedAuditLogIngestionEnabled and \"Set-AdminAuditLogConfig\" in the admin audit), transport rules and inbound connectors ( Get-TransportRule, Get-InboundConnector, changed in the window), newly created accounts with roles, and credentials added to existing privileged apps (Hour 1–4). Engage external IR if available. Notify the regulator: this is often a reportable major incident under NIS2."
    attack: []
    window: null
  - id: "8"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    name: "Vendor / Third-Party Identity Exposure (their breach, your problem)"
    indicators: "a vendor whose employees have access to your tenant via guest/B2B identity is breached; or vendor employees' credentials appear in an infostealer log with shared-app access to your environment."
    discriminator: "You don't control their identity store, so you can't revoke at the source: refresh tokens for a B2B user are not revoked in your tenant, only in their home tenant (Microsoft identity platform, refresh tokens). What you control is your side of the trust. Block the guest objects ( Update-MgUser -AccountEnabled:$false works on them), then use cross-tenant access settings (Entra › External Identities › Cross-tenant access settings): add the vendor's tenant as an organisation and set inbound B2B collaboration to blocked, or stop trusting their MFA and device claims so your Conditional Access re-challenges them. Scope the exposure by their tenant, not by user: in sign-in logs HomeTenantId == \"<vendor tenant id>\" and CrossTenantAccessType!= \"none\" lists every vendor identity that touched you; in Get-MgServicePrincipal, AppOwnerOrganizationId equal to their tenant id lists every app of theirs that holds grants here. Restrict their app access to read-only during validation and contact their security team with specific exposure data (not generic \"improve your security\"). See Vendor Breach Response for the full vendor-IR workflow."
    attack: []
    window: null
criteria:
  - id: "identity-breach-response/defender/s1-successful-sign-ins-for-the-account-interactive"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · First sign-in"
    stage_ord: 1
    platform: "Defender XDR / Sentinel"
    title: "Successful sign-ins for the account, interactive and non-interactive, earliest first per IP and client"
    why: "The first successful sign-in from an attacker IP is the start of the exposure window; every later hunt and any breach notification is dated from it. Refresh-token replay and device-code redemptions are logged as non-interactive sign-ins, so SigninLogs alone misses the token use that follows the phish."
    how: null
    fp: "The user's own VPN egress, a new office and Microsoft service IPs all appear as \"new\" sources; rank by ASN and first-seen, not by count, and compare against the 30 days before the window."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)        // 30 d on P1/P2, 7 d on Free; longer only in Log Analytics
      | where UserPrincipalName =~ "<upn>" and ResultType == "0"
      | extend Kind = iff(Type == "SigninLogs", "interactive", "non-interactive")
      | summarize FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated), SignIns=count(), Kinds=make_set(Kind)
          by IPAddress, AutonomousSystemNumber, UserAgent, ClientAppUsed, AppDisplayName, AuthenticationProtocol
      | order by FirstSeen asc
      // AuthenticationProtocol == "deviceCode" on the first hit: the window starts at the code redemption, not at a password.
    tested: null
    attack:
      - "T1078.004"
  - id: "identity-breach-response/defender/s2-how-mfa-was-satisfied-prt-from-an-unmanaged-devi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "Defender XDR / Sentinel"
    title: "How MFA was satisfied; PRT from an unmanaged device; one session on two IPs; what Identity Protection flagged"
    why: "A password reset does not stop a stolen session cookie, a replayed PRT or a device-code token; how MFA was passed decides whether you revoke sessions, remove devices, or also rebuild the victim's PC."
    how: null
    fp: "Entra-joined devices mid-enrolment and Windows 365 or AVD session hosts can present a PRT with an empty device id; two IPs on one SessionId is normal for a phone moving between Wi-Fi and cellular within minutes. Weigh ASN and country, not the count. Remote-debugging flags are also set by browser automation and test tooling on developer machines."
    query: |-
      // a. How each authentication step was satisfied, from the attacker's IPs
      SigninLogs
      | where TimeGenerated > ago(30d)
      | where UserPrincipalName =~ "<upn>" and ResultType == "0" and IPAddress in ("<ip>")
      | mv-expand step = parse_json(AuthenticationDetails)
      | project TimeGenerated, IPAddress, AppDisplayName, AuthenticationProtocol, AuthenticationRequirement,
                IncomingTokenType, Method=tostring(step.authenticationMethod), Detail=tostring(step.authenticationStepResultDetail)
      // AuthenticationProtocol == "deviceCode": device-code phishing.
      // Detail == "MFA requirement satisfied by claim in the token" from a new IP: a replayed session (AiTM or stolen cookie).
      // b. A primary refresh token presented from a device Entra does not manage: stolen or forged PRT
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>" and IncomingTokenType == "primaryRefreshToken"
      | extend dd = parse_json(DeviceDetail)
      | where tostring(dd.isManaged) != "true" or isempty(tostring(dd.deviceId))
      | project TimeGenerated, IPAddress, AppDisplayName, DeviceId=tostring(dd.deviceId), TrustType=tostring(dd.trustType), SessionId
      // c. One session id seen from more than one IP: the cookie moved
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>" and isnotempty(SessionId)
      | summarize IPs=make_set(IPAddress), Sources=dcount(IPAddress), First=min(TimeGenerated), Last=max(TimeGenerated) by SessionId
      | where Sources > 1
      // d. What Identity Protection already saw (P2)
      AADUserRiskEvents
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>"
      | project TimeGenerated, RiskEventType, RiskLevel, RiskState, Activity, IpAddress
      // e. Endpoint: Chromium started for remote debugging (cookie theft), on the victim's device
      DeviceProcessEvents
      | where Timestamp > ago(30d) and DeviceName =~ "<victim host>"
      | where FileName in~ ("chrome.exe","msedge.exe") and ProcessCommandLine has "--remote-debugging-port"
      | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, ProcessCommandLine
    tested: null
    attack:
      - "T1539"
      - "T1550.004"
      - "T1528"
  - id: "identity-breach-response/defender/s3-mfa-methods-taps-device-registrations-app-consen"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Persistence"
    stage_ord: 3
    platform: "Defender XDR / Sentinel"
    title: "MFA methods, TAPs, device registrations, app consents and credentials, inbox rules, forwarding, delegation, transport rules"
    why: "Each of these survives a password reset and a session revocation; anything found here has to be removed before the account is handed back. Outlook and OWA log rule changes as UpdateInboxRules (mailbox audit); only PowerShell logs New-InboxRule."
    how: null
    fp: "\"User registered security info\" fires on every routine enrolment and on Authenticator re-registration after a phone change; keep hits inside the exposure window and from the attacker's IP or a new country. Helpdesk-issued TAPs are normal; a TAP issued by the compromised account itself, or by an admin from the attacker IP, is not."
    query: |-
      // Entra: methods, TAPs, devices, consents, app role assignments, credentials added to apps
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where OperationName in ("User registered security info", "Admin registered security info",
          "User deleted security info", "Register device", "Add registered owner to device",
          "Add registered users to device", "Consent to application", "Add delegated permission grant",
          "Add app role assignment grant to user", "Add app role assignment to service principal",
          "Add service principal credentials")
         or OperationName has "Certificates and secrets management"
      | where tostring(InitiatedBy) has "<upn>" or tostring(TargetResources) has "<upn>"
      | project TimeGenerated, OperationName, Result, ResultReason, Actor=tostring(InitiatedBy.user.userPrincipalName),
                ActorIP=tostring(InitiatedBy.user.ipAddress), Target=tostring(TargetResources[0].displayName)
      | order by TimeGenerated asc
      // ResultReason has "temporary access pass": a TAP was issued; who issued it and from where, and was it redeemed from the attacker IP?
      // Exchange: rules, forwarding, delegation, transport rules and connectors
      OfficeActivity
      | where TimeGenerated > ago(30d)
      | where Operation in ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "Set-Mailbox",
          "Add-MailboxPermission", "Add-MailboxFolderPermission", "Add-RecipientPermission",
          "New-TransportRule", "Set-TransportRule", "New-InboundConnector", "Set-InboundConnector")
      | where UserId =~ "<upn>" or tostring(Parameters) has "<upn>"
      | where Operation != "Set-Mailbox" or tostring(Parameters) has_any ("ForwardingSmtpAddress", "ForwardingAddress", "DeliverToMailboxAndForward")
      | project TimeGenerated, Operation, UserId, ClientIP, Parameters
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1556.006"
      - "T1098.005"
      - "T1098.001"
      - "T1564.008"
  - id: "identity-breach-response/defender/s4-mail-read-and-files-downloaded-by-client-ip-with"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Data access"
    stage_ord: 4
    platform: "Defender XDR / Sentinel"
    title: "Mail read and files downloaded, by client IP, with sync-versus-bind, throttling, client string, searches and deletions"
    why: "What was read or downloaded from the attacker's IP decides whether this is a notifiable data breach and whose data it involves. MailAccessType == \"Sync\" means whole folders were pulled; IsThrottled == \"True\" means the log stopped counting after 1,000 accesses in 24 hours and under-states the read; ClientInfoString names the tool."
    how: null
    fp: "The owner's own clients dominate MailItemsAccessed; split by ClientIP first. Outlook in cached mode and mobile mail apps legitimately show Sync, and IsThrottled is also set by the user's own full-mailbox search or a migration. Compare the attacker IP's folder set with the user's usual one."
    query: |-
      OfficeActivity
      | where TimeGenerated > ago(30d) and UserId =~ "<upn>"
      | where Operation in ("MailItemsAccessed", "FileDownloaded", "FileSyncDownloadedFull", "FileAccessed",
          "SearchQueryInitiatedExchange", "SearchQueryInitiatedSharePoint", "MoveToDeletedItems", "SoftDelete", "HardDelete")
      | extend Props = tostring(OperationProperties)
      | extend MailAccessType = extract(@'MailAccessType\W+Value\W+(\w+)', 1, Props),
               IsThrottled    = extract(@'IsThrottled\W+Value\W+(\w+)', 1, Props)
      | summarize Events=count(), First=min(TimeGenerated), Last=max(TimeGenerated),
          Sync=countif(MailAccessType == "Sync"), Throttled=countif(IsThrottled == "True"),
          Clients=make_set(ClientInfoString, 5), Folders=make_set(tostring(parse_json(Folders)[0].Path), 10)
          by Operation, OfficeWorkload, ClientIP
      | order by First asc
      // ClientInfoString "Client=REST;;;" with an app id, or an unfamiliar MAPI/OWA/IMAP string: the attacker's tool.
      // SearchQueryInitiatedExchange needs Audit (Premium) and the SearchQueryInitiated owner action; it shows what they looked for.
      // Deletions after reads: cleanup of sent phish, bounce notices or rule-created folders.
      // Defender XDR without Sentinel:
      // CloudAppEvents | where Timestamp > ago(30d) and AccountObjectId == "<object id>"
      // | where ActionType in ("MailItemsAccessed","FileDownloaded") | summarize count() by ActionType, IPAddress
      // An empty MailItemsAccessed result only means nothing was logged; check Get-Mailbox <upn> | fl AuditEnabled, DefaultAuditSet.
    tested: null
    attack:
      - "T1114.002"
      - "T1530"
      - "T1213.002"
  - id: "identity-breach-response/defender/s5-mail-sent-from-the-account-and-who-clicked-it-fi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Outbound"
    stage_ord: 5
    platform: "Defender XDR / Sentinel"
    title: "Mail sent from the account and who clicked it; files shared out of OneDrive and SharePoint"
    why: "Internal phish sent from a trusted mailbox is how one account becomes ten; every internal recipient who clicked is a candidate for the same containment, and every external recipient of a sharing link is a disclosure. EmailEvents and UrlClickEvents need Defender for Office 365; message trace is the fallback."
    how: "Outside Sentinel: Get-MessageTraceV2 -SenderAddress <upn> -StartDate <start> -EndDate <end> (10 days per query, 90 days back, 5,000 rows max) and Start-HistoricalSearch for a complete export."
    fp: "Assistants, shared mailboxes and newsletter senders mail many internal recipients every day; compare recipient set and subject lines with the 30 days before the window, not with zero. SharingSet also fires on every permission change inside a Teams channel."
    query: |-
      // a. What the account sent, by direction
      EmailEvents
      | where Timestamp > ago(30d) and (SenderFromAddress =~ "<upn>" or SenderMailFromAddress =~ "<upn>")
      | summarize Messages=count(), Recipients=dcount(RecipientEmailAddress), First=min(Timestamp), Last=max(Timestamp),
          WithUrl=countif(UrlCount > 0), WithAttachment=countif(AttachmentCount > 0), Subjects=make_set(Subject, 10)
          by EmailDirection
      // b. Who clicked a link in internal mail from the account (Safe Links required)
      EmailEvents
      | where Timestamp > ago(30d) and SenderFromAddress =~ "<upn>" and EmailDirection == "Intra-org"
      | join kind=inner (UrlClickEvents | where Timestamp > ago(30d)) on NetworkMessageId
      | project ClickTime=Timestamp1, Clicker=AccountUpn, Url, ActionType, IsClickedThrough, Subject
      | order by ClickTime asc
      // ActionType "ClickAllowed", or any row with IsClickedThrough == true: that user entered the kit; contain them now.
      // c. Sharing out of OneDrive and SharePoint
      OfficeActivity
      | where TimeGenerated > ago(30d) and UserId =~ "<upn>"
      | where Operation in ("SharingSet", "SharingInvitationCreated", "AnonymousLinkCreated", "SecureLinkCreated",
          "AddedToSecureLink", "CompanyLinkCreated", "SharingLinkCreated")
      | project TimeGenerated, Operation, OfficeWorkload, ClientIP, Site_Url, SourceFileName, TargetUserOrGroupName, TargetUserOrGroupType
      | order by TimeGenerated asc
    tested: null
    attack:
      - "T1534"
      - "T1567"
  - id: "identity-breach-response/defender/s6-role-assignments-to-or-by-the-account-including"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Privilege"
    stage_ord: 6
    platform: "Defender XDR / Sentinel"
    title: "Role assignments to or by the account, including PIM, role-assignable groups and Azure RBAC"
    why: "If the account holds or gained an admin role, this is a tenant incident, not a user incident: containment and notification both widen. Membership of a role-assignable group or an Azure Owner assignment is the same escalation under a different operation name."
    how: null
    fp: "PIM activations by the user's own admin account from the usual IP are routine; the signal is an assignment made by another actor, from the attacker IP, or to a group that was never role-assignable before the window."
    query: |-
      AuditLogs
      | where TimeGenerated > ago(30d)
      | where (Category == "RoleManagement" and (OperationName startswith "Add member to role" or OperationName startswith "Add eligible member to role"))
         or (Category == "GroupManagement" and OperationName == "Add member to group")
      | where tostring(TargetResources) has "<upn>" or tostring(InitiatedBy) has "<upn>"
      | project TimeGenerated, Category, OperationName, Result, Actor=tostring(InitiatedBy.user.userPrincipalName), TargetResources
      | order by TimeGenerated asc
      // "Add member to group": check the group with Get-MgGroup -GroupId <id> -Property IsAssignableToRole, and whether it holds an Azure role.
      // Azure RBAC writes by or to the account (AzureActivity via the Azure Activity connector)
      AzureActivity
      | where TimeGenerated > ago(30d)
      | where OperationNameValue =~ "Microsoft.Authorization/roleAssignments/write" and ActivityStatusValue == "Success"
      | where Caller =~ "<upn>" or tostring(Properties) has "<object id>"
      | project TimeGenerated, Caller, CallerIpAddress, SubscriptionId, ResourceGroup, Properties
      // Every directory change the account itself made:
      // AuditLogs | where TimeGenerated > ago(30d) and tostring(InitiatedBy.user.userPrincipalName) =~ "<upn>" | summarize count() by OperationName
    tested: null
    attack:
      - "T1098.003"
      - "T1078.004"
  - id: "identity-breach-response/defender/s7-other-users-signing-in-from-the-attacker-s-ips-o"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 7 · Other accounts"
    stage_ord: 7
    platform: "Defender XDR / Sentinel"
    title: "Other users signing in from the attacker's IPs or user agent, and flagged by Identity Protection on the same source"
    why: "AiTM kits and password sprays hit many users from the same infrastructure; every other account seen here needs the same containment. The internal recipients who clicked are in Stage 5."
    how: null
    fp: "A corporate NAT, Global Secure Access egress or a partner's VPN puts many legitimate users behind one IP; check the address against named locations before containing by IP. Residential-proxy kits rotate sources, so an empty result on the first IP does not clear the tenant."
    query: |-
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d)
      | where IPAddress in ("<ip1>","<ip2>")          // or: UserAgent == "<attacker user agent>"
      | summarize Attempts=count(), Successes=countif(ResultType == "0"), First=min(TimeGenerated), Apps=make_set(AppDisplayName, 5)
          by UserPrincipalName
      | order by First asc
      // Risk detections on the same source, tenant-wide
      AADUserRiskEvents
      | where TimeGenerated > ago(30d) and IpAddress in ("<ip1>","<ip2>")
      | summarize Detections=make_set(RiskEventType), First=min(TimeGenerated) by UserPrincipalName, RiskState
    tested: null
    attack:
      - "T1078.004"
      - "T1110.003"
  - id: "identity-breach-response/defender/s8-conditional-access-named-locations-users-apps-cr"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 8 · Tenant changes"
    stage_ord: 8
    platform: "Defender XDR / Sentinel"
    title: "Conditional Access, named locations, users, apps, credentials, federation, partners, transport rules and audit settings changed in the window"
    why: "A changed CA policy, a new federated domain, a GDAP partner or a credential on an existing privileged app is a back door that survives every per-user action on this page. A switched-off audit log is the point past which you are blind; date it."
    how: null
    fp: "CA-as-code pipelines and Entra Connect write policies and users on a schedule; match on actor, app and time, not on the operation alone. Entra Connect itself shows as \"Sync_\" actors and an app actor; an interactive user doing the same is the finding."
    query: |-
      // Entra: directory and policy changes in the window, by anyone
      AuditLogs
      | where TimeGenerated between (datetime(<window start>) .. datetime(<window end>))
      | where OperationName has_any ("Conditional Access policy", "named location", "security defaults",
          "Add user", "Add application", "Add service principal", "Add service principal credentials",
          "Add owner to application", "Add owner to service principal", "Set federation settings on domain",
          "Set domain authentication", "Add unverified domain", "Verify domain", "Add partner to company",
          "authorization policy", "Update StsRefreshTokenValidFrom Timestamp")
         or OperationName has "Certificates and secrets management"
      | project TimeGenerated, Category, OperationName, Result, Actor=tostring(InitiatedBy.user.userPrincipalName),
                App=tostring(InitiatedBy.app.displayName), ActorIP=tostring(InitiatedBy.user.ipAddress),
                Target=tostring(TargetResources[0].displayName), TargetResources
      | order by TimeGenerated asc
      // Exchange: transport rules, connectors, audit and auth settings
      OfficeActivity
      | where TimeGenerated between (datetime(<window start>) .. datetime(<window end>))
      | where Operation in ("New-TransportRule", "Set-TransportRule", "Remove-TransportRule", "New-InboundConnector", "Set-InboundConnector",
          "Set-AdminAuditLogConfig", "Set-OrganizationConfig", "Set-AuthenticationPolicy", "Set-MailboxAuditBypassAssociation",
          "Add-RoleGroupMember", "New-ManagementRoleAssignment", "New-ApplicationAccessPolicy")
      | project TimeGenerated, Operation, UserId, ClientIP, Parameters
      // Set-AdminAuditLogConfig with UnifiedAuditLogIngestionEnabled false: the UAL was switched off; your evidence ends there.
      // Set-MailboxAuditBypassAssociation: a mailbox silently excluded from auditing.
    tested: null
    attack:
      - "T1556.009"
      - "T1484.002"
      - "T1136.003"
      - "T1098.001"
  - id: "identity-breach-response/defender/s9-token-use-and-graph-calls-after-the-revocation-t"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "Defender XDR / Sentinel"
    title: "Token use and Graph calls after the revocation time; which family clients the refresh token was minted for"
    why: "revokeSignInSessions invalidates refresh tokens and session cookies; access tokens already issued live until they expire, 60–90 minutes by default and up to 28 hours on CAE-capable clients unless CAE pushed the revocation (it does for account disable and password change). A success after that window means containment missed a device, an app grant or a refresh token."
    how: null
    fp: "Successes inside the first 90 minutes after revocation from the user's own devices are cached access tokens expiring, not a missed channel. Office and Teams on a managed device re-authenticate silently with the PRT the moment the account is re-enabled; that is expected, from the attacker IP it is not."
    query: |-
      let revoked = datetime(<revocation time, UTC>);
      // or: toscalar(AuditLogs | where OperationName == "Update StsRefreshTokenValidFrom Timestamp" and tostring(TargetResources) has "<upn>" | summarize max(TimeGenerated))
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > revoked and UserPrincipalName =~ "<upn>" and ResultType == "0"
      | summarize SignIns=count(), First=min(TimeGenerated), Last=max(TimeGenerated) by Type, IPAddress, AppDisplayName, UserAgent, IncomingTokenType
      | order by First asc
      // Graph calls after the revocation (needs the "MicrosoftGraphActivityLogs" diagnostic setting; nothing is kept without it)
      MicrosoftGraphActivityLogs
      | where TimeGenerated > revoked and UserId == "<object id>"
      | summarize Calls=count(), Last=max(TimeGenerated) by IPAddress, AppId, RequestMethod, RequestUri
      | order by Calls desc
      // Which FOCI family clients the attacker minted tokens for before revocation: one family refresh token serves all of them
      union SigninLogs, AADNonInteractiveUserSignInLogs
      | where TimeGenerated > ago(30d) and UserPrincipalName =~ "<upn>" and IPAddress in ("<ip1>","<ip2>")
      | where AppId in ("d3590ed6-52b3-4102-aeff-aad2292ab01c", "04b07795-8ddb-461a-bbee-02f9e1bf7b46", "1950a258-227b-4e31-a9cf-717495945fc2",
          "1fec8e78-bce4-4aaf-ab1b-5451cc387264", "4813382a-8fa7-425e-ab75-3b753aab3abb", "27922004-5251-4030-b22d-91ecd9a37ea4",
          "ab9b8c07-8f02-4f72-87fa-80105867a763")
      | summarize Apps=make_set(AppDisplayName), First=min(TimeGenerated) by IPAddress, UserAgent
    tested: null
    attack:
      - "T1550.001"
      - "T1078.004"
  - id: "identity-breach-response/crowdstrike/s1-successful-sign-ins-for-the-account-earliest-fir"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · First sign-in"
    stage_ord: 1
    platform: "CrowdStrike Falcon"
    title: "Successful sign-ins for the account, earliest first per IP and client"
    why: "The first successful sign-in from an attacker IP is the start of the exposure window; every later hunt and any breach notification is dated from it. Refresh-token replay and device-code redemptions are non-interactive sign-ins; check the connector ingests them (Stage 9)."
    how: null
    fp: "The user's own VPN egress and new office locations appear as new IPs; rank by first-seen and ASN, not by count."
    query: |-
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.userPrincipalName="<upn>"
      | groupBy([Vendor.properties.ipAddress, Vendor.properties.userAgent, Vendor.properties.appDisplayName, Vendor.properties.authenticationProtocol],
          function=[min(@timestamp, as=FirstSeen), count(as=SignIns)])
      | sort(FirstSeen, order=asc)
      // CrowdStrike documents Vendor.properties.authenticationProtocol and .appId for this connector.
      // userPrincipalName / ipAddress / userAgent / appDisplayName are the matching keys of the raw
      // Entra sign-in record: check them on one parsed event before trusting an empty result.
