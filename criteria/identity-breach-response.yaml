  - id: "identity-breach-response/sentinelone/s9-token-use-after-the-revocation-time"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 9 · Still active"
    stage_ord: 9
    platform: "SentinelOne"
    title: "Token use after the revocation time"
    why: "revokeSignInSessions invalidates refresh tokens and session cookies; access tokens already issued live until they expire, 60–90 minutes by default and up to 28 hours on CAE-capable clients unless CAE pushed the revocation. A success after that window means containment missed a device, an app grant or a refresh token."
    how: null
    fp: "Successes inside the first 90 minutes from the user's own devices are cached access tokens expiring, not a missed channel."
    query: |-
      // Set the time range to start at the revocation time. On the Entra sign-in source from Stage 1:
      dataSource.name = '<entra source>' <user field> contains:anycase '<upn>'
      | group SignIns = count(), Last = newest(timestamp) by <ip field>, <app field>
    tested: null
