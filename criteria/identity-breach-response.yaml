  - id: "identity-breach-response/crowdstrike/s2-how-mfa-was-satisfied-prt-from-an-unmanaged-devi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "CrowdStrike Falcon"
    title: "How MFA was satisfied; PRT from an unmanaged device; one session on two IPs; cookie theft on the victim's device"
    why: "A password reset does not stop a stolen session cookie, a replayed PRT or a device-code token; how MFA was passed decides whether you revoke sessions, remove devices, or also rebuild the victim's PC."
    how: null
    fp: "A phone moving between Wi-Fi and cellular shows one session on two IPs within minutes; weigh ASN and country. Remote-debugging flags are also set by browser automation on developer machines."
    query: |-
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.userPrincipalName="<upn>"
      | Vendor.properties.authenticationProtocol=deviceCode
      // a hit is device-code phishing (fields as in CrowdStrike's Entra ID / PRT abuse blog)
      // PRT from an unmanaged device and one session id on two IPs: the raw Entra keys are
      // incomingTokenType (= primaryRefreshToken), deviceDetail.isManaged, deviceDetail.deviceId and sessionId;
      // confirm the parsed names on one event, then:
      #repo="3pi_microsoft_entra_id"
      | Vendor.properties.userPrincipalName="<upn>"
      | groupBy([Vendor.properties.sessionId], function=[collect([Vendor.properties.ipAddress]), count(Vendor.properties.ipAddress, distinct=true, as=Sources)])
      | Sources > 1
      // Endpoint: Chromium started for remote debugging (cookie theft), on the victim's device
      #event_simpleName=ProcessRollup2 ComputerName="<victim host>"
      | ImageFileName=/\\(chrome|msedge)\.exe$/i CommandLine=/--remote-debugging-port/i
      | table([@timestamp, ComputerName, UserName, CommandLine])
    tested: null
    attack:
      - "T1539"
      - "T1550.004"
      - "T1528"
