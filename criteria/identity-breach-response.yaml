  - id: "identity-breach-response/splunk/s1-successful-sign-ins-for-the-account-interactive"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · First sign-in"
    stage_ord: 1
    platform: "Splunk"
    title: "Successful sign-ins for the account, interactive and non-interactive, earliest first per IP and client"
    why: "The first successful sign-in from an attacker IP is the start of the exposure window; every later hunt and any breach notification is dated from it. Refresh-token replay and device-code redemptions are non-interactive and only arrive through the Event Hub input."
    how: null
    fp: "The user's own VPN egress and new office locations appear as new IPs; rank by first-seen, not by count."
    query: |-
      index=<index> sourcetype="azure:aad:signin" userPrincipalName="<upn>" status.errorCode=0
      | stats min(_time) as first_seen max(_time) as last_seen count by ipAddress appDisplayName clientAppUsed authenticationProtocol
      | sort first_seen
      | convert ctime(first_seen) ctime(last_seen)
      // Non-interactive (Event Hub input)
      index=<index> sourcetype="azure:monitor:aad" category="NonInteractiveUserSignInLogs"
        properties.userPrincipalName="<upn>" properties.status.errorCode=0
      | stats min(_time) as first_seen count by properties.ipAddress properties.appDisplayName properties.incomingTokenType
      | sort first_seen
      | convert ctime(first_seen)
    tested: null
    attack:
      - "T1078.004"
  - id: "identity-breach-response/splunk/s2-how-mfa-was-satisfied-prt-from-an-unmanaged-devi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "Splunk"
    title: "How MFA was satisfied; PRT from an unmanaged device; one session on two IPs; cookie theft on the victim's device"
    why: "A password reset does not stop a stolen session cookie, a replayed PRT or a device-code token; how MFA was passed decides whether you revoke sessions, remove devices, or also rebuild the victim's PC."
    how: null
    fp: "A phone moving between Wi-Fi and cellular shows one session on two IPs within minutes; weigh ASN and country. Remote-debugging flags are also set by browser automation on developer machines."
    query: |-
      index=<index> sourcetype="azure:aad:signin" userPrincipalName="<upn>" ipAddress="<ip>"
      | table _time ipAddress appDisplayName authenticationProtocol authenticationRequirement incomingTokenType
              authenticationDetails{}.authenticationMethod authenticationDetails{}.authenticationStepResultDetail
      // these fields exist only when the add-on input reads the Graph beta endpoint
      // PRT from a device Entra does not manage
      index=<index> sourcetype="azure:aad:signin" userPrincipalName="<upn>" incomingTokenType="primaryRefreshToken"
        NOT deviceDetail.isManaged="true"
      | table _time ipAddress appDisplayName deviceDetail.deviceId deviceDetail.trustType sessionId
      // One session id from more than one IP
      index=<index> sourcetype="azure:aad:signin" userPrincipalName="<upn>" sessionId=*
      | stats dc(ipAddress) as sources values(ipAddress) as ips min(_time) as first by sessionId
      | where sources > 1
      // Endpoint (Sysmon): Chromium started for remote debugging (cookie theft)
      index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1
        (Image="*\\chrome.exe" OR Image="*\\msedge.exe") CommandLine="*--remote-debugging-port*"
      | table _time host User ParentImage CommandLine
    tested: null
    attack:
      - "T1539"
      - "T1550.004"
      - "T1528"
  - id: "identity-breach-response/splunk/s3-mfa-methods-taps-device-registrations-app-consen"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Persistence"
    stage_ord: 3
    platform: "Splunk"
    title: "MFA methods, TAPs, device registrations, app consents and credentials, inbox rules, forwarding, delegation, transport rules"
    why: "Each of these survives a password reset and a session revocation; anything found here has to be removed before the account is handed back. Outlook and OWA log rule changes as UpdateInboxRules; only PowerShell logs New-InboxRule."
    how: null
    fp: "\"User registered security info\" fires on every routine enrolment and Authenticator re-registration; keep hits inside the exposure window and from the attacker's IP. Helpdesk-issued TAPs are normal; one issued by the compromised account, or from the attacker IP, is not."
    query: |-
      index=<index> sourcetype="azure:aad:audit"
        (activityDisplayName IN ("User registered security info", "Admin registered security info",
          "User deleted security info", "Register device", "Add registered owner to device",
          "Add registered users to device", "Consent to application", "Add delegated permission grant",
          "Add app role assignment grant to user", "Add app role assignment to service principal",
          "Add service principal credentials") OR activityDisplayName="*Certificates and secrets management*")
        ("initiatedBy.user.userPrincipalName"="<upn>" OR "targetResources{}.userPrincipalName"="<upn>")
      | table _time activityDisplayName result resultReason initiatedBy.user.userPrincipalName initiatedBy.user.ipAddress targetResources{}.displayName
      // resultReason containing "temporary access pass": a TAP was issued; who, from where, and was it redeemed from the attacker IP?
      // Exchange: rules, forwarding, delegation, transport rules
      index=<index> sourcetype="o365:management:activity" (UserId="<upn>" OR "Parameters{}.Value"="<upn>")
        Operation IN ("New-InboxRule","Set-InboxRule","UpdateInboxRules","Set-Mailbox",
          "Add-MailboxPermission","Add-MailboxFolderPermission","Add-RecipientPermission",
          "New-TransportRule","Set-TransportRule","New-InboundConnector","Set-InboundConnector")
      | where Operation!="Set-Mailbox" OR like(mvjoin('Parameters{}.Name', ","), "%Forwarding%") OR like(mvjoin('Parameters{}.Name', ","), "%DeliverToMailboxAndForward%")
      | table _time Operation UserId ClientIP Parameters{}.Name Parameters{}.Value
    tested: null
    attack:
      - "T1556.006"
      - "T1098.005"
      - "T1098.001"
      - "T1564.008"
  - id: "identity-breach-response/splunk/s4-mail-read-and-files-downloaded-by-client-ip-with"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 4 · Data access"
    stage_ord: 4
    platform: "Splunk"
    title: "Mail read and files downloaded, by client IP, with sync-versus-bind, throttling, client string and deletions"
    why: "What was read or downloaded from the attacker's IP decides whether this is a notifiable data breach and whose data it involves. MailAccessType Sync means whole folders were pulled; IsThrottled True means the log stopped counting after 1,000 accesses in 24 hours; ClientInfoString names the tool."
    how: null
    fp: "The owner's own clients dominate MailItemsAccessed; split by ClientIP first. Cached-mode Outlook and mobile mail apps legitimately show Sync; IsThrottled is also set by the user's own full-mailbox search."
    query: |-
      index=<index> sourcetype="o365:management:activity" UserId="<upn>"
        Operation IN ("MailItemsAccessed","FileDownloaded","FileSyncDownloadedFull","FileAccessed",
          "SearchQueryInitiatedExchange","MoveToDeletedItems","SoftDelete","HardDelete")
      | eval MailAccessType=mvindex('OperationProperties{}.Value', mvfind('OperationProperties{}.Name', "MailAccessType")),
             IsThrottled=mvindex('OperationProperties{}.Value', mvfind('OperationProperties{}.Name', "IsThrottled"))
      | stats count min(_time) as first max(_time) as last
              count(eval(MailAccessType="Sync")) as sync count(eval(IsThrottled="True")) as throttled
              values(ClientInfoString) as clients values(Folders{}.Path) as folders
              by Operation Workload ClientIP
      | sort first
      | convert ctime(first) ctime(last)
      // SearchQueryInitiatedExchange needs Audit (Premium) and the SearchQueryInitiated owner action.
    tested: null
    attack:
      - "T1114.002"
      - "T1530"
      - "T1213.002"
  - id: "identity-breach-response/splunk/s5-mail-sent-from-the-account-message-trace-and-fil"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 5 · Outbound"
    stage_ord: 5
    platform: "Splunk"
    title: "Mail sent from the account (message trace) and files shared out of OneDrive and SharePoint"
    why: "Internal phish from a trusted mailbox is how one account becomes ten; external sharing links are a disclosure. Message trace is the complete source for sent mail; the Exchange \"Send\" audit record needs Audit (Premium)."
    how: null
    fp: "Assistants and shared mailboxes mail many internal recipients daily; compare recipient set and subjects with the 30 days before the window. SharingSet fires on every permission change inside a Teams channel."
    query: |-
      // Message trace input (last 10 days per fetch; Get-MessageTraceV2 covers 90 days outside Splunk)
      index=<index> sourcetype="o365:reporting:messagetrace" SenderAddress="<upn>"
      | stats count dc(RecipientAddress) as recipients values(Subject) as subjects min(_time) as first by RecipientAddress
      | sort first
      | convert ctime(first)
      // Sharing out of OneDrive and SharePoint
      index=<index> sourcetype="o365:management:activity" UserId="<upn>"
        Operation IN ("SharingSet","SharingInvitationCreated","AnonymousLinkCreated","SecureLinkCreated","AddedToSecureLink","CompanyLinkCreated","SharingLinkCreated")
      | table _time Operation Workload ClientIP SiteUrl SourceFileName TargetUserOrGroupName TargetUserOrGroupType
    tested: null
    attack:
      - "T1534"
      - "T1567"
  - id: "identity-breach-response/splunk/s6-role-assignments-to-or-by-the-account-including"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 6 · Privilege"
    stage_ord: 6
    platform: "Splunk"
    title: "Role assignments to or by the account, including PIM and role-assignable groups"
    why: "If the account holds or gained an admin role, this is a tenant incident, not a user incident: containment and notification both widen. Membership of a role-assignable group is the same escalation under a different operation name."
    how: null
    fp: "PIM activations by the user's own admin account from the usual IP are routine; the signal is an assignment by another actor, from the attacker IP, or to a group that was never role-assignable before."
    query: |-
      index=<index> sourcetype="azure:aad:audit"
        ((category="RoleManagement" (activityDisplayName="Add member to role*" OR activityDisplayName="Add eligible member to role*"))
         OR (category="GroupManagement" activityDisplayName="Add member to group"))
        ("initiatedBy.user.userPrincipalName"="<upn>" OR "targetResources{}.userPrincipalName"="<upn>")
      | table _time category activityDisplayName result initiatedBy.user.userPrincipalName targetResources{}.userPrincipalName targetResources{}.displayName
      | sort _time
      // "Add member to group": check the group with Get-MgGroup -GroupId <id> -Property IsAssignableToRole.
      // Azure RBAC writes: the Azure Activity log input of the Microsoft Cloud Services add-on; filter operationName
      // on Microsoft.Authorization/roleAssignments/write (field names depend on the input type).
    tested: null
    attack:
      - "T1098.003"
      - "T1078.004"
  - id: "identity-breach-response/splunk/s7-other-users-signing-in-from-the-attacker-s-ips-o"
    status: "active"
