  - id: "identity-breach-response/sentinelone/s2-how-mfa-was-satisfied-prt-from-an-unmanaged-devi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "SentinelOne"
    title: "How MFA was satisfied; PRT from an unmanaged device; one session on two IPs; infostealer and cookie theft on the victim's device"
    why: "A password reset does not stop a stolen session cookie, a replayed PRT or a device-code token; how MFA was passed decides whether you revoke sessions, remove devices, or also rebuild the victim's PC."
    how: null
    fp: "A phone moving between Wi-Fi and cellular shows one session on two IPs within minutes. Remote-debugging flags are also set by browser automation on developer machines; InfoStealer indicators fire on some password-manager and backup tools reading browser databases."
    query: |-
      // Entra authentication details: on the Entra source and fields found in Stage 1, filter the raw keys
      // authenticationProtocol = deviceCode, incomingTokenType = primaryRefreshToken with deviceDetail.isManaged false,
      // and group by sessionId with count_distinct(<ip field>) > 1 for a cookie seen from two sources.
      // Endpoint, on the victim's device: SentinelOne infostealer indicators
      indicator.category = 'InfoStealer'
      | group Hits = count() by endpoint.name, src.process.name
      // Chromium started for remote debugging (cookie theft)
      event.type = 'Process Creation' AND tgt.process.name in ('chrome.exe','msedge.exe')
        AND tgt.process.cmdline contains '--remote-debugging-port'
      | columns event.time, endpoint.name, src.process.name, tgt.process.cmdline
    tested: null
    attack:
      - "T1539"
      - "T1550.004"
      - "T1555.003"
