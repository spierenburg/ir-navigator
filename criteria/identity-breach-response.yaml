      FROM logs-azure.signinlogs-*
      | WHERE azure.signinlogs.properties.user_principal_name == "<upn>" AND event.outcome == "success"
      | STATS first_seen = MIN(@timestamp), last_seen = MAX(@timestamp), signins = COUNT(*), categories = VALUES(azure.signinlogs.category)
          BY source.ip, user_agent.original, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.authentication_protocol
      | SORT first_seen ASC
    tested: null
    attack:
      - "T1078.004"
  - id: "identity-breach-response/elastic/s2-how-mfa-was-satisfied-prt-from-an-unmanaged-devi"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 2 · MFA"
    stage_ord: 2
    platform: "Elastic / Wazuh"
    title: "How MFA was satisfied; PRT from an unmanaged device; cookie theft on the victim's device"
    why: "A password reset does not stop a stolen session cookie, a replayed PRT or a device-code token; how MFA was passed decides whether you revoke sessions, remove devices, or also rebuild the victim's PC. The integration does not map the Entra session id, so the two-IPs-per-session check is on the Defender or Splunk tab."
    how: null
    fp: "Entra-joined devices mid-enrolment and Windows 365 or AVD hosts can present a PRT with an empty device id. Remote-debugging flags are also set by browser automation on developer machines."
    query: |-
      FROM logs-azure.signinlogs-*
      | WHERE azure.signinlogs.properties.user_principal_name == "<upn>" AND source.ip == TO_IP("<ip>")
      | KEEP @timestamp, source.ip, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.authentication_protocol,
             azure.signinlogs.properties.authentication_requirement, azure.signinlogs.properties.incoming_token_type
      // PRT presented from a device the integration shows as unmanaged
      FROM logs-azure.signinlogs-*
      | WHERE azure.signinlogs.properties.user_principal_name == "<upn>"
        AND azure.signinlogs.properties.incoming_token_type == "primaryRefreshToken"
        AND azure.signinlogs.properties.device_detail.is_managed != true
      | KEEP @timestamp, source.ip, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.device_detail.device_id, azure.signinlogs.properties.device_detail.trust_type
      // Endpoint (EQL, same logic as Elastic's prebuilt rule "Potential Cookies Theft via Browser Debugging")
      process where event.type == "start" and process.name : ("chrome.exe", "msedge.exe") and
        process.args : "--remote-debugging-port=*" and process.args : "--user-data-dir=*"
      // a hit on the victim's device: treat every session on it as stolen
    tested: null
    attack:
      - "T1539"
      - "T1550.004"
      - "T1528"
  - id: "identity-breach-response/elastic/s3-mfa-methods-taps-device-registrations-app-consen"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 3 · Persistence"
    stage_ord: 3
    platform: "Elastic / Wazuh"
    title: "MFA methods, TAPs, device registrations, app consents and credentials, inbox rules, forwarding, delegation, transport rules"
    why: "Each of these survives a password reset and a session revocation; anything found here has to be removed before the account is handed back. Outlook and OWA log rule changes as UpdateInboxRules; only PowerShell logs New-InboxRule."
    how: null
    fp: "\"User registered security info\" fires on every routine enrolment and Authenticator re-registration; keep hits inside the exposure window and from the attacker's IP. Helpdesk-issued TAPs are normal; one issued by the compromised account, or from the attacker IP, is not."
    query: |-
      FROM logs-azure.auditlogs-*
      | WHERE azure.auditlogs.operation_name IN ("User registered security info", "Admin registered security info",
          "User deleted security info", "Register device", "Add registered owner to device",
          "Add registered users to device", "Consent to application", "Add delegated permission grant",
          "Add app role assignment grant to user", "Add app role assignment to service principal", "Add service principal credentials")
         OR azure.auditlogs.operation_name LIKE "*Certificates and secrets management*"
      | KEEP @timestamp, azure.auditlogs.operation_name, azure.auditlogs.result_reason, azure.auditlogs.properties.initiated_by.user.userPrincipalName,
             azure.auditlogs.properties.initiated_by.user.ipAddress, azure.auditlogs.properties.target_resources.0.display_name
      | SORT @timestamp ASC
      // result_reason containing "temporary access pass": a TAP was issued; who, from where, and was it redeemed from the attacker IP?
      // Exchange: rules, forwarding, delegation, transport rules
      FROM logs-o365.audit-*
      | WHERE o365.audit.UserId == "<upn>"
        AND o365.audit.Operation IN ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "Set-Mailbox",
            "Add-MailboxPermission", "Add-MailboxFolderPermission", "Add-RecipientPermission",
            "New-TransportRule", "Set-TransportRule", "New-InboundConnector", "Set-InboundConnector")
      | KEEP @timestamp, o365.audit.Operation, o365.audit.ClientIP, o365.audit.Parameters
      // keep Set-Mailbox rows whose Parameters mention ForwardingSmtpAddress, ForwardingAddress or DeliverToMailboxAndForward
    tested: null
    attack:
      - "T1556.006"
      - "T1098.005"
      - "T1098.001"
      - "T1564.008"
  - id: "identity-breach-response/elastic/s4-mail-read-and-files-downloaded-by-client-ip-with"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
