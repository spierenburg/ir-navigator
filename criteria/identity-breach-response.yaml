  - id: "identity-breach-response/elastic/s1-successful-sign-ins-for-the-account-interactive"
    status: "active"
    source: "landing-page@2026-10-10"
    validated_at: null
    supersedes: null
    stage: "Stage 1 · First sign-in"
    stage_ord: 1
    platform: "Elastic / Wazuh"
    title: "Successful sign-ins for the account, interactive and non-interactive, earliest first per IP and client"
    why: "The first successful sign-in from an attacker IP is the start of the exposure window; every later hunt and any breach notification is dated from it. Refresh-token replay and device-code redemptions land in the NonInteractiveUserSignInLogs category, which the integration only carries when the diagnostic setting exports it."
    how: null
    fp: "The user's own VPN egress and new office locations appear as new IPs; rank by first-seen, not by count."
