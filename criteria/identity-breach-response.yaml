    validated_at: null
    supersedes: null
    stage: "Stage 1 · First sign-in"
    stage_ord: 1
    platform: "SentinelOne"
    title: "Successful sign-ins for the account, earliest first per IP and client"
    why: "The first successful sign-in from an attacker IP is the start of the exposure window; every later hunt and any breach notification is dated from it. Check whether the Entra source carries non-interactive sign-ins; refresh-token replay and device-code redemptions are logged there."
    how: null
