    stage_ord: 4
    platform: "Elastic / Wazuh"
    title: "Mail read and files downloaded, by client IP, with client string, logon type and deletions"
    why: "What was read or downloaded from the attacker's IP decides whether this is a notifiable data breach and whose data it involves. ClientInfoString names the tool; MailAccessType (Sync means whole folders) and IsThrottled (the log under-counts past 1,000 in 24 h) sit inside OperationProperties and are read per document."
