    why: "A changed CA policy, a new federated domain, a GDAP partner or a credential on an existing privileged app is a back door that survives every per-user action on this page."
    how: null
    fp: "CA-as-code pipelines and Entra Connect write policies and users on a schedule; match on actor and time, not on the operation alone."
    query: |-
      // After discovery (Stage 1), on the Entra audit source, time range = the exposure window, any actor:
      dataSource.name = '<entra audit source>' <operation field> contains ('Conditional Access policy','named location',
        'security defaults','Add user','Add application','Add service principal','Add service principal credentials',
        'Certificates and secrets management','Add owner to application','Set federation settings on domain',
        'Set domain authentication','Add partner to company','authorization policy')
      | columns timestamp, <operation field>, <actor field>, <actor ip field>, <target field>
      // Exchange tenant settings (transport rules, connectors, Set-AdminAuditLogConfig): the same on the Microsoft 365 source.
    tested: null
